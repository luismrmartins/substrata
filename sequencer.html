  // ---------- transport ----------
  function stepDuration() {
    const bpm = clamp(parseFloat(bpmInput.value) || 120, 20, 300);
    return 60 / bpm / 4;
  }
  function triggerDuck(time) {
    if (duckCfg.sourceIndex < 0) return;
    for (let i = 0; i < tracks.length; i++) {
      if (i === duckCfg.sourceIndex) continue;
      const t = tracks[i];
      if (!t.duckGain || !(t.duckAmt > 0)) continue;
      const g = t.duckGain.gain;
      const floor = Math.max(0.001, 1 - t.duckAmt);
      g.cancelScheduledValues(time);
      g.setValueAtTime(g.value, time);
      g.linearRampToValueAtTime(floor, time + duckCfg.attack);
      g.linearRampToValueAtTime(1,     time + duckCfg.attack + duckCfg.release);
    }
  }

  function scheduler() {
    const horizon = audioCtx.currentTime + SCHEDULE_AHEAD;
    const sDur = stepDuration();
    const anySolo = tracks.some(x => x.solo);
    for (let i = 0; i < tracks.length; i++) {
      const t = tracks[i];
      if (t.kind === 'mic' || !t.pattern || t.pattern.length === 0 || !t.voice) continue;
      while (t.nextNoteTime < horizon) {
        const idx = t.nextStep % t.pattern.length;
        // apply pending mute/arm exactly at the downbeat of the loop
        if (idx === 0 && (t._pendingMute !== undefined || t._pendingArmed !== undefined)) {
          const newMute  = (t._pendingMute  !== undefined) ? t._pendingMute  : t.mute;
          const newArmed = (t._pendingArmed !== undefined) ? t._pendingArmed : t.armed;
          const delay = Math.max(0, (t.nextNoteTime - audioCtx.currentTime) * 1000);
          setTimeout(() => {
            t.mute = newMute;
            t.armed = newArmed;
            t._pendingMute = undefined;
            t._pendingArmed = undefined;
            refreshAllToggleBtns();
            refreshMicGates();
          }, delay);
        }
        const entry = t.pattern[idx];
        const audible = t.armed && !t.mute && (!anySolo || t.solo);
        if (entry && audible) {
          const vel = entry.vel ?? 1;
          const pan = entry.pan ?? 0;
          // mono: fade out the previous trigger fast so only one voice sounds at a time
          if (t.mono && t._lastTrigGain) {
            const g = t._lastTrigGain.gain;
            const stopAt = t.nextNoteTime;
            try {
              g.cancelScheduledValues(stopAt);
              g.setValueAtTime(g.value, stopAt);
              g.linearRampToValueAtTime(0.0001, stopAt + 0.005);
            } catch (e) {}
            t._lastTrigGain = null;
          }
          // Per-trigger gain — start from near-zero and ramp to vel over 2 ms so the
          // trigger boundary itself never produces a click, regardless of voice attack.
          const tg = audioCtx.createGain();
          tg.gain.setValueAtTime(0.0001, t.nextNoteTime);
          tg.gain.exponentialRampToValueAtTime(Math.max(0.0001, vel), t.nextNoteTime + 0.002);
          const tp = audioCtx.createStereoPanner(); tp.pan.value = pan;
          tg.connect(tp).connect(t.input);
          const env = {
            stepDur: sDur,
            prevFreq:  t._prevFreq,
            prevSlide: t._prevSlide,
          };
          t.voice(audioCtx, t.nextNoteTime, tg, t, entry, env);
          if (t.mono) t._lastTrigGain = tg;
          if (i === duckCfg.sourceIndex) triggerDuck(t.nextNoteTime);
        }
        if (entry && (t.kind === 'bass' || t.kind === 'lead' || t.kind === 'sh101' || t.kind === 'juno' || t.kind === 'cs80')) {
          t._prevFreq  = midiToFreq(t.root + (entry.pitch || 0));
          t._prevSlide = !!entry.slide;
        }
        const delay = Math.max(0, (t.nextNoteTime - audioCtx.currentTime) * 1000);
        const stepIdx = idx;
        setTimeout(() => { if (isPlaying) highlightStep(t, stepIdx); }, delay);
        // swing: even step → +swing, odd step → -swing (so pair preserves tempo)
        const swingFactor = ((t.nextStep % 2) === 0) ? (1 + (t.swing || 0)) : (1 - (t.swing || 0));
        t.nextNoteTime += sDur * swingFactor;
        t.nextStep++;
      }
    }
  }
  function start() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    isPlaying = true;
    const startTime = audioCtx.currentTime + 0.05;
    for (const t of tracks) {
      t.nextStep = 0;
      t.nextNoteTime = startTime;
      t._prevFreq = null;
      t._prevSlide = false;
    }
    playBtn.textContent = '■';
    playBtn.classList.add('playing');
    schedulerTimer = setInterval(scheduler, LOOKAHEAD);
  }
  function stop() {
    isPlaying = false;
    clearInterval(schedulerTimer); schedulerTimer = null;
    for (const t of tracks) highlightStep(t, -1);
    playBtn.textContent = '▶';
    playBtn.classList.remove('playing');
  }
  playBtn.addEventListener('click', () => { isPlaying ? stop() : start(); });

  bpmInput.addEventListener('input', () => {
    if (delayCfg.sync) {
      applyDelayTime();
      if (delayCfg._refreshUI) delayCfg._refreshUI();
    }
    if (spaceEchoCfg.sync) {
      applySpaceEchoTimes();
      if (spaceEchoCfg._refreshUI) spaceEchoCfg._refreshUI();
    }
  });

  // theme toggle
  const themeBtn = document.getElementById('theme');
  function setTheme(dark) {
    document.body.classList.toggle('dark', dark);
    themeBtn.textContent = dark ? '☾' : '☼';
    try { localStorage.setItem('substrata-theme', dark ? 'dark' : 'light'); } catch (e) {}
    // redraw granular waveforms with new ink
    for (const t of tracks) { if (t._refreshWave) t._refreshWave(); }
  }
  themeBtn.addEventListener('click', () => {
    setTheme(!document.body.classList.contains('dark'));
  });
  try {
    const saved = localStorage.getItem('substrata-theme');
    if (saved === 'dark') setTheme(true);
    else setTheme(false);
  } catch (e) { setTheme(false); }

  // redraw waveforms on window resize so canvases match their CSS width
  window.addEventListener('resize', () => {
    for (const t of tracks) { if (t._refreshWave) t._refreshWave(); }
  });

  // ---------- per-track audio lifecycle ----------
  function initTrackAudio(t) {
    if (!audioCtx) return;
    if (t.input) return; // already initialised
    t.input        = audioCtx.createGain();
    // Per-track deck-crossfader gain — set from the live crossfader. Placed
    // before volNode so it scales the signal feeding the sends too.
    t.deckGainN    = audioCtx.createGain();
    t.deckGainN.gain.value = deckGainFor(t.deck);
    t.volNode      = audioCtx.createGain();   t.volNode.gain.value      = t.volume;
    t.trkLfoMod    = audioCtx.createGain();   t.trkLfoMod.gain.value    = 1; // tremolo carrier
    t.trkPanNode   = audioCtx.createStereoPanner(); t.trkPanNode.pan.value = t.pan || 0;
    // 3-band channel EQ (shown on the Mix tab strip)
    t.trkEqLow  = audioCtx.createBiquadFilter(); t.trkEqLow.type ='lowshelf';  t.trkEqLow.frequency.value  = 200;  t.trkEqLow.gain.value  = t.eqLow  || 0;
    t.trkEqMid  = audioCtx.createBiquadFilter(); t.trkEqMid.type ='peaking';   t.trkEqMid.frequency.value  = 1000; t.trkEqMid.Q.value = 0.8; t.trkEqMid.gain.value = t.eqMid || 0;
    t.trkEqHigh = audioCtx.createBiquadFilter(); t.trkEqHigh.type='highshelf'; t.trkEqHigh.frequency.value = 5000; t.trkEqHigh.gain.value = t.eqHigh || 0;
    t.duckGain     = audioCtx.createGain();   t.duckGain.gain.value     = 1;
    t.delaySendN   = audioCtx.createGain();   t.delaySendN.gain.value   = t.delaySend;
    t.reverbSendN  = audioCtx.createGain();   t.reverbSendN.gain.value  = t.reverbSend;
    t.chorusSendN  = audioCtx.createGain();   t.chorusSendN.gain.value  = t.chorusSend;
    t.flangerSendN = audioCtx.createGain();   t.flangerSendN.gain.value = t.flangerSend;
    t.bitcrushSendN= audioCtx.createGain();   t.bitcrushSendN.gain.value= t.bitcrushSend;
    t.spaceEchoSendN = audioCtx.createGain(); t.spaceEchoSendN.gain.value = t.spaceEchoSend || 0;
    // Bass + SH-101 channels get a fast hard limiter at the very end of the
    // channel strip — catches anything the per-voice cap missed plus user
    // vol/EQ hot-spots, so the low end can't clip into the master no matter
    // what.
    if (t.kind === 'bass' || t.kind === 'sh101') {
      t.bassLimiter = audioCtx.createDynamicsCompressor();
      t.bassLimiter.threshold.value = -8;
      t.bassLimiter.ratio.value     = 15;
      t.bassLimiter.attack.value    = 0.001;
      t.bassLimiter.release.value   = 0.06;
      t.bassLimiter.knee.value      = 3;
    }
    // Channel-wide lowpass — sits after the per-channel EQ. Default cutoff
    // is 22 kHz so it's inaudible until the user dials it down. The Track
    // LFO can sweep it (see trkLfoCutG below).
    t.trkLpf = audioCtx.createBiquadFilter();
    t.trkLpf.type = 'lowpass';
    t.trkLpf.frequency.value = t.trkLpfCutoff || 22000;
    t.trkLpf.Q.value = 0.7;
    // Meter analyser (cheap, parallel observer after vol/EQ)
    t.trkMeter = audioCtx.createAnalyser();
    t.trkMeter.fftSize = 256;
    t.input.connect(t.deckGainN).connect(t.volNode);
    t.volNode.connect(t.trkLfoMod).connect(t.trkPanNode)
             .connect(t.trkEqLow).connect(t.trkEqMid).connect(t.trkEqHigh).connect(t.trkLpf);
    if (t.bassLimiter) {
      t.trkLpf.connect(t.bassLimiter).connect(t.duckGain);
    } else {
      t.trkLpf.connect(t.duckGain);
    }
    t.duckGain.connect(t.trkMeter);
    t.duckGain.connect(deckBusInputFor(t.deck));
    t.duckGain.connect(t.delaySendN).connect(delayBus);
    t.duckGain.connect(t.reverbSendN).connect(reverbBus);
    t.duckGain.connect(t.chorusSendN).connect(chorusBus);
    t.duckGain.connect(t.flangerSendN).connect(flangerBus);
    t.duckGain.connect(t.bitcrushSendN).connect(bitcrushBus);
    if (spaceEchoBus) t.duckGain.connect(t.spaceEchoSendN).connect(spaceEchoBus);

    // continuous track-level LFO modulates tremolo + auto-pan + channel LPF.
    t.trkLfo      = audioCtx.createOscillator();
    t.trkLfo.type = t.trkLfoShape || 'sine';
    t.trkLfo.frequency.value = t.trkLfoRate || 0.5;
    t.trkLfoVolG  = audioCtx.createGain(); t.trkLfoVolG.gain.value = t.trkLfoVolDepth || 0;
    t.trkLfoPanG  = audioCtx.createGain(); t.trkLfoPanG.gain.value = t.trkLfoPanDepth || 0;
    // LFO → trkLpf.frequency: depth 1.0 = ±4000 Hz around the base cutoff.
    t.trkLfoCutG  = audioCtx.createGain(); t.trkLfoCutG.gain.value = (t.trkLfoCutDepth || 0) * 4000;
    t.trkLfo.connect(t.trkLfoVolG).connect(t.trkLfoMod.gain);
    t.trkLfo.connect(t.trkLfoPanG).connect(t.trkPanNode.pan);
    t.trkLfo.connect(t.trkLfoCutG).connect(t.trkLpf.frequency);
    t.trkLfo.start();

    if (t.kind === 'mic') {
      t.inputGainN = audioCtx.createGain(); t.inputGainN.gain.value = t.inputGain;
      t.hpf = audioCtx.createBiquadFilter(); t.hpf.type = 'highpass'; t.hpf.frequency.value = t.hpfFreq;
      t.eqNodes = t.eqBands.map(b => {
        const n = audioCtx.createBiquadFilter();
        n.type = 'peaking'; n.frequency.value = b.freq; n.Q.value = 1.0;
        n.gain.value = b.on ? b.gain : 0;
        return n;
      });
      t.micGate = audioCtx.createGain(); t.micGate.gain.value = 1;
      t.analyser = audioCtx.createAnalyser();
      t.analyser.fftSize = 2048;
      let node = t.inputGainN.connect(t.hpf);
      for (const eq of t.eqNodes) node = node.connect(eq);
      node.connect(t.micGate).connect(t.input);
      // analyser sits in a parallel branch off the input gain so it shows raw input level
      t.inputGainN.connect(t.analyser);
    }
  }
  function destroyTrackAudio(t) {
    if (t.recorder && t.recorder.state === 'recording') {
      try { t.recorder.stop(); } catch (e) {}
    }
    if (t.stream) { try { t.stream.getTracks().forEach(s => s.stop()); } catch (e) {} t.stream = null; }
    if (t._scopeStop !== undefined) t._scopeStop = true;
    if (t.trkLfo) { try { t.trkLfo.stop(); } catch (e) {} try { t.trkLfo.disconnect(); } catch (e) {} t.trkLfo = null; }
    ['trkLfoVolG','trkLfoPanG','trkLfoCutG','trkLfoMod','trkPanNode','trkEqLow','trkEqMid','trkEqHigh','trkLpf','trkMeter',
     'micSource','inputGainN','hpf','micGate','analyser','input','deckGainN','volNode','duckGain','bassLimiter','spaceEchoSendN',
     'delaySendN','reverbSendN','chorusSendN','flangerSendN','bitcrushSendN']
      .forEach(k => { if (t[k]) { try { t[k].disconnect(); } catch (e) {} t[k] = null; } });
    if (t.eqNodes) { t.eqNodes.forEach(n => { try { n.disconnect(); } catch (e) {} }); t.eqNodes = null; }
  }
  async function addTrack(kind, overrides) {
    if ((kind === 'mic' || kind === 'granular' || kind === 'sampler') && !projectDir && window.showDirectoryPicker) {
      const want = window.confirm(
        'Adding a ' + kind + ' track.\n\n' +
        'Pick a project folder now to keep samples and the project file together?\n' +
        '(Cancel to skip — recordings will be downloaded one by one.)'
      );
      if (want) await pickProjectDir();
    }
    const t = makeTrack(kind, overrides);
    tracks.push(t);
    if (audioCtx) initTrackAudio(t);
    // Always sync the new track to the first track's next downbeat so the
    // user doesn't have to press the per-track sync button after every add.
    // syncTrackToFirst is a no-op when this is the only track.
    if (audioCtx && isPlaying) syncTrackToFirst(t);
    selectedTrackId = t.id;  // auto-focus the newly added instrument
    rebuildTracksUI();
    rebuildDuckerSourceOptions();
  }
  function removeTrack(t) {
    destroyTrackAudio(t);
    const idx = tracks.indexOf(t);
    if (idx >= 0) tracks.splice(idx, 1);
    if (duckCfg.sourceIndex === idx) duckCfg.sourceIndex = -1;
    else if (duckCfg.sourceIndex > idx) duckCfg.sourceIndex--;
    if (selectedTrackId === t.id) {
      selectedTrackId = tracks.length ? tracks[Math.min(idx, tracks.length - 1)].id : null;
    }
    rebuildTracksUI();
    rebuildDuckerSourceOptions();
  }
  // Build the "+ Add instrument" widget at the bottom of the Track-mode
  // instruments column. The old top-row Add-track strip is hidden in
  // Track mode; everything happens from this one button.
  const ADD_INSTRUMENT_KINDS = [
    ['drum',      'Drum'],
    ['bass',      'Bass'],
    ['lead',      'Synth'],
    ['sh101',     'SH-101'],
    ['juno',      'Juno-106'],
    ['cs80',      'CS-80'],
    ['chord',     'Chord'],
    ['mellotron', 'Mellotron'],
    ['mic',       'Mic'],
    ['granular',  'Granular'],
    ['sampler',   'Sampler']
  ];
  function appendAddInstrumentButton(host) {
    if (!host) return;
    const wrap = el('div', 'add-instrument-wrap');
    const btn  = el('button', 'add-instrument-btn', '+ Add instrument');
    const menu = el('div', 'add-instrument-menu');
    ADD_INSTRUMENT_KINDS.forEach(([kind, label]) => {
      const opt = el('button', 'add-instrument-option', '+ ' + label);
      opt.addEventListener('click', async (e) => {
        e.stopPropagation();
        menu.classList.remove('open');
        btn.classList.remove('on');
        try { await addTrack(kind); }
        catch (err) { console.error('addTrack failed:', err); alert('Add track failed: ' + (err && err.message)); }
      });
      menu.appendChild(opt);
    });
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.classList.toggle('open');
      btn.classList.toggle('on', open);
    });
    // Click anywhere outside closes the menu.
    const closeOnOutside = (e) => {
      if (!wrap.contains(e.target)) {
        menu.classList.remove('open');
        btn.classList.remove('on');
      }
    };
    document.addEventListener('click', closeOnOutside);
    wrap.appendChild(btn);
    wrap.appendChild(menu);
    host.appendChild(wrap);
  }

  // Pin each bottom-mixer strip's vertical fader + meter to exactly the
  // space available inside the strip. Necessary because range inputs with
  // appearance:slider-vertical only respect an explicit pixel height — CSS
  // flex / grid / 100% height get silently ignored by WebKit.
  function resizeMixerStrips(panel) {
    if (!panel) panel = document.querySelector('.panel-mixer');
    if (!panel) return;
    const strips = panel.querySelectorAll('.mini-channel, .master-strip');
    strips.forEach(strip => {
      const stripH = strip.clientHeight;
      if (stripH < 80) return;
      const mixStrip = strip.querySelector('.mix-strip');
      if (!mixStrip) return;
      const cs = getComputedStyle(strip);
      const padT = parseFloat(cs.paddingTop)    || 0;
      const padB = parseFloat(cs.paddingBottom) || 0;
      const gap  = parseFloat(cs.rowGap) || parseFloat(cs.gap) || 0;
      let above = 0;
      let cur = strip.firstElementChild;
      let countGaps = 0;
      while (cur && cur !== mixStrip) {
        above += cur.offsetHeight;
        countGaps++;
        cur = cur.nextElementSibling;
      }
      // include the gap below mix-strip's last sibling too
      countGaps += 1;
      const avail = Math.max(60, stripH - padT - padB - above - (gap * countGaps));
      const val   = strip.querySelector('.mix-vol-val');
      const valH  = val ? val.offsetHeight + 2 : 0;
      const meter = strip.querySelector('.mix-meter');
      const fader = strip.querySelector('.mix-fader');
      if (meter) meter.style.height = avail + 'px';
      if (fader) fader.style.height = Math.max(60, avail - valH) + 'px';
    });
  }
  let _resizeMixerTimer = null;
  window.addEventListener('resize', () => {
    if (_resizeMixerTimer) cancelAnimationFrame(_resizeMixerTimer);
    _resizeMixerTimer = requestAnimationFrame(() => resizeMixerStrips());
  });

  // ---------- Per-track sync ----------
  // Slip this track so its next step 0 lands on the first track's next
  // step 0. The track is silent between now and the alignment point —
  // it picks up cleanly at the first track's downbeat instead of being
  // re-triggered mid-step.
  function syncTrackToFirst(track) {
    if (!audioCtx || tracks.length === 0) return;
    const ref = tracks[0];
    if (ref === track) return;          // can't sync the reference to itself
    if (typeof ref.nextNoteTime !== 'number') return;
    const bpm = parseFloat(bpmInput.value) || 120;
    const stepDur = (60 / bpm) / 4;
    // Time when the first track will next be at step 0
    const stepsUntilZero = (ref.nextStep === 0) ? 0 : (ref.steps - ref.nextStep);
    let target = ref.nextNoteTime + stepsUntilZero * stepDur;
    while (target < audioCtx.currentTime + 0.02) {
      target += ref.steps * stepDur;     // skip to the next loop if we're already past it
    }
    track.nextStep = 0;
    track.nextNoteTime = target;
    track._prevFreq = null;
    track._prevSlide = false;
    track._lastTrigGain = null;
  }

  // ---------- Per-track pattern banks (A / B / C / D) ----------
  // Each track keeps four step-sequence snapshots that share the same
  // instrument. Switching banks repoints track.pattern to that bank's
  // array, so any edit you make to the visible grid is auto-saved into
  // the active bank (no separate "Save" step). Initialised lazily so
  // existing projects that don't have banks just see bank A populated.
  const PATTERN_BANKS = ['A','B','C','D'];
  function ensurePatternBanks(track) {
    if (!track.patternBanks) {
      track.patternBanks = {};
      PATTERN_BANKS.forEach(b => {
        track.patternBanks[b] = (b === (track.activeBank || 'A'))
          ? track.pattern
          : (track.pattern || []).map(e => e ? { ...e } : null);
      });
      track.activeBank = track.activeBank || 'A';
    }
    // Always keep the active bank pointed at the live pattern.
    track.patternBanks[track.activeBank] = track.pattern;
  }
  function switchPatternBank(track, bank) {
    if (!PATTERN_BANKS.includes(bank)) return;
    if (track.activeBank === bank) return;
    ensurePatternBanks(track);
    // Save the current bank, then load the new one.
    track.patternBanks[track.activeBank] = track.pattern;
    track.activeBank = bank;
    track.pattern = track.patternBanks[bank];
    rebuildTracksUI();
  }
  function buildPatternBankSelector(track) {
    ensurePatternBanks(track);
    const wrap = el('div', 'pattern-banks');
    PATTERN_BANKS.forEach(b => {
      const btn = el('button', 'pattern-bank-btn', b);
      if (track.activeBank === b) btn.classList.add('active');
      btn.title = 'Switch to pattern ' + b + ' (edits auto-save to the active bank)';
      btn.addEventListener('click', (e) => { e.stopPropagation(); switchPatternBank(track, b); });
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function previewTrack(track) {
    if (!track || track.kind === 'mic' || !track.voice) return;
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!track.input) initTrackAudio(track);
    const bpm = parseFloat(bpmInput.value) || 120;
    const stepDur = (60 / bpm) / 4;
    const at = audioCtx.currentTime + 0.02;
    const env = { stepDur, prevFreq: null, prevSlide: false };
    const step = { pitch: 0, slide: false, length: 1.0, velocity: 1.0 };
    try { track.voice(audioCtx, at, track.input, track, step, env); }
    catch (e) { console.warn('Preview failed:', e); }
  }

  // ---------- Per-track A / B / C morph ----------
  // Each track stores up to three snapshots of its instrument + channel
  // parameters. A slider lerps between A→B (pos 0..1) and B→C (pos 1..2)
  // so the user can morph patches live. States are saved with the project,
  // not pulled from a global preset bank.
  const MORPH_EXCLUDE = new Set([
    'name','kind','voice','voiceType','wave','waveA','waveB',
    'steps','pattern','expanded',
    'mute','solo','armed','mono','group','noteLen',
    'sampleFile','buffer','deviceId','enabled','eqBands','pads','selectedPad','groups',
    'scale','seventh','ninth','subOctave','lfoShape','trkLfoShape','div','sync',
    'morphStates','morphPos','deck','_pendingMute','_pendingArmed',
    // Track volume + the per-track sends are channel-mix values the user
    // sets independently of the patch. Keeping them out of the morph means
    // moving the slider only changes the instrument character.
    'volume','pan','delaySend','reverbSend','chorusSend','flangerSend','bitcrushSend','spaceEchoSend','duckAmt'
  ]);

  function captureMorphState(track) {
    const keys = (SAVE_KEYS.common || []).concat(SAVE_KEYS[track.kind] || []);
    const out = {};
    for (const k of keys) {
      if (MORPH_EXCLUDE.has(k)) continue;
      const v = track[k];
      if (typeof v === 'number' || typeof v === 'boolean' || typeof v === 'string') {
        out[k] = v;
      }
    }
    return out;
  }

  function lerpMorphStates(a, b, t) {
    const merged = {};
    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
    for (const k of keys) {
      const av = a[k];
      const bv = b[k];
      if (typeof av === 'number' && typeof bv === 'number') {
        merged[k] = av + (bv - av) * t;
      } else {
        // For non-numeric values, switch at the midpoint.
        merged[k] = (t < 0.5 ? av : bv);
      }
    }
    return merged;
  }

  function applyMorph(track, pos) {
    track.morphPos = pos;
    const ms = track.morphStates;
    if (!ms) return;
    let merged = null;
    if (pos <= 1) {
      if (ms.A && ms.B)      merged = lerpMorphStates(ms.A, ms.B, pos);
      else if (ms.B)         merged = { ...ms.B };
      else if (ms.A)         merged = { ...ms.A };
    } else {
      const t = pos - 1;
      if (ms.B && ms.C)      merged = lerpMorphStates(ms.B, ms.C, t);
      else if (ms.C)         merged = { ...ms.C };
      else if (ms.B)         merged = { ...ms.B };
    }
    if (!merged) return;
    // Strip any excluded keys (e.g. volume / sends captured by an earlier
    // version of the code that didn't exclude them yet). Without this the
    // morph would write a "locked" mix-channel value back over whatever
    // the user has set, and dragging the slider wouldn't revert it.
    for (const k of MORPH_EXCLUDE) delete merged[k];
    // Assign morphed params back to the track.
    Object.assign(track, merged);
    // Re-apply the channel-side params to live audio nodes so changes are
    // heard immediately. Instrument params (cutoff, ADSR, etc.) take effect
    // on the next note trigger, which is the right behaviour for a morph.
    if (!audioCtx) return;
    const ct = audioCtx.currentTime;
    const ramp = 0.03;
    if (track.volNode    && merged.volume       !== undefined) track.volNode.gain.setTargetAtTime(merged.volume,        ct, ramp);
    if (track.trkEqLow   && merged.eqLow        !== undefined) track.trkEqLow.gain.setTargetAtTime(merged.eqLow,        ct, ramp);
    if (track.trkEqMid   && merged.eqMid        !== undefined) track.trkEqMid.gain.setTargetAtTime(merged.eqMid,        ct, ramp);
    if (track.trkEqHigh  && merged.eqHigh       !== undefined) track.trkEqHigh.gain.setTargetAtTime(merged.eqHigh,      ct, ramp);
    if (track.delaySendN    && merged.delaySend    !== undefined) track.delaySendN.gain.setTargetAtTime(merged.delaySend,        ct, ramp);
    if (track.reverbSendN   && merged.reverbSend   !== undefined) track.reverbSendN.gain.setTargetAtTime(merged.reverbSend,      ct, ramp);
    if (track.chorusSendN   && merged.chorusSend   !== undefined) track.chorusSendN.gain.setTargetAtTime(merged.chorusSend,      ct, ramp);
    if (track.flangerSendN  && merged.flangerSend  !== undefined) track.flangerSendN.gain.setTargetAtTime(merged.flangerSend,    ct, ramp);
    if (track.bitcrushSendN && merged.bitcrushSend !== undefined) track.bitcrushSendN.gain.setTargetAtTime(merged.bitcrushSend,  ct, ramp);
    if (track.spaceEchoSendN&& merged.spaceEchoSend!== undefined) track.spaceEchoSendN.gain.setTargetAtTime(merged.spaceEchoSend, ct, ramp);
    if (track.trkLfo && merged.trkLfoRate !== undefined) track.trkLfo.frequency.setTargetAtTime(merged.trkLfoRate, ct, ramp);
    // Live-update every slider in the current Track-tab view that's bound
    // to one of the morphed properties — so the user sees knobs move with
    // the morph slider, not just hear the sound change.
    refreshMorphableKnobs(track, merged);
  }

  function refreshMorphableKnobs(track, mergedParams) {
    const inputs = document.querySelectorAll(
      '.panel-details [data-prop], .panel-sequencer [data-prop]'
    );
    inputs.forEach(input => {
      const prop = input.dataset.prop;
      if (!prop) return;
      if (mergedParams && mergedParams[prop] === undefined) return;
      const v = track[prop];
      if (typeof v !== 'number') return;
      if (input._refresh) input._refresh(v);
      else if (input.tagName === 'INPUT') input.value = v;
    });
  }

  function saveMorphSlot(track, slot) {
    if (!track.morphStates) track.morphStates = { A: null, B: null, C: null };
    track.morphStates[slot] = captureMorphState(track);
  }

  function buildMorphSection(track) {
    const sec = el('div', 'knobs-section morph-section');
    const head = el('div', 'knobs-section-head');
    head.appendChild(el('div', 'knobs-section-name', track.name));
    head.appendChild(el('div', 'knobs-section-title', 'Morph'));
    sec.appendChild(head);

    const slot = (label) => {
      const has = !!(track.morphStates && track.morphStates[label]);
      return el('span', 'morph-slot' + (has ? ' has' : ''), label);
    };

    const tickRow = el('div', 'morph-ticks');
    tickRow.appendChild(slot('A'));
    tickRow.appendChild(slot('B'));
    tickRow.appendChild(slot('C'));
    sec.appendChild(tickRow);

    const slider = el('input', 'morph-slider');
    slider.type = 'range'; slider.min = 0; slider.max = 2; slider.step = 0.01;
    slider.value = track.morphPos || 0;
    slider.addEventListener('input', () => applyMorph(track, parseFloat(slider.value)));
    sec.appendChild(slider);
    track._morphSlider = slider;

    const btnRow = el('div', 'morph-buttons');
    ['A','B','C'].forEach(label => {
      const b = el('button', 'small', 'Save ' + label);
      b.title = 'Snapshot the current instrument + channel state into slot ' + label;
      b.addEventListener('click', () => {
        saveMorphSlot(track, label);
        rebuildTracksUI();   // refresh the slot dots to show this slot is now filled
      });
      btnRow.appendChild(b);
    });
    sec.appendChild(btnRow);

    return sec;
  }

  // Reorganise the children of a track's knobs container into two visual
  // sections: "Instrument" (preset + voice-specific groups) and "Channel"
  // (Stp/Vol/Swg/Mono + Sends + Duck + Track LFO). Relies on the fixed order
  // produced by buildKnobs — first child is the std controls group, last
  // three are Send/Duck/Trk LFO, everything in between is voice/preset.
  function partitionKnobsForRedesign(track) {
    const k = track && track.knobsEl;
    if (!k) return;
    const children = Array.from(k.children);
    if (children.length === 0) return;

    const makeSection = (title, items) => {
      const sec = el('div', 'knobs-section');
      const head = el('div', 'knobs-section-head');
      head.appendChild(el('div', 'knobs-section-name', track.name));
      if (title) head.appendChild(el('div', 'knobs-section-title', title));
      sec.appendChild(head);
      const row = el('div', 'knobs-row');
      items.forEach(c => row.appendChild(c));
      sec.appendChild(row);
      return sec;
    };

    if (track.kind === 'mic') {
      const sec = makeSection('Mic input', children);
      k.innerHTML = '';
      k.appendChild(sec);
    } else if (children.length < 3) {
      // Unexpected shape — single section.
      const sec = makeSection('Channel', children);
      k.innerHTML = '';
      k.appendChild(sec);
    } else {
      // Std controls were already lifted into the sequencer header, so what
      // remains is [preset?, voice-specific groups…, Send, Duck, Trk LFO].
      // Last three groups are Channel; everything before them is Instrument.
      const tail   = children.slice(-3);
      const middle = children.slice(0, -3);
      const insSec = makeSection('Instrument', middle);
      const chSec  = makeSection('Channel',    tail);
      k.innerHTML = '';
      k.appendChild(insSec);
      k.appendChild(chSec);
    }
    // Details panel is the focus — open every group by default.
    k.querySelectorAll('.group.collapsed').forEach(g => g.classList.remove('collapsed'));
    // Morph slider lives below the channel section, separated by the same
    // divider rule that already styles knobs-section + knobs-section.
    const morphSec = buildMorphSection(track);
    if (morphSec) k.appendChild(morphSec);
  }

  function rebuildTracksUI() {
    tracksEl.innerHTML = '';
    _masterMeterFill = null;
    _masterMeterSegs = null;

    if (currentMode === 'recording') {
      // Three-zone layout: instruments column + sequencer panel + details
      // panel, with a full-width mini-mixer pinned underneath for quick
      // access to every channel's vol + mute / solo / arm.
      const instPanel = el('aside', 'panel-instruments');
      const seqPanel  = el('section', 'panel-sequencer');
      const detPanel  = el('section', 'panel-details');
      const mixPanel  = el('section', 'panel-mixer');
      tracksEl.appendChild(instPanel);
      tracksEl.appendChild(seqPanel);
      tracksEl.appendChild(detPanel);
      tracksEl.appendChild(mixPanel);

      if (tracks.length === 0) {
        instPanel.appendChild(el('div', 'panel-empty',
          'No instruments yet — use "+ Add instrument" below.'));
        seqPanel.appendChild(el('div', 'panel-empty', 'Add an instrument to start sequencing.'));
        appendAddInstrumentButton(instPanel);
        return;
      }

      // Make sure something is selected.
      if (!tracks.some(t => t.id === selectedTrackId)) {
        selectedTrackId = tracks[0].id;
      }

      tracks.forEach(t => {
        buildTrack(t);                              // appends a .track wrap to tracksEl
        const wrap  = tracksEl.lastElementChild;
        const meta  = wrap.querySelector('.track-meta');
        const steps = wrap.querySelector('.steps-row');
        const mic   = wrap.querySelector('.mic-control');
        const knobs = wrap.querySelector('.track-knobs');

        // Move the meta (name + toggles) into an instrument-list item.
        const item = el('div', 'instrument-item');
        item.dataset.trackId = t.id;
        if (t.id === selectedTrackId) item.classList.add('selected');
        if (meta) item.appendChild(meta);
        instPanel.appendChild(item);
        item.addEventListener('click', (e) => {
          // Let buttons / inputs inside the meta keep their existing behaviour.
          if (e.target.closest('button, input, select, textarea')) return;
          if (selectedTrackId !== t.id) {
            selectedTrackId = t.id;
            rebuildTracksUI();
          }
        });

        // For the selected track only, move the sequencer + knobs into
        // their panels. The first child of knobs is the std controls
        // group (Stp / Vol / Swg / Mono [/ NLen]) — it lives in a header
        // ABOVE the step grid; the rest is partitioned into Instrument /
        // Channel sections in the details panel.
        if (t.id === selectedTrackId) {
          // Track name + pattern-bank selector at the top of the sequencer
          // column, with a Preview button pushed to the right that triggers
          // the current patch once without writing a step.
          const nameRow = el('div', 'panel-track-name-row');
          nameRow.appendChild(el('div', 'panel-track-name', t.name));
          if (t.kind !== 'mic') {
            nameRow.appendChild(buildPatternBankSelector(t));
            // Sequence-edit actions: randomize + nudge earlier / later.
            const seqActs = el('div', 'seq-actions');
            const mkSeq = (label, title, fn) => {
              const b = el('button', 'small seq-action-btn', label);
              b.title = title;
              b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
              return b;
            };
            seqActs.appendChild(mkSeq('R', 'Randomize this pattern',
              () => { randomizeTrack(t); rebuildSteps(t); }));
            seqActs.appendChild(mkSeq('◄', 'Nudge pattern earlier by one step',
              () => {
                if (Array.isArray(t.pattern) && t.pattern.length) {
                  t.pattern.push(t.pattern.shift());
                  rebuildSteps(t);
                }
              }));
            seqActs.appendChild(mkSeq('►', 'Nudge pattern later by one step',
              () => {
                if (Array.isArray(t.pattern) && t.pattern.length) {
                  t.pattern.unshift(t.pattern.pop());
                  rebuildSteps(t);
                }
              }));
            seqActs.appendChild(mkSeq('↻',
              "Sync this track to the first track's next downbeat",
              () => syncTrackToFirst(t)));
            nameRow.appendChild(seqActs);
            const previewBtn = el('button', 'small pattern-preview', '▶ Preview');
            previewBtn.title = 'Trigger this patch once without dropping a step';
            previewBtn.addEventListener('click', () => previewTrack(t));
            nameRow.appendChild(previewBtn);
          }
          seqPanel.appendChild(nameRow);
          // Groups row sits below the sections (per spec). Mic tracks
          // can also belong to groups, so this row is shown for every
          // track kind.
          const groupsRow = el('div', 'panel-groups-row');
          groupsRow.appendChild(el('span', 'panel-groups-label', 'Groups'));
          groupsRow.appendChild(buildGroupSelector(t));
          seqPanel.appendChild(groupsRow);
          if (knobs && t.kind !== 'mic' && knobs.firstElementChild) {
            const std = knobs.firstElementChild;
            const header = el('div', 'panel-seq-header');
            header.appendChild(std);
            seqPanel.appendChild(header);
          }
          if (steps) seqPanel.appendChild(steps);
          if (mic)   seqPanel.appendChild(mic);
          if (knobs) {
            detPanel.appendChild(knobs);
            partitionKnobsForRedesign(t);
          }
        }
        // Mini-mixer strip for this track at the bottom of the view —
        // same channel-strip shape as Mix mode (vertical fader + meter +
        // 3-band EQ), minus the per-channel sends row.
        const mc = el('div', 'mini-channel');
        if (t.id === selectedTrackId) mc.classList.add('selected');
        mc.addEventListener('click', (e) => {
          if (e.target.closest('button, input, select')) return;
          if (selectedTrackId !== t.id) { selectedTrackId = t.id; rebuildTracksUI(); }
        });
        mc.appendChild(el('div', 'mini-channel-name', t.name));

        // Pan slider — horizontal L/C/R control above the EQ. Reads/writes
        // track.pan and the trkPanNode AudioParam (which is also modulated
        // by the track LFO; the LFO sums on top of this static offset).

  // ---------- meter loop (Mix tab + master strip) ----------
  let _meterLoopRunning = false;
  let _masterMeterFill  = null;
  let _masterMeterSegs  = null;
  // Build a vertical segmented meter (N square cells stacked bottom-up).
  // Each segment gets a position-derived green→yellow→red colour pair
  // (faint off / full on) so the scale is always visible.
  function buildSegmentedMeter(numSegs) {
    if (!numSegs) numSegs = 14;
    const wrap = el('div', 'mix-meter-wrap');
    // Left-column dB scale — peak * 1.3 maps to full meter (≈ 0 dB top),
    // so we tag the segment whose threshold matches each label.
    const scale = el('div', 'mix-meter-scale');
    const labels = [0, -6, -12, -24];
    labels.forEach(db => {
      const linear = Math.pow(10, db / 20);
      let pos = linear * 1.3;                      // 0..1 from bottom
      pos = Math.max(0, Math.min(1, pos));
      const tickPct = (1 - pos) * 100;             // CSS top % (0 = top)
      const tick = el('div', 'mix-meter-tick', db === 0 ? '0' : String(db));
      tick.style.top = tickPct.toFixed(1) + '%';
      scale.appendChild(tick);
    });
    wrap.appendChild(scale);
    const m = el('div', 'mix-meter');
    const segs = [];
    for (let i = 0; i < numSegs; i++) {
      const seg = el('div', 'mix-meter-seg');
      const r = i / (numSegs - 1);
      let R, G, B;
      if (r < 0.55) {
        const t = r / 0.55;          // green → yellow
        R = Math.round( 60 + t * (255 -  60));
        G = Math.round(200 + t * (210 - 200));
        B = Math.round( 80 + t * ( 30 -  80));
      } else {
        const t = (r - 0.55) / 0.45;  // yellow → red
        R = Math.round(255 + t * (240 - 255));
        G = Math.round(210 + t * ( 60 - 210));
        B = Math.round( 30 + t * ( 50 -  30));
      }
      seg.style.setProperty('--seg-on',  `rgb(${R},${G},${B})`);
      seg.style.setProperty('--seg-off', `rgba(${R},${G},${B},0.18)`);
      m.appendChild(seg);
      segs.push(seg);
    }
    wrap.appendChild(m);
    return { meter: wrap, segs };
  }
  function setMeterSegs(segs, peak) {
    if (!segs || !segs.length) return;
    const litCount = Math.min(segs.length, Math.round(Math.min(1, peak * 1.3) * segs.length));
    for (let i = 0; i < segs.length; i++) {
      const on = i < litCount;
      if (segs[i]._lit !== on) {
        segs[i].classList.toggle('lit', on);
        segs[i]._lit = on;
      }
    }
  }
  function meterPeak(analyser, buf) {
    analyser.getFloatTimeDomainData(buf);
    let max = 0;
    for (let i = 0; i < buf.length; i++) {
      const v = Math.abs(buf[i]);
      if (v > max) max = v;
    }
    return max;
  }
  function startMeterLoop() {
    if (_meterLoopRunning) return;
    _meterLoopRunning = true;
    const buf = new Float32Array(128);
    const loop = () => {
      if (!audioCtx) { _meterLoopRunning = false; return; }
      for (const t of tracks) {
        if (t.trkMeter && t._meterSegs) {
          setMeterSegs(t._meterSegs, meterPeak(t.trkMeter, buf));
        }
      }
      if (masterMeter && _masterMeterSegs) {
        setMeterSegs(_masterMeterSegs, meterPeak(masterMeter, buf));
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  // ---------- master channel strip (Mix tab) ----------
  // "L40" / "C" / "R65" style readout for a stereo pan value in [-1, 1].
  function panLabel(v) {
    const n = Math.round(Math.abs(v) * 100);
    if (n === 0) return 'C';
    return (v < 0 ? 'L' : 'R') + n;
  }

  function buildMasterStrip() {
    const wrap = el('div', 'track master-strip');
    const meta = el('div', 'track-meta');
    const name = el('div', 'track-name');
    name.appendChild(el('span', null, 'MASTER'));

      const row = el('div', 'mix-eq-row mix-eq-rotary');

      let saved = val;

      kill.title = 'kill this band (-40 dB)';
      const dial = makeRotary(-40, 15, val, (v) => {

        valEl.textContent = fmtMEq(v);

        killed = !killed;

        valEl.textContent = fmtMEq(v);

    eqWrap.appendChild(makeRow('LO', master.low, v => {
      master.low = v;
      if (eqLow) eqLow.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);

    wrap.appendChild(eqWrap);

    const strip = el('div', 'mix-strip');
    const masterMeterRes = buildSegmentedMeter(14);
    _masterMeterSegs = masterMeterRes.segs;
    strip.appendChild(masterMeterRes.meter);

    const faderWrap = el('div', 'mix-fader-wrap');
    const fader = el('input', 'mix-fader');
    fader.type = 'range';
    fader.min = 0; fader.max = 1.2; fader.step = 0.01; fader.value = master.vol;
    const label = el('span', 'mix-vol-val', Number(master.vol).toFixed(2));
    fader.addEventListener('input', () => {
      const v = parseFloat(fader.value);
      master.vol = v;
      label.textContent = v.toFixed(2);
      if (masterOut) masterOut.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    });
    faderWrap.appendChild(fader);
    faderWrap.appendChild(label);
    strip.appendChild(faderWrap);
    wrap.appendChild(strip);

    tracksEl.appendChild(wrap);
  }

  // ---------- mixer (dual deck) ----------
  function applyCrossfade(x) {
    const aA = Math.cos(x * Math.PI / 2);
    const aB = Math.sin(x * Math.PI / 2);
    if (decks.A.xfade) decks.A.xfade.gain.setTargetAtTime(aA, audioCtx.currentTime, 0.01);
    if (decks.B.xfade) decks.B.xfade.gain.setTargetAtTime(aB, audioCtx.currentTime, 0.01);
  }
  function loadDeckFile(k, statusEl) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'audio/*,application/json,.json';
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      statusEl.textContent = 'loading…';
      // JSON project file: render its loop offline into the deck buffer
      if (/\.json$/i.test(file.name) || file.type === 'application/json') {
        try {
          const txt = await file.text();
          const data = JSON.parse(txt);
          statusEl.textContent = 'rendering project…';
          const buf = await renderProjectToBuffer(data);
          if (!buf) throw new Error('render failed');
          decks[k].buffer = buf;
          decks[k].name = file.name + ' (rendered loop)';
          statusEl.textContent = decks[k].name + ' (' + buf.duration.toFixed(1) + 's)';
        } catch (e) {
          console.warn(e);
          statusEl.textContent = 'render failed: ' + (e.message || 'unknown');
        }
        return;
      }
      try {
        initAudio();
        const ab = await file.arrayBuffer();
        decks[k].buffer = await audioCtx.decodeAudioData(ab);
        decks[k].name = file.name;
        statusEl.textContent = file.name + ' (' + decks[k].buffer.duration.toFixed(1) + 's)';
      } catch (e) { statusEl.textContent = 'load failed'; }
    });
    input.click();
  }

  // Render a saved project's pattern loop into an offline-rendered AudioBuffer.
  // Skips mic/granular (live/sample) and supports drum/bass/lead/chord voices.
  async function renderProjectToBuffer(data) {
    if (!window.OfflineAudioContext) return null;
    const bpm = clamp(parseFloat(data.bpm) || 120, 20, 300);
    const stepDur = 60 / bpm / 4;
    // longest pattern length in steps among playable tracks
    const playable = (data.tracks || []).filter(t =>
      t.kind !== 'mic' && t.kind !== 'granular' && t.kind !== 'sampler' && Array.isArray(t.pattern) && t.pattern.length);
    if (playable.length === 0) return null;
    const maxSteps = Math.max(...playable.map(t => t.steps || t.pattern.length));
    const durSec = stepDur * maxSteps + 2.0; // tail for releases
    const sr = 44100;
    const offline = new OfflineAudioContext(2, Math.ceil(durSec * sr), sr);
    // reuse current effect configs as a static snapshot
    const masterOutO = offline.createGain(); masterOutO.gain.value = (data.master && data.master.vol) || 0.9;
    masterOutO.connect(offline.destination);

    // schedule each track's notes onto offline ctx
    for (const td of playable) {
      const t = makeTrack(td.kind, td);
      // wire a minimal channel: input → vol → master
      const input = offline.createGain();
      const vol = offline.createGain(); vol.gain.value = t.volume;
      input.connect(vol).connect(masterOutO);
      let prevFreq = null, prevSlide = false;
      for (let i = 0; i < maxSteps; i++) {
        const idx = i % t.pattern.length;
        const entry = t.pattern[idx];
        if (!entry) continue;
        const time = stepDur * i;
        const vel = entry.vel ?? 1;
        const pan = entry.pan ?? 0;
        const tg = offline.createGain(); tg.gain.value = vel;
        const tp = offline.createStereoPanner(); tp.pan.value = pan;
        tg.connect(tp).connect(input);
        const env = { stepDur, prevFreq, prevSlide };
        try { t.voice(offline, time, tg, t, entry, env); } catch (e) { /* skip */ }
        if (t.kind === 'bass' || t.kind === 'lead' || t.kind === 'sh101' || t.kind === 'juno' || t.kind === 'cs80') {
          prevFreq = midiToFreq(t.root + (entry.pitch || 0));
          prevSlide = !!entry.slide;
        }
      }
    }
    try {
      return await offline.startRendering();
    } catch (e) { console.warn('render error', e); return null; }
  }
  function playDeck(k, btn) {

  function rebuildAllUI() {

  // Effects vertical sliders need an explicit pixel height (vertical

  function resizeEffectsFaders() {

      const fader = card.querySelector('.vfader');
      if (!fader) return;
      const cardH = card.clientHeight;

  async function saveProject(forceRename) {

    if (!projectDir && window.showDirectoryPicker) {

    let filename;
    if (currentProjectName && !forceRename) {

      const suggested = currentProjectName || randomProjectName();
      const name = window.prompt('Save project as:', suggested);

  function loadProject(data) {

    if (data.compCfg)     Object.assign(compCfg, data.compCfg);

  async function reloadGranularSamples() {

  // ---------- Live mode (two-deck live mixing) ----------
  // Loads two saved projects side-by-side. Each loaded project's tracks are
  // tagged with their deck (A or B) and appended to the global tracks array
  // so they all run on the shared transport / scheduler — no pre-rendering.
  // The user mixes by muting / unmuting channels on each deck, sets per-
  // channel volume with horizontal faders, and crossfades the two decks

  const liveDecks = { A: { projectName: '' }, B: { projectName: '' } };

  const liveDeckGain = { A: 1, B: 1, x: 0.5 };

    if (deck === 'B') return liveDeckGain.B;

        if (!t.deckGainN) continue;

  function updateLiveDeckLabels() {

  function loadProjectIntoDeck(data, deck, fileName) {

      }

    if (holdBtn) holdBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (isDeckPaused(d)) return;
      if (!pauseDeck(d)) return;
      holdBtn.classList.add('on');
      const release = () => {
        resumeDeck(d);
        holdBtn.classList.remove('on');
        document.removeEventListener('pointerup', release);
        document.removeEventListener('pointercancel', release);
      };
      document.addEventListener('pointerup', release);
      document.addEventListener('pointercancel', release);
    });

    if (stopBtn) stopBtn.addEventListener('click', () => {
      if (isDeckPaused(d)) {
        // Already paused — restart from step 0.
        resetDeck(d);
        stopBtn.classList.remove('on');
        if (pauseBtn) pauseBtn.classList.remove('on');
      } else {
        // First press: pause the deck in place.
        if (pauseDeck(d)) stopBtn.classList.add('on');
      }
    });
  });
  setLiveCrossfade(0.5);

  // ---- per-deck EQ UI ----
  // Builds 3-band EQ controls (LO/MD/HI) under each deck panel. Each band
  // has a kill button (✕) that toggles the band to -15 dB (effectively
  // mutes that frequency range) and back. Saves the previous value so
  // toggling restores exactly what was there.
  const fmtEqDb = v => (v > 0 ? '+' : '') + Number(v).toFixed(1);

  function applyDeckEqBand(deck, band, value) {
    liveDeckEq[deck][band] = value;
    if (!audioCtx) return;
    const node = deck === 'A'
      ? (band === 'low' ? deckABusEqLow : band === 'mid' ? deckABusEqMid : deckABusEqHigh)
      : (band === 'low' ? deckBBusEqLow : band === 'mid' ? deckBBusEqMid : deckBBusEqHigh);
    if (node) node.gain.setTargetAtTime(value, audioCtx.currentTime, 0.02);
  }

  // Bipolar deck filter. value ∈ [-1, 1]: 0 = both filters open (bypass),
  // negative sweeps a low-pass down from 20 kHz to 300 Hz, positive sweeps a
  // high-pass up from 20 Hz to 8 kHz. Frequencies move logarithmically so the
  // sweep feels even across the knob's travel.
  const DECK_FILTER_LP_MAX = 20000, DECK_FILTER_LP_MIN = 300;
  const DECK_FILTER_HP_MIN = 20,    DECK_FILTER_HP_MAX = 8000;
  function deckFilterFreqs(value) {
    let hp = DECK_FILTER_HP_MIN, lp = 22000;
    if (value < 0) {
      const frac = Math.min(1, -value);
      lp = DECK_FILTER_LP_MAX * Math.pow(DECK_FILTER_LP_MIN / DECK_FILTER_LP_MAX, frac);
    } else if (value > 0) {
      const frac = Math.min(1, value);
      hp = DECK_FILTER_HP_MIN * Math.pow(DECK_FILTER_HP_MAX / DECK_FILTER_HP_MIN, frac);
    }
    return { hp, lp };
  }
  function applyDeckFilter(deck, value) {
    liveDeckFilter[deck] = value;
    if (!audioCtx) return;
    const hpNode = deck === 'A' ? deckAFilterHP : deckBFilterHP;
    const lpNode = deck === 'A' ? deckAFilterLP : deckBFilterLP;
    if (!hpNode || !lpNode) return;
    const { hp, lp } = deckFilterFreqs(value);
    hpNode.frequency.setTargetAtTime(hp, audioCtx.currentTime, 0.02);
    lpNode.frequency.setTargetAtTime(lp, audioCtx.currentTime, 0.02);
  }
  const fmtHz = f => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 0 : 1) + 'k' : Math.round(f);
  function fmtDeckFilter(value) {
    if (Math.abs(value) < 0.02) return 'OFF';
    const { hp, lp } = deckFilterFreqs(value);
    return value < 0 ? 'LP ' + fmtHz(lp) : 'HP ' + fmtHz(hp);
  }

  function buildDeckEq(deck) {
    const host = document.getElementById('live-deck-eq-' + deck);
    if (!host) return;
    host.innerHTML = '';

    // Per-deck volume slider sits at the top, above the EQ bands. Writes to
    // the dedicated deck-bus volume node so it's independent of the master
    // and of the crossfader.
    const volRow = el('div', 'live-deck-vol-row');
    volRow.appendChild(el('span', 'lbl', 'Vol'));
    const volSlider = el('input'); volSlider.type='range';
    volSlider.min = 0; volSlider.max = 1.2; volSlider.step = 0.01;
    volSlider.value = liveDeckVol[deck];
    const volVal = el('span', 'v', Number(liveDeckVol[deck]).toFixed(2));
    volSlider.addEventListener('input', () => {
      const v = parseFloat(volSlider.value);
      liveDeckVol[deck] = v;
      volVal.textContent = v.toFixed(2);
      const node = deck === 'A' ? deckAVolNode : deckBVolNode;
      if (node && audioCtx) node.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
    });
    volRow.appendChild(volSlider);
    volRow.appendChild(volVal);
    host.appendChild(volRow);

    // Bipolar sweep filter — centre-detented slider. Centre = off; left
    // sweeps a low-pass down, right sweeps a high-pass up. Double-click the
    // slider to snap back to centre.
    const filtRow = el('div', 'live-deck-filter-row');
    filtRow.appendChild(el('span', 'lbl', 'Filt'));
    const filtVal = el('span', 'v', fmtDeckFilter(liveDeckFilter[deck]));
    const filtSlider = el('input'); filtSlider.type = 'range';
    filtSlider.min = -1; filtSlider.max = 1; filtSlider.step = 0.01;
    filtSlider.value = liveDeckFilter[deck];
    filtSlider.title = 'Deck ' + deck + ' filter — left: low-pass, right: high-pass (double-click = off)';
    const setFilt = (v) => {
      filtVal.textContent = fmtDeckFilter(v);
      applyDeckFilter(deck, v);
    };
    filtSlider.addEventListener('input', () => setFilt(parseFloat(filtSlider.value)));
    filtSlider.addEventListener('dblclick', () => { filtSlider.value = 0; setFilt(0); });
    filtRow.appendChild(filtSlider);
    filtRow.appendChild(filtVal);
    host.appendChild(filtRow);

    const bandsRow = el('div', 'live-deck-eq-bands');
    [['LO','low'],['MD','mid'],['HI','high']].forEach(([label, band]) => {
      const row = el('div', 'live-deck-eq-row');
      row.appendChild(el('span', null, label));
      const initial = liveDeckEq[deck][band];
      const valEl = el('span', 'v', fmtEqDb(initial));
      let saved = initial;
      let killed = false;
      const kill = el('button', 'eq-kill', '✕');
      kill.title = 'kill this band (-40 dB)';
      const dial = makeRotary(-40, 15, initial, (v) => {
        if (killed) { killed = false; kill.classList.remove('on'); }
        saved = v;
        valEl.textContent = fmtEqDb(v);
        applyDeckEqBand(deck, band, v);
      }, fmtEqDb);
      kill.addEventListener('click', (e) => {
        e.preventDefault();
        killed = !killed;
        kill.classList.toggle('on', killed);
        const v = killed ? -40 : saved;
        dial._setValue(v);
        valEl.textContent = fmtEqDb(v);
        applyDeckEqBand(deck, band, v);
      });
      row.appendChild(dial);
      row.appendChild(valEl);
      row.appendChild(kill);
      bandsRow.appendChild(row);
    });
    host.appendChild(bandsRow);

    // Global group-arm widget — sits inside each deck's EQ panel so the
    // user can kill / revive a whole group (e.g. "drums") right next to
    // where they're touching the EQ.
    host.appendChild(buildLiveGroupBar('deck-' + deck));
  }
  // Inline group-arm bar — used inside every deck-EQ block and on the
  // master bar. Reads/writes the shared groupArmed[] state.
  function buildLiveGroupBar(idTag) {
    const wrap = el('div', 'live-deck-groups');
    wrap.appendChild(el('span', 'lbl', 'Groups'));
    for (let i = 0; i < 4; i++) {
      const btn = el('button', 'live-group-btn', String(i + 1));
      btn.dataset.group = String(i);
      btn.title = 'Arm / disarm every track in group ' + (i + 1);
      const refreshBtn = () => {
        const anyMember = tracks.some(t => t.groups && t.groups[i]);
        btn.classList.toggle('on', groupArmed[i] && anyMember);
        btn.classList.toggle('empty', !anyMember);
      };
      refreshBtn();
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        if (!tracks.some(t => t.groups && t.groups[i])) return;
        groupArmed[i] = !groupArmed[i];
        applyGroupArm(i);
        refreshAllGroupBtns();
        document.querySelectorAll('.live-group-btn').forEach(b => {
          const idx = parseInt(b.dataset.group, 10);
          const anyMember = tracks.some(t => t.groups && t.groups[idx]);
          b.classList.toggle('on', groupArmed[idx] && anyMember);
          b.classList.toggle('empty', !anyMember);
        });
      });
      wrap.appendChild(btn);
    }
    return wrap;
  }
  buildDeckEq('A'); buildDeckEq('B');

  // ---- Live master bar (EQ + volume for the whole mix) ----
  function buildLiveMasterBar() {
    const host = document.getElementById('live-master-bar');
    if (!host) return;
    host.innerHTML = '';
    host.appendChild(el('span', 'live-master-label', 'Master'));

    const eqWrap = el('div', 'live-master-eq');
    const fmt = v => (v > 0 ? '+' : '') + Number(v).toFixed(1);

    const makeBand = (label, prop, getNode) => {
      const row = el('div', 'live-master-eq-row');
      row.appendChild(el('span', 'lbl', label));
      const initial = master[prop];
      const valEl = el('span', 'v', fmt(initial));
      let saved = initial;
      let killed = false;
      const kill = el('button', 'live-master-kill', '✕');
      kill.title = 'Kill this band (-40 dB)';
      const apply = (v) => {
        master[prop] = v;
        valEl.textContent = fmt(v);
        const n = getNode();
        if (n && audioCtx) n.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
      };
      const dial = makeRotary(-40, 15, initial, (v) => {
        if (killed) { killed = false; kill.classList.remove('on'); }
        saved = v;
        apply(v);
      }, fmt);
      kill.addEventListener('click', (e) => {
        e.preventDefault();
        killed = !killed;
        kill.classList.toggle('on', killed);
        const v = killed ? -40 : saved;
        dial._setValue(v);
        apply(v);
      });
      row.appendChild(dial);
      row.appendChild(valEl);
      row.appendChild(kill);
      return row;
    };
    eqWrap.appendChild(makeBand('LO',  'low',  () => eqLow));
    eqWrap.appendChild(makeBand('MD',  'mid',  () => eqMid));
    eqWrap.appendChild(makeBand('HI',  'high', () => eqHigh));
    host.appendChild(eqWrap);

    // Global group-arm widget — sits next to the master EQ so the user
    // can kill or revive a whole group (e.g. "drums") from the live
    // bar without hunting through tracks.
    const groupsWrap = el('div', 'live-master-groups');
    groupsWrap.appendChild(el('span', 'lbl', 'Groups'));
    for (let i = 0; i < 4; i++) {
      const btn = el('button', 'live-group-btn', String(i + 1));
      btn.dataset.group = String(i);
      btn.title = 'Arm / disarm every track in group ' + (i + 1);
      const refreshBtn = () => {
        const anyMember = tracks.some(t => t.groups && t.groups[i]);
        btn.classList.toggle('on', groupArmed[i] && anyMember);
        btn.classList.toggle('empty', !anyMember);
      };
      refreshBtn();
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        // Skip groups with no members.
        if (!tracks.some(t => t.groups && t.groups[i])) return;
        groupArmed[i] = !groupArmed[i];
        applyGroupArm(i);
        refreshAllGroupBtns();
        document.querySelectorAll('.live-group-btn').forEach(b => {
          const idx = parseInt(b.dataset.group, 10);
          const anyMember = tracks.some(t => t.groups && t.groups[idx]);
          b.classList.toggle('on', groupArmed[idx] && anyMember);
          b.classList.toggle('empty', !anyMember);
        });
      });
      groupsWrap.appendChild(btn);
    }
    host.appendChild(groupsWrap);

    const volWrap = el('div', 'live-master-vol');
    volWrap.appendChild(el('span', 'lbl', 'Vol'));
    const volSlider = el('input');
    volSlider.type='range'; volSlider.min=0; volSlider.max=1.2; volSlider.step=0.01;
    volSlider.value = master.vol;
    const volVal = el('span', 'v', Number(master.vol).toFixed(2));
    volSlider.addEventListener('input', () => {
      const v = parseFloat(volSlider.value);
      master.vol = v;
      volVal.textContent = v.toFixed(2);
      if (masterOut && audioCtx) masterOut.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    });
    volWrap.appendChild(volSlider);
    volWrap.appendChild(volVal);
    host.appendChild(volWrap);
  }
  buildLiveMasterBar();

  // ---------- Live cue ----------
  // A staging list — user adds project files, then sends each to Deck A or
  // Deck B with one click. The chosen entry is removed from the cue after
  // it's sent. Cues can be exported / re-imported as a single bundled JSON.
  const liveCue = [];
  let _cueIdCounter = 1;

  function rebuildCueUI() {
    const listEl = document.getElementById('live-cue-list');
    const countEl = document.getElementById('live-cue-count');
    if (!listEl) return;
    listEl.innerHTML = '';
    if (countEl) countEl.textContent = liveCue.length + ' staged';
    if (liveCue.length === 0) {
      const hint = el('div', 'live-cue-empty',
        'Empty cue — drop project files here, or use "+ Add files".');
      listEl.appendChild(hint);
      return;
    }
    liveCue.forEach(entry => {
      const row = el('div', 'live-cue-item');
      const nameEl = el('span', 'live-cue-name', entry.name);
      nameEl.title = entry.name;
      const meta = el('span', 'live-cue-meta',
        (Array.isArray(entry.data.tracks) ? entry.data.tracks.length : 0) + ' tr'
        + (entry.data.bpm !== undefined ? ' · ' + entry.data.bpm + ' bpm' : ''));
      const aBtn = el('button', 'live-cue-deck-btn', 'A');
      aBtn.title = 'Send to Deck A (replaces current Deck A)';
      const bBtn = el('button', 'live-cue-deck-btn', 'B');
      bBtn.title = 'Send to Deck B (replaces current Deck B)';
      const rmBtn = el('button', 'live-cue-rm', '×');
      rmBtn.title = 'Remove from cue';
      aBtn.addEventListener('click', () => sendCueToDeck(entry.id, 'A'));
      bBtn.addEventListener('click', () => sendCueToDeck(entry.id, 'B'));
      rmBtn.addEventListener('click', () => { removeFromCue(entry.id); });
      row.appendChild(nameEl);
      row.appendChild(meta);
      row.appendChild(aBtn);
      row.appendChild(bBtn);
      row.appendChild(rmBtn);
      listEl.appendChild(row);
    });
  }

  function addToCue(name, data) {
    if (!data || !Array.isArray(data.tracks)) {
      alert('"' + name + '" is not a substrata project.');
      return;
    }
    liveCue.push({ id: _cueIdCounter++, name, data });
    rebuildCueUI();
  }
  function removeFromCue(id) {
    const i = liveCue.findIndex(c => c.id === id);
    if (i >= 0) liveCue.splice(i, 1);
    rebuildCueUI();
  }
  function sendCueToDeck(id, deck) {
    const entry = liveCue.find(c => c.id === id);
    if (!entry) return;
    loadProjectIntoDeck(entry.data, deck, entry.name);
    removeFromCue(id);
  }
  function clearCue() {
    liveCue.length = 0;
    rebuildCueUI();
  }

  function openCueAddDialog() {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = '.json,application/json';
    input.addEventListener('change', () => {
      const files = Array.from(input.files || []);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          try { addToCue(file.name, JSON.parse(reader.result)); }
          catch (e) { alert('Could not parse ' + file.name + ': ' + e.message); }
        };
        reader.readAsText(file);
      });
    });
    input.click();
  }

  function saveCueToFile() {
    if (liveCue.length === 0) { alert('Cue is empty — add files first.'); return; }
    const payload = {
      type: 'substrata-cue',
      version: 1,
      savedAt: new Date().toISOString(),
      items: liveCue.map(c => ({ name: c.name, data: c.data }))
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    a.href = url;
    a.download = 'substrata-cue-' + ts + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function loadCueFromFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || parsed.type !== 'substrata-cue' || !Array.isArray(parsed.items)) {
            alert('That file is not a substrata cue.');
            return;
          }
          clearCue();
          parsed.items.forEach(it => {
            if (it && it.name && it.data) liveCue.push({ id: _cueIdCounter++, name: it.name, data: it.data });
          });
          rebuildCueUI();
        } catch (e) { alert('Failed to load cue: ' + e.message); }
      };
      reader.readAsText(file);
    });
    input.click();
  }

  const cueAdd   = document.getElementById('cue-add');
  const cueSave  = document.getElementById('cue-save');
  const cueLoad  = document.getElementById('cue-load');
  const cueClear = document.getElementById('cue-clear');
  if (cueAdd)   cueAdd.addEventListener('click', openCueAddDialog);
  if (cueSave)  cueSave.addEventListener('click', saveCueToFile);
  if (cueLoad)  cueLoad.addEventListener('click', loadCueFromFile);
  if (cueClear) cueClear.addEventListener('click', () => {
    if (liveCue.length === 0) return;
    if (confirm('Clear the cue?')) clearCue();
  });

  // Drag-and-drop project files onto the cue zone
  const cueZone = document.getElementById('live-cue');
  if (cueZone) {
    ['dragenter','dragover'].forEach(ev => {
      cueZone.addEventListener(ev, e => { e.preventDefault(); cueZone.classList.add('drag-over'); });
    });
    ['dragleave','drop'].forEach(ev => {
      cueZone.addEventListener(ev, e => { e.preventDefault(); cueZone.classList.remove('drag-over'); });
    });
    cueZone.addEventListener('drop', e => {
      const files = Array.from(e.dataTransfer && e.dataTransfer.files || []);
      files.filter(f => /\.json$/i.test(f.name)).forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          try { addToCue(file.name, JSON.parse(reader.result)); }
          catch (err) { alert('Could not parse ' + file.name + ': ' + err.message); }
        };
        reader.readAsText(file);
      });
    });
  }

  rebuildCueUI();

  updateLiveDeckLabels();

  function openLoadDialog() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          loadProject(JSON.parse(reader.result));
          currentProjectName = file.name;
          updateProjectNameDisplay();
        } catch (e) { alert('Failed to load: ' + e.message); }
      };
      reader.readAsText(file);
    });
    input.click();
  }
  document.getElementById('save').addEventListener('click', (e) => saveProject(e.shiftKey));
  document.getElementById('load').addEventListener('click', openLoadDialog);

  // ---------- recording ----------
  let recordDest = null, mediaRecorder = null, recordChunks = [];
  let recordMime = '';
  const recBtn = document.getElementById('rec');
  function pickMime() {
    const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/ogg;codecs=opus'];
    return cands.find(c => window.MediaRecorder && MediaRecorder.isTypeSupported(c)) || '';
  }
  function startRecording() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!window.MediaRecorder) { alert('MediaRecorder is not supported in this browser.'); return; }
    if (!recordDest) {
      recordDest = audioCtx.createMediaStreamDestination();
      masterOut.connect(recordDest);
    }
    recordMime = pickMime();
    recordChunks = [];
    mediaRecorder = new MediaRecorder(recordDest.stream, recordMime ? { mimeType: recordMime } : undefined);
    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const type = recordMime || 'audio/webm';
      const blob = new Blob(recordChunks, { type });
      const ext = type.includes('mp4') ? 'm4a' : (type.includes('ogg') ? 'ogg' : 'webm');
      const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      const filename = 'substrata-rec-' + ts + '.' + ext;
      if (projectDir) {
        const ok = await writeToSubfolder('exports', filename, blob);
        if (ok) return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    };
    mediaRecorder.start();
    recBtn.classList.add('on');
    recBtn.textContent = '■';
  }
  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    recBtn.classList.remove('on');
    recBtn.textContent = '●';
  }
  recBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
    else startRecording();
  });

  function makeCollapsible(moduleEl, opts) {
    opts = opts || {};
    const h2 = moduleEl.querySelector('h2');
    if (!h2) return;
    if (h2.querySelector('.collapse-chev')) return;
    const chev = document.createElement('span');
    chev.className = 'collapse-chev';
    const startCollapsed = opts.collapsed || moduleEl.classList.contains('collapsed');
    chev.textContent = startCollapsed ? '▸' : '▾';
    h2.insertBefore(chev, h2.firstChild);
    if (startCollapsed) moduleEl.classList.add('collapsed');
    h2.addEventListener('click', () => {
      const collapsed = moduleEl.classList.toggle('collapsed');
      chev.textContent = collapsed ? '▸' : '▾';
      if (opts.onToggle) opts.onToggle(collapsed);
    });
  }
  function applyCollapsibles() {
    ['master','comp','ducker','delay','space-echo','reverb','chorus','flanger','bitcrush','tape','lofi','lpfilter','hpfilter'].forEach(id => {
      const m = document.getElementById(id);
      if (m) makeCollapsible(m);
    });
    const mixer = document.getElementById('mixer');
    if (mixer) {
      makeCollapsible(mixer, {
        collapsed: mixer.classList.contains('collapsed') || !document.body.classList.contains('mixer-open'),
        onToggle: (c) => {
          document.body.classList.toggle('mixer-collapsed', c);
          // Bottom mixer height just changed → effects side-panel size
          // changes → re-measure faders.
          if (typeof resizeEffectsFaders === 'function') {
            requestAnimationFrame(resizeEffectsFaders);
          }
        }
      });
    }
  }

  // Add Track buttons
  document.querySelectorAll('.add-track').forEach(btn => {
    btn.addEventListener('click', async () => {
      try { await addTrack(btn.dataset.kind); }
      catch (e) { console.error('addTrack failed:', e); alert('Add track failed: ' + (e && e.message)); }
    });
  });

  // Project folder button
  document.getElementById('folder').addEventListener('click', pickProjectDir);
  updateFolderIndicator();

  // Mode toggle
  const modeBtns = document.querySelectorAll('#mode-toggle button');
  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      const oldMode = currentMode;
      currentMode = mode;
      document.body.classList.toggle('mode-recording', mode === 'recording');
      document.body.classList.toggle('mode-mixing',  mode === 'mixing');
      document.body.classList.toggle('mode-effects', mode === 'effects');
      document.body.classList.toggle('mode-live',    mode === 'live');
      modeBtns.forEach(b => b.classList.toggle('on', b === btn));
      // Live, Mix and Track modes each use their own DOM layouts — rebuild
      // whenever we cross a mode boundary that changes structure.
      const structural = m => m === 'live' || m === 'mixing' || m === 'recording';
      if (structural(mode) || structural(oldMode)) rebuildTracksUI();
      // Effects-mode sliders are JS-sized — re-measure now that the side
      // panel is visible (and CSS heights have settled).
      if (mode === 'effects') requestAnimationFrame(resizeEffectsFaders);
    });
  });

  // Realign every track to step 0 — kills accumulated timing drift.
  // Defers the snap until every track has crossed its next step boundary so
  // nothing gets cut mid-step (the cause of the audible stumble).
  document.getElementById('realign').addEventListener('click', () => {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    let maxNext = now;
    for (const t of tracks) {
      if (typeof t.nextNoteTime === 'number' && t.nextNoteTime > maxNext) {
        maxNext = t.nextNoteTime;
      }
    }
    const bpm = parseFloat(bpmInput.value) || 120;
    const stepDur = (60 / bpm) / 4;  // 16th-note step duration
    // One full step past the latest scheduled step — guarantees every track
    // has finished playing the step it was already committed to.
    const startTime = maxNext + stepDur;
    for (const t of tracks) {
      t.nextStep = 0;
      t.nextNoteTime = startTime;
      t._prevFreq = null;
      t._prevSlide = false;
      t._lastTrigGain = null;
    }
  });

  // Full screen
  document.getElementById('fullscreen').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  rebuildTracksUI();
  buildFxRacks();
  buildMaster(); buildComp(); buildDucker();
  buildDelay(); buildSpaceEcho(); buildReverb();
  buildChorus(); buildFlanger(); buildBitcrush(); buildTape(); buildLoFi();
  buildLPFilter(); buildHPFilter();
  applyCollapsibles();
  setupEffectsResizeObserver();
</script>
</body>
</html>
