<script>
  const bpmInput = document.getElementById('bpm');
  const playBtn  = document.getElementById('play');
  const tracksEl = document.getElementById('tracks');

  let projectDir = null;
  let currentProjectName = '';
  function updateProjectNameDisplay() {
    const el = document.getElementById('project-name');
    if (el) el.textContent = currentProjectName || '';
  }

  async function pickProjectDir() {
    if (!window.showDirectoryPicker) {
      alert('Selecting a project folder requires Chrome or Edge. Samples will be downloaded individually.');
      return false;
    }
    try {
      const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
      projectDir = dir;
      await projectDir.getDirectoryHandle('samples', { create: true });
      await projectDir.getDirectoryHandle('exports', { create: true });
      updateFolderIndicator();
      // After the folder is set, try to auto-load a project JSON sitting
      // at the root: 0 → flag, 1 → load, >1 → ask the user to pick one.
      await autoLoadProjectFromDir();
      return true;
    } catch (e) { return false; }
  }
  // Scans the project folder root for `.json` files. Loads it directly
  // when there's exactly one; falls back to a picker prompt when there
  // are multiple, and flags the folder name when there are none.
  async function autoLoadProjectFromDir() {
    if (!projectDir) return;
    const jsons = [];
    try {
      for await (const [name, handle] of projectDir.entries()) {
        if (handle.kind === 'file' && /\.json$/i.test(name)) jsons.push(name);
      }
    } catch (e) {
      console.warn('Could not enumerate folder for JSON files', e);
      flagFolderProjectStatus('— no JSON');
      return;
    }
    if (jsons.length === 0) {
      flagFolderProjectStatus('— no project JSON');
      return;
    }
    let chosen = jsons[0];
    if (jsons.length > 1) {
      const list = jsons.map((n, i) => (i + 1) + ') ' + n).join('\n');
      const pick = window.prompt(
        'Multiple project files found:\n\n' + list +
        '\n\nType the number to load (Cancel to skip):',
        '1'
      );
      if (!pick) { flagFolderProjectStatus('— pick a project'); return; }
      const idx = parseInt(pick.trim(), 10) - 1;
      if (!(idx >= 0 && idx < jsons.length)) { flagFolderProjectStatus('— pick a project'); return; }
      chosen = jsons[idx];
    }
    try {
      const fh = await projectDir.getFileHandle(chosen);
      const file = await fh.getFile();
      const text = await file.text();
      loadProject(JSON.parse(text));
      currentProjectName = chosen;
      updateProjectNameDisplay();
    } catch (e) {
      console.warn('Failed to auto-load project JSON', e);
      alert('Failed to load ' + chosen + ': ' + (e.message || e));
    }
  }
  // Append a short status hint to the folder name pill so the user sees
  // why nothing got auto-loaded.
  function flagFolderProjectStatus(hint) {
    const el = document.getElementById('folder-name');
    if (!el || !projectDir) return;
    el.textContent = projectDir.name + ' ' + hint;
  }
  function updateFolderIndicator() {
    const el = document.getElementById('folder-name');
    if (el) el.textContent = projectDir ? projectDir.name : 'no folder';
  }
  async function writeToSubfolder(sub, filename, blobOrText) {
    if (!projectDir) return false;
    try {
      const dir = await projectDir.getDirectoryHandle(sub, { create: true });
      const fh = await dir.getFileHandle(filename, { create: true });
      const w = await fh.createWritable();
      await w.write(blobOrText);
      await w.close();
      return true;
    } catch (e) { console.warn('Could not write', sub, filename, e); return false; }
  }
  async function readSampleFromFolder(filename) {
    if (!projectDir) return null;
    try {
      const dir = await projectDir.getDirectoryHandle('samples');
      const fh = await dir.getFileHandle(filename);
      const file = await fh.getFile();
      return await file.arrayBuffer();
    } catch (e) { console.warn('Sample not found:', filename, e); return null; }
  }

  let audioCtx = null, isPlaying = false;
  let globalStep = 0, nextNoteTime = 0;
  let schedulerTimer = null;
  const LOOKAHEAD = 25, SCHEDULE_AHEAD = 0.1;

  // ---------- helpers ----------
  let noiseBuffer = null;
  function getNoise(ctx) {
    if (noiseBuffer) return noiseBuffer;
    const len = ctx.sampleRate * 2;
    noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuffer;
  }
  const semi        = n => Math.pow(2, n / 12);
  const midiToFreq  = m => 440 * Math.pow(2, (m - 69) / 12);
  const clamp       = (x, a, b) => Math.max(a, Math.min(b, x));

  function makePulseWave(ctx, pw) {
    const n = 64;
    const real = new Float32Array(n);
    const imag = new Float32Array(n);
    const d = Math.max(0.02, Math.min(0.98, pw));
    for (let k = 1; k < n; k++) {
      imag[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * d);
    }
    return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
  }
  function createOsc(ctx, wave, pw) {
    const o = ctx.createOscillator();
    if (wave === 'pulse') o.setPeriodicWave(makePulseWave(ctx, pw));
    else o.type = wave;
    return o;
  }
  function applyOscFreq(osc, target, t, slideFrom) {
    if (slideFrom && Math.abs(slideFrom - target) > 0.5) {
      osc.frequency.setValueAtTime(slideFrom, t);
      osc.frequency.exponentialRampToValueAtTime(target, t + 0.06);
    } else {
      osc.frequency.value = target;
    }
  }

  // ---------- drum voices (signature: ctx, t, out, track, step, env) ----------
  function vKick(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150 * m, t);
    o.frequency.exponentialRampToValueAtTime(40 * m, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.4);
  }
  function vHatClosed(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 8000*m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    s.connect(hp).connect(g).connect(out); s.start(t); s.stop(t + 0.06);
  }
  function vHatOpen(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 7000*m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    s.connect(hp).connect(g).connect(out); s.start(t); s.stop(t + 0.4);
  }
  function vSnare(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 1200*m;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(0.6, t + 0.001);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    s.connect(hp).connect(ng).connect(out); s.start(t); s.stop(t + 0.2);
    const o = ctx.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(220*m, t);
    o.frequency.exponentialRampToValueAtTime(170*m, t + 0.08);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(og).connect(out); o.start(t); o.stop(t + 0.15);
  }
  function vClap(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const burst = (t0, dur, peak) => {
      const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value = 1100*m; bp.Q.value = 1.5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.001);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(bp).connect(g).connect(out); s.start(t0); s.stop(t0 + dur + 0.05);
    };
    burst(t,         0.015, 0.55);
    burst(t + 0.012, 0.015, 0.55);
    burst(t + 0.024, 0.015, 0.55);
    burst(t + 0.04,  0.18,  0.35);
  }
  function vRide(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const bp = ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 3500*m; bp.Q.value = 1.2;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 2500*m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
    s.connect(hp).connect(bp).connect(g).connect(out); s.start(t); s.stop(t + 0.85);
  }
  function vCrash(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 5000*m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    s.connect(hp).connect(g).connect(out); s.start(t); s.stop(t + 1.6);
  }
  function makeTom(base) {
    return function (ctx, t, out, tr) {
      const m = semi(tr.tune);
      const o = ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(base*1.6*m, t);
      o.frequency.exponentialRampToValueAtTime(base*m, t + 0.2);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.8, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.connect(g).connect(out); o.start(t); o.stop(t + 0.5);
    };
  }
  function vClave(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const o = ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(2500*m, t);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.7, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.06);
  }

  // ---------- bass ----------
  // Cached soft-limit curve for the bass voice — keeps the three-oscillator
  // sum plus the resonant low-pass peak from ever exceeding ~0.7. Paired
  // with the per-channel bass compressor in initTrackAudio.
  let _bassLimitCurve = null;
  function getBassLimitCurve(ctx) {
    if (!_bassLimitCurve) _bassLimitCurve = makeLimiterCurve(0.45, 0.7);
    return _bassLimitCurve;
  }

  function vBass(ctx, t, out, tr, step, env) {
    const offset  = step.pitch || 0;
    const target  = midiToFreq(tr.root + offset);
    const slide   = env && env.prevSlide && env.prevFreq;
    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const holdEnd = t + stepDur * stepLen;
    const off     = holdEnd + Math.max(tr.release, tr.fDecay) + 0.15;

    const sub = ctx.createOscillator(); sub.type = 'sine';
    const sin = ctx.createOscillator(); sin.type = 'sine';
    const saw = ctx.createOscillator(); saw.type = tr.wave;

    applyOscFreq(sub, target / 2, t, slide ? env.prevFreq / 2 : null);
    applyOscFreq(sin, target,     t, slide ? env.prevFreq     : null);
    applyOscFreq(saw, target,     t, slide ? env.prevFreq     : null);

    const subG = ctx.createGain(); subG.gain.value = tr.subLevel;
    const sinG = ctx.createGain(); sinG.gain.value = tr.sinLevel;
    const sawG = ctx.createGain(); sawG.gain.value = tr.sawLevel;
    // Headroom for the three-oscillator sum before the resonant filter — was
    // 0.7, lowered to 0.55 so high subLevel + high reso doesn't push past 0 dB.
    const mix  = ctx.createGain(); mix.gain.value = 0.55;
    sub.connect(subG).connect(mix);
    sin.connect(sinG).connect(mix);
    saw.connect(sawG).connect(mix);

    // Per-voice soft limiter — catches anything the headroom and ADSR didn't.
    const limit = ctx.createWaveShaper();
    limit.curve = getBassLimitCurve(ctx);
    limit.oversample = '4x';

    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.Q.value = tr.reso;
    const peak = Math.min(18000, tr.cutoff * (1 + tr.env * 12));
    f.frequency.setValueAtTime(peak, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, tr.cutoff), t + tr.fDecay);

    // amp ADSR
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + tr.attack);
    g.gain.linearRampToValueAtTime(Math.max(0.0001, tr.sustain), t + tr.attack + tr.decay);
    g.gain.setValueAtTime(Math.max(0.0001, tr.sustain), holdEnd);
    g.gain.linearRampToValueAtTime(0.0001, holdEnd + tr.release);

    const anyLFO = tr.lfoCut > 0 || tr.lfoRes > 0 || tr.lfoPitch > 0 || tr.lfoAmp > 0 || tr.lfoEnv > 0;
    let lfo = null;
    if (anyLFO) {
      lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
    }

    if (anyLFO && tr.lfoAmp > 0) {
      const dc = ctx.createConstantSource(); dc.offset.value = 1;
      const trem = ctx.createGain(); trem.gain.value = 1;
      const ag = ctx.createGain(); ag.gain.value = tr.lfoAmp * 0.9;
      lfo.connect(ag).connect(trem.gain);
      dc.connect(trem.gain);
      dc.start(t); dc.stop(off);
      mix.connect(trem).connect(f).connect(g).connect(limit).connect(out);
    } else {
      mix.connect(f).connect(g).connect(limit).connect(out);
    }

    if (anyLFO) {
      if (tr.lfoCut > 0) {
        const cg = ctx.createGain(); cg.gain.value = tr.lfoCut * 3000;
        lfo.connect(cg).connect(f.frequency);
      }
      if (tr.lfoEnv > 0) {
        const pk = Math.min(18000, tr.cutoff * (1 + tr.env * 12));
        const eg = ctx.createGain(); eg.gain.value = tr.lfoEnv * (pk - tr.cutoff) * 0.6;
        lfo.connect(eg).connect(f.frequency);
      }
      if (tr.lfoRes > 0) {
        const rg = ctx.createGain(); rg.gain.value = tr.lfoRes * 12;
        lfo.connect(rg).connect(f.Q);
      }
      if (tr.lfoPitch > 0) {
        const pg = ctx.createGain(); pg.gain.value = tr.lfoPitch * 100;
        lfo.connect(pg);
        pg.connect(sub.detune); pg.connect(sin.detune); pg.connect(saw.detune);
      }
    }

    sub.start(t); sub.stop(off);
    sin.start(t); sin.stop(off);
    saw.start(t); saw.stop(off);
  }

  // -------- vSh101 — Roland-SH-101-inspired mono synth --------
  // Single VCO with simultaneously-available pulse + saw + sub (-1 / -2 oct
  // square) + noise. 24 dB/oct lowpass (two cascaded LP biquads) with its own
  // ADSR and bipolar env amount. Separate VCA ADSR. LFO (sine/tri/sq/saw)
  // routes to pitch and cutoff. Portamento via the existing slide flag.
  function vSh101(ctx, t, out, tr, step, env) {
    const offset  = step.pitch || 0;
    const target  = midiToFreq(tr.root + offset);
    const slide   = env && env.prevSlide && env.prevFreq;
    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const holdEnd = t + stepDur * stepLen;
    const off     = holdEnd + Math.max(tr.release, tr.fRelease, 0.1) + 0.15;

    // VCO — pulse (PWM-tuneable), saw, sub square, noise
    const pulse = createOsc(ctx, 'pulse', tr.pulseWidth);
    const saw   = ctx.createOscillator(); saw.type = 'sawtooth';
    const sub   = ctx.createOscillator(); sub.type = 'square';
    const noise = ctx.createBufferSource(); noise.buffer = getNoise(ctx); noise.loop = true;
    const subMul = tr.subOctave === -2 ? 0.25 : 0.5;
    applyOscFreq(pulse, target,         t, slide ? env.prevFreq         : null);
    applyOscFreq(saw,   target,         t, slide ? env.prevFreq         : null);
    applyOscFreq(sub,   target * subMul, t, slide ? env.prevFreq * subMul : null);

    const pulseG = ctx.createGain(); pulseG.gain.value = tr.pulseLevel;
    const sawG   = ctx.createGain(); sawG.gain.value   = tr.sawLevel;
    const subG   = ctx.createGain(); subG.gain.value   = tr.subLevel;
    const noiseG = ctx.createGain(); noiseG.gain.value = tr.noiseLevel;
    const mix    = ctx.createGain(); mix.gain.value    = 0.45;
    pulse.connect(pulseG).connect(mix);
    saw.connect(sawG).connect(mix);
    sub.connect(subG).connect(mix);
    noise.connect(noiseG).connect(mix);

    // 24 dB/oct lowpass = two cascaded BiquadFilter lowpass nodes. First
    // stage carries the resonance, second stage is gentle to avoid a double
    // resonance peak.
    const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.Q.value = tr.reso;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = 0.5;

    // Filter envelope — bipolar env amount: positive sweeps cutoff up at the
    // attack, negative would sweep down. fSustain (0..1) interpolates between
    // baseCut and peakCut for the hold phase.
    const baseCut = Math.max(40, tr.cutoff);
    const envOctaves = tr.fEnvAmt * 5;
    const peakCut = clamp(baseCut * Math.pow(2, envOctaves), 40, 18000);
    const sustainCut = clamp(baseCut * Math.pow(2, envOctaves * tr.fSustain), 40, 18000);
    const setFilterEnv = (node, scale) => {
      const peakS = clamp(peakCut * scale, 40, 18000);
      const susS  = clamp(sustainCut * scale, 40, 18000);
      const baseS = clamp(baseCut * scale, 40, 18000);
      node.frequency.setValueAtTime(baseS, t);
      node.frequency.exponentialRampToValueAtTime(peakS, t + Math.max(0.001, tr.fAttack));
      node.frequency.exponentialRampToValueAtTime(susS, t + tr.fAttack + Math.max(0.005, tr.fDecay));
      node.frequency.setValueAtTime(susS, holdEnd);
      node.frequency.exponentialRampToValueAtTime(baseS, holdEnd + Math.max(0.01, tr.fRelease));
    };
    setFilterEnv(f1, 1);
    setFilterEnv(f2, 1.15);

    // VCA ADSR
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + Math.max(0.001, tr.attack));
    g.gain.linearRampToValueAtTime(Math.max(0.0001, tr.sustain), t + tr.attack + Math.max(0.001, tr.decay));
    g.gain.setValueAtTime(Math.max(0.0001, tr.sustain), holdEnd);
    g.gain.linearRampToValueAtTime(0.0001, holdEnd + Math.max(0.005, tr.release));

    // LFO — to pitch, cutoff
    if (tr.lfoVCO > 0 || tr.lfoVCF > 0) {
      const lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'triangle';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
      if (tr.lfoVCO > 0) {
        const pg = ctx.createGain(); pg.gain.value = tr.lfoVCO * 100;
        lfo.connect(pg);
        pg.connect(pulse.detune); pg.connect(saw.detune); pg.connect(sub.detune);
      }
      if (tr.lfoVCF > 0) {
        const cg1 = ctx.createGain(); cg1.gain.value = tr.lfoVCF * 3000;
        const cg2 = ctx.createGain(); cg2.gain.value = tr.lfoVCF * 3000;
        lfo.connect(cg1).connect(f1.frequency);
        lfo.connect(cg2).connect(f2.frequency);
      }
    }

    // Per-voice soft limiter — reuse the bass curve (knee 0.45 / ceiling 0.7).
    const limit = ctx.createWaveShaper();
    limit.curve = getBassLimitCurve(ctx);
    limit.oversample = '4x';

    mix.connect(f1).connect(f2).connect(g).connect(limit).connect(out);

    pulse.start(t); pulse.stop(off);
    saw.start(t);   saw.stop(off);
    sub.start(t);   sub.stop(off);
    noise.start(t); noise.stop(off);
  }

  // -------- vJuno — Roland-Juno-106-inspired mono synth --------
  // Like the SH-101 voice (pulse + saw + sub + noise into 24 dB lowpass)
  // but with the iconic built-in BBD-style stereo chorus tacked on after
  // the VCA. Brighter top end than the SH-101 and a softer second filter
  // stage to keep the Juno's smoother character.
  function vJuno(ctx, t, out, tr, step, env) {
    const offset  = step.pitch || 0;
    const target  = midiToFreq(tr.root + offset);
    const slide   = env && env.prevSlide && env.prevFreq;
    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const holdEnd = t + stepDur * stepLen;
    const off     = holdEnd + Math.max(tr.release, tr.fRelease, 0.2) + 0.2;

    const pulse = createOsc(ctx, 'pulse', tr.pulseWidth);
    const saw   = ctx.createOscillator(); saw.type = 'sawtooth';
    const sub   = ctx.createOscillator(); sub.type = 'square';
    const noise = ctx.createBufferSource(); noise.buffer = getNoise(ctx); noise.loop = true;
    applyOscFreq(pulse, target,       t, slide ? env.prevFreq       : null);
    applyOscFreq(saw,   target,       t, slide ? env.prevFreq       : null);
    applyOscFreq(sub,   target * 0.5, t, slide ? env.prevFreq * 0.5 : null);

    const pulseG = ctx.createGain(); pulseG.gain.value = tr.pulseLevel;
    const sawG   = ctx.createGain(); sawG.gain.value   = tr.sawLevel;
    const subG   = ctx.createGain(); subG.gain.value   = tr.subLevel;
    const noiseG = ctx.createGain(); noiseG.gain.value = tr.noiseLevel;
    const mix    = ctx.createGain(); mix.gain.value    = 0.40;
    pulse.connect(pulseG).connect(mix);
    saw.connect(sawG).connect(mix);
    sub.connect(subG).connect(mix);
    noise.connect(noiseG).connect(mix);

    const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.Q.value = tr.reso;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = 0.4;
    const baseCut = Math.max(40, tr.cutoff);
    const envOct = tr.fEnvAmt * 5;
    const peakCut = clamp(baseCut * Math.pow(2, envOct), 40, 18000);
    const susCut  = clamp(baseCut * Math.pow(2, envOct * tr.fSustain), 40, 18000);
    const setFilter = (node, scale) => {
      const p = clamp(peakCut * scale, 40, 18000);
      const s = clamp(susCut  * scale, 40, 18000);
      const b = clamp(baseCut * scale, 40, 18000);
      node.frequency.setValueAtTime(b, t);
      node.frequency.exponentialRampToValueAtTime(p, t + Math.max(0.001, tr.fAttack));
      node.frequency.exponentialRampToValueAtTime(s, t + tr.fAttack + Math.max(0.005, tr.fDecay));
      node.frequency.setValueAtTime(s, holdEnd);
      node.frequency.exponentialRampToValueAtTime(b, holdEnd + Math.max(0.01, tr.fRelease));
    };
    setFilter(f1, 1);
    setFilter(f2, 1.25); // brighter second pole

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + Math.max(0.001, tr.attack));
    g.gain.linearRampToValueAtTime(Math.max(0.0001, tr.sustain), t + tr.attack + Math.max(0.001, tr.decay));
    g.gain.setValueAtTime(Math.max(0.0001, tr.sustain), holdEnd);
    g.gain.linearRampToValueAtTime(0.0001, holdEnd + Math.max(0.005, tr.release));

    if (tr.lfoVCO > 0 || tr.lfoVCF > 0) {
      const lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'triangle';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
      if (tr.lfoVCO > 0) {
        const pg = ctx.createGain(); pg.gain.value = tr.lfoVCO * 100;
        lfo.connect(pg);
        pg.connect(pulse.detune); pg.connect(saw.detune); pg.connect(sub.detune);
      }
      if (tr.lfoVCF > 0) {
        const cg1 = ctx.createGain(); cg1.gain.value = tr.lfoVCF * 3000;
        const cg2 = ctx.createGain(); cg2.gain.value = tr.lfoVCF * 3000;
        lfo.connect(cg1).connect(f1.frequency);
        lfo.connect(cg2).connect(f2.frequency);
      }
    }

    // ---- Built-in chorus: dual LFO-modulated delay panned L/R ----
    const chorusAmt = clamp(tr.chorusAmount || 0, 0, 1);
    const post = ctx.createGain(); // node feeding the chorus + dry path
    if (chorusAmt > 0) {
      const dryG = ctx.createGain(); dryG.gain.value = 1 - chorusAmt * 0.4;
      const wetG = ctx.createGain(); wetG.gain.value = chorusAmt * 0.7;
      const dL   = ctx.createDelay(0.05); dL.delayTime.value = 0.016;
      const dR   = ctx.createDelay(0.05); dR.delayTime.value = 0.019;
      const lfoL = ctx.createOscillator(); lfoL.type = 'sine'; lfoL.frequency.value = tr.chorusRate || 0.7;
      const lfoR = ctx.createOscillator(); lfoR.type = 'sine'; lfoR.frequency.value = (tr.chorusRate || 0.7) * 1.06;
      const mL   = ctx.createGain(); mL.gain.value = 0.006;
      const mR   = ctx.createGain(); mR.gain.value = 0.006;
      lfoL.connect(mL).connect(dL.delayTime);
      lfoR.connect(mR).connect(dR.delayTime);
      lfoL.start(t); lfoL.stop(off);
      lfoR.start(t); lfoR.stop(off);
      const merger = ctx.createChannelMerger(2);
      post.connect(dL).connect(merger, 0, 0);
      post.connect(dR).connect(merger, 0, 1);
      merger.connect(wetG);
      post.connect(dryG);
      const sum = ctx.createGain();
      dryG.connect(sum); wetG.connect(sum);
      // Per-voice limiter
      const limit = ctx.createWaveShaper();
      limit.curve = getBassLimitCurve(ctx);
      limit.oversample = '4x';
      mix.connect(f1).connect(f2).connect(g).connect(post);
      sum.connect(limit).connect(out);
    } else {
      const limit = ctx.createWaveShaper();
      limit.curve = getBassLimitCurve(ctx);
      limit.oversample = '4x';
      mix.connect(f1).connect(f2).connect(g).connect(limit).connect(out);
    }

    pulse.start(t); pulse.stop(off);
    saw.start(t);   saw.stop(off);
    sub.start(t);   sub.stop(off);
    noise.start(t); noise.stop(off);
  }

  // -------- vCs80 — Yamaha-CS-80-inspired mono synth --------
  // Two detuned oscillators routed through a HPF → 24 dB LPF cascade
  // (CS-80's signature filter pair). Optional ring modulation between the
  // two oscillators. A delayed LFO models the CS-80's "vibrato delay" so
  // pitch wobble fades in after a held note — that's a big part of the
  // Vangelis-style sustained pad character.
  function vCs80(ctx, t, out, tr, step, env) {
    const offset  = step.pitch || 0;
    const target  = midiToFreq(tr.root + offset);
    const slide   = env && env.prevSlide && env.prevFreq;
    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const holdEnd = t + stepDur * stepLen;
    const off     = holdEnd + Math.max(tr.release, tr.fRelease, 0.3) + 0.3;

    const fA = target * Math.pow(2, (tr.octA || 0) / 12);
    const fB = target * Math.pow(2, (tr.octB || 0) / 12);
    const oscA = createOsc(ctx, tr.waveA || 'sawtooth', tr.pwA || 0.5);
    const oscB = createOsc(ctx, tr.waveB || 'sawtooth', tr.pwB || 0.5);
    applyOscFreq(oscA, fA, t, slide ? env.prevFreq * Math.pow(2, (tr.octA || 0) / 12) : null);
    applyOscFreq(oscB, fB, t, slide ? env.prevFreq * Math.pow(2, (tr.octB || 0) / 12) : null);
    oscB.detune.value = tr.detuneB || 0;

    const aG = ctx.createGain(); aG.gain.value = tr.mixA;
    const bG = ctx.createGain(); bG.gain.value = tr.mixB;
    const mix = ctx.createGain(); mix.gain.value = 0.4;
    oscA.connect(aG).connect(mix);
    oscB.connect(bG).connect(mix);

    // Optional ring mod between A and B — gate node's gain is modulated by
    // oscillator B, then signal A flows through, producing A * B.
    if ((tr.ringMod || 0) > 0) {
      const rGate = ctx.createGain(); rGate.gain.value = 0;
      oscB.connect(rGate.gain);
      const rG = ctx.createGain(); rG.gain.value = (tr.ringMod || 0) * 0.4;
      const rPath = ctx.createGain(); rPath.gain.value = 1;
      oscA.connect(rPath).connect(rGate).connect(rG).connect(mix);
    }

    // HPF (CS-80 brilliance/presence control) → LPF cascade (24 dB)
    const hpf = ctx.createBiquadFilter(); hpf.type = 'highpass'; hpf.Q.value = 0.7;
    hpf.frequency.value = Math.max(20, tr.hpf || 30);
    const lpf1 = ctx.createBiquadFilter(); lpf1.type = 'lowpass'; lpf1.Q.value = tr.reso;
    const lpf2 = ctx.createBiquadFilter(); lpf2.type = 'lowpass'; lpf2.Q.value = 0.5;

    const baseCut = Math.max(40, tr.cutoff);
    const envOct = tr.fEnvAmt * 4;
    const peakCut = clamp(baseCut * Math.pow(2, envOct), 40, 18000);
    const susCut  = clamp(baseCut * Math.pow(2, envOct * tr.fSustain), 40, 18000);
    const setFilter = (node, scale) => {
      const p = clamp(peakCut * scale, 40, 18000);
      const s = clamp(susCut  * scale, 40, 18000);
      const b = clamp(baseCut * scale, 40, 18000);
      node.frequency.setValueAtTime(b, t);
      node.frequency.exponentialRampToValueAtTime(p, t + Math.max(0.001, tr.fAttack));
      node.frequency.exponentialRampToValueAtTime(s, t + tr.fAttack + Math.max(0.005, tr.fDecay));
      node.frequency.setValueAtTime(s, holdEnd);
      node.frequency.exponentialRampToValueAtTime(b, holdEnd + Math.max(0.01, tr.fRelease));
    };
    setFilter(lpf1, 1);
    setFilter(lpf2, 1.2);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + Math.max(0.001, tr.attack));
    g.gain.linearRampToValueAtTime(Math.max(0.0001, tr.sustain), t + tr.attack + Math.max(0.001, tr.decay));
    g.gain.setValueAtTime(Math.max(0.0001, tr.sustain), holdEnd);
    g.gain.linearRampToValueAtTime(0.0001, holdEnd + Math.max(0.005, tr.release));

    // LFO with vibrato delay (CS-80 signature: vibrato fades in after a beat)
    if (tr.lfoVCO > 0 || tr.lfoVCF > 0) {
      const lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
      const lfoEnv = ctx.createGain();
      const dly = Math.max(0, tr.lfoDelay || 0.35);
      lfoEnv.gain.setValueAtTime(0, t);
      lfoEnv.gain.setValueAtTime(0, t + dly);
      lfoEnv.gain.linearRampToValueAtTime(1, t + dly + 0.12);
      lfo.connect(lfoEnv);
      if (tr.lfoVCO > 0) {
        const pg = ctx.createGain(); pg.gain.value = tr.lfoVCO * 100;
        lfoEnv.connect(pg);
        pg.connect(oscA.detune); pg.connect(oscB.detune);
      }
      if (tr.lfoVCF > 0) {
        const cg = ctx.createGain(); cg.gain.value = tr.lfoVCF * 3000;
        lfoEnv.connect(cg).connect(lpf1.frequency);
      }
    }

    const limit = ctx.createWaveShaper();
    limit.curve = getBassLimitCurve(ctx);
    limit.oversample = '4x';

    mix.connect(hpf).connect(lpf1).connect(lpf2).connect(g).connect(limit).connect(out);

    oscA.start(t); oscA.stop(off);
    oscB.start(t); oscB.stop(off);
  }

  // ---------- chord ----------
  const SCALES = {
    major:      [0, 2, 4, 5, 7, 9, 11],
    minor:      [0, 2, 3, 5, 7, 8, 10],
    dorian:     [0, 2, 3, 5, 7, 9, 10],
    phrygian:   [0, 1, 3, 5, 7, 8, 10],
    lydian:     [0, 2, 4, 6, 7, 9, 11],
    mixolydian: [0, 2, 4, 5, 7, 9, 10],
    locrian:    [0, 1, 3, 5, 6, 8, 10],
  };
  const CHORD_QUALITIES = ['auto','M','m','dim','aug','M7','m7','7','sus4','sus2'];
  const QUALITY_LABELS = {
    auto:'·', M:'M', m:'m', dim:'d', aug:'a', M7:'M7', m7:'m7', '7':'7', sus4:'s4', sus2:'s2'
  };
  const QUALITY_INTERVALS = {
    M:    [0, 4, 7],
    m:    [0, 3, 7],
    dim:  [0, 3, 6],
    aug:  [0, 4, 8],
    M7:   [0, 4, 7, 11],
    m7:   [0, 3, 7, 10],
    '7':  [0, 4, 7, 10],
    sus4: [0, 5, 7],
    sus2: [0, 2, 7],
  };
  function chordNotesFor(tr, step) {
    const scale = SCALES[tr.scale];
    const get = (i) => {
      const oct = Math.floor(i / 7);
      return scale[((i % 7) + 7) % 7] + oct * 12;
    };
    const baseOff = get(step.degree | 0);
    const q = step.quality || 'auto';
    let intervals;
    if (q === 'auto') {
      intervals = [0, get(step.degree + 2) - baseOff, get(step.degree + 4) - baseOff];
      if (tr.seventh) intervals.push(get(step.degree + 6) - baseOff);
      if (tr.ninth)   intervals.push(get(step.degree + 8) - baseOff);
    } else {
      intervals = QUALITY_INTERVALS[q].slice();
      if (tr.ninth) intervals.push(14);
    }
    return intervals.map(iv => tr.root + baseOff + iv);
  }
  function vChord(ctx, t, out, tr, step, env) {
    const midiNotes = chordNotesFor(tr, step);
    const stepDur   = env.stepDur;
    const stepLen   = (step && step.length != null) ? step.length : 1.0;
    const holdEnd   = t + stepDur * tr.lengthSteps * stepLen;
    const off       = holdEnd + Math.max(tr.release, tr.fRelease) + 0.15;

    // 24dB/oct lowpass = two cascaded biquads
    const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.Q.value = tr.reso;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = tr.reso * 0.6;

    const baseCut = tr.cutoff;
    const peakCut = Math.min(18000, baseCut * (1 + tr.fEnvAmt * 10));
    const sustCut = baseCut + (peakCut - baseCut) * tr.fSustain;
    [f1, f2].forEach(f => {
      f.frequency.setValueAtTime(baseCut, t);
      f.frequency.linearRampToValueAtTime(peakCut, t + tr.fAttack);
      f.frequency.linearRampToValueAtTime(sustCut, t + tr.fAttack + tr.fDecay);
      f.frequency.setValueAtTime(sustCut, holdEnd);
      f.frequency.linearRampToValueAtTime(baseCut, holdEnd + tr.fRelease);
    });

    const mix = ctx.createGain();
    mix.gain.value = 1 / Math.max(2, midiNotes.length);

    const allOscs = [];
    midiNotes.forEach((midi, i) => {
      const baseF = midiToFreq(midi);
      const center = (i - (midiNotes.length - 1) / 2);

      const oa = createOsc(ctx, tr.waveA, tr.pwA);
      oa.frequency.value = baseF * Math.pow(2, tr.octA / 12) * semi(tr.tuneA / 100);
      oa.detune.value = center * 4;
      const oaG = ctx.createGain(); oaG.gain.value = (1 - tr.mix);
      oa.connect(oaG).connect(mix);
      oa.start(t); oa.stop(off);

      const ob = createOsc(ctx, tr.waveB, tr.pwB);
      ob.frequency.value = baseF * Math.pow(2, tr.octB / 12) * semi(tr.tuneB / 100);
      ob.detune.value = tr.detuneB + center * 4;
      const obG = ctx.createGain(); obG.gain.value = tr.mix;
      ob.connect(obG).connect(mix);
      ob.start(t); ob.stop(off);

      allOscs.push(oa, ob);
    });

    if (tr.noise > 0) {
      const ns = ctx.createBufferSource(); ns.buffer = getNoise(ctx);
      const nsG = ctx.createGain(); nsG.gain.value = tr.noise * 0.3;
      ns.connect(nsG).connect(mix);
      ns.start(t); ns.stop(off);
    }

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.linearRampToValueAtTime(1, t + tr.attack);
    amp.gain.linearRampToValueAtTime(tr.sustain, t + tr.attack + tr.decay);
    amp.gain.setValueAtTime(tr.sustain, holdEnd);
    amp.gain.linearRampToValueAtTime(0.0001, holdEnd + tr.release);

    const panner = ctx.createStereoPanner();
    panner.pan.value = 0;

    const anyLFO = tr.lfoCut > 0 || tr.lfoRes > 0 || tr.lfoPit > 0 || tr.lfoAmp > 0 || tr.lfoPan > 0;
    let lfo = null;
    if (anyLFO) {
      lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
    }

    let postFilter = f2;
    if (anyLFO && tr.lfoAmp > 0) {
      const dc = ctx.createConstantSource(); dc.offset.value = 1;
      const trem = ctx.createGain(); trem.gain.value = 1;
      const ag = ctx.createGain(); ag.gain.value = tr.lfoAmp * 0.9;
      lfo.connect(ag).connect(trem.gain);
      dc.connect(trem.gain);
      dc.start(t); dc.stop(off);
      f2.connect(trem);
      postFilter = trem;
    }
    mix.connect(f1).connect(f2);
    postFilter.connect(amp).connect(panner).connect(out);

    if (anyLFO) {
      if (tr.lfoCut > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoCut * 3000;
        lfo.connect(g);
        g.connect(f1.frequency); g.connect(f2.frequency);
      }
      if (tr.lfoRes > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoRes * 10;
        lfo.connect(g);
        g.connect(f1.Q); g.connect(f2.Q);
      }
      if (tr.lfoPit > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPit * 100;
        lfo.connect(g);
        allOscs.forEach(o => g.connect(o.detune));
      }
      if (tr.lfoPan > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPan;
        lfo.connect(g).connect(panner.pan);
      }
    }
  }

  // ---------- lead (monophonic Prophet-style) ----------
  function vLead(ctx, t, out, tr, step, env) {
    const offset  = step.pitch || 0;
    const target  = midiToFreq(tr.root + offset);
    const slide   = env && env.prevSlide && env.prevFreq;
    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const holdEnd = t + stepDur * stepLen;
    const off     = holdEnd + Math.max(tr.release, tr.fRelease) + 0.15;

    const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.Q.value = tr.reso;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = tr.reso * 0.6;
    const baseCut = tr.cutoff;
    const peakCut = Math.min(18000, baseCut * (1 + tr.fEnvAmt * 10));
    const sustCut = baseCut + (peakCut - baseCut) * tr.fSustain;
    [f1, f2].forEach(f => {
      f.frequency.setValueAtTime(baseCut, t);
      f.frequency.linearRampToValueAtTime(peakCut, t + tr.fAttack);
      f.frequency.linearRampToValueAtTime(sustCut, t + tr.fAttack + tr.fDecay);
      f.frequency.setValueAtTime(sustCut, holdEnd);
      f.frequency.linearRampToValueAtTime(baseCut, holdEnd + tr.fRelease);
    });

    const mix = ctx.createGain(); mix.gain.value = 0.7;

    const fA = target * Math.pow(2, tr.octA / 12) * semi(tr.tuneA / 100);
    const fB = target * Math.pow(2, tr.octB / 12) * semi(tr.tuneB / 100);
    const prevFA = slide ? env.prevFreq * Math.pow(2, tr.octA / 12) * semi(tr.tuneA / 100) : null;
    const prevFB = slide ? env.prevFreq * Math.pow(2, tr.octB / 12) * semi(tr.tuneB / 100) : null;

    const oa = createOsc(ctx, tr.waveA, tr.pwA);
    applyOscFreq(oa, fA, t, prevFA);
    const oaG = ctx.createGain(); oaG.gain.value = (1 - tr.mix);
    oa.connect(oaG).connect(mix);

    const ob = createOsc(ctx, tr.waveB, tr.pwB);
    applyOscFreq(ob, fB, t, prevFB);
    ob.detune.value = tr.detuneB;
    const obG = ctx.createGain(); obG.gain.value = tr.mix;
    ob.connect(obG).connect(mix);

    oa.start(t); oa.stop(off);
    ob.start(t); ob.stop(off);
    const allOscs = [oa, ob];

    if (tr.noise > 0) {
      const ns = ctx.createBufferSource(); ns.buffer = getNoise(ctx);
      const nsG = ctx.createGain(); nsG.gain.value = tr.noise * 0.3;
      ns.connect(nsG).connect(mix);
      ns.start(t); ns.stop(off);
    }

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.linearRampToValueAtTime(1, t + tr.attack);
    amp.gain.linearRampToValueAtTime(tr.sustain, t + tr.attack + tr.decay);
    amp.gain.setValueAtTime(tr.sustain, holdEnd);
    amp.gain.linearRampToValueAtTime(0.0001, holdEnd + tr.release);

    const panner = ctx.createStereoPanner(); panner.pan.value = 0;

    const anyLFO = tr.lfoCut > 0 || tr.lfoRes > 0 || tr.lfoPit > 0 || tr.lfoAmp > 0 || tr.lfoPan > 0;
    let lfo = null;
    if (anyLFO) {
      lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
    }

    let postFilter = f2;
    if (anyLFO && tr.lfoAmp > 0) {
      const dc = ctx.createConstantSource(); dc.offset.value = 1;
      const trem = ctx.createGain(); trem.gain.value = 1;
      const ag = ctx.createGain(); ag.gain.value = tr.lfoAmp * 0.9;
      lfo.connect(ag).connect(trem.gain);
      dc.connect(trem.gain);
      dc.start(t); dc.stop(off);
      f2.connect(trem);
      postFilter = trem;
    }
    mix.connect(f1).connect(f2);
    postFilter.connect(amp).connect(panner).connect(out);

    if (anyLFO) {
      if (tr.lfoCut > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoCut * 3000;
        lfo.connect(g);
        g.connect(f1.frequency); g.connect(f2.frequency);
      }
      if (tr.lfoRes > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoRes * 10;
        lfo.connect(g);
        g.connect(f1.Q); g.connect(f2.Q);
      }
      if (tr.lfoPit > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPit * 100;
        lfo.connect(g);
        allOscs.forEach(o => g.connect(o.detune));
      }
      if (tr.lfoPan > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPan;
        lfo.connect(g).connect(panner.pan);
      }
    }
  }

  // ---------- mellotron (long sustained note / chord pad) ----------
  const MELLOTRON_VOICINGS = {
    single:      [0],
    octave:      [0, 12],
    fifth:       [0, 7],
    'triad-min': [0, 3, 7],
    'triad-maj': [0, 4, 7],
    sus4:        [0, 5, 7],
    min7:        [0, 3, 7, 10],
    maj7:        [0, 4, 7, 11],
    add9:        [0, 4, 7, 14],
  };
  function vMellotron(ctx, t, out, tr, step, env) {
    const offset = (step && step.pitch) || 0;
    const baseMidi = tr.root + offset;
    const intervals = MELLOTRON_VOICINGS[tr.voicing] || [0];
    const midiNotes = intervals.map(iv => baseMidi + iv);
    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const holdEnd = t + stepDur * tr.lengthSteps * stepLen;
    const off     = holdEnd + Math.max(tr.release, tr.fRelease) + 0.2;

    // 24 dB lowpass like the chord engine
    const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.Q.value = tr.reso;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = tr.reso * 0.6;
    const baseCut = tr.cutoff;
    const peakCut = Math.min(18000, baseCut * (1 + tr.fEnvAmt * 10));
    const sustCut = baseCut + (peakCut - baseCut) * tr.fSustain;
    [f1, f2].forEach(f => {
      f.frequency.setValueAtTime(baseCut, t);
      f.frequency.linearRampToValueAtTime(peakCut, t + tr.fAttack);
      f.frequency.linearRampToValueAtTime(sustCut, t + tr.fAttack + tr.fDecay);
      f.frequency.setValueAtTime(sustCut, holdEnd);
      f.frequency.linearRampToValueAtTime(baseCut, holdEnd + tr.fRelease);
    });

    const mix = ctx.createGain();
    mix.gain.value = 1 / Math.max(2, midiNotes.length);

    const allOscs = [];
    midiNotes.forEach((midi, i) => {
      const baseF = midiToFreq(midi);
      const center = (i - (midiNotes.length - 1) / 2);
      // small per-voice drift = mellotron-flavour wobble
      const drift = (Math.random() * 6 - 3);

      const oa = createOsc(ctx, tr.waveA, tr.pwA);
      oa.frequency.value = baseF * Math.pow(2, tr.octA / 12) * semi(tr.tuneA / 100);
      oa.detune.value = center * 6 + drift;
      const oaG = ctx.createGain(); oaG.gain.value = (1 - tr.mix);
      oa.connect(oaG).connect(mix);

      const ob = createOsc(ctx, tr.waveB, tr.pwB);
      ob.frequency.value = baseF * Math.pow(2, tr.octB / 12) * semi(tr.tuneB / 100);
      ob.detune.value = tr.detuneB + center * 6 + drift * -1;
      const obG = ctx.createGain(); obG.gain.value = tr.mix;
      ob.connect(obG).connect(mix);

      oa.start(t); oa.stop(off);
      ob.start(t); ob.stop(off);
      allOscs.push(oa, ob);
    });

    if (tr.noise > 0) {
      const ns = ctx.createBufferSource(); ns.buffer = getNoise(ctx);
      const nsG = ctx.createGain(); nsG.gain.value = tr.noise * 0.18;
      ns.connect(nsG).connect(mix);
      ns.start(t); ns.stop(off);
    }

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.linearRampToValueAtTime(1, t + tr.attack);
    amp.gain.linearRampToValueAtTime(tr.sustain, t + tr.attack + tr.decay);
    amp.gain.setValueAtTime(tr.sustain, holdEnd);
    amp.gain.linearRampToValueAtTime(0.0001, holdEnd + tr.release);

    const panner = ctx.createStereoPanner();
    panner.pan.value = 0;

    const anyLFO = tr.lfoCut > 0 || tr.lfoRes > 0 || tr.lfoPit > 0 || tr.lfoAmp > 0 || tr.lfoPan > 0;
    let lfo = null;
    if (anyLFO) {
      lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
    }

    let postFilter = f2;
    if (anyLFO && tr.lfoAmp > 0) {
      const dc = ctx.createConstantSource(); dc.offset.value = 1;
      const trem = ctx.createGain(); trem.gain.value = 1;
      const ag = ctx.createGain(); ag.gain.value = tr.lfoAmp * 0.9;
      lfo.connect(ag).connect(trem.gain);
      dc.connect(trem.gain);
      dc.start(t); dc.stop(off);
      f2.connect(trem);
      postFilter = trem;
    }
    mix.connect(f1).connect(f2);
    postFilter.connect(amp).connect(panner).connect(out);

    if (anyLFO) {
      if (tr.lfoCut > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoCut * 3000;
        lfo.connect(g);
        g.connect(f1.frequency); g.connect(f2.frequency);
      }
      if (tr.lfoRes > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoRes * 10;
        lfo.connect(g);
        g.connect(f1.Q); g.connect(f2.Q);
      }
      if (tr.lfoPit > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPit * 100;
        lfo.connect(g);
        allOscs.forEach(o => g.connect(o.detune));
      }
      if (tr.lfoPan > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPan;
        lfo.connect(g).connect(panner.pan);
      }
    }
  }

  // ---------- granular (sample player) ----------
  function computeGranularLFO(track, time) {
    const phase = ((time * (track.lfoRate || 0)) % 1 + 1) % 1;
    const shape = track.lfoShape || 'sine';
    switch (shape) {
      case 'sine':     return Math.sin(phase * 2 * Math.PI);
      case 'triangle': return phase < 0.5 ? (phase * 4 - 1) : (3 - phase * 4);
      case 'sawtooth': return phase * 2 - 1;
      case 'square':   return phase < 0.5 ? -1 : 1;
      case 'random':   return Math.random() * 2 - 1;
      default:         return 0;
    }
  }
  function vGranular(ctx, t, out, tr, step) {
    if (!tr.buffer) return;
    const stepPitch = (step && step.pitch) || 0;
    const semis = (tr.pitch || 0) + stepPitch;
    const rate  = Math.pow(2, semis / 12);
    const dur = tr.buffer.duration;
    const truncStartSec = (tr.truncStart || 0) * dur;
    const truncEndSec   = Math.min(dur, (tr.truncEnd ?? 1) * dur);
    const truncDur = Math.max(0.001, truncEndSec - truncStartSec);

    let playFrac = tr.playStart || 0;
    if ((tr.lfoDepth || 0) > 0) {
      const lfo = computeGranularLFO(tr, t);
      playFrac += lfo * tr.lfoDepth * 0.5;
    }
    playFrac = clamp(playFrac, 0, 0.999);
    const playStartSec = truncStartSec + playFrac * truncDur;
    const remainingSec = (truncEndSec - playStartSec) / rate;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const requestedLenSec = (tr.length / 1000) * stepLen;
    // when looping, len can exceed remaining (it wraps within trunc region)
    const lenSec = tr.loop ? requestedLenSec : Math.min(requestedLenSec, remainingSec);
    if (lenSec <= 0.001) return;

    const src = ctx.createBufferSource();
    src.buffer = tr.buffer;
    src.playbackRate.value = rate;
    if (tr.loop) {
      src.loop = true;
      src.loopStart = truncStartSec;
      src.loopEnd   = truncEndSec;
    }

    const g = ctx.createGain();
    const att = Math.min(tr.attack, lenSec * 0.3);
    const rel = Math.min(tr.release, lenSec * 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + att);
    g.gain.setValueAtTime(1, t + lenSec - rel);
    g.gain.linearRampToValueAtTime(0.0001, t + lenSec);

    src.connect(g).connect(out);
    if (tr.loop) {
      src.start(t, playStartSec);
    } else {
      src.start(t, playStartSec, lenSec * rate);
    }
    src.stop(t + lenSec + 0.05);
  }

  // ---------- sampler (16-pad slice player) ----------
  // Same recording / load plumbing as granular, but the sample is divided
  // into 16 pads, each with its own start/end region. Steps store the pad
  // index instead of a pitch.
  function vSampler(ctx, t, out, tr, step) {
    if (!tr.buffer) return;
    const padIdx = step && step.pad != null ? step.pad : 0;
    const pad = tr.pads && tr.pads[padIdx];
    if (!pad) return;
    const dur = tr.buffer.duration;
    const startSec = clamp(pad.start || 0, 0, 0.999) * dur;
    const endSec   = clamp(pad.end ?? 1, 0.001, 1) * dur;
    if (endSec <= startSec + 0.002) return;

    const semis = (tr.pitch || 0) + (pad.pitch || 0) + ((step && step.pitch) || 0);
    const rate  = Math.pow(2, semis / 12);
    const sliceSec = (endSec - startSec) / rate;
    if (sliceSec <= 0.001) return;

    const src = ctx.createBufferSource();
    src.buffer = tr.buffer;
    src.playbackRate.value = rate;

    const g = ctx.createGain();
    const padGain = pad.gain != null ? pad.gain : 1;
    const att = Math.min(tr.attack || 0.002, sliceSec * 0.3);
    const rel = Math.min(tr.release || 0.04, sliceSec * 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(padGain, t + att);
    g.gain.setValueAtTime(padGain, t + sliceSec - rel);
    g.gain.linearRampToValueAtTime(0.0001, t + sliceSec);

    src.connect(g).connect(out);
    src.start(t, startSec, sliceSec * rate);
    src.stop(t + sliceSec + 0.05);
  }

  // One-shot pad audition — routes a sampler pad straight to the track input
  // so the user hears the same chain (EQ / sends / fx) as during playback.
  function previewPad(track, padIdx) {
    if (!track.buffer) return;
    initAudio();
    if (!track.input) initTrackAudio(track);
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const step = { pad: padIdx, vel: 1, pan: 0 };

  async function enableGranularListen(track, listenBtn, recBtn, statusEl) {
    if (track.stream) return;
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      track.stream = stream;
      track.micSource = audioCtx.createMediaStreamSource(stream);
      track.micSource.connect(track.input);
      listenBtn.textContent = '■ Stop Listen';
      listenBtn.classList.add('on');
      statusEl.textContent = 'listening — press Rec to capture';
      recBtn.disabled = false;
    } catch (e) {
      statusEl.textContent = 'mic denied';
    }
  }
  async function enableGranularListenTab(track, listenBtn, recBtn, statusEl) {
    if (track.stream) return;
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (!navigator.mediaDevices.getDisplayMedia) {
      statusEl.textContent = 'tab capture unsupported';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      stream.getVideoTracks().forEach(v => { try { v.stop(); } catch(e){} stream.removeTrack(v); });
      if (stream.getAudioTracks().length === 0) {
        statusEl.textContent = 'no audio in shared tab';
        return;
      }
      track.stream = stream;
      track.micSource = audioCtx.createMediaStreamSource(stream);
      track.micSource.connect(track.input);
      listenBtn.textContent = '■ Stop Tab';
      listenBtn.classList.add('on');
      statusEl.textContent = 'listening to tab — Rec to capture';
      recBtn.disabled = false;
    } catch (e) {
      statusEl.textContent = 'tab capture denied';
    }
  }
  function disableGranularListen(track, listenBtn, recBtn, statusEl) {
    if (track.recorder && track.recorder.state === 'recording') {
      try { track.recorder.stop(); } catch (e) {}
    }
    if (track.micSource) { try { track.micSource.disconnect(); } catch (e) {} track.micSource = null; }
    if (track.stream)    { try { track.stream.getTracks().forEach(s => s.stop()); } catch (e) {} track.stream = null; }
    listenBtn.textContent = '🎤 Listen';
    listenBtn.classList.remove('on');
    recBtn.disabled = true;
    statusEl.textContent = track.buffer ? track.buffer.duration.toFixed(2) + 's loaded' : 'no sample';
  }
  function pickGranularMime() {
    if (!window.MediaRecorder) return '';
    const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/ogg;codecs=opus'];
    return cands.find(c => MediaRecorder.isTypeSupported(c)) || '';
  }
  async function startGranularRecord(track, recBtn, statusEl) {
    if (!track.stream) {
      statusEl.textContent = 'enable Listen first';
      return;
    }
    if (!window.MediaRecorder) {
      statusEl.textContent = 'MediaRecorder unsupported';
      return;
    }
    if (!track.stream.getAudioTracks || track.stream.getAudioTracks().length === 0) {
      statusEl.textContent = 'stream has no audio track';
      return;
    }
    let recorder;
    const mime = pickGranularMime();
    try {
      recorder = mime
        ? new MediaRecorder(track.stream, { mimeType: mime })
        : new MediaRecorder(track.stream);
    } catch (e) {
      console.error('MediaRecorder construction failed', e);
      statusEl.textContent = 'recorder error: ' + (e.message || e.name);
      return;
    }
    const chunks = [];
    const ext = mime.includes('mp4') ? 'm4a' : (mime.includes('ogg') ? 'ogg' : 'webm');
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onerror = (e) => {
      console.error('MediaRecorder error:', e);
      statusEl.textContent = 'recorder error: ' + (e.error && e.error.message);
    };
    recorder.onstop = async () => {
      try {
        if (chunks.length === 0) throw new Error('no audio data captured');
        const blob = new Blob(chunks, { type: recorder.mimeType || mime || 'audio/webm' });
        const ab   = await blob.arrayBuffer();
        track.buffer = await audioCtx.decodeAudioData(ab);
        statusEl.textContent = track.buffer.duration.toFixed(2) + 's loaded';
        if (track._refreshWave) track._refreshWave();
        if (projectDir) {
          const filename = `sample-${track.id}-${Date.now()}.${ext}`;
          const ok = await writeToSubfolder('samples', filename, blob);
          if (ok) {
            track.sampleFile = filename;
            statusEl.textContent += ' → samples/' + filename;
          }
        }
      } catch (e) {
        console.error('granular decode/save failed', e);
        statusEl.textContent = 'failed: ' + (e.message || e.name || 'unknown');
      }
      recBtn.textContent = '● Rec';
      recBtn.classList.remove('on');
      track.recorder = null;
    };
    try {
      recorder.start();
    } catch (e) {
      console.error('recorder.start failed', e);
      statusEl.textContent = 'start failed: ' + (e.message || e.name);
      return;
    }
    track.recorder = recorder;
    recBtn.textContent = '■ Stop Rec';
    recBtn.classList.add('on');
    statusEl.textContent = 'recording…';
  }
  function stopGranularRecord(track) {
    if (track.recorder && track.recorder.state === 'recording') track.recorder.stop();
  }
  function loadGranularFile(track, statusEl) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'audio/*';
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      statusEl.textContent = 'loading…';
      try {
        initAudio();
        const ab = await file.arrayBuffer();
        track.buffer = await audioCtx.decodeAudioData(ab);
        statusEl.textContent = file.name + ' (' + track.buffer.duration.toFixed(2) + 's)';
        if (track._refreshWave) track._refreshWave();
      } catch (e) { statusEl.textContent = 'load failed'; }
    });
    input.click();
  }

  // TR-808 — deep boomy kick, long sub tail, very clean noise hats
  function v808Kick(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120 * m, t);
    o.frequency.exponentialRampToValueAtTime(45 * m, t + 0.05);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(1, t + 0.003);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    o.connect(og).connect(out); o.start(t); o.stop(t + 1.5);
    const cs = ctx.createBufferSource(); cs.buffer = getNoise(ctx);
    const chp = ctx.createBiquadFilter(); chp.type='highpass'; chp.frequency.value = 3000;
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(0.0001, t);
    cg.gain.exponentialRampToValueAtTime(0.3, t + 0.001);
    cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.008);

  function v808Clap(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const burst = (t0, dur, peak) => {
      const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value = 1100*m; bp.Q.value = 1.4;

    burst(t + 0.010, 0.012, 0.5);
    burst(t + 0.020, 0.012, 0.5);
    burst(t + 0.030, 0.18, 0.35);

    return curve;
  }

  function makeWarmthCurve(amount) {
    const n = 4096;
    const curve = new Float32Array(n);
    const k = amount * 0.25; // gentle 3rd-harmonic soft-clip; identity at amount=0
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = x - k * x * x * x;
    }
    return curve;
  }
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterIn   = audioCtx.createGain();
    eqLow      = audioCtx.createBiquadFilter(); eqLow.type ='lowshelf';  eqLow.frequency.value  = 200;
    eqMid      = audioCtx.createBiquadFilter(); eqMid.type ='peaking';   eqMid.frequency.value  = 1000; eqMid.Q.value = 0.8;
    eqHigh     = audioCtx.createBiquadFilter(); eqHigh.type='highshelf'; eqHigh.frequency.value = 5000;
    // Per-deck EQ buses for live mode.
    deckABusEqLow  = audioCtx.createBiquadFilter(); deckABusEqLow.type='lowshelf';   deckABusEqLow.frequency.value  = 200;  deckABusEqLow.gain.value  = liveDeckEq.A.low;
    deckABusEqMid  = audioCtx.createBiquadFilter(); deckABusEqMid.type='peaking';    deckABusEqMid.frequency.value  = 1000; deckABusEqMid.Q.value = 0.8; deckABusEqMid.gain.value = liveDeckEq.A.mid;
    deckABusEqHigh = audioCtx.createBiquadFilter(); deckABusEqHigh.type='highshelf'; deckABusEqHigh.frequency.value = 5000; deckABusEqHigh.gain.value = liveDeckEq.A.high;
    deckBBusEqLow  = audioCtx.createBiquadFilter(); deckBBusEqLow.type='lowshelf';   deckBBusEqLow.frequency.value  = 200;  deckBBusEqLow.gain.value  = liveDeckEq.B.low;
    deckBBusEqMid  = audioCtx.createBiquadFilter(); deckBBusEqMid.type='peaking';    deckBBusEqMid.frequency.value  = 1000; deckBBusEqMid.Q.value = 0.8; deckBBusEqMid.gain.value = liveDeckEq.B.mid;
    deckBBusEqHigh = audioCtx.createBiquadFilter(); deckBBusEqHigh.type='highshelf'; deckBBusEqHigh.frequency.value = 5000; deckBBusEqHigh.gain.value = liveDeckEq.B.high;
    // Per-deck volume nodes sit at the very end of each deck bus, after the
    // EQ + before masterIn — independent of the crossfader (per-track
    // deckGainN) so the user can dial down a deck's overall level without
    // touching the A/B balance.
    deckAVolNode = audioCtx.createGain(); deckAVolNode.gain.value = liveDeckVol.A;
    deckBVolNode = audioCtx.createGain(); deckBVolNode.gain.value = liveDeckVol.B;
    // Per-deck bipolar sweep filter (HPF → LPF), sitting after the EQ and
    // before the deck volume. Both start wide open so the deck is unaffected
    // until the user touches the filter knob.
    deckAFilterHP = audioCtx.createBiquadFilter(); deckAFilterHP.type='highpass'; deckAFilterHP.frequency.value = 20;    deckAFilterHP.Q.value = 0.7;
    deckAFilterLP = audioCtx.createBiquadFilter(); deckAFilterLP.type='lowpass';  deckAFilterLP.frequency.value = 22000; deckAFilterLP.Q.value = 0.7;
    deckBFilterHP = audioCtx.createBiquadFilter(); deckBFilterHP.type='highpass'; deckBFilterHP.frequency.value = 20;    deckBFilterHP.Q.value = 0.7;
    deckBFilterLP = audioCtx.createBiquadFilter(); deckBFilterLP.type='lowpass';  deckBFilterLP.frequency.value = 22000; deckBFilterLP.Q.value = 0.7;
    deckABusEqLow.connect(deckABusEqMid).connect(deckABusEqHigh).connect(deckAFilterHP).connect(deckAFilterLP).connect(deckAVolNode).connect(masterIn);
    deckBBusEqLow.connect(deckBBusEqMid).connect(deckBBusEqHigh).connect(deckBFilterHP).connect(deckBFilterLP).connect(deckBVolNode).connect(masterIn);
    // Restore any filter positions set before the audio graph existed.
    applyDeckFilter('A', liveDeckFilter.A);
    applyDeckFilter('B', liveDeckFilter.B);
    warmLow    = audioCtx.createBiquadFilter(); warmLow.type='lowshelf';  warmLow.frequency.value  = 180;  warmLow.gain.value  =  1.5 * master.warmth;
    warmHigh   = audioCtx.createBiquadFilter(); warmHigh.type='highshelf'; warmHigh.frequency.value = 4500; warmHigh.gain.value = -2.5 * master.warmth;
    warmShaper = audioCtx.createWaveShaper();   warmShaper.curve = makeWarmthCurve(master.warmth);
    compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = compCfg.threshold;
    compressor.ratio.value     = compCfg.ratio;
    compressor.attack.value    = compCfg.attack;
    compressor.release.value   = compCfg.release;
    compressor.knee.value      = compCfg.knee;
    // Brick-wall master limiter — WaveShaper with hard ceiling.
    masterLimiter = audioCtx.createWaveShaper();
    masterLimiter.curve = makeLimiterCurve(0.78, 0.95);
    masterLimiter.oversample = '4x';

    // ----- Tape emulator (SP-404-style) -----
    tapeIn       = audioCtx.createGain();
    tapeOut      = audioCtx.createGain();
    tapeDry      = audioCtx.createGain(); tapeDry.gain.value = 1 - tapeCfg.wet;
    tapeWet      = audioCtx.createGain(); tapeWet.gain.value = tapeCfg.wet;
    // dry path uses a matching ~6 ms delay so it stays in phase with the wet path
    tapeDryDelay = audioCtx.createDelay(0.05);
    tapeDryDelay.delayTime.value = 0.006;
    tapeIn.connect(tapeDryDelay).connect(tapeDry).connect(tapeOut);

    // wet path: wow+flutter delay → tone HP/LP → saturation → wet gain
    tapeWowDelay = audioCtx.createDelay(0.05);
    tapeWowDelay.delayTime.value = 0.006;
    tapeWowLfo     = audioCtx.createOscillator(); tapeWowLfo.type='sine';     tapeWowLfo.frequency.value     = 0.7;
    tapeFlutterLfo = audioCtx.createOscillator(); tapeFlutterLfo.type='sine'; tapeFlutterLfo.frequency.value = 7;
    tapeWowDepth     = audioCtx.createGain(); tapeWowDepth.gain.value     = tapeCfg.wow     * 0.004;
    tapeFlutterDepth = audioCtx.createGain(); tapeFlutterDepth.gain.value = tapeCfg.flutter * 0.0008;
    tapeWowLfo.connect(tapeWowDepth).connect(tapeWowDelay.delayTime);
    tapeFlutterLfo.connect(tapeFlutterDepth).connect(tapeWowDelay.delayTime);
    tapeWowLfo.start();
    tapeFlutterLfo.start();

    tapeFilterHP = audioCtx.createBiquadFilter(); tapeFilterHP.type='highpass';
    tapeFilterHP.frequency.value = 20 + tapeCfg.tone * 180;
    tapeFilterLP = audioCtx.createBiquadFilter(); tapeFilterLP.type='lowpass';
    tapeFilterLP.frequency.value = 18000 - tapeCfg.tone * 12000;

    tapeSatNode  = audioCtx.createWaveShaper();
    tapeSatNode.curve = makeTapeSatCurve(tapeCfg.sat);
    tapeSatNode.oversample = '4x';

    tapeIn.connect(tapeWowDelay)
          .connect(tapeFilterHP).connect(tapeFilterLP)
          .connect(tapeSatNode).connect(tapeWet);

    // noise sources, summed into wet
    tapeHissSource = audioCtx.createBufferSource();
    tapeHissSource.buffer = getNoise(audioCtx);
    tapeHissSource.loop = true;
    tapeHissHP   = audioCtx.createBiquadFilter(); tapeHissHP.type='highpass'; tapeHissHP.frequency.value = 5000;
    tapeHissGain = audioCtx.createGain(); tapeHissGain.gain.value = tapeCfg.hiss * 0.04;
    tapeHissSource.connect(tapeHissHP).connect(tapeHissGain).connect(tapeWet);
    tapeHissSource.start();

    tapeCrackleSource = audioCtx.createBufferSource();
    tapeCrackleSource.buffer = makeCrackleBuffer(audioCtx);
    tapeCrackleSource.loop = true;
    tapeCrackleGain = audioCtx.createGain(); tapeCrackleGain.gain.value = tapeCfg.crackle * 0.3;
    tapeCrackleSource.connect(tapeCrackleGain).connect(tapeWet);
    tapeCrackleSource.start();

    tapeWet.connect(tapeOut);

    // ----- Lo-Fi House master effect -----
    lofiIn  = audioCtx.createGain();
    lofiOut = audioCtx.createGain();
    lofiDry = audioCtx.createGain(); lofiDry.gain.value = 1 - lofiCfg.wet;
    lofiWet = audioCtx.createGain(); lofiWet.gain.value = lofiCfg.wet;
    lofiSat = audioCtx.createWaveShaper();
    lofiSat.curve = makeLofiSatCurve(lofiCfg.drive);
    lofiSat.oversample = '4x';
    lofiLP  = audioCtx.createBiquadFilter();
    lofiLP.type = 'lowpass';
    lofiLP.frequency.value = lofiCfg.hiCut;
    lofiWobbleDelay = audioCtx.createDelay(0.05);
    lofiWobbleDelay.delayTime.value = 0.006;
    lofiWobbleLfo = audioCtx.createOscillator();
    lofiWobbleLfo.type = 'sine';
    lofiWobbleLfo.frequency.value = 4.5;
    lofiWobbleDepth = audioCtx.createGain();
    lofiWobbleDepth.gain.value = lofiCfg.wobble * 0.005;
    lofiWobbleLfo.connect(lofiWobbleDepth).connect(lofiWobbleDelay.delayTime);
    lofiWobbleLfo.start();
    lofiIn.connect(lofiDry).connect(lofiOut);
    lofiIn.connect(lofiSat).connect(lofiLP).connect(lofiWobbleDelay).connect(lofiWet);
    lofiDustSource = audioCtx.createBufferSource();
    lofiDustSource.buffer = makeCrackleBuffer(audioCtx);
    lofiDustSource.loop = true;
    lofiDustGain = audioCtx.createGain();
    lofiDustGain.gain.value = lofiCfg.dust * 0.35;
    lofiDustSource.connect(lofiDustGain).connect(lofiWet);
    lofiDustSource.start();
    lofiWet.connect(lofiOut);

    // Insert filters (LP + HP) sit just before the brick-wall limiter.
    masterLP = audioCtx.createBiquadFilter(); masterLP.type = 'lowpass';
    masterLP.frequency.value = lpfCfg.freq; masterLP.Q.value = lpfCfg.q;
    masterHP = audioCtx.createBiquadFilter(); masterHP.type = 'highpass';
    masterHP.frequency.value = hpfCfg.freq; masterHP.Q.value = hpfCfg.q;

    masterOut  = audioCtx.createGain();         masterOut.gain.value = master.vol;
    masterMeter = audioCtx.createAnalyser();    masterMeter.fftSize = 256;
    masterIn.connect(eqLow).connect(eqMid).connect(eqHigh)
            .connect(warmLow).connect(warmHigh).connect(warmShaper)
            .connect(compressor).connect(tapeIn);
    tapeOut.connect(lofiIn);

           .connect(masterOut).connect(audioCtx.destination);
    masterOut.connect(masterMeter);
    startMeterLoop();

    delayBus  = audioCtx.createGain();
    delayNode = audioCtx.createDelay(2.0); delayNode.delayTime.value = delayCfg.time;
    delayFb   = audioCtx.createGain(); delayFb.gain.value = delayCfg.fb;
    delayWet  = audioCtx.createGain(); delayWet.gain.value = delayCfg.wet;
    delayBus.connect(delayNode);
    delayNode.connect(delayFb).connect(delayNode);
    delayNode.connect(delayWet).connect(masterIn);

    // ---- Space Echo (RE-201) ----
    // Three parallel tape heads (H1=t, H2=2t, H3=3t). Input + feedback are
    // summed at sumIn, then run through tape saturation + a low-pass for
    // tape darkness, then split to the three delay heads. Wow + flutter
    // LFOs drift each head's delay time. Per-head gains select the mode.
    spaceEchoBus    = audioCtx.createGain();
    spaceEchoSumIn  = audioCtx.createGain();
    spaceEchoSat    = audioCtx.createWaveShaper();
    spaceEchoSat.curve = makeSpaceSatCurve(spaceEchoCfg.sat);
    spaceEchoSat.oversample = '4x';
    spaceEchoTone   = audioCtx.createBiquadFilter();
    spaceEchoTone.type = 'lowpass'; spaceEchoTone.Q.value = 0.7;
    spaceEchoTone.frequency.value = spaceEchoCfg.hicut;
    spaceEchoH1 = audioCtx.createDelay(2.0); spaceEchoH1.delayTime.value = spaceEchoCfg.baseTime;
    spaceEchoH2 = audioCtx.createDelay(2.0); spaceEchoH2.delayTime.value = spaceEchoCfg.baseTime * 2;
    spaceEchoH3 = audioCtx.createDelay(2.0); spaceEchoH3.delayTime.value = spaceEchoCfg.baseTime * 3;
    spaceEchoH1G = audioCtx.createGain();
    spaceEchoH2G = audioCtx.createGain();
    spaceEchoH3G = audioCtx.createGain();
    spaceEchoMix = audioCtx.createGain();
    spaceEchoFb  = audioCtx.createGain(); spaceEchoFb.gain.value = spaceEchoCfg.intensity;
    spaceEchoWet = audioCtx.createGain(); spaceEchoWet.gain.value = spaceEchoCfg.wet;
    // Wow & flutter — LFOs modulate every head's delay time
    spaceEchoWowLfo     = audioCtx.createOscillator(); spaceEchoWowLfo.type = 'sine';
    spaceEchoWowLfo.frequency.value = 0.6;
    spaceEchoFlutterLfo = audioCtx.createOscillator(); spaceEchoFlutterLfo.type = 'sine';
    spaceEchoFlutterLfo.frequency.value = 7;
    spaceEchoWowG     = audioCtx.createGain(); spaceEchoWowG.gain.value     = spaceEchoCfg.wow     * 0.008;
    spaceEchoFlutterG = audioCtx.createGain(); spaceEchoFlutterG.gain.value = spaceEchoCfg.flutter * 0.0015;
    spaceEchoWowLfo.connect(spaceEchoWowG);
    spaceEchoFlutterLfo.connect(spaceEchoFlutterG);
    spaceEchoWowG.connect(spaceEchoH1.delayTime);
    spaceEchoWowG.connect(spaceEchoH2.delayTime);
    spaceEchoWowG.connect(spaceEchoH3.delayTime);
    spaceEchoFlutterG.connect(spaceEchoH1.delayTime);
    spaceEchoFlutterG.connect(spaceEchoH2.delayTime);
    spaceEchoFlutterG.connect(spaceEchoH3.delayTime);

    spaceEchoFlutterLfo.start();

    spaceEchoBus.connect(spaceEchoSumIn);
    spaceEchoSumIn.connect(spaceEchoSat).connect(spaceEchoTone);
    spaceEchoTone.connect(spaceEchoH1).connect(spaceEchoH1G).connect(spaceEchoMix);
    spaceEchoTone.connect(spaceEchoH2).connect(spaceEchoH2G).connect(spaceEchoMix);
    spaceEchoTone.connect(spaceEchoH3).connect(spaceEchoH3G).connect(spaceEchoMix);

    spaceEchoMix.connect(spaceEchoWet).connect(masterIn);
    applySpaceEchoMode();

    reverbBus  = audioCtx.createGain();
    reverbNode = audioCtx.createConvolver();
    reverbNode.buffer = makeReverbIR(audioCtx, reverbCfg.decay);
    reverbWet  = audioCtx.createGain(); reverbWet.gain.value = reverbCfg.wet;
    reverbBus.connect(reverbNode).connect(reverbWet).connect(masterIn);

    // chorus (stereo)
    chorusBus  = audioCtx.createGain();
    chorusWet  = audioCtx.createGain(); chorusWet.gain.value = chorusCfg.wet;
    chorusDelL = audioCtx.createDelay(0.05); chorusDelL.delayTime.value = 0.02;
    chorusDelR = audioCtx.createDelay(0.05); chorusDelR.delayTime.value = 0.022;
    chorusLfoL = audioCtx.createOscillator(); chorusLfoL.type='sine'; chorusLfoL.frequency.value = chorusCfg.rate;
    chorusLfoR = audioCtx.createOscillator(); chorusLfoR.type='sine'; chorusLfoR.frequency.value = chorusCfg.rate;
    chorusModL = audioCtx.createGain(); chorusModL.gain.value = chorusCfg.depth * 0.008;
    chorusModR = audioCtx.createGain(); chorusModR.gain.value = chorusCfg.depth * 0.008;
    chorusLfoL.connect(chorusModL).connect(chorusDelL.delayTime);
    chorusLfoR.connect(chorusModR).connect(chorusDelR.delayTime);
    const cPanL = audioCtx.createStereoPanner(); cPanL.pan.value = -0.8;
    const cPanR = audioCtx.createStereoPanner(); cPanR.pan.value =  0.8;
    chorusBus.connect(chorusDelL).connect(cPanL).connect(chorusWet);
    chorusBus.connect(chorusDelR).connect(cPanR).connect(chorusWet);
    chorusWet.connect(masterIn);
    chorusLfoL.start(); chorusLfoR.start(audioCtx.currentTime + 0.25 / Math.max(0.1, chorusCfg.rate));

    flangerBus = audioCtx.createGain();
    flangerWet = audioCtx.createGain(); flangerWet.gain.value = flangerCfg.wet;
    flangerDel = audioCtx.createDelay(0.02); flangerDel.delayTime.value = 0.005;
    flangerFb  = audioCtx.createGain(); flangerFb.gain.value = flangerCfg.fb;
    flangerLfo = audioCtx.createOscillator(); flangerLfo.type='sine'; flangerLfo.frequency.value = flangerCfg.rate;
    flangerMod = audioCtx.createGain(); flangerMod.gain.value = flangerCfg.depth * 0.004;
    flangerLfo.connect(flangerMod).connect(flangerDel.delayTime);
    flangerBus.connect(flangerDel);
    flangerDel.connect(flangerFb).connect(flangerDel);
    flangerDel.connect(flangerWet).connect(masterIn);
    flangerLfo.start();

    // bitcrush (ScriptProcessor)
    bitcrushBus  = audioCtx.createGain();
    bitcrushWet  = audioCtx.createGain(); bitcrushWet.gain.value = bitcrushCfg.wet;
    bitcrushProc = audioCtx.createScriptProcessor(2048, 1, 1);
    bitcrushProc._phase = 0; bitcrushProc._last = 0;
    bitcrushProc.onaudioprocess = (e) => {
      const inb = e.inputBuffer.getChannelData(0);
      const out = e.outputBuffer.getChannelData(0);
      const step = Math.pow(0.5, bitcrushCfg.bits);
      const nf = bitcrushCfg.normFreq;
      let phase = bitcrushProc._phase, last = bitcrushProc._last;
      for (let i = 0; i < inb.length; i++) {
        phase += nf;
        if (phase >= 1) { phase -= 1; last = step * Math.floor(inb[i] / step + 0.5); }
        out[i] = last;
      }
      bitcrushProc._phase = phase; bitcrushProc._last = last;
    };
    bitcrushBus.connect(bitcrushProc).connect(bitcrushWet).connect(masterIn);

    for (const t of tracks) initTrackAudio(t);

    // mixer / decks
    mixerOut = audioCtx.createGain();
    mixerOut.connect(masterIn);
    ['A','B'].forEach(k => {
      const d = decks[k];
      d.gain = audioCtx.createGain();    d.gain.value = d.vol;
      d.eqLow  = audioCtx.createBiquadFilter(); d.eqLow.type ='lowshelf';  d.eqLow.frequency.value  = 250;  d.eqLow.gain.value  = d.low;
      d.eqMid  = audioCtx.createBiquadFilter(); d.eqMid.type ='peaking';   d.eqMid.frequency.value  = 1000; d.eqMid.Q.value = 0.8; d.eqMid.gain.value = d.mid;
      d.eqHigh = audioCtx.createBiquadFilter(); d.eqHigh.type='highshelf'; d.eqHigh.frequency.value = 4000; d.eqHigh.gain.value = d.high;
      d.xfade  = audioCtx.createGain();
      d.gain.connect(d.eqLow).connect(d.eqMid).connect(d.eqHigh).connect(d.xfade).connect(mixerOut);
    });
    applyCrossfade(decks.xfade);
  }

  // ---------- UI helpers ----------
  function el(tag, cls, txt) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined) n.textContent = txt;
    return n;
  }
  // ---------- Rotary dial (vertical-drag knob) ----------
  // Used in place of horizontal range sliders where the rotary metaphor
  // reads better — currently the per-channel and per-deck EQ bands.
  // Drag up to increase, down to decrease (100 px ≈ full range).
  function makeRotary(min, max, val, onChange, fmt) {
    const wrap = el('div', 'rotary');
    const arc  = el('div', 'rotary-arc');
    const dot  = el('div', 'rotary-dot');
    arc.appendChild(dot);
    wrap.appendChild(arc);
    let cur = val;
    const apply = (v, fire) => {
      cur = Math.max(min, Math.min(max, v));
      const ratio = (cur - min) / (max - min);
      const deg = -135 + ratio * 270;
      arc.style.transform = `rotate(${deg}deg)`;
      if (fire && onChange) onChange(cur);
    };
    apply(val, false);
    let dragging = false, startY = 0, startVal = 0;
    wrap.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      dragging = true;
      startY = e.clientY;
      startVal = cur;
      wrap.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dy = startY - e.clientY;
      const delta = (dy / 100) * (max - min);
      apply(startVal + delta, true);
    });
    const release = (e) => { dragging = false; try { wrap.releasePointerCapture(e.pointerId); } catch (err) {} };
    wrap.addEventListener('pointerup', release);
    wrap.addEventListener('pointercancel', release);
    wrap.addEventListener('dblclick', () => apply((min + max) / 2, true));
    wrap._setValue = (v) => apply(v, false);
    return wrap;
  }

  function knob(label, min, max, step, val, onChange, fmt) {
    const w = el('div', 'knob');
    w.appendChild(el('label', null, label));
    const v = el('span', 'v', fmt(val));
    const quantize = (x) => {
      if (!step) return x;
      const snapped = Math.round((x - min) / step) * step + min;
      return Math.max(min, Math.min(max, snapped));
    };
    const dial = makeRotary(min, max, val, (raw) => {
      const x = quantize(raw);
      v.textContent = fmt(x);
      onChange(x);
    }, fmt);
    // Try to infer which track property this knob writes to from the
    // onChange closure source — used by the morph slider to live-update
    // every affected dial without rebuilding the panel.
    try {
      const src = onChange.toString();
      const m = src.match(/track\.([\w$]+)\s*=\s*(?:x|v)\b/) || src.match(/t\.([\w$]+)\s*=\s*(?:x|v)\b/);
      if (m) dial.dataset.prop = m[1];
    } catch (e) {}
    dial._refresh = (newVal) => { dial._setValue(newVal); v.textContent = fmt(newVal); };
    w.appendChild(dial); w.appendChild(v); return w;
  }
  function numField(label, min, max, val, onChange) {
    const w = el('div', 'knob');
    w.appendChild(el('label', null, label));
    const n = el('input'); n.type='number'; n.min=min; n.max=max; n.value=val;
    n.addEventListener('change', () => {
      const x = clamp(parseInt(n.value)||val, min, max);
      n.value = x; onChange(x);
    });
    w.appendChild(n); return w;
  }
  function selectField(label, opts, val, onChange) {
    const w = el('div', 'knob');
    w.appendChild(el('label', null, label));
    const s = el('select');
    const fill = (parent, items) => {
      for (const o of items) {
        const op = el('option', null, o); op.value = o;
        if (o === val) op.selected = true;
        parent.appendChild(op);
      }
    };
    if (Array.isArray(opts)) {
      fill(s, opts);
    } else if (opts && typeof opts === 'object') {
      for (const groupName of Object.keys(opts)) {
        const og = document.createElement('optgroup');
        og.label = groupName;
        fill(og, opts[groupName]);
        s.appendChild(og);
      }
    }
    s.addEventListener('change', () => onChange(s.value));
    w.appendChild(s); return w;
  }
  function group(label, ...nodes) {
    const g = el('div', 'group');
    if (label) {
      const lbl = el('span', 'label', label);
      lbl.addEventListener('click', () => g.classList.toggle('collapsed'));
      g.appendChild(lbl);
      g.classList.add('collapsed'); // start collapsed
    }
    const row = el('div', 'group-row');
    nodes.forEach(n => row.appendChild(n));
    g.appendChild(row);
    return g;
  }
  // Effects-mode parameter row: label · rotary · value. Step is applied as
  // snap quantization inside the rotary onChange. Returns the row so callers
  // that need to refresh the value externally can hold a reference to the
  // dial via row._dial.
  function sideRow(parent, label, min, max, step, val, onChange, fmt) {
    const row = el('div', 'row rotary-row');
    row.appendChild(el('label', null, label));
    const v = el('span', 'v', fmt(val));
    const quantize = (x) => {
      if (!step) return x;

      return Math.max(min, Math.min(max, snapped));

    const dial = makeRotary(min, max, val, (raw) => {
      const x = quantize(raw);
      v.textContent = fmt(x);
      onChange(x);

    row.appendChild(dial);
    row.appendChild(v);
    row._dial   = dial;
    row._valEl  = v;
    row._fmt    = fmt;

  }
  // Vertical fader for an effect module's primary parameter — Wet for
