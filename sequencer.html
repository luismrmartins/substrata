  function loadPresetStore() {
    try { return JSON.parse(localStorage.getItem('substrata-presets') || '{}'); }
    catch (e) { return {}; }
  }
  function savePresetStore(store) {
    try { localStorage.setItem('substrata-presets', JSON.stringify(store)); } catch (e) {}
  }
  function getPresetsForKind(kind) {
    return loadPresetStore()[kind] || {};
  }
  function setPreset(kind, name, params) {
    const store = loadPresetStore();
    if (!store[kind]) store[kind] = {};
    store[kind][name] = params;
    savePresetStore(store);
  }
  function deletePreset(kind, name) {
    const store = loadPresetStore();
    if (store[kind]) delete store[kind][name];
    savePresetStore(store);
  }
  function getTrackPresetParams(track) {
    const keys = (SAVE_KEYS[track.kind] || []).slice();
    const out = {};
    keys.forEach(k => out[k] = track[k]);
    return out;
  }
  function applyPresetToTrack(track, preset) {
    Object.assign(track, preset);
    if (track.kind === 'drum') track.voice = DRUM_VOICES[track.voiceType] || DRUM_VOICES.kick;
  }

  // ---------- shared UI helpers ----------
  function checkBox(label, val, onChange) {
    const w = el('label', 'knob');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!val;
    cb.addEventListener('change', () => onChange(cb.checked));
    w.appendChild(cb);
    w.appendChild(el('span', null, label));
    return w;
  }

  // ---------- track UI ----------
  function buildTrack(track) {
    const wrap = el('div', 'track');
    if (track.expanded) wrap.classList.add('expanded');

    const meta = el('div', 'track-meta');

    const name = el('div', 'track-name');
    const chev = el('span', 'chev', track.expanded ? '▾' : '▸');
    chev.style.cursor = 'pointer';
    chev.addEventListener('click', () => {
      track.expanded = !track.expanded;
      wrap.classList.toggle('expanded', track.expanded);
      chev.textContent = track.expanded ? '▾' : '▸';
    });
    name.appendChild(chev);
    const nameInput = el('input', 'name-input');
    nameInput.type = 'text';
    nameInput.value = track.name;
    nameInput.title = 'click to rename';
    nameInput.addEventListener('change', () => { track.name = nameInput.value || track.name; });
    nameInput.addEventListener('blur',   () => { track.name = nameInput.value || track.name; });
    name.appendChild(nameInput);
    meta.appendChild(name);

    const togs = el('div', 'toggles');
    const aBtn = el('button', 'toggle arm',  'A');
    const mBtn = el('button', 'toggle mute', 'M');
    const sBtn = el('button', 'toggle solo', 'S');
    const rBtn = el('button', 'toggle rnd',  'R');
    const dBtn = el('button', 'toggle dup',  'D');
    const gBtn = el('button', 'toggle grp',  'G' + (track.group || 0));
    const xBtn = el('button', 'toggle rmv',  '×');
    aBtn.title = 'armed (will play)';
    mBtn.title = 'mute'; sBtn.title = 'solo';
    rBtn.title = 'randomize';
    dBtn.title = 'duplicate track';
    gBtn.title = 'mute/solo group (0 = none, 1-8 link tracks)';
    xBtn.title = 'remove track';
    track._mBtn = mBtn;
    track._aBtn = aBtn;
    track._sBtn = sBtn;
    track._gBtn = gBtn;
    if (track.armed && track._pendingArmed === undefined) aBtn.classList.add('on');
    if (track._pendingArmed !== undefined) {
      aBtn.classList.toggle('on', track._pendingArmed);
      aBtn.classList.add('pending');
    }
    if (track.mute && track._pendingMute === undefined) mBtn.classList.add('on');
    if (track._pendingMute !== undefined) {
      mBtn.classList.toggle('on', track._pendingMute);
      mBtn.classList.add('pending');
    }
    if (track.solo)  sBtn.classList.add('on');
    aBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const visible = (track._pendingArmed !== undefined) ? track._pendingArmed : track.armed;
      setArmedAcross(track, !visible, currentMode === 'mixing');
    });
    mBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const visible = (track._pendingMute !== undefined) ? track._pendingMute : track.mute;
      setMuteAcross(track, !visible, currentMode === 'mixing');
    });
    sBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setSoloAcross(track, !track.solo);
    });
    rBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (track.kind === 'mic') return;
      randomizeTrack(track);
    });
    dBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      duplicateTrack(track);
    });
    gBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      track.group = ((track.group || 0) + 1) % 9;
      gBtn.textContent = 'G' + track.group;
    });
    xBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.confirm('Remove track "' + track.name + '"?')) removeTrack(track);
    });
    togs.appendChild(aBtn);
    togs.appendChild(mBtn);
    togs.appendChild(sBtn);
    togs.appendChild(rBtn);
    togs.appendChild(dBtn);
    togs.appendChild(gBtn);
    togs.appendChild(xBtn);
    meta.appendChild(togs);

    wrap.appendChild(meta);

    if (track.kind === 'mic') {
      const mic = el('div', 'mic-control');
      const btn = el('button', null, track.enabled ? 'Live' : 'Enable Mic');
      if (track.enabled) btn.classList.add('on');
      const status = el('span', 'status', track.enabled ? 'capturing input' : 'off');
      const deviceSel = el('select', 'mic-device');
      const def = el('option', null, '(default)'); def.value = '';
      deviceSel.appendChild(def);
      deviceSel.addEventListener('change', () => switchMicDevice(track, deviceSel.value, btn, status, deviceSel));
      btn.addEventListener('click', () => enableMic(track, btn, status, deviceSel));
      const tabBtn = el('button', 'mic-btn', '🖥 Tab Audio');
      tabBtn.title = 'capture audio from another browser tab/window';
      tabBtn.addEventListener('click', () => enableMicFromTab(track, btn, status));
      const scope = el('canvas', 'mic-scope');
      scope.width = 240; scope.height = 38;
      mic.appendChild(btn);
      mic.appendChild(deviceSel);
      mic.appendChild(tabBtn);
      mic.appendChild(status);
      mic.appendChild(scope);
      wrap.appendChild(mic);
      startMicScope(track, scope);
    } else {
      const stepsRow = el('div', 'steps-row');
      track.stepsEl = stepsRow;
      wrap.appendChild(stepsRow);
    }

    const knobs = el('div', 'track-knobs');
    track.knobsEl = knobs;
    buildKnobs(track);
    wrap.appendChild(knobs);

    // Vertical fader for mix-mode channel strip (hidden in other modes)
    const mixFaderWrap = el('div', 'mix-fader-wrap');
    const mixFader = el('input', 'mix-fader');
    mixFader.type = 'range';
    mixFader.min = 0; mixFader.max = 1.2; mixFader.step = 0.01;
    mixFader.value = track.volume;
    const mixVolLabel = el('span', 'mix-vol-val', Number(track.volume).toFixed(2));
    mixFader.addEventListener('input', () => {
      const v = parseFloat(mixFader.value);
      track.volume = v;
      mixVolLabel.textContent = v.toFixed(2);
      if (track.volNode) track.volNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    });
    mixFaderWrap.appendChild(mixFader);
    mixFaderWrap.appendChild(mixVolLabel);
    track._mixFader = mixFader;
    track._mixVolLabel = mixVolLabel;
    wrap.appendChild(mixFaderWrap);

    tracksEl.appendChild(wrap);
    if (track.kind !== 'mic') rebuildSteps(track);
  }

  function buildKnobs(track) {
    const k = track.knobsEl;
    k.innerHTML = '';

    if (track.kind === 'mic') {
      k.appendChild(group(null,
        knob('Vol', 0, 1.2, 0.01, track.volume, v => {
          track.volume = v;
          if (track.volNode) track.volNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        }, v => v.toFixed(2)),
        knob('Gain', 0.1, 20, 0.1, track.inputGain, v => {
          track.inputGain = v;
          if (track.inputGainN) track.inputGainN.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        }, v => v.toFixed(1) + 'x'),
        knob('HPF', 20, 1000, 5, track.hpfFreq, v => {
          track.hpfFreq = v;
          if (track.hpf) track.hpf.frequency.setTargetAtTime(v, audioCtx.currentTime, 0.02);
        }, v => Math.round(v)),
      ));
      // 8-band EQ — each band is its own column with on toggle, freq, gain
      track.eqBands.forEach((b, idx) => {
        const cell = el('div', 'group eq-band');
        const head = el('div', 'eq-head');
        const onBtn = el('button', 'toggle eq-on', String(idx + 1));
        if (b.on) onBtn.classList.add('on');
        onBtn.addEventListener('click', () => {
          b.on = !b.on;
          onBtn.classList.toggle('on', b.on);
          if (track.eqNodes && track.eqNodes[idx]) {
            track.eqNodes[idx].gain.setTargetAtTime(b.on ? b.gain : 0, audioCtx.currentTime, 0.02);
          }
        });
        head.appendChild(onBtn);
        cell.appendChild(head);
        cell.appendChild(knob('Hz', 30, 16000, 10, b.freq, v => {
          b.freq = v;
          if (track.eqNodes && track.eqNodes[idx]) {
            track.eqNodes[idx].frequency.setTargetAtTime(v, audioCtx.currentTime, 0.02);
          }
        }, v => Math.round(v)));
        cell.appendChild(knob('dB', -15, 15, 0.5, b.gain, v => {
          b.gain = v;
          if (track.eqNodes && track.eqNodes[idx] && b.on) {
            track.eqNodes[idx].gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
          }
        }, v => (v >= 0 ? '+' : '') + v.toFixed(1)));
        k.appendChild(cell);
      });
    } else {
      const stdControls = [
        numField('Stp', 1, 128, track.steps, n => { track.steps = n; rebuildSteps(track); }),
        knob('Vol', 0, 1.2, 0.01, track.volume, v => {
          track.volume = v;
          if (track.volNode) track.volNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        }, v => v.toFixed(2)),
        knob('Swg', 0, 0.6, 0.01, track.swing || 0, v => track.swing = v, v => v.toFixed(2)),
        checkBox('Mono', track.mono, v => { track.mono = v; if (!v) track._lastTrigGain = null; }),
      ];
      if (NOTE_LEN_KINDS.has(track.kind)) {
        const curLen = track.noteLen != null ? track.noteLen : 1.0;
        stdControls.push(knob('NLen', 0.1, 3, 0.05, curLen, v => {
          track.noteLen = v;
          // overwrite every existing step's length too
          for (const entry of track.pattern) { if (entry) entry.length = v; }
          rebuildSteps(track);
        }, v => v.toFixed(2)));
      }
      k.appendChild(group(null, ...stdControls));
      if (PRESET_KINDS.has(track.kind)) {
        const presetWrap = el('div', 'group');
        presetWrap.appendChild(el('span', 'label', 'Preset'));
        const row = el('div', 'group-row');
        const sel = el('select');
        sel.className = 'preset-select';
        const refreshSel = () => {
          sel.innerHTML = '';
          const def = el('option', null, '(load…)'); def.value = '';
          sel.appendChild(def);
          const factory = (FACTORY_PRESETS[track.kind] || {});
          const user    = getPresetsForKind(track.kind);
          const fNames = Object.keys(factory).sort();
          const uNames = Object.keys(user).sort();
          if (fNames.length) {
            const og = document.createElement('optgroup');
            og.label = 'Factory';
            fNames.forEach(n => {
              const op = el('option', null, n); op.value = 'f:' + n;
              og.appendChild(op);
            });
            sel.appendChild(og);
          }
          if (uNames.length) {
            const og = document.createElement('optgroup');
            og.label = 'User';
            uNames.forEach(n => {
              const op = el('option', null, n); op.value = 'u:' + n;
              og.appendChild(op);
            });
            sel.appendChild(og);
          }
        };
        refreshSel();
        sel.addEventListener('change', () => {
          if (!sel.value) return;
          const idx = sel.value.indexOf(':');
          const src = sel.value.slice(0, idx);
          const name = sel.value.slice(idx + 1);
          const p = (src === 'f')
            ? (FACTORY_PRESETS[track.kind] || {})[name]
            : getPresetsForKind(track.kind)[name];
          if (!p) return;
          applyPresetToTrack(track, p);
          buildKnobs(track);
        });
        const saveBtn = el('button', 'mic-btn', 'Save');
        saveBtn.title = 'save current sound as a user preset';
        saveBtn.addEventListener('click', () => {
          // suggest current value (strip src prefix) if it's a user preset
          let suggested = '';
          if (sel.value && sel.value.startsWith('u:')) suggested = sel.value.slice(2);
          const name = window.prompt('Save ' + track.kind + ' preset as:', suggested);
          if (!name) return;
          setPreset(track.kind, name, getTrackPresetParams(track));
          refreshSel();
          sel.value = 'u:' + name;
        });
        const delBtn = el('button', 'mic-btn', 'Del');
        delBtn.title = 'delete the selected user preset (factory presets cannot be deleted)';
        delBtn.addEventListener('click', () => {
          if (!sel.value) return;
          if (!sel.value.startsWith('u:')) {
            window.alert('Factory presets cannot be deleted.');
            return;
          }
          const name = sel.value.slice(2);
          if (window.confirm('Delete preset "' + name + '"?')) {
            deletePreset(track.kind, name);
            refreshSel();
          }
        });
        row.appendChild(sel);
        row.appendChild(saveBtn);
        row.appendChild(delBtn);
        presetWrap.appendChild(row);
        k.appendChild(presetWrap);
      }
    }

    if (track.kind === 'granular') {
      const area = el('div', 'sample-area');
      const head = el('div', 'group');
      const listenBtn = el('button', 'mic-btn', track.stream ? '■ Stop Listen' : '🎤 Listen');
      if (track.stream) listenBtn.classList.add('on');
      const recBtn = el('button', 'mic-btn', '● Rec');
      recBtn.disabled = !track.stream;
      const loadBtn = el('button', 'mic-btn', 'Load File');
      const status = el('span', 'sample-status', track.buffer ? track.buffer.duration.toFixed(2) + 's loaded' : 'no sample');
      const wave = el('canvas', 'grain-wave');
      wave.width = 380; wave.height = 60;

      const refreshWave = () => drawGranularWaveform(wave, track);
      refreshWave();
      track._refreshWave = refreshWave;

      listenBtn.addEventListener('click', () => {
        if (track.stream) disableGranularListen(track, listenBtn, recBtn, status);
        else enableGranularListen(track, listenBtn, recBtn, status);
      });
      const tabBtn = el('button', 'mic-btn', '🖥 Tab');
      tabBtn.title = 'capture audio from another browser tab/window';
      tabBtn.addEventListener('click', () => {
        if (track.stream) disableGranularListen(track, listenBtn, recBtn, status);
        else enableGranularListenTab(track, listenBtn, recBtn, status);
      });
      recBtn.addEventListener('click', () => {
        if (track.recorder && track.recorder.state === 'recording') stopGranularRecord(track);
        else startGranularRecord(track, recBtn, status);
      });
      loadBtn.addEventListener('click', () => loadGranularFile(track, status));

      // click on waveform sets playStart inside truncated region
      wave.style.cursor = 'crosshair';

  function rebuildSteps(track) {
    const prev = track.pattern;
    track.pattern = new Array(track.steps).fill(false).map((_, i) => prev[i] || false);
    track.stepsEl.innerHTML = '';
    for (let i = 0; i < track.steps; i++) {
      const col = el('div', 'step-col');
      const cell = el('div', 'step' + (i % 4 === 0 ? ' beat' : ''));
      renderStep(cell, track, i);

      // forward refs so the click handler can refresh the lanes when a step is toggled off
      let velRef = null, panRef = null, lenRef = null;

      cell.addEventListener('click', (e) => {
        if ((track.kind === 'bass' || track.kind === 'lead') && e.shiftKey) {
          if (track.pattern[i]) {
            track.pattern[i].slide = !track.pattern[i].slide;
            renderStep(cell, track, i);
          }
          return;
        }
        toggleStep(track, i);
        renderStep(cell, track, i);
        if (velRef) renderLane(velRef, track, i, 'vel');
        if (panRef) renderLane(panRef, track, i, 'pan');
        if (lenRef) renderLane(lenRef, track, i, 'length');
      });

      if (track.kind === 'bass' || track.kind === 'lead' || track.kind === 'granular' || track.kind === 'mellotron') {
        cell.addEventListener('wheel', (e) => {
          if (!track.pattern[i]) return;
          e.preventDefault();
          const dir = e.deltaY < 0 ? 1 : -1;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) + dir, -24, 24);
          renderStep(cell, track, i);
        }, { passive: false });
      }
      if (track.kind === 'chord') {
        cell.addEventListener('wheel', (e) => {
          if (!track.pattern[i]) return;
          e.preventDefault();
          const dir = e.deltaY < 0 ? 1 : -1;
          track.pattern[i].degree = clamp(((track.pattern[i].degree || 0) + dir), 0, 6);
          renderStep(cell, track, i);
        }, { passive: false });
      }

      col.appendChild(cell);

      if (track.kind === 'bass' || track.kind === 'lead') {
        const ctrl = el('div', 'step-mini');
        const dn = el('button', null, '−');
        const up = el('button', null, '+');

        };
        dn.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) - 1, -12, 24);
          renderStep(cell, track, i);
        });
        up.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) + 1, -12, 24);
          renderStep(cell, track, i);
        });
        sl.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].slide = !track.pattern[i].slide;
          refreshSlide();
          renderStep(cell, track, i);
        });
        refreshSlide();
        ctrl.appendChild(dn); ctrl.appendChild(up); ctrl.appendChild(sl);
        col.appendChild(ctrl);
      }
      if (track.kind === 'granular' || track.kind === 'mellotron') {

          renderStep(cell, track, i);
        });
        up.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) + 1, -24, 24);
          renderStep(cell, track, i);

        up.addEventListener('click', () => {

      const vel = el('div', 'lane-cell vel');

      const pan = el('div', 'lane-cell pan');
      const panBar = el('div', 'bar'); pan.appendChild(panBar);

      if (NOTE_LEN_KINDS.has(track.kind)) {
        const len = el('div', 'lane-cell length');

        renderLane(len, track, i, 'length');

  function defaultEntry(track) {
    const base = { vel: 1, pan: 0 };
    const len = track.noteLen != null ? track.noteLen : 1.0;
    if (track.kind === 'bass' || track.kind === 'lead') return { ...base, pitch: 0, slide: false, length: len };
    if (track.kind === 'granular') return { ...base, pitch: 0, length: len };
    if (track.kind === 'mellotron') return { ...base, pitch: 0, length: len };
    if (track.kind === 'chord') return { ...base, degree: 0, quality: 'auto', length: len };
    return base;
  }
  // Which kinds support per-step note length
  const NOTE_LEN_KINDS = new Set(['bass','lead','chord','mellotron','granular']);
  function toggleStep(track, i) {
    track.pattern[i] = track.pattern[i] ? false : defaultEntry(track);
  }

  function renderStep(cell, track, i) {
    const on = !!track.pattern[i];
    cell.classList.toggle('on', on);
    cell.classList.toggle('slide', on && track.pattern[i].slide);
    if (on && (track.kind === 'bass' || track.kind === 'lead' || track.kind === 'granular' || track.kind === 'mellotron')) {
      cell.textContent = String(track.pattern[i].pitch);
    } else if (on && track.kind === 'chord') {
      const numerals = ['I','II','III','IV','V','VI','VII'];
      cell.textContent = numerals[track.pattern[i].degree | 0];
    } else cell.textContent = '';
  }
  function renderLane(cellEl, track, i, kind) {
    const bar = cellEl.querySelector('.bar');
    const entry = track.pattern[i];
    if (!entry) { bar.style.display = 'none'; return; }
    bar.style.display = 'block';
    if (kind === 'vel') {
      const v = entry.vel ?? 1;
      bar.style.top = ''; bar.style.bottom = '0';
      bar.style.height = (v * 100) + '%';
    } else if (kind === 'pan') {
      const v = entry.pan ?? 0;
      if (v >= 0) {
        bar.style.bottom = '50%';
        bar.style.top = '';
        bar.style.height = (v * 50) + '%';
      } else {
        bar.style.top = '50%';
        bar.style.bottom = '';
        bar.style.height = (-v * 50) + '%';
      }
    } else if (kind === 'length') {
      // 0..3 mapped to 0..100% from bottom. 1.0 sits at 33%.
      const v = entry.length ?? 1.0;
      bar.style.top = ''; bar.style.bottom = '0';
      bar.style.height = Math.min(100, (v / 3) * 100) + '%';
    }
  }
  function attachLaneDrag(cellEl, track, i, kind) {
    const beginDrag = (initialY) => {
      if (!track.pattern[i]) return null;
      const rect = cellEl.getBoundingClientRect();
      const update = (y) => {
        const t = clamp((rect.bottom - y) / rect.height, 0, 1);
        let val;
        if (kind === 'vel')         val = t;          // 0..1
        else if (kind === 'pan')    val = t * 2 - 1;  // -1..1
        else if (kind === 'length') val = t * 3;      // 0..3
        else                        val = t;
        track.pattern[i][kind] = val;
        renderLane(cellEl, track, i, kind);
      };
      update(initialY);
      return update;
    };
    cellEl.addEventListener('mousedown', (e) => {
      const update = beginDrag(e.clientY);
      if (!update) return;
      const onMove = (ev) => update(ev.clientY);
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
    cellEl.addEventListener('touchstart', (e) => {
      const t0 = e.touches[0]; if (!t0) return;
      const update = beginDrag(t0.clientY);
      if (!update) return;
      const onMove = (ev) => { const t = ev.touches[0]; if (t) { update(t.clientY); ev.preventDefault(); } };
      const onEnd = () => {
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onEnd);
        window.removeEventListener('touchcancel', onEnd);
      };
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
      window.addEventListener('touchcancel', onEnd);
      e.preventDefault();
    }, { passive: false });
  }

  function highlightStep(track, idx) {
    if (!track.stepsEl) return;
    if (track._cursorIdx === idx) return;
    const cols = track.stepsEl.children;
    if (track._cursorIdx >= 0 && track._cursorIdx < cols.length) {
      const oldCol = cols[track._cursorIdx];
      if (oldCol && oldCol.firstChild) oldCol.firstChild.classList.remove('cursor');
    }
    if (idx >= 0 && idx < cols.length) {
      const newCol = cols[idx];
      if (newCol && newCol.firstChild) newCol.firstChild.classList.add('cursor');
    }
    track._cursorIdx = idx;
  }

  function stepDuration() {
    const bpm = clamp(parseFloat(bpmInput.value) || 120, 20, 300);
    return 60 / bpm / 4;
  }
  function triggerDuck(time) {
    if (duckCfg.sourceIndex < 0) return;
    for (let i = 0; i < tracks.length; i++) {
      if (i === duckCfg.sourceIndex) continue;
      const t = tracks[i];
      if (!t.duckGain || !(t.duckAmt > 0)) continue;
      const g = t.duckGain.gain;
      const floor = Math.max(0.001, 1 - t.duckAmt);
      g.cancelScheduledValues(time);
      g.setValueAtTime(g.value, time);
      g.linearRampToValueAtTime(floor, time + duckCfg.attack);
      g.linearRampToValueAtTime(1,     time + duckCfg.attack + duckCfg.release);
    }
  }

  function scheduler() {
    const horizon = audioCtx.currentTime + SCHEDULE_AHEAD;
    const sDur = stepDuration();
    const anySolo = tracks.some(x => x.solo);
    for (let i = 0; i < tracks.length; i++) {
      const t = tracks[i];
      if (t.kind === 'mic' || !t.pattern || t.pattern.length === 0 || !t.voice) continue;
      while (t.nextNoteTime < horizon) {
        const idx = t.nextStep % t.pattern.length;
        // apply pending mute/arm exactly at the downbeat of the loop
        if (idx === 0 && (t._pendingMute !== undefined || t._pendingArmed !== undefined)) {
          const newMute  = (t._pendingMute  !== undefined) ? t._pendingMute  : t.mute;
          const newArmed = (t._pendingArmed !== undefined) ? t._pendingArmed : t.armed;
          const delay = Math.max(0, (t.nextNoteTime - audioCtx.currentTime) * 1000);
          setTimeout(() => {
            t.mute = newMute;
            t.armed = newArmed;
            t._pendingMute = undefined;
            t._pendingArmed = undefined;
            refreshAllToggleBtns();
            refreshMicGates();
          }, delay);
        }
        const entry = t.pattern[idx];
        const audible = t.armed && !t.mute && (!anySolo || t.solo);
        if (entry && audible) {
          const vel = entry.vel ?? 1;
          const pan = entry.pan ?? 0;
          // mono: fade out the previous trigger fast so only one voice sounds at a time
          if (t.mono && t._lastTrigGain) {
            const g = t._lastTrigGain.gain;
            const stopAt = t.nextNoteTime;
            try {
              g.cancelScheduledValues(stopAt);
              g.setValueAtTime(g.value, stopAt);
              g.linearRampToValueAtTime(0.0001, stopAt + 0.005);
            } catch (e) {}
            t._lastTrigGain = null;
          }
          // Per-trigger gain — start from near-zero and ramp to vel over 2 ms so the
          // trigger boundary itself never produces a click, regardless of voice attack.
          const tg = audioCtx.createGain();
          tg.gain.setValueAtTime(0.0001, t.nextNoteTime);
          tg.gain.exponentialRampToValueAtTime(Math.max(0.0001, vel), t.nextNoteTime + 0.002);
          const tp = audioCtx.createStereoPanner(); tp.pan.value = pan;
          tg.connect(tp).connect(t.input);
          const env = {
            stepDur: sDur,
            prevFreq:  t._prevFreq,
            prevSlide: t._prevSlide,
          };
          t.voice(audioCtx, t.nextNoteTime, tg, t, entry, env);
          if (t.mono) t._lastTrigGain = tg;
          if (i === duckCfg.sourceIndex) triggerDuck(t.nextNoteTime);
        }
        if (entry && (t.kind === 'bass' || t.kind === 'lead')) {
          t._prevFreq  = midiToFreq(t.root + (entry.pitch || 0));
          t._prevSlide = !!entry.slide;
        }
        const delay = Math.max(0, (t.nextNoteTime - audioCtx.currentTime) * 1000);
        const stepIdx = idx;
        setTimeout(() => { if (isPlaying) highlightStep(t, stepIdx); }, delay);
        // swing: even step → +swing, odd step → -swing (so pair preserves tempo)
        const swingFactor = ((t.nextStep % 2) === 0) ? (1 + (t.swing || 0)) : (1 - (t.swing || 0));
        t.nextNoteTime += sDur * swingFactor;
        t.nextStep++;
      }
    }
  }
  function start() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    isPlaying = true;
    const startTime = audioCtx.currentTime + 0.05;
    for (const t of tracks) {
      t.nextStep = 0;
      t.nextNoteTime = startTime;
      t._prevFreq = null;
      t._prevSlide = false;
    }
    playBtn.textContent = 'Stop';
    playBtn.classList.add('playing');
    schedulerTimer = setInterval(scheduler, LOOKAHEAD);
  }
  function stop() {
    isPlaying = false;
    clearInterval(schedulerTimer); schedulerTimer = null;
    for (const t of tracks) highlightStep(t, -1);
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
  }
  playBtn.addEventListener('click', () => { isPlaying ? stop() : start(); });

  // ---------- per-track audio lifecycle ----------
  function initTrackAudio(t) {
    if (!audioCtx) return;
    if (t.input) return; // already initialised
    t.input        = audioCtx.createGain();
    t.volNode      = audioCtx.createGain();   t.volNode.gain.value      = t.volume;
    t.trkLfoMod    = audioCtx.createGain();   t.trkLfoMod.gain.value    = 1; // tremolo carrier
    t.trkPanNode   = audioCtx.createStereoPanner(); t.trkPanNode.pan.value = 0;
    t.duckGain     = audioCtx.createGain();   t.duckGain.gain.value     = 1;
    t.delaySendN   = audioCtx.createGain();   t.delaySendN.gain.value   = t.delaySend;
    t.reverbSendN  = audioCtx.createGain();   t.reverbSendN.gain.value  = t.reverbSend;
    t.chorusSendN  = audioCtx.createGain();   t.chorusSendN.gain.value  = t.chorusSend;
    t.flangerSendN = audioCtx.createGain();   t.flangerSendN.gain.value = t.flangerSend;
    t.bitcrushSendN= audioCtx.createGain();   t.bitcrushSendN.gain.value= t.bitcrushSend;
    t.input.connect(t.volNode);
    t.volNode.connect(t.trkLfoMod).connect(t.trkPanNode).connect(t.duckGain);
    t.duckGain.connect(masterIn);
    t.duckGain.connect(t.delaySendN).connect(delayBus);
    t.duckGain.connect(t.reverbSendN).connect(reverbBus);
    t.duckGain.connect(t.chorusSendN).connect(chorusBus);
    t.duckGain.connect(t.flangerSendN).connect(flangerBus);
    t.duckGain.connect(t.bitcrushSendN).connect(bitcrushBus);

    // continuous track-level LFO modulates tremolo + auto-pan
    t.trkLfo      = audioCtx.createOscillator();
    t.trkLfo.type = t.trkLfoShape || 'sine';
    t.trkLfo.frequency.value = t.trkLfoRate || 0.5;
    t.trkLfoVolG  = audioCtx.createGain(); t.trkLfoVolG.gain.value = t.trkLfoVolDepth || 0;
    t.trkLfoPanG  = audioCtx.createGain(); t.trkLfoPanG.gain.value = t.trkLfoPanDepth || 0;
    t.trkLfo.connect(t.trkLfoVolG).connect(t.trkLfoMod.gain);
    t.trkLfo.connect(t.trkLfoPanG).connect(t.trkPanNode.pan);
    t.trkLfo.start();

    if (t.kind === 'mic') {
      t.inputGainN = audioCtx.createGain(); t.inputGainN.gain.value = t.inputGain;
      t.hpf = audioCtx.createBiquadFilter(); t.hpf.type = 'highpass'; t.hpf.frequency.value = t.hpfFreq;
      t.eqNodes = t.eqBands.map(b => {
        const n = audioCtx.createBiquadFilter();
        n.type = 'peaking'; n.frequency.value = b.freq; n.Q.value = 1.0;
        n.gain.value = b.on ? b.gain : 0;
        return n;
      });
      t.micGate = audioCtx.createGain(); t.micGate.gain.value = 1;
      t.analyser = audioCtx.createAnalyser();
      t.analyser.fftSize = 2048;
      let node = t.inputGainN.connect(t.hpf);
      for (const eq of t.eqNodes) node = node.connect(eq);
      node.connect(t.micGate).connect(t.input);
      // analyser sits in a parallel branch off the input gain so it shows raw input level
      t.inputGainN.connect(t.analyser);
    }
  }
  function destroyTrackAudio(t) {
    if (t.recorder && t.recorder.state === 'recording') {
      try { t.recorder.stop(); } catch (e) {}
    }
    if (t.stream) { try { t.stream.getTracks().forEach(s => s.stop()); } catch (e) {} t.stream = null; }
    if (t._scopeStop !== undefined) t._scopeStop = true;
    if (t.trkLfo) { try { t.trkLfo.stop(); } catch (e) {} try { t.trkLfo.disconnect(); } catch (e) {} t.trkLfo = null; }
    ['trkLfoVolG','trkLfoPanG','trkLfoMod','trkPanNode',
     'micSource','inputGainN','hpf','micGate','analyser','input','volNode','duckGain',
     'delaySendN','reverbSendN','chorusSendN','flangerSendN','bitcrushSendN']
      .forEach(k => { if (t[k]) { try { t[k].disconnect(); } catch (e) {} t[k] = null; } });
    if (t.eqNodes) { t.eqNodes.forEach(n => { try { n.disconnect(); } catch (e) {} }); t.eqNodes = null; }
  }
  async function addTrack(kind, overrides) {
    if ((kind === 'mic' || kind === 'granular') && !projectDir && window.showDirectoryPicker) {
      const want = window.confirm(
        'Adding a ' + kind + ' track.\n\n' +
        'Pick a project folder now to keep samples and the project file together?\n' +
        '(Cancel to skip — recordings will be downloaded one by one.)'
      );
      if (want) await pickProjectDir();
    }
    const t = makeTrack(kind, overrides);
    tracks.push(t);
    if (audioCtx) initTrackAudio(t);
    rebuildTracksUI();
    rebuildDuckerSourceOptions();
  }
  function removeTrack(t) {
    destroyTrackAudio(t);
    const idx = tracks.indexOf(t);
    if (idx >= 0) tracks.splice(idx, 1);
    if (duckCfg.sourceIndex === idx) duckCfg.sourceIndex = -1;
    else if (duckCfg.sourceIndex > idx) duckCfg.sourceIndex--;
    rebuildTracksUI();
    rebuildDuckerSourceOptions();
  }
  function rebuildTracksUI() {
    tracksEl.innerHTML = '';
    if (tracks.length === 0) {
      tracksEl.appendChild(el('div', 'empty-hint',
        'No tracks yet — use the "Add track" buttons above to add a Drum, Bass, Synth, Chord, Mic, or Granular channel.'));
      return;
    }
    tracks.forEach(buildTrack);
  }
  function rebuildDuckerSourceOptions() {
    const m = document.getElementById('ducker');
    if (!m) return;
    const wasCollapsed = m.classList.contains('collapsed');
    m.innerHTML = '';
    buildDucker();
    if (typeof makeCollapsible === 'function') {
      makeCollapsible(m, { collapsed: wasCollapsed });
    }
  }

  // ---------- mixer (dual deck) ----------
  function applyCrossfade(x) {
    const aA = Math.cos(x * Math.PI / 2);
    const aB = Math.sin(x * Math.PI / 2);
    if (decks.A.xfade) decks.A.xfade.gain.setTargetAtTime(aA, audioCtx.currentTime, 0.01);
    if (decks.B.xfade) decks.B.xfade.gain.setTargetAtTime(aB, audioCtx.currentTime, 0.01);
  }
  function loadDeckFile(k, statusEl) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'audio/*,application/json,.json';
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      statusEl.textContent = 'loading…';
      // JSON project file: render its loop offline into the deck buffer
      if (/\.json$/i.test(file.name) || file.type === 'application/json') {
        try {
          const txt = await file.text();
          const data = JSON.parse(txt);
          statusEl.textContent = 'rendering project…';
          const buf = await renderProjectToBuffer(data);
          if (!buf) throw new Error('render failed');
          decks[k].buffer = buf;
          decks[k].name = file.name + ' (rendered loop)';
          statusEl.textContent = decks[k].name + ' (' + buf.duration.toFixed(1) + 's)';
        } catch (e) {
          console.warn(e);
          statusEl.textContent = 'render failed: ' + (e.message || 'unknown');
        }
        return;
      }
      try {
        initAudio();
        const ab = await file.arrayBuffer();
        decks[k].buffer = await audioCtx.decodeAudioData(ab);
        decks[k].name = file.name;
        statusEl.textContent = file.name + ' (' + decks[k].buffer.duration.toFixed(1) + 's)';
      } catch (e) { statusEl.textContent = 'load failed'; }
    });
    input.click();
  }

  // Render a saved project's pattern loop into an offline-rendered AudioBuffer.
  // Skips mic/granular (live/sample) and supports drum/bass/lead/chord voices.
  async function renderProjectToBuffer(data) {
    if (!window.OfflineAudioContext) return null;
    const bpm = clamp(parseFloat(data.bpm) || 120, 20, 300);
    const stepDur = 60 / bpm / 4;
    // longest pattern length in steps among playable tracks
    const playable = (data.tracks || []).filter(t =>
      t.kind !== 'mic' && t.kind !== 'granular' && Array.isArray(t.pattern) && t.pattern.length);
    if (playable.length === 0) return null;
    const maxSteps = Math.max(...playable.map(t => t.steps || t.pattern.length));
    const durSec = stepDur * maxSteps + 2.0; // tail for releases
    const sr = 44100;
    const offline = new OfflineAudioContext(2, Math.ceil(durSec * sr), sr);
    // reuse current effect configs as a static snapshot
    const masterOutO = offline.createGain(); masterOutO.gain.value = (data.master && data.master.vol) || 0.9;
    masterOutO.connect(offline.destination);

    // schedule each track's notes onto offline ctx
    for (const td of playable) {
      const t = makeTrack(td.kind, td);
      // wire a minimal channel: input → vol → master
      const input = offline.createGain();
      const vol = offline.createGain(); vol.gain.value = t.volume;
      input.connect(vol).connect(masterOutO);
      let prevFreq = null, prevSlide = false;
      for (let i = 0; i < maxSteps; i++) {
        const idx = i % t.pattern.length;
        const entry = t.pattern[idx];
        if (!entry) continue;
        const time = stepDur * i;
        const vel = entry.vel ?? 1;
        const pan = entry.pan ?? 0;
        const tg = offline.createGain(); tg.gain.value = vel;
        const tp = offline.createStereoPanner(); tp.pan.value = pan;
        tg.connect(tp).connect(input);
        const env = { stepDur, prevFreq, prevSlide };
        try { t.voice(offline, time, tg, t, entry, env); } catch (e) { /* skip */ }
        if (t.kind === 'bass' || t.kind === 'lead') {
          prevFreq = midiToFreq(t.root + (entry.pitch || 0));
          prevSlide = !!entry.slide;
        }
      }
    }
    try {
      return await offline.startRendering();
    } catch (e) { console.warn('render error', e); return null; }
  }
  function playDeck(k, btn) {
    const d = decks[k];
    if (!d.buffer) return;
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    stopDeck(k, btn);
    const src = audioCtx.createBufferSource();
    src.buffer = d.buffer; src.loop = true;
    src.connect(d.gain); src.start();
    d.source = src; d.playing = true;
    btn.textContent = 'Stop'; btn.classList.add('on');
  }
  function stopDeck(k, btn) {
    const d = decks[k];
    if (d.source) {
      try { d.source.stop(); } catch (e) {}
      try { d.source.disconnect(); } catch (e) {}
      d.source = null;
    }
    d.playing = false;
    if (btn) { btn.textContent = 'Play'; btn.classList.remove('on'); }
  }
  function buildDeck(k) {
    const d = decks[k];
    const dEl = el('div', 'mixer-deck');
    dEl.appendChild(el('div', 'deck-title', 'Deck ' + k));

    const btnRow = el('div', 'deck-btns');
    const loadBtn = el('button', 'mic-btn', 'Load');
    const playBtn = el('button', 'mic-btn', d.playing ? 'Stop' : 'Play');
    if (d.playing) playBtn.classList.add('on');
    const status  = el('span', 'sample-status', d.name || 'no file');
    loadBtn.addEventListener('click', () => loadDeckFile(k, status));
    playBtn.addEventListener('click', () => {
      if (d.playing) stopDeck(k, playBtn);
      else playDeck(k, playBtn);
    });
    btnRow.appendChild(loadBtn);
    btnRow.appendChild(playBtn);
    btnRow.appendChild(status);
    dEl.appendChild(btnRow);

    const knobs = el('div', 'deck-knobs');
    knobs.appendChild(knob('Vol', 0, 1.5, 0.01, d.vol, v => {
      d.vol = v; if (d.gain) d.gain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    }, v => v.toFixed(2)));
    knobs.appendChild(knob('Lo',  -20, 20, 0.5, d.low, v => {
      d.low = v; if (d.eqLow) d.eqLow.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    }, v => (v >= 0 ? '+' : '') + v.toFixed(1)));
    knobs.appendChild(knob('Mid', -20, 20, 0.5, d.mid, v => {
      d.mid = v; if (d.eqMid) d.eqMid.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    }, v => (v >= 0 ? '+' : '') + v.toFixed(1)));
    knobs.appendChild(knob('Hi',  -20, 20, 0.5, d.high, v => {
      d.high = v; if (d.eqHigh) d.eqHigh.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    }, v => (v >= 0 ? '+' : '') + v.toFixed(1)));
    dEl.appendChild(knobs);
    return dEl;
  }
  function buildMixer() {
    const m = document.getElementById('mixer');
    m.innerHTML = '';
    m.appendChild(el('h2', null, 'Mixer · Two-Deck'));
    const grid = el('div', 'decks-grid');
    grid.appendChild(buildDeck('A'));

    const xf = el('div', 'mixer-xfade');
    xf.appendChild(el('div', 'xfade-label', 'A · crossfade · B'));
    const xfSlider = el('input');
    xfSlider.type = 'range'; xfSlider.min = 0; xfSlider.max = 1; xfSlider.step = 0.01;
    xfSlider.value = decks.xfade;
    xfSlider.addEventListener('input', () => {
      decks.xfade = parseFloat(xfSlider.value);
      if (audioCtx) applyCrossfade(decks.xfade);
    });
    xf.appendChild(xfSlider);
    grid.appendChild(xf);

    grid.appendChild(buildDeck('B'));
    m.appendChild(grid);
  }

  // ---------- save / load ----------

  function serializeTrack(t) {
    const out = {};
    SAVE_KEYS.common.forEach(k => out[k] = t[k]);
    (SAVE_KEYS[t.kind] || []).forEach(k => out[k] = t[k]);
    return out;
  }
  function getProjectState() {
    const deckSnap = (d) => ({ name: d.name, vol: d.vol, low: d.low, mid: d.mid, high: d.high });
    return {
      version: 1,
      bpm: parseFloat(bpmInput.value),
      tracks: tracks.map(serializeTrack),
      master, delayCfg, reverbCfg, chorusCfg, flangerCfg, bitcrushCfg, compCfg, duckCfg, tapeCfg, lpfCfg, hpfCfg,
      decks: { A: deckSnap(decks.A), B: deckSnap(decks.B), xfade: decks.xfade },
    };
  }
  function applyAllParams() {
    if (!audioCtx) return;
    for (const t of tracks) {
      if (t.volNode)      t.volNode.gain.value      = t.volume;
      if (t.delaySendN)   t.delaySendN.gain.value   = t.delaySend;
      if (t.reverbSendN)  t.reverbSendN.gain.value  = t.reverbSend;
      if (t.chorusSendN)  t.chorusSendN.gain.value  = t.chorusSend;
      if (t.flangerSendN) t.flangerSendN.gain.value = t.flangerSend;
      if (t.bitcrushSendN)t.bitcrushSendN.gain.value= t.bitcrushSend;
      if (t.kind === 'mic' && t.hpf) t.hpf.frequency.value = t.hpfFreq;
    }
    if (masterOut)  masterOut.gain.value  = master.vol;
    if (eqLow)      eqLow.gain.value      = master.low;
    if (eqMid)      eqMid.gain.value      = master.mid;
    if (eqHigh)     eqHigh.gain.value     = master.high;
    if (warmLow)    warmLow.gain.value    =  1.5 * master.warmth;
    if (warmHigh)   warmHigh.gain.value   = -2.5 * master.warmth;
    if (warmShaper) warmShaper.curve      = makeWarmthCurve(master.warmth);
    if (compressor) {
      compressor.threshold.value = compCfg.threshold;
      compressor.ratio.value     = compCfg.ratio;
      compressor.attack.value    = compCfg.attack;
      compressor.release.value   = compCfg.release;
      compressor.knee.value      = compCfg.knee;
    }
    if (delayNode)  delayNode.delayTime.value = delayCfg.sync ? computeDelaySync() : delayCfg.time;
    if (delayFb)    delayFb.gain.value        = delayCfg.fb;
    if (delayWet)   delayWet.gain.value       = delayCfg.wet;
    if (reverbNode) reverbNode.buffer         = makeReverbIR(audioCtx, reverbCfg.decay);
    if (reverbWet)  reverbWet.gain.value      = reverbCfg.wet;
    if (chorusLfoL) chorusLfoL.frequency.value = chorusCfg.rate;
    if (chorusLfoR) chorusLfoR.frequency.value = chorusCfg.rate;
    if (chorusModL) chorusModL.gain.value      = chorusCfg.depth * 0.008;
    if (chorusModR) chorusModR.gain.value      = chorusCfg.depth * 0.008;
    if (chorusWet)  chorusWet.gain.value       = chorusCfg.wet;
    if (flangerLfo) flangerLfo.frequency.value = flangerCfg.rate;
    if (flangerMod) flangerMod.gain.value      = flangerCfg.depth * 0.004;
    if (flangerFb)  flangerFb.gain.value       = flangerCfg.fb;
    if (flangerWet) flangerWet.gain.value      = flangerCfg.wet;
    if (bitcrushWet) bitcrushWet.gain.value    = bitcrushCfg.wet;
    if (tapeWowDepth)     tapeWowDepth.gain.value     = tapeCfg.wow     * 0.004;
    if (tapeFlutterDepth) tapeFlutterDepth.gain.value = tapeCfg.flutter * 0.0008;
    if (tapeCrackleGain)  tapeCrackleGain.gain.value  = tapeCfg.crackle * 0.3;
    if (tapeHissGain)     tapeHissGain.gain.value     = tapeCfg.hiss    * 0.04;
    if (tapeSatNode)      tapeSatNode.curve           = makeTapeSatCurve(tapeCfg.sat);
    if (tapeFilterHP)     tapeFilterHP.frequency.value = 20 + tapeCfg.tone * 180;
    if (tapeFilterLP)     tapeFilterLP.frequency.value = 18000 - tapeCfg.tone * 12000;
    if (tapeDry) tapeDry.gain.value = 1 - tapeCfg.wet;
    if (tapeWet) tapeWet.gain.value = tapeCfg.wet;
    if (masterLP) { masterLP.frequency.value = lpfCfg.freq; masterLP.Q.value = lpfCfg.q; }
    if (masterHP) { masterHP.frequency.value = hpfCfg.freq; masterHP.Q.value = hpfCfg.q; }
    ['A','B'].forEach(k => {
      const d = decks[k];
      if (d.gain)   d.gain.gain.value      = d.vol;
      if (d.eqLow)  d.eqLow.gain.value     = d.low;
      if (d.eqMid)  d.eqMid.gain.value     = d.mid;
      if (d.eqHigh) d.eqHigh.gain.value    = d.high;
    });
    applyCrossfade(decks.xfade);
  }
  function rebuildAllUI() {
    tracksEl.innerHTML = '';
    ['master','comp','ducker','delay','reverb','chorus','flanger','bitcrush','tape','lpfilter','hpfilter','mixer'].forEach(id => {
      const node = document.getElementById(id);
      if (node) node.innerHTML = '';
    });
    rebuildTracksUI();
    buildMaster(); buildComp(); buildDucker();
    buildDelay(); buildReverb();
    buildChorus(); buildFlanger(); buildBitcrush(); buildTape();
  buildLPFilter(); buildHPFilter();
    buildMixer();
    applyCollapsibles();
  }
  async function saveProject() {
    const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const name = window.prompt('Save project as:', 'substrata-' + ts);
    if (!name) return;
    const filename = /\.json$/i.test(name) ? name : (name + '.json');
    const data = JSON.stringify(getProjectState(), null, 2);

    if (projectDir) {
      try {
        const fh = await projectDir.getFileHandle(filename, { create: true });
        const w = await fh.createWritable();
        await w.write(data);
        await w.close();
        return;
      } catch (e) {
        console.warn('Folder write failed, falling back to download:', e);
      }
    }
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function loadProject(data) {
    if (data.bpm !== undefined) bpmInput.value = data.bpm;
    if (Array.isArray(data.tracks)) {
      // tear down existing tracks
      stop();
      for (const t of tracks) destroyTrackAudio(t);
      tracks.length = 0;
      nextTrackId = 1;
      // build fresh tracks from saved data
      for (const td of data.tracks) {
        const t = makeTrack(td.kind, td);
        if (t.kind === 'mic') { t.enabled = false; t.stream = null; t.micSource = null; }
        tracks.push(t);
        if (audioCtx) initTrackAudio(t);
      }
    }
    if (data.master)      Object.assign(master, data.master);
    if (data.delayCfg)    Object.assign(delayCfg, data.delayCfg);
    if (data.reverbCfg)   Object.assign(reverbCfg, data.reverbCfg);
    if (data.chorusCfg)   Object.assign(chorusCfg, data.chorusCfg);
    if (data.flangerCfg)  Object.assign(flangerCfg, data.flangerCfg);
    if (data.bitcrushCfg) Object.assign(bitcrushCfg, data.bitcrushCfg);
    if (data.compCfg)     Object.assign(compCfg, data.compCfg);
    if (data.duckCfg)     Object.assign(duckCfg, data.duckCfg);
    if (data.tapeCfg)     Object.assign(tapeCfg, data.tapeCfg);
    if (data.lpfCfg)      Object.assign(lpfCfg,  data.lpfCfg);
    if (data.hpfCfg)      Object.assign(hpfCfg,  data.hpfCfg);
    if (data.decks) {
      ['A','B'].forEach(k => {
        if (data.decks[k]) {
          const d = data.decks[k];
          decks[k].name = d.name || '';
          decks[k].vol  = d.vol ?? decks[k].vol;
          decks[k].low  = d.low ?? 0;
          decks[k].mid  = d.mid ?? 0;
          decks[k].high = d.high ?? 0;
        }
      });
      decks.xfade = data.decks.xfade ?? 0.5;
    }
    applyAllParams();
    rebuildAllUI();
    // restore granular sample buffers from project folder
    if (projectDir) reloadGranularSamples();
  }
  async function reloadGranularSamples() {
    for (const t of tracks) {
      if (t.kind !== 'granular' || !t.sampleFile) continue;
      const ab = await readSampleFromFolder(t.sampleFile);
      if (!ab) continue;
      try {
        initAudio();
        t.buffer = await audioCtx.decodeAudioData(ab);
        if (t._refreshWave) t._refreshWave();
      } catch (e) { console.warn('Decode failed for', t.sampleFile, e); }
    }
  }
  function openLoadDialog() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { loadProject(JSON.parse(reader.result)); }
        catch (e) { alert('Failed to load: ' + e.message); }
      };
      reader.readAsText(file);
    });
    input.click();
  }
  document.getElementById('save').addEventListener('click', saveProject);
  document.getElementById('load').addEventListener('click', openLoadDialog);

  // ---------- recording ----------
  let recordDest = null, mediaRecorder = null, recordChunks = [];
  let recordMime = '';
  const recBtn = document.getElementById('rec');
  function pickMime() {
    const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/ogg;codecs=opus'];
    return cands.find(c => window.MediaRecorder && MediaRecorder.isTypeSupported(c)) || '';
  }
  function startRecording() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!window.MediaRecorder) { alert('MediaRecorder is not supported in this browser.'); return; }
    if (!recordDest) {
      recordDest = audioCtx.createMediaStreamDestination();
      masterOut.connect(recordDest);
    }
    recordMime = pickMime();
    recordChunks = [];
    mediaRecorder = new MediaRecorder(recordDest.stream, recordMime ? { mimeType: recordMime } : undefined);
    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const type = recordMime || 'audio/webm';
      const blob = new Blob(recordChunks, { type });
      const ext = type.includes('mp4') ? 'm4a' : (type.includes('ogg') ? 'ogg' : 'webm');
      const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      const filename = 'substrata-rec-' + ts + '.' + ext;
      if (projectDir) {
        const ok = await writeToSubfolder('exports', filename, blob);
        if (ok) return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    };
    mediaRecorder.start();
    recBtn.classList.add('on');
    recBtn.textContent = '■ Stop';
  }
  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    recBtn.classList.remove('on');
    recBtn.textContent = '● Rec';
  }
  recBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
    else startRecording();
  });

  function makeCollapsible(moduleEl, opts) {
    opts = opts || {};
    const h2 = moduleEl.querySelector('h2');
    if (!h2) return;
    if (h2.querySelector('.collapse-chev')) return;
    const chev = document.createElement('span');
    chev.className = 'collapse-chev';
    const startCollapsed = opts.collapsed || moduleEl.classList.contains('collapsed');
    chev.textContent = startCollapsed ? '▸' : '▾';
    h2.insertBefore(chev, h2.firstChild);
    if (startCollapsed) moduleEl.classList.add('collapsed');
    h2.addEventListener('click', () => {
      const collapsed = moduleEl.classList.toggle('collapsed');
      chev.textContent = collapsed ? '▸' : '▾';
      if (opts.onToggle) opts.onToggle(collapsed);
    });
  }
  function applyCollapsibles() {
    ['master','comp','ducker','delay','reverb','chorus','flanger','bitcrush','tape','lpfilter','hpfilter'].forEach(id => {
      const m = document.getElementById(id);
      if (m) makeCollapsible(m);
    });
    const mixer = document.getElementById('mixer');
    if (mixer) {
      makeCollapsible(mixer, {
        collapsed: mixer.classList.contains('collapsed') || !document.body.classList.contains('mixer-open'),
        onToggle: (c) => {
          document.body.classList.toggle('mixer-collapsed', c);
        }
      });
    }
  }

  // Add Track buttons
  document.querySelectorAll('.add-track').forEach(btn => {
    btn.addEventListener('click', async () => {
      try { await addTrack(btn.dataset.kind); }
      catch (e) { console.error('addTrack failed:', e); alert('Add track failed: ' + (e && e.message)); }
    });
  });

  // Project folder button
  document.getElementById('folder').addEventListener('click', pickProjectDir);
  updateFolderIndicator();

  // Mode toggle
  const modeBtns = document.querySelectorAll('#mode-toggle button');
  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      currentMode = mode;
      document.body.classList.toggle('mode-mixing',  mode === 'mixing');
      document.body.classList.toggle('mode-effects', mode === 'effects');
      modeBtns.forEach(b => b.classList.toggle('on', b === btn));
    });
  });

  // Realign every track to step 0 — kills accumulated timing drift between channels
  document.getElementById('realign').addEventListener('click', () => {
    if (!audioCtx) return;
    const startTime = audioCtx.currentTime + 0.06;
    for (const t of tracks) {
      t.nextStep = 0;
      t.nextNoteTime = startTime;
      t._prevFreq = null;
      t._prevSlide = false;
      t._lastTrigGain = null;
    }
  });

  // Full screen
  document.getElementById('fullscreen').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  rebuildTracksUI();
  buildMaster(); buildComp(); buildDucker();
  buildDelay(); buildReverb();
  buildChorus(); buildFlanger(); buildBitcrush(); buildTape();
  buildLPFilter(); buildHPFilter();

  // default: mixer starts collapsed
  document.getElementById('mixer').classList.add('collapsed');
  document.body.classList.add('mixer-collapsed');
  buildMixer();
  applyCollapsibles();
</script>
</body>
</html>
