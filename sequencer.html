<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>substrata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light theme — Warm White */
    --bg: #FDFCF4;
    --text: #2A2C2F;
    --muted: #B3ABA3;
    --line: #ECE8E3;
    --cell-off: transparent;
    --cell-on: #2A2C2F;
    --cell-border: #B3ABA3;
    --cell-playing: #FF5623;
    --canvas-ink: #2A2C2F;
    --accent: #FF5623;
    --dot: rgba(42, 44, 47, 0.07);
  }
  body.dark {
    /* Dark theme — Meteorite Black */
    --bg: #2A2C2F;
    --text: #FDFCF4;
    --muted: #B3ABA3;
    --line: #3F4145;
    --cell-off: transparent;
    --cell-on: #FDFCF4;
    --cell-border: #5A5C60;
    --cell-playing: #FF5623;
    --canvas-ink: #FDFCF4;
    --accent: #FF5623;
    --dot: rgba(253, 252, 244, 0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', ui-monospace, Menlo, monospace;
    font-weight: 400;
    font-size: 11px;
    line-height: 1.4;
  }
  body {
    padding: 18px 20px;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><circle cx='1' cy='1' r='1' fill='%232A2C2F' fill-opacity='0.07'/></svg>");
    background-repeat: repeat;
  }
  body.dark {
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><circle cx='1' cy='1' r='1' fill='%23FDFCF4' fill-opacity='0.05'/></svg>");
  }
  h2 { font-weight: 500; margin: 0; letter-spacing: 0.5px; font-size: 10px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

  h1.title {
    margin: 0 0 14px;
    line-height: 1;
    display: block;
  }
  h1.title svg {
    display: block;
    height: 22px;
    width: auto;
  }
  h1.title .logo-ink    { fill: var(--text); }
  h1.title .logo-accent { fill: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }
  /* Side effects panel only shows on the Effects tab */
  .side { display: none; }
  body.mode-effects .side {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
  }

  .transport {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .transport .field { display: flex; align-items: center; gap: 8px; }
  .transport label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .transport input[type="number"] {
    width: 56px;
    background: transparent; color: var(--text);
    border: none; border-bottom: 1px solid var(--line);
    padding: 2px 0; font: inherit; text-align: right;
  }
  .transport input:focus { outline: none; border-bottom-color: var(--text); }
  button.play {
    background: var(--accent); color: #fff;
    border: none; padding: 6px 18px;
    font: inherit; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer;
  }
  button.play.playing { background: transparent; color: var(--text); outline: 1px solid var(--accent); }
  .transport button.small {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .transport button.small:hover { border-color: var(--text); }
  .transport button.small.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .mode-toggle {
    display: inline-flex;
    border: 1px solid var(--cell-border);
  }
  .mode-toggle button {
    background: transparent;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 14px;
    cursor: pointer;
    border-right: 1px solid var(--cell-border);
  }
  .mode-toggle button:last-child { border-right: none; }
  .mode-toggle button.on { background: var(--text); color: var(--bg); }

  .tabs {
    display: inline-flex;
    border-bottom: 1px solid var(--line);
  }
  .tabs button {
    background: transparent;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 6px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabs button.on {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .folder-name {
    font-size: 10px;
    color: var(--muted);
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .add-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
  }
  .add-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .add-row button.small {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .add-row button.small:hover { border-color: var(--text); }

  /* Effects mode hides the tracks UI; .side reveals itself via the rule above. */
  body.mode-effects .add-row,
  body.mode-effects #tracks { display: none !important; }

  /* mixing mode: hide everything except name + toggles */
  body.mode-mixing .steps-row,
  body.mode-mixing .track-knobs,
  body.mode-mixing .mic-control,
  body.mode-mixing .mixer,
  body.mode-mixing .add-row { display: none !important; }
  /* Mix mode — vertical channel strips */
  body.mode-mixing #tracks {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-start;
  }
  body.mode-mixing .track {
    display: flex !important;
    flex-direction: column;
    align-items: center;
    width: 96px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 6px;
    grid-template-columns: unset;
    overflow: hidden;
  }
  body.mode-mixing .track-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    overflow: visible;
    width: 100%;
  }
  body.mode-mixing .track-name {
    font-size: 9px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    cursor: default;
  }
  body.mode-mixing .track-name input.name-input { width: 78px; text-align: center; font-size: 9px; }
  body.mode-mixing .toggles {
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px;
    max-width: 86px;
  }
  body.mode-mixing .toggle { width: 18px; height: 18px; font-size: 9px; }
  body.mode-mixing .mix-fader-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }

  /* The fader strip itself — vertical orientation across modern browsers */
  .mix-fader-wrap { display: none; }
  .mix-fader {
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    writing-mode: vertical-lr;
    direction: rtl;
    width: 22px;
    height: 180px;
    accent-color: var(--accent);
    cursor: ns-resize;
  }
  .mix-vol-val {
    font-size: 8px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .track-name input.name-input {
    background: transparent;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 500;
    padding: 0;
    width: 80px;
  }
  .track-name input.name-input:focus { outline: 1px dotted var(--text); }
  .toggle.rmv:hover { border-color: #c33; color: #c33; }

  .empty-hint {
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
  }

  /* ---- tracks ---- */
  .track {
    display: grid;
    grid-template-columns: 124px 1fr;
    column-gap: 14px;
    row-gap: 5px;
    align-items: start;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .track-name {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
  }
  .track-name .chev {
    display: inline-block;
    width: 10px;
    color: var(--muted);
  }

  .steps-row {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    min-width: 0;
  }
  .step-col {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .step {
    width: 22px;
    height: 22px;
    background: var(--cell-off);
    border: 1px solid var(--cell-border);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--text);
    transition: background 60ms;
    position: relative;
  }
  .step.beat { border-color: #8a8a88; }
  .step.on { background: var(--cell-on); color: var(--bg); border-color: var(--cell-on); }
  .step.cursor { outline: 1px solid var(--accent); outline-offset: 2px; }
  .step:hover { border-color: var(--accent); }
  .step.slide::after {
    content: '';
    position: absolute;
    right: 1px; bottom: 1px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--bg);
  }
  .step:not(.on).slide::after { background: var(--text); }

  .lane-cell {
    width: 22px;
    height: 14px;
    border: 1px solid var(--cell-border);
    position: relative;
    cursor: ns-resize;
    background: transparent;
  }
  .lane-cell .bar {
    position: absolute;
    background: var(--text);
    left: 0; width: 100%;
  }
  .lane-cell.vel .bar { bottom: 0; }
  .track:not(.expanded) .lane-cell { display: none; }

  .step-mini {
    display: flex;
    gap: 1px;
    height: 12px;
  }
  .step-mini button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 9px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    user-select: none;
  }
  .step-mini button:hover { border-color: var(--text); }
  .step-mini button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .track:not(.expanded) .step-mini { display: none; }

  .track-knobs {
    grid-column: 2;
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    padding-top: 4px;
    border-top: 1px dashed var(--line);
  }
  .track.expanded .track-knobs { display: flex; }
  .knob { display: flex; align-items: center; gap: 5px; }
  .knob label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .knob input[type="range"] { width: 60px; accent-color: var(--text); height: 12px; }
  .knob input[type="number"] {
    width: 42px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    text-align: right;
    padding: 0;
  }
  .knob select {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    padding: 0;
    cursor: pointer;
  }
  .knob input:focus, .knob select:focus { outline: none; border-bottom-color: var(--text); }
  .knob .v {
    font-size: 9px;
    color: var(--muted);
    min-width: 28px;
    text-align: right;
  }
  .group {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 3px;
    padding: 3px 8px;
    border-left: 1px solid var(--line);
  }
  .group:first-child { border-left: none; padding-left: 0; }
  .group .label {
    font-size: 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    cursor: pointer;
    user-select: none;
  }
  .group .label::before {
    content: '▸ ';
    font-size: 8px;
    opacity: 0.65;
  }
  .group:not(.collapsed) .label::before { content: '▾ '; }
  .group.collapsed .group-row { display: none; }
  .group-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toggle.pending {
    outline: 1px dashed var(--accent);
    outline-offset: 1px;
  }
  .group.eq-band { gap: 4px; padding: 3px 6px; }
  .group.eq-band .group-row { flex-direction: column; align-items: stretch; }
  .group.eq-band .knob { flex-direction: column; align-items: stretch; gap: 2px; }
  .group.eq-band .knob input[type="range"] { width: 50px; }
  .eq-head { display: flex; justify-content: center; }
  .toggle.eq-on { width: 18px; height: 14px; font-size: 9px; }

  /* ---- side ---- */
  .side { display: flex; flex-direction: column; gap: 22px; }
  .side .module h2 { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .side .row {
    display: grid;
    grid-template-columns: 56px 1fr 34px;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 10px;
  }
  .side .row label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .side .row input[type="range"] { width: 100%; accent-color: var(--text); height: 12px; }
  .side .row .v { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .side .row select {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 2px 0;
    width: 100%;
    cursor: pointer;
  }
  .side .row select:focus { outline: none; border-bottom-color: var(--text); }
  .side .row.wide { grid-template-columns: 56px 1fr; }
  .sync-ctrls { display: flex; gap: 6px; align-items: center; }
  .sync-ctrls select {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 1px 0;
    cursor: pointer;
  }
  .sync-ctrls select:disabled { color: var(--muted); cursor: not-allowed; }
  .mini-toggle {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .mini-toggle:hover { border-color: var(--text); }
  .mini-toggle.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .hint {
    font-size: 9px;
    color: var(--muted);
    margin-left: 6px;
  }

  /* ---- mute/solo ---- */
  .track-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding-top: 2px;
    min-width: 0;
    overflow: hidden;
  }
  .toggles { display: flex; gap: 2px; flex-wrap: wrap; }
  .toggle {
    width: 16px; height: 16px;
    border: 1px solid var(--cell-border);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 9px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    user-select: none;
  }
  .toggle:hover { border-color: var(--text); }
  .toggle.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .mic-control {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 0;
  }
  .mic-control button {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .mic-control button:hover { border-color: var(--text); }
  .mic-control button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .mic-control .status { font-size: 10px; color: var(--muted); }
  button.mic-btn {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button.mic-btn:hover { border-color: var(--text); }
  button.mic-btn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  button.mic-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.mic-btn:disabled:hover { border-color: var(--cell-border); }
  select.preset-select {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 4px 6px;
    max-width: 140px;
    cursor: pointer;
  }
  select.preset-select:focus { outline: none; border-color: var(--text); }
  .sample-status { font-size: 10px; color: var(--muted); padding-left: 4px; }
  .grain-wave, .mic-scope {
    border: 1px solid var(--cell-border);
    background: transparent;
    display: block;
    max-width: 100%;
    width: 100%;
  }
  .grain-wave { height: 50px; }
  .mic-scope  { height: 38px; }
  .sample-area { display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
  .mic-control select.mic-device {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 4px 6px;
    max-width: 200px;
    cursor: pointer;
  }
  .mic-control .level {
    width: 110px; height: 6px;
    border: 1px solid var(--cell-border);
    position: relative;
  }
  .mic-control .level-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--text);
    width: 0%;
    transition: width 60ms linear;
  }

  /* ---- mixer / decks (locked to bottom, Effects tab only) ---- */
  .mixer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 10px 20px;
    z-index: 10;
    margin: 0;
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }
  body.mode-effects .mixer { display: block; }
  .mixer h2 { margin-bottom: 10px; }
  .mixer.collapsed { padding: 6px 20px; max-height: none; overflow: visible; }
  .mixer.collapsed > *:not(h2) { display: none; }
  body { padding-bottom: 24px; }
  body.mode-effects { padding-bottom: 240px; }
  body.mode-effects.mixer-collapsed { padding-bottom: 40px; }
  body.mode-mixing { padding-bottom: 0 !important; }

  /* collapsible modules */
  .module.collapsed > *:not(h2) { display: none; }
  .collapse-chev {
    display: inline-block;
    width: 12px;
    color: var(--muted);
    font-size: 10px;
    margin-right: 4px;
  }
  .module h2, .mixer h2 { user-select: none; cursor: pointer; }
  .decks-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px;
    align-items: start;
  }
  .mixer-deck { display: flex; flex-direction: column; gap: 10px; }
  .deck-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 500;
  }
  .deck-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .deck-knobs { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .mixer-xfade {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; min-width: 160px;
  }
  .mixer-xfade input[type="range"] {
    width: 160px; accent-color: var(--text);
  }
  .xfade-label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  /* ---- responsive ---- */
  @media (max-width: 1024px) {
    body { padding: 14px 14px 220px; }
    .layout { gap: 18px; }
  }
  @media (max-width: 720px) {
    body { padding: 12px 10px 12px; }
    body.mode-effects { padding-bottom: 60vh; }
    body.mode-effects.mixer-collapsed { padding-bottom: 40px; }
    .decks-grid { grid-template-columns: 1fr; }
    .mixer-xfade { width: 100%; min-width: 0; }
    .mixer-xfade input[type="range"] { width: 100%; }
    .knob input[type="range"] { width: 80px; }
    h1.title svg { height: 20px; }
    .transport { gap: 8px; flex-wrap: wrap; row-gap: 6px; }
    .add-row { gap: 6px; flex-wrap: wrap; row-gap: 6px; }
    .mixer { max-height: 50vh; }
    body.mode-mixing #tracks { gap: 8px; }

<script>
  const bpmInput = document.getElementById('bpm');
  const playBtn  = document.getElementById('play');
  const tracksEl = document.getElementById('tracks');

  let projectDir = null;

  async function pickProjectDir() {
    if (!window.showDirectoryPicker) {
      alert('Selecting a project folder requires Chrome or Edge. Samples will be downloaded individually.');
      return false;
    }
    try {
      const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
      projectDir = dir;
      await projectDir.getDirectoryHandle('samples', { create: true });
      await projectDir.getDirectoryHandle('exports', { create: true });
      updateFolderIndicator();
      return true;
    } catch (e) { return false; }
  }
  function updateFolderIndicator() {
    const el = document.getElementById('folder-name');
    if (el) el.textContent = projectDir ? projectDir.name : 'no folder';
  }
  async function writeToSubfolder(sub, filename, blobOrText) {
    if (!projectDir) return false;
    try {
      const dir = await projectDir.getDirectoryHandle(sub, { create: true });
      const fh = await dir.getFileHandle(filename, { create: true });
      const w = await fh.createWritable();
      await w.write(blobOrText);
      await w.close();
      return true;
    } catch (e) { console.warn('Could not write', sub, filename, e); return false; }
  }
  async function readSampleFromFolder(filename) {
    if (!projectDir) return null;
    try {
      const dir = await projectDir.getDirectoryHandle('samples');
      const fh = await dir.getFileHandle(filename);
      const file = await fh.getFile();
      return await file.arrayBuffer();
    } catch (e) { console.warn('Sample not found:', filename, e); return null; }
  }

  let audioCtx = null, isPlaying = false;
  let globalStep = 0, nextNoteTime = 0;
  let schedulerTimer = null;
  const LOOKAHEAD = 25, SCHEDULE_AHEAD = 0.1;

  // ---------- helpers ----------
  let noiseBuffer = null;
  function getNoise(ctx) {
    if (noiseBuffer) return noiseBuffer;
    const len = ctx.sampleRate * 2;
    noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuffer;
  }
  const semi        = n => Math.pow(2, n / 12);
  const midiToFreq  = m => 440 * Math.pow(2, (m - 69) / 12);
  const clamp       = (x, a, b) => Math.max(a, Math.min(b, x));

  function makePulseWave(ctx, pw) {
    const n = 64;
    const real = new Float32Array(n);
    const imag = new Float32Array(n);
    const d = Math.max(0.02, Math.min(0.98, pw));
    for (let k = 1; k < n; k++) {
      imag[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * d);
    }
    return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
  }
  function createOsc(ctx, wave, pw) {
    const o = ctx.createOscillator();
    if (wave === 'pulse') o.setPeriodicWave(makePulseWave(ctx, pw));
    else o.type = wave;
    return o;
  }
  function applyOscFreq(osc, target, t, slideFrom) {
    if (slideFrom && Math.abs(slideFrom - target) > 0.5) {
      osc.frequency.setValueAtTime(slideFrom, t);
      osc.frequency.exponentialRampToValueAtTime(target, t + 0.06);
    } else {
      osc.frequency.value = target;
    }
  }

  // ---------- drum voices (signature: ctx, t, out, track, step, env) ----------
  function vKick(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150 * m, t);
    o.frequency.exponentialRampToValueAtTime(40 * m, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.4);
  }
  function vHatClosed(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 8000*m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    s.connect(hp).connect(g).connect(out); s.start(t); s.stop(t + 0.06);
  }
  function vHatOpen(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 7000*m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.45, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    s.connect(hp).connect(g).connect(out); s.start(t); s.stop(t + 0.4);
  }
  function vSnare(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 1200*m;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(0.6, t + 0.001);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    s.connect(hp).connect(ng).connect(out); s.start(t); s.stop(t + 0.2);
    const o = ctx.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(220*m, t);
    o.frequency.exponentialRampToValueAtTime(170*m, t + 0.08);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(og).connect(out); o.start(t); o.stop(t + 0.15);
  }
  function vClap(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const burst = (t0, dur, peak) => {
      const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
      const bp = ctx.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value = 1100*m; bp.Q.value = 1.5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.001);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(bp).connect(g).connect(out); s.start(t0); s.stop(t0 + dur + 0.05);
    };
    burst(t,         0.015, 0.55);
    burst(t + 0.012, 0.015, 0.55);
    burst(t + 0.024, 0.015, 0.55);
    burst(t + 0.04,  0.18,  0.35);
  }
  function vRide(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const bp = ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 3500*m; bp.Q.value = 1.2;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 2500*m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
    s.connect(hp).connect(bp).connect(g).connect(out); s.start(t); s.stop(t + 0.85);
  }
  function vCrash(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const s = ctx.createBufferSource(); s.buffer = getNoise(ctx);
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 5000*m;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    s.connect(hp).connect(g).connect(out); s.start(t); s.stop(t + 1.6);

  function makeTom(base) {

      const m = semi(tr.tune);
      const o = ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(base*1.6*m, t);
      o.frequency.exponentialRampToValueAtTime(base*m, t + 0.2);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.8, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);

  function vClave(ctx, t, out, tr) {
    const m = semi(tr.tune);
    const o = ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(2500*m, t);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.7, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.06);
  }

  // ---------- bass ----------
  function vBass(ctx, t, out, tr, step, env) {
    const offset  = step.pitch || 0;
    const target  = midiToFreq(tr.root + offset);
    const slide   = env && env.prevSlide && env.prevFreq;
    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const holdEnd = t + stepDur * stepLen;
    const off     = holdEnd + Math.max(tr.release, tr.fDecay) + 0.15;

    const sub = ctx.createOscillator(); sub.type = 'sine';
    const sin = ctx.createOscillator(); sin.type = 'sine';
    const saw = ctx.createOscillator(); saw.type = tr.wave;

    applyOscFreq(sub, target / 2, t, slide ? env.prevFreq / 2 : null);
    applyOscFreq(sin, target,     t, slide ? env.prevFreq     : null);
    applyOscFreq(saw, target,     t, slide ? env.prevFreq     : null);

    const subG = ctx.createGain(); subG.gain.value = tr.subLevel;
    const sinG = ctx.createGain(); sinG.gain.value = tr.sinLevel;
    const sawG = ctx.createGain(); sawG.gain.value = tr.sawLevel;
    const mix  = ctx.createGain(); mix.gain.value = 0.7;
    sub.connect(subG).connect(mix);
    sin.connect(sinG).connect(mix);
    saw.connect(sawG).connect(mix);

    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.Q.value = tr.reso;
    const peak = Math.min(18000, tr.cutoff * (1 + tr.env * 12));
    f.frequency.setValueAtTime(peak, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, tr.cutoff), t + tr.fDecay);

    // amp ADSR
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + tr.attack);
    g.gain.linearRampToValueAtTime(Math.max(0.0001, tr.sustain), t + tr.attack + tr.decay);
    g.gain.setValueAtTime(Math.max(0.0001, tr.sustain), holdEnd);
    g.gain.linearRampToValueAtTime(0.0001, holdEnd + tr.release);

    const anyLFO = tr.lfoCut > 0 || tr.lfoRes > 0 || tr.lfoPitch > 0 || tr.lfoAmp > 0 || tr.lfoEnv > 0;
    let lfo = null;
    if (anyLFO) {
      lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
    }

    if (anyLFO && tr.lfoAmp > 0) {
      const dc = ctx.createConstantSource(); dc.offset.value = 1;
      const trem = ctx.createGain(); trem.gain.value = 1;
      const ag = ctx.createGain(); ag.gain.value = tr.lfoAmp * 0.9;
      lfo.connect(ag).connect(trem.gain);
      dc.connect(trem.gain);
      dc.start(t); dc.stop(off);
      mix.connect(trem).connect(f).connect(g).connect(out);
    } else {
      mix.connect(f).connect(g).connect(out);
    }

    if (anyLFO) {
      if (tr.lfoCut > 0) {
        const cg = ctx.createGain(); cg.gain.value = tr.lfoCut * 3000;
        lfo.connect(cg).connect(f.frequency);
      }
      if (tr.lfoEnv > 0) {
        const pk = Math.min(18000, tr.cutoff * (1 + tr.env * 12));
        const eg = ctx.createGain(); eg.gain.value = tr.lfoEnv * (pk - tr.cutoff) * 0.6;
        lfo.connect(eg).connect(f.frequency);
      }
      if (tr.lfoRes > 0) {
        const rg = ctx.createGain(); rg.gain.value = tr.lfoRes * 12;
        lfo.connect(rg).connect(f.Q);
      }
      if (tr.lfoPitch > 0) {
        const pg = ctx.createGain(); pg.gain.value = tr.lfoPitch * 100;
        lfo.connect(pg);
        pg.connect(sub.detune); pg.connect(sin.detune); pg.connect(saw.detune);
      }
    }

    sub.start(t); sub.stop(off);
    sin.start(t); sin.stop(off);
    saw.start(t); saw.stop(off);
  }

  // ---------- chord ----------
  const SCALES = {
    major:      [0, 2, 4, 5, 7, 9, 11],
    minor:      [0, 2, 3, 5, 7, 8, 10],
    dorian:     [0, 2, 3, 5, 7, 9, 10],
    phrygian:   [0, 1, 3, 5, 7, 8, 10],
    lydian:     [0, 2, 4, 6, 7, 9, 11],
    mixolydian: [0, 2, 4, 5, 7, 9, 10],
    locrian:    [0, 1, 3, 5, 6, 8, 10],
  };
  const CHORD_QUALITIES = ['auto','M','m','dim','aug','M7','m7','7','sus4','sus2'];
  const QUALITY_LABELS = {
    auto:'·', M:'M', m:'m', dim:'d', aug:'a', M7:'M7', m7:'m7', '7':'7', sus4:'s4', sus2:'s2'
  };
  const QUALITY_INTERVALS = {
    M:    [0, 4, 7],
    m:    [0, 3, 7],
    dim:  [0, 3, 6],
    aug:  [0, 4, 8],
    M7:   [0, 4, 7, 11],
    m7:   [0, 3, 7, 10],
    '7':  [0, 4, 7, 10],
    sus4: [0, 5, 7],
    sus2: [0, 2, 7],
  };
  function chordNotesFor(tr, step) {
    const scale = SCALES[tr.scale];
    const get = (i) => {
      const oct = Math.floor(i / 7);
      return scale[((i % 7) + 7) % 7] + oct * 12;
    };
    const baseOff = get(step.degree | 0);
    const q = step.quality || 'auto';
    let intervals;
    if (q === 'auto') {
      intervals = [0, get(step.degree + 2) - baseOff, get(step.degree + 4) - baseOff];
      if (tr.seventh) intervals.push(get(step.degree + 6) - baseOff);
      if (tr.ninth)   intervals.push(get(step.degree + 8) - baseOff);
    } else {
      intervals = QUALITY_INTERVALS[q].slice();
      if (tr.ninth) intervals.push(14);
    }
    return intervals.map(iv => tr.root + baseOff + iv);
  }
  function vChord(ctx, t, out, tr, step, env) {
    const midiNotes = chordNotesFor(tr, step);
    const stepDur   = env.stepDur;
    const stepLen   = (step && step.length != null) ? step.length : 1.0;
    const holdEnd   = t + stepDur * tr.lengthSteps * stepLen;
    const off       = holdEnd + Math.max(tr.release, tr.fRelease) + 0.15;

    // 24dB/oct lowpass = two cascaded biquads
    const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.Q.value = tr.reso;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = tr.reso * 0.6;

    const baseCut = tr.cutoff;
    const peakCut = Math.min(18000, baseCut * (1 + tr.fEnvAmt * 10));
    const sustCut = baseCut + (peakCut - baseCut) * tr.fSustain;
    [f1, f2].forEach(f => {
      f.frequency.setValueAtTime(baseCut, t);
      f.frequency.linearRampToValueAtTime(peakCut, t + tr.fAttack);
      f.frequency.linearRampToValueAtTime(sustCut, t + tr.fAttack + tr.fDecay);
      f.frequency.setValueAtTime(sustCut, holdEnd);
      f.frequency.linearRampToValueAtTime(baseCut, holdEnd + tr.fRelease);
    });

    const mix = ctx.createGain();
    mix.gain.value = 1 / Math.max(2, midiNotes.length);

    const allOscs = [];
    midiNotes.forEach((midi, i) => {
      const baseF = midiToFreq(midi);
      const center = (i - (midiNotes.length - 1) / 2);

      const oa = createOsc(ctx, tr.waveA, tr.pwA);
      oa.frequency.value = baseF * Math.pow(2, tr.octA / 12) * semi(tr.tuneA / 100);
      oa.detune.value = center * 4;
      const oaG = ctx.createGain(); oaG.gain.value = (1 - tr.mix);
      oa.connect(oaG).connect(mix);
      oa.start(t); oa.stop(off);

      const ob = createOsc(ctx, tr.waveB, tr.pwB);
      ob.frequency.value = baseF * Math.pow(2, tr.octB / 12) * semi(tr.tuneB / 100);
      ob.detune.value = tr.detuneB + center * 4;
      const obG = ctx.createGain(); obG.gain.value = tr.mix;
      ob.connect(obG).connect(mix);
      ob.start(t); ob.stop(off);

      allOscs.push(oa, ob);
    });

    if (tr.noise > 0) {
      const ns = ctx.createBufferSource(); ns.buffer = getNoise(ctx);
      const nsG = ctx.createGain(); nsG.gain.value = tr.noise * 0.3;
      ns.connect(nsG).connect(mix);
      ns.start(t); ns.stop(off);
    }

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.linearRampToValueAtTime(1, t + tr.attack);
    amp.gain.linearRampToValueAtTime(tr.sustain, t + tr.attack + tr.decay);
    amp.gain.setValueAtTime(tr.sustain, holdEnd);
    amp.gain.linearRampToValueAtTime(0.0001, holdEnd + tr.release);

    const panner = ctx.createStereoPanner();
    panner.pan.value = 0;

    const anyLFO = tr.lfoCut > 0 || tr.lfoRes > 0 || tr.lfoPit > 0 || tr.lfoAmp > 0 || tr.lfoPan > 0;
    let lfo = null;
    if (anyLFO) {
      lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
    }

    let postFilter = f2;
    if (anyLFO && tr.lfoAmp > 0) {
      const dc = ctx.createConstantSource(); dc.offset.value = 1;
      const trem = ctx.createGain(); trem.gain.value = 1;
      const ag = ctx.createGain(); ag.gain.value = tr.lfoAmp * 0.9;
      lfo.connect(ag).connect(trem.gain);
      dc.connect(trem.gain);
      dc.start(t); dc.stop(off);
      f2.connect(trem);
      postFilter = trem;
    }
    mix.connect(f1).connect(f2);
    postFilter.connect(amp).connect(panner).connect(out);

    if (anyLFO) {
      if (tr.lfoCut > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoCut * 3000;
        lfo.connect(g);
        g.connect(f1.frequency); g.connect(f2.frequency);
      }
      if (tr.lfoRes > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoRes * 10;
        lfo.connect(g);
        g.connect(f1.Q); g.connect(f2.Q);
      }
      if (tr.lfoPit > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPit * 100;
        lfo.connect(g);
        allOscs.forEach(o => g.connect(o.detune));
      }
      if (tr.lfoPan > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPan;
        lfo.connect(g).connect(panner.pan);
      }
    }
  }

  // ---------- lead (monophonic Prophet-style) ----------
  function vLead(ctx, t, out, tr, step, env) {
    const offset  = step.pitch || 0;
    const target  = midiToFreq(tr.root + offset);

    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;

    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = tr.reso * 0.6;
    const baseCut = tr.cutoff;
    const peakCut = Math.min(18000, baseCut * (1 + tr.fEnvAmt * 10));
    const sustCut = baseCut + (peakCut - baseCut) * tr.fSustain;
    [f1, f2].forEach(f => {
      f.frequency.setValueAtTime(baseCut, t);
      f.frequency.linearRampToValueAtTime(peakCut, t + tr.fAttack);
      f.frequency.linearRampToValueAtTime(sustCut, t + tr.fAttack + tr.fDecay);
      f.frequency.setValueAtTime(sustCut, holdEnd);
      f.frequency.linearRampToValueAtTime(baseCut, holdEnd + tr.fRelease);
    });

    const prevFA = slide ? env.prevFreq * Math.pow(2, tr.octA / 12) * semi(tr.tuneA / 100) : null;
    const prevFB = slide ? env.prevFreq * Math.pow(2, tr.octB / 12) * semi(tr.tuneB / 100) : null;

    const oa = createOsc(ctx, tr.waveA, tr.pwA);
    applyOscFreq(oa, fA, t, prevFA);
    const oaG = ctx.createGain(); oaG.gain.value = (1 - tr.mix);
    oa.connect(oaG).connect(mix);

    const ob = createOsc(ctx, tr.waveB, tr.pwB);
    applyOscFreq(ob, fB, t, prevFB);
    ob.detune.value = tr.detuneB;
    const obG = ctx.createGain(); obG.gain.value = tr.mix;
    ob.connect(obG).connect(mix);

    oa.start(t); oa.stop(off);
    ob.start(t); ob.stop(off);
    const allOscs = [oa, ob];

    if (tr.noise > 0) {
      const ns = ctx.createBufferSource(); ns.buffer = getNoise(ctx);
      const nsG = ctx.createGain(); nsG.gain.value = tr.noise * 0.3;
      ns.connect(nsG).connect(mix);
      ns.start(t); ns.stop(off);
    }

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.linearRampToValueAtTime(1, t + tr.attack);
    amp.gain.linearRampToValueAtTime(tr.sustain, t + tr.attack + tr.decay);
    amp.gain.setValueAtTime(tr.sustain, holdEnd);
    amp.gain.linearRampToValueAtTime(0.0001, holdEnd + tr.release);

    const panner = ctx.createStereoPanner(); panner.pan.value = 0;

    const anyLFO = tr.lfoCut > 0 || tr.lfoRes > 0 || tr.lfoPit > 0 || tr.lfoAmp > 0 || tr.lfoPan > 0;
    let lfo = null;
    if (anyLFO) {
      lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
    }

    let postFilter = f2;
    if (anyLFO && tr.lfoAmp > 0) {
      const dc = ctx.createConstantSource(); dc.offset.value = 1;
      const trem = ctx.createGain(); trem.gain.value = 1;
      const ag = ctx.createGain(); ag.gain.value = tr.lfoAmp * 0.9;
      lfo.connect(ag).connect(trem.gain);
      dc.connect(trem.gain);
      dc.start(t); dc.stop(off);
      f2.connect(trem);
      postFilter = trem;
    }
    mix.connect(f1).connect(f2);
    postFilter.connect(amp).connect(panner).connect(out);

    if (anyLFO) {
      if (tr.lfoCut > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoCut * 3000;
        lfo.connect(g);
        g.connect(f1.frequency); g.connect(f2.frequency);
      }
      if (tr.lfoRes > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoRes * 10;
        lfo.connect(g);
        g.connect(f1.Q); g.connect(f2.Q);
      }
      if (tr.lfoPit > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPit * 100;
        lfo.connect(g);
        allOscs.forEach(o => g.connect(o.detune));
      }
      if (tr.lfoPan > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPan;
        lfo.connect(g).connect(panner.pan);

    }
  }

  // ---------- mellotron (long sustained note / chord pad) ----------
  const MELLOTRON_VOICINGS = {
    single:      [0],
    octave:      [0, 12],
    fifth:       [0, 7],
    'triad-min': [0, 3, 7],
    'triad-maj': [0, 4, 7],
    sus4:        [0, 5, 7],
    min7:        [0, 3, 7, 10],
    maj7:        [0, 4, 7, 11],
    add9:        [0, 4, 7, 14],
  };
  function vMellotron(ctx, t, out, tr, step, env) {
    const offset = (step && step.pitch) || 0;
    const baseMidi = tr.root + offset;
    const intervals = MELLOTRON_VOICINGS[tr.voicing] || [0];
    const midiNotes = intervals.map(iv => baseMidi + iv);
    const stepDur = env.stepDur;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const holdEnd = t + stepDur * tr.lengthSteps * stepLen;
    const off     = holdEnd + Math.max(tr.release, tr.fRelease) + 0.2;

    // 24 dB lowpass like the chord engine
    const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.Q.value = tr.reso;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = tr.reso * 0.6;
    const baseCut = tr.cutoff;
    const peakCut = Math.min(18000, baseCut * (1 + tr.fEnvAmt * 10));
    const sustCut = baseCut + (peakCut - baseCut) * tr.fSustain;
    [f1, f2].forEach(f => {
      f.frequency.setValueAtTime(baseCut, t);
      f.frequency.linearRampToValueAtTime(peakCut, t + tr.fAttack);
      f.frequency.linearRampToValueAtTime(sustCut, t + tr.fAttack + tr.fDecay);
      f.frequency.setValueAtTime(sustCut, holdEnd);
      f.frequency.linearRampToValueAtTime(baseCut, holdEnd + tr.fRelease);
    });

    const mix = ctx.createGain();
    mix.gain.value = 1 / Math.max(2, midiNotes.length);

    const allOscs = [];
    midiNotes.forEach((midi, i) => {
      const baseF = midiToFreq(midi);
      const center = (i - (midiNotes.length - 1) / 2);
      // small per-voice drift = mellotron-flavour wobble
      const drift = (Math.random() * 6 - 3);

      const oa = createOsc(ctx, tr.waveA, tr.pwA);
      oa.frequency.value = baseF * Math.pow(2, tr.octA / 12) * semi(tr.tuneA / 100);
      oa.detune.value = center * 6 + drift;
      const oaG = ctx.createGain(); oaG.gain.value = (1 - tr.mix);
      oa.connect(oaG).connect(mix);

      const ob = createOsc(ctx, tr.waveB, tr.pwB);
      ob.frequency.value = baseF * Math.pow(2, tr.octB / 12) * semi(tr.tuneB / 100);
      ob.detune.value = tr.detuneB + center * 6 + drift * -1;
      const obG = ctx.createGain(); obG.gain.value = tr.mix;
      ob.connect(obG).connect(mix);

      oa.start(t); oa.stop(off);
      ob.start(t); ob.stop(off);
      allOscs.push(oa, ob);
    });

    if (tr.noise > 0) {
      const ns = ctx.createBufferSource(); ns.buffer = getNoise(ctx);
      const nsG = ctx.createGain(); nsG.gain.value = tr.noise * 0.18;
      ns.connect(nsG).connect(mix);
      ns.start(t); ns.stop(off);
    }

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.linearRampToValueAtTime(1, t + tr.attack);
    amp.gain.linearRampToValueAtTime(tr.sustain, t + tr.attack + tr.decay);
    amp.gain.setValueAtTime(tr.sustain, holdEnd);
    amp.gain.linearRampToValueAtTime(0.0001, holdEnd + tr.release);

    const panner = ctx.createStereoPanner();
    panner.pan.value = 0;

    const anyLFO = tr.lfoCut > 0 || tr.lfoRes > 0 || tr.lfoPit > 0 || tr.lfoAmp > 0 || tr.lfoPan > 0;
    let lfo = null;
    if (anyLFO) {
      lfo = ctx.createOscillator();
      lfo.type = tr.lfoShape || 'sine';
      lfo.frequency.value = tr.lfoRate;
      lfo.start(t); lfo.stop(off);
    }

    let postFilter = f2;
    if (anyLFO && tr.lfoAmp > 0) {
      const dc = ctx.createConstantSource(); dc.offset.value = 1;
      const trem = ctx.createGain(); trem.gain.value = 1;
      const ag = ctx.createGain(); ag.gain.value = tr.lfoAmp * 0.9;
      lfo.connect(ag).connect(trem.gain);
      dc.connect(trem.gain);
      dc.start(t); dc.stop(off);
      f2.connect(trem);
      postFilter = trem;
    }
    mix.connect(f1).connect(f2);
    postFilter.connect(amp).connect(panner).connect(out);

    if (anyLFO) {
      if (tr.lfoCut > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoCut * 3000;
        lfo.connect(g);
        g.connect(f1.frequency); g.connect(f2.frequency);
      }
      if (tr.lfoRes > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoRes * 10;
        lfo.connect(g);
        g.connect(f1.Q); g.connect(f2.Q);
      }
      if (tr.lfoPit > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPit * 100;
        lfo.connect(g);
        allOscs.forEach(o => g.connect(o.detune));
      }
      if (tr.lfoPan > 0) {
        const g = ctx.createGain(); g.gain.value = tr.lfoPan;
        lfo.connect(g).connect(panner.pan);
      }
    }
  }

  // ---------- granular (sample player) ----------
  function computeGranularLFO(track, time) {
    const phase = ((time * (track.lfoRate || 0)) % 1 + 1) % 1;
    const shape = track.lfoShape || 'sine';
    switch (shape) {
      case 'sine':     return Math.sin(phase * 2 * Math.PI);
      case 'triangle': return phase < 0.5 ? (phase * 4 - 1) : (3 - phase * 4);
      case 'sawtooth': return phase * 2 - 1;
      case 'square':   return phase < 0.5 ? -1 : 1;
      case 'random':   return Math.random() * 2 - 1;
      default:         return 0;
    }
  }
  function vGranular(ctx, t, out, tr, step) {
    if (!tr.buffer) return;
    const stepPitch = (step && step.pitch) || 0;
    const semis = (tr.pitch || 0) + stepPitch;
    const rate  = Math.pow(2, semis / 12);
    const dur = tr.buffer.duration;
    const truncStartSec = (tr.truncStart || 0) * dur;
    const truncEndSec   = Math.min(dur, (tr.truncEnd ?? 1) * dur);
    const truncDur = Math.max(0.001, truncEndSec - truncStartSec);

    let playFrac = tr.playStart || 0;
    if ((tr.lfoDepth || 0) > 0) {
      const lfo = computeGranularLFO(tr, t);
      playFrac += lfo * tr.lfoDepth * 0.5;
    }
    playFrac = clamp(playFrac, 0, 0.999);
    const playStartSec = truncStartSec + playFrac * truncDur;
    const remainingSec = (truncEndSec - playStartSec) / rate;
    const stepLen = (step && step.length != null) ? step.length : 1.0;
    const requestedLenSec = (tr.length / 1000) * stepLen;
    // when looping, len can exceed remaining (it wraps within trunc region)
    const lenSec = tr.loop ? requestedLenSec : Math.min(requestedLenSec, remainingSec);
    if (lenSec <= 0.001) return;

    const src = ctx.createBufferSource();
    src.buffer = tr.buffer;
    src.playbackRate.value = rate;
    if (tr.loop) {
      src.loop = true;
      src.loopStart = truncStartSec;
      src.loopEnd   = truncEndSec;
    }

    const g = ctx.createGain();
    const att = Math.min(tr.attack, lenSec * 0.3);
    const rel = Math.min(tr.release, lenSec * 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(1, t + att);
    g.gain.setValueAtTime(1, t + lenSec - rel);
    g.gain.linearRampToValueAtTime(0.0001, t + lenSec);

    src.connect(g).connect(out);
    if (tr.loop) {
      src.start(t, playStartSec);
    } else {
      src.start(t, playStartSec, lenSec * rate);
    }
    src.stop(t + lenSec + 0.05);
  }

  async function enableGranularListen(track, listenBtn, recBtn, statusEl) {
    if (track.stream) return;
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      track.stream = stream;
      track.micSource = audioCtx.createMediaStreamSource(stream);
      track.micSource.connect(track.input);
      listenBtn.textContent = '■ Stop Listen';
      listenBtn.classList.add('on');
      statusEl.textContent = 'listening — press Rec to capture';
      recBtn.disabled = false;
    } catch (e) {
      statusEl.textContent = 'mic denied';
    }
  }
  async function enableGranularListenTab(track, listenBtn, recBtn, statusEl) {
    if (track.stream) return;
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (!navigator.mediaDevices.getDisplayMedia) {
      statusEl.textContent = 'tab capture unsupported';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      stream.getVideoTracks().forEach(v => { try { v.stop(); } catch(e){} stream.removeTrack(v); });
      if (stream.getAudioTracks().length === 0) {
        statusEl.textContent = 'no audio in shared tab';
        return;
      }
      track.stream = stream;
      track.micSource = audioCtx.createMediaStreamSource(stream);
      track.micSource.connect(track.input);
      listenBtn.textContent = '■ Stop Tab';
      listenBtn.classList.add('on');
      statusEl.textContent = 'listening to tab — Rec to capture';
      recBtn.disabled = false;
    } catch (e) {
      statusEl.textContent = 'tab capture denied';
    }
  }
  function disableGranularListen(track, listenBtn, recBtn, statusEl) {
    if (track.recorder && track.recorder.state === 'recording') {
      try { track.recorder.stop(); } catch (e) {}
    }
    if (track.micSource) { try { track.micSource.disconnect(); } catch (e) {} track.micSource = null; }
    if (track.stream)    { try { track.stream.getTracks().forEach(s => s.stop()); } catch (e) {} track.stream = null; }
    listenBtn.textContent = '🎤 Listen';
    listenBtn.classList.remove('on');
    recBtn.disabled = true;
    statusEl.textContent = track.buffer ? track.buffer.duration.toFixed(2) + 's loaded' : 'no sample';
  }
  function pickGranularMime() {
    if (!window.MediaRecorder) return '';
    const cands = ['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/ogg;codecs=opus'];
    return cands.find(c => MediaRecorder.isTypeSupported(c)) || '';
  }
  async function startGranularRecord(track, recBtn, statusEl) {
    if (!track.stream) {
      statusEl.textContent = 'enable Listen first';
      return;
    }
    if (!window.MediaRecorder) {
      statusEl.textContent = 'MediaRecorder unsupported';
      return;
    }
    if (!track.stream.getAudioTracks || track.stream.getAudioTracks().length === 0) {
      statusEl.textContent = 'stream has no audio track';
      return;
    }
    let recorder;
    const mime = pickGranularMime();
    try {
      recorder = mime
        ? new MediaRecorder(track.stream, { mimeType: mime })
        : new MediaRecorder(track.stream);
    } catch (e) {
      console.error('MediaRecorder construction failed', e);
      statusEl.textContent = 'recorder error: ' + (e.message || e.name);
      return;
    }
    const chunks = [];
    const ext = mime.includes('mp4') ? 'm4a' : (mime.includes('ogg') ? 'ogg' : 'webm');
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onerror = (e) => {
      console.error('MediaRecorder error:', e);
      statusEl.textContent = 'recorder error: ' + (e.error && e.error.message);
    };
    recorder.onstop = async () => {
      try {
        if (chunks.length === 0) throw new Error('no audio data captured');
        const blob = new Blob(chunks, { type: recorder.mimeType || mime || 'audio/webm' });
        const ab   = await blob.arrayBuffer();
        track.buffer = await audioCtx.decodeAudioData(ab);
        statusEl.textContent = track.buffer.duration.toFixed(2) + 's loaded';
        if (track._refreshWave) track._refreshWave();
        if (projectDir) {
          const filename = `sample-${track.id}-${Date.now()}.${ext}`;
          const ok = await writeToSubfolder('samples', filename, blob);
          if (ok) {
            track.sampleFile = filename;
            statusEl.textContent += ' → samples/' + filename;
          }
        }
      } catch (e) {
        console.error('granular decode/save failed', e);
        statusEl.textContent = 'failed: ' + (e.message || e.name || 'unknown');
      }
      recBtn.textContent = '● Rec';
      recBtn.classList.remove('on');
      track.recorder = null;
    };
    try {
      recorder.start();
    } catch (e) {
      console.error('recorder.start failed', e);
      statusEl.textContent = 'start failed: ' + (e.message || e.name);
      return;
    }
    track.recorder = recorder;
    recBtn.textContent = '■ Stop Rec';
    recBtn.classList.add('on');
    statusEl.textContent = 'recording…';
  }
  function stopGranularRecord(track) {
    if (track.recorder && track.recorder.state === 'recording') track.recorder.stop();
  }
  function loadGranularFile(track, statusEl) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'audio/*';
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      statusEl.textContent = 'loading…';
      try {
        initAudio();
        const ab = await file.arrayBuffer();
        track.buffer = await audioCtx.decodeAudioData(ab);
        statusEl.textContent = file.name + ' (' + track.buffer.duration.toFixed(2) + 's)';
        if (track._refreshWave) track._refreshWave();
      } catch (e) { statusEl.textContent = 'load failed'; }
    });
    input.click();
  }

          .connect(tapeFilterHP).connect(tapeFilterLP)

    // noise sources, summed into wet
    tapeHissSource = audioCtx.createBufferSource();
    tapeHissSource.buffer = getNoise(audioCtx);
    tapeHissSource.loop = true;
    tapeHissHP   = audioCtx.createBiquadFilter(); tapeHissHP.type='highpass'; tapeHissHP.frequency.value = 5000;
    tapeHissGain = audioCtx.createGain(); tapeHissGain.gain.value = tapeCfg.hiss * 0.04;
    tapeHissSource.connect(tapeHissHP).connect(tapeHissGain).connect(tapeWet);
    tapeHissSource.start();

    tapeCrackleSource = audioCtx.createBufferSource();
    tapeCrackleSource.buffer = makeCrackleBuffer(audioCtx);
    tapeCrackleSource.loop = true;
    tapeCrackleGain = audioCtx.createGain(); tapeCrackleGain.gain.value = tapeCfg.crackle * 0.3;
    tapeCrackleSource.connect(tapeCrackleGain).connect(tapeWet);
    tapeCrackleSource.start();

    tapeWet.connect(tapeOut);

    // Insert filters (LP + HP) sit just before the brick-wall limiter.
    masterLP = audioCtx.createBiquadFilter(); masterLP.type = 'lowpass';
    masterLP.frequency.value = lpfCfg.freq; masterLP.Q.value = lpfCfg.q;
    masterHP = audioCtx.createBiquadFilter(); masterHP.type = 'highpass';
    masterHP.frequency.value = hpfCfg.freq; masterHP.Q.value = hpfCfg.q;

    masterOut  = audioCtx.createGain();         masterOut.gain.value = master.vol;
    masterIn.connect(eqLow).connect(eqMid).connect(eqHigh)
            .connect(warmLow).connect(warmHigh).connect(warmShaper)
            .connect(compressor).connect(tapeIn);
    tapeOut.connect(masterLP).connect(masterHP).connect(masterLimiter)
           .connect(masterOut).connect(audioCtx.destination);

    delayBus  = audioCtx.createGain();
    delayNode = audioCtx.createDelay(2.0); delayNode.delayTime.value = delayCfg.time;
    delayFb   = audioCtx.createGain(); delayFb.gain.value = delayCfg.fb;
    delayWet  = audioCtx.createGain(); delayWet.gain.value = delayCfg.wet;
    delayBus.connect(delayNode);
    delayNode.connect(delayFb).connect(delayNode);
    delayNode.connect(delayWet).connect(masterIn);

    reverbBus  = audioCtx.createGain();
    reverbNode = audioCtx.createConvolver();
    reverbNode.buffer = makeReverbIR(audioCtx, reverbCfg.decay);
    reverbWet  = audioCtx.createGain(); reverbWet.gain.value = reverbCfg.wet;
    reverbBus.connect(reverbNode).connect(reverbWet).connect(masterIn);

    // chorus (stereo)
    chorusBus  = audioCtx.createGain();
    chorusWet  = audioCtx.createGain(); chorusWet.gain.value = chorusCfg.wet;
    chorusDelL = audioCtx.createDelay(0.05); chorusDelL.delayTime.value = 0.02;
    chorusDelR = audioCtx.createDelay(0.05); chorusDelR.delayTime.value = 0.022;
    chorusLfoL = audioCtx.createOscillator(); chorusLfoL.type='sine'; chorusLfoL.frequency.value = chorusCfg.rate;
    chorusLfoR = audioCtx.createOscillator(); chorusLfoR.type='sine'; chorusLfoR.frequency.value = chorusCfg.rate;
    chorusModL = audioCtx.createGain(); chorusModL.gain.value = chorusCfg.depth * 0.008;
    chorusModR = audioCtx.createGain(); chorusModR.gain.value = chorusCfg.depth * 0.008;
    chorusLfoL.connect(chorusModL).connect(chorusDelL.delayTime);
    chorusLfoR.connect(chorusModR).connect(chorusDelR.delayTime);
    const cPanL = audioCtx.createStereoPanner(); cPanL.pan.value = -0.8;
    const cPanR = audioCtx.createStereoPanner(); cPanR.pan.value =  0.8;
    chorusBus.connect(chorusDelL).connect(cPanL).connect(chorusWet);
    chorusBus.connect(chorusDelR).connect(cPanR).connect(chorusWet);
    chorusWet.connect(masterIn);
    chorusLfoL.start(); chorusLfoR.start(audioCtx.currentTime + 0.25 / Math.max(0.1, chorusCfg.rate));

    // flanger (mono w/ feedback)
    flangerBus = audioCtx.createGain();
    flangerWet = audioCtx.createGain(); flangerWet.gain.value = flangerCfg.wet;
    flangerDel = audioCtx.createDelay(0.02); flangerDel.delayTime.value = 0.005;
    flangerFb  = audioCtx.createGain(); flangerFb.gain.value = flangerCfg.fb;
    flangerLfo = audioCtx.createOscillator(); flangerLfo.type='sine'; flangerLfo.frequency.value = flangerCfg.rate;
    flangerMod = audioCtx.createGain(); flangerMod.gain.value = flangerCfg.depth * 0.004;
    flangerLfo.connect(flangerMod).connect(flangerDel.delayTime);
    flangerBus.connect(flangerDel);
    flangerDel.connect(flangerFb).connect(flangerDel);
    flangerDel.connect(flangerWet).connect(masterIn);
    flangerLfo.start();

    // bitcrush (ScriptProcessor)
    bitcrushBus  = audioCtx.createGain();
    bitcrushWet  = audioCtx.createGain(); bitcrushWet.gain.value = bitcrushCfg.wet;
    bitcrushProc = audioCtx.createScriptProcessor(2048, 1, 1);
    bitcrushProc._phase = 0; bitcrushProc._last = 0;
    bitcrushProc.onaudioprocess = (e) => {
      const inb = e.inputBuffer.getChannelData(0);
      const out = e.outputBuffer.getChannelData(0);
      const step = Math.pow(0.5, bitcrushCfg.bits);
      const nf = bitcrushCfg.normFreq;
      let phase = bitcrushProc._phase, last = bitcrushProc._last;
      for (let i = 0; i < inb.length; i++) {
        phase += nf;
        if (phase >= 1) { phase -= 1; last = step * Math.floor(inb[i] / step + 0.5); }
        out[i] = last;
      }
      bitcrushProc._phase = phase; bitcrushProc._last = last;
    };
    bitcrushBus.connect(bitcrushProc).connect(bitcrushWet).connect(masterIn);

    for (const t of tracks) initTrackAudio(t);

    // mixer / decks
    mixerOut = audioCtx.createGain();
    mixerOut.connect(masterIn);
    ['A','B'].forEach(k => {
      const d = decks[k];
      d.gain = audioCtx.createGain();    d.gain.value = d.vol;
      d.eqLow  = audioCtx.createBiquadFilter(); d.eqLow.type ='lowshelf';  d.eqLow.frequency.value  = 250;  d.eqLow.gain.value  = d.low;
      d.eqMid  = audioCtx.createBiquadFilter(); d.eqMid.type ='peaking';   d.eqMid.frequency.value  = 1000; d.eqMid.Q.value = 0.8; d.eqMid.gain.value = d.mid;
      d.eqHigh = audioCtx.createBiquadFilter(); d.eqHigh.type='highshelf'; d.eqHigh.frequency.value = 4000; d.eqHigh.gain.value = d.high;
      d.xfade  = audioCtx.createGain();
      d.gain.connect(d.eqLow).connect(d.eqMid).connect(d.eqHigh).connect(d.xfade).connect(mixerOut);
    });
    applyCrossfade(decks.xfade);
  }

  // ---------- UI helpers ----------
  function el(tag, cls, txt) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined) n.textContent = txt;
    return n;
  }
  function knob(label, min, max, step, val, onChange, fmt) {
    const w = el('div', 'knob');
    w.appendChild(el('label', null, label));
    const r = el('input'); r.type='range'; r.min=min; r.max=max; r.step=step; r.value=val;
    const v = el('span', 'v', fmt(val));
    r.addEventListener('input', () => {
      const x = parseFloat(r.value);
      v.textContent = fmt(x); onChange(x);
    });
    w.appendChild(r); w.appendChild(v); return w;
  }
  function numField(label, min, max, val, onChange) {
    const w = el('div', 'knob');
    w.appendChild(el('label', null, label));
    const n = el('input'); n.type='number'; n.min=min; n.max=max; n.value=val;
    n.addEventListener('change', () => {
      const x = clamp(parseInt(n.value)||val, min, max);
      n.value = x; onChange(x);
    });
    w.appendChild(n); return w;
  }
  function selectField(label, opts, val, onChange) {
    const w = el('div', 'knob');
    w.appendChild(el('label', null, label));
    const s = el('select');
    const fill = (parent, items) => {
      for (const o of items) {
        const op = el('option', null, o); op.value = o;
        if (o === val) op.selected = true;
        parent.appendChild(op);
      }
    };
    if (Array.isArray(opts)) {
      fill(s, opts);
    } else if (opts && typeof opts === 'object') {
      for (const groupName of Object.keys(opts)) {
        const og = document.createElement('optgroup');
        og.label = groupName;
        fill(og, opts[groupName]);
        s.appendChild(og);
      }
    }
    s.addEventListener('change', () => onChange(s.value));
    w.appendChild(s); return w;
  }
  function group(label, ...nodes) {
    const g = el('div', 'group');
    if (label) {
      const lbl = el('span', 'label', label);
      lbl.addEventListener('click', () => g.classList.toggle('collapsed'));
      g.appendChild(lbl);
      g.classList.add('collapsed'); // start collapsed
    }
    const row = el('div', 'group-row');
    nodes.forEach(n => row.appendChild(n));
    g.appendChild(row);
    return g;
  }
  function sideRow(parent, label, min, max, step, val, onChange, fmt) {
    const row = el('div', 'row');
    row.appendChild(el('label', null, label));
    const r = el('input'); r.type='range'; r.min=min; r.max=max; r.step=step; r.value=val;
    const v = el('span', 'v', fmt(val));
    r.addEventListener('input', () => {
      const x = parseFloat(r.value);
      v.textContent = fmt(x); onChange(x);
    });
    row.appendChild(r); row.appendChild(v);
    parent.appendChild(row);
  }

  // ---------- waveform / scope ----------
  function getInkColor() {
    return getComputedStyle(document.body).getPropertyValue('--canvas-ink').trim() || '#111';
  }
  function syncCanvasSize(canvas) {
    const cw = Math.max(40, Math.floor(canvas.clientWidth));
    if (canvas.width !== cw) canvas.width = cw;
  }
  function drawWaveform(canvas, buffer, startNorm, lenSec) {
    syncCanvasSize(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const ink = getInkColor();
    ctx.clearRect(0, 0, w, h);
    if (!buffer) {
      ctx.fillStyle = '#888';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('no sample', w / 2, h / 2);
      return;
    }
    const data = buffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / w));
    const amp = h / 2;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < w; i++) {
      let min = 1.0, max = -1.0;
      const start = i * step;
      const end = Math.min(start + step, data.length);
      for (let j = start; j < end; j++) {
        const v = data[j];
        if (v < min) min = v;
        if (v > max) max = v;
      }
      ctx.moveTo(i, (1 - max) * amp);
      ctx.lineTo(i, (1 - min) * amp);
    }
    ctx.stroke();
    if (typeof startNorm === 'number') {
      const sx = Math.max(0, Math.min(w, startNorm * w));
      ctx.fillStyle = 'rgba(128, 128, 128, 0.28)';
      ctx.fillRect(0, 0, sx, h);
      ctx.strokeStyle = ink;
      ctx.beginPath();
      ctx.moveTo(sx + 0.5, 0); ctx.lineTo(sx + 0.5, h);
      ctx.stroke();
      if (typeof lenSec === 'number') {
        const lenNorm = lenSec / buffer.duration;
        const ex = Math.max(0, Math.min(w, (startNorm + lenNorm) * w));
        ctx.fillStyle = 'rgba(128, 128, 128, 0.28)';
        ctx.fillRect(ex, 0, w - ex, h);
        ctx.beginPath();
        ctx.moveTo(ex + 0.5, 0); ctx.lineTo(ex + 0.5, h);
        ctx.stroke();
      }
    }
  }

  function drawGranularWaveform(canvas, track) {
    syncCanvasSize(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const ink = getInkColor();
    ctx.clearRect(0, 0, w, h);
    const buffer = track.buffer;
    if (!buffer) {
      ctx.fillStyle = '#888';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('no sample — Listen + Rec, or Load a file', w / 2, h / 2);
      return;
    }
    // waveform
    const data = buffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / w));
    const amp = h / 2;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < w; i++) {
      let min = 1.0, max = -1.0;
      const s0 = i * step;
      const e0 = Math.min(s0 + step, data.length);
      for (let j = s0; j < e0; j++) { const v = data[j]; if (v < min) min = v; if (v > max) max = v; }
      ctx.moveTo(i, (1 - max) * amp);
      ctx.lineTo(i, (1 - min) * amp);
    }
    ctx.stroke();
    // truncation greyout
    const truncS = (track.truncStart || 0) * w;
    const truncE = Math.min(w, (track.truncEnd ?? 1) * w);
    ctx.fillStyle = 'rgba(128, 128, 128, 0.55)';
    ctx.fillRect(0, 0, truncS, h);
    ctx.fillRect(truncE, 0, w - truncE, h);
    // trunc boundary
    ctx.strokeStyle = ink;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(truncS + 0.5, 0); ctx.lineTo(truncS + 0.5, h);
    ctx.moveTo(truncE + 0.5, 0); ctx.lineTo(truncE + 0.5, h);
    ctx.stroke();
    ctx.setLineDash([]);
    // play length highlight (within trunc region)
    const truncW = truncE - truncS;
    const playStartX = truncS + (track.playStart || 0) * truncW;
    const playLenPx = ((track.length || 0) / 1000) / buffer.duration * w;
    ctx.fillStyle = 'rgba(80, 80, 80, 0.2)';
    ctx.fillRect(playStartX, 0, Math.min(playLenPx, w - playStartX), h);
    // play start marker
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(playStartX + 0.5, 0); ctx.lineTo(playStartX + 0.5, h);
    ctx.stroke();
    ctx.lineWidth = 1;
    // LFO range bar at bottom
    if ((track.lfoDepth || 0) > 0) {
      const half = (track.lfoDepth || 0) * 0.5;
      const a = Math.max(0, (track.playStart || 0) - half);
      const b = Math.min(1, (track.playStart || 0) + half);
      const ax = truncS + a * truncW;
      const bx = truncS + b * truncW;
      ctx.fillStyle = ink;
      ctx.globalAlpha = 0.45;
      ctx.fillRect(ax, h - 4, bx - ax, 3);
      ctx.globalAlpha = 1;
    }
  }

  function startMicScope(track, canvas) {
    track._scopeStop = false;
    const cctx = canvas.getContext('2d');
    const FPS = 24;
    const minInterval = 1000 / FPS;
    let lastTime = 0;
    let idleDrawn = false;
    let buf = null;
    const draw = (now) => {
      if (track._scopeStop) return;
      if (!document.body.contains(canvas)) { track._scopeStop = true; return; }
      const enabled = !!(track.analyser && track.enabled);
      if (!enabled) {
        if (!idleDrawn) {
          syncCanvasSize(canvas);
          const w = canvas.width, h = canvas.height;
          cctx.clearRect(0, 0, w, h);
          cctx.fillStyle = '#888';
          cctx.font = '10px monospace';
          cctx.textAlign = 'center';
          cctx.textBaseline = 'middle';
          cctx.fillText('mic off', w / 2, h / 2);
          idleDrawn = true;
        }
        // when idle, poll less often (every ~250 ms) to detect enable
        setTimeout(() => { idleDrawn = false; requestAnimationFrame(draw); }, 250);
        return;
      }
      idleDrawn = false;
      if (!buf || buf.length !== track.analyser.fftSize) buf = new Float32Array(track.analyser.fftSize);
      const elapsed = now - lastTime;
      if (elapsed < minInterval) {
        requestAnimationFrame(draw);
        return;
      }
      lastTime = now;
      syncCanvasSize(canvas);
      const w = canvas.width, h = canvas.height;
      const ink = getInkColor();
      cctx.clearRect(0, 0, w, h);
      track.analyser.getFloatTimeDomainData(buf);
      cctx.strokeStyle = ink;
      cctx.lineWidth = 1;
      cctx.beginPath();
      const step = buf.length / w;
      for (let i = 0; i < w; i++) {
        const v = buf[Math.floor(i * step)] || 0;
        const y = (1 - v) * h / 2;
        if (i === 0) cctx.moveTo(i, y);
        else cctx.lineTo(i, y);
      }
      cctx.stroke();
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  }

  // ---------- mic ----------
  async function listMicDevices() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      return devs.filter(d => d.kind === 'audioinput');
    } catch (e) { return []; }
  }
  async function switchMicDevice(track, deviceId, btn, statusEl, deviceSel) {
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    // tear down previous
    if (track.stream) {
      try { track.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    }
    if (track.micSource) {
      try { track.micSource.disconnect(); } catch (e) {}
    }
    try {
      const constraints = {
        audio: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          echoCancellation: false, noiseSuppression: false, autoGainControl: false,
        }
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      track.stream    = stream;
      track.deviceId  = deviceId || '';
      track.micSource = audioCtx.createMediaStreamSource(stream);
      track.micSource.connect(track.inputGainN);
      track.enabled = true;
      if (btn) { btn.textContent = 'Live'; btn.classList.add('on'); }
      if (statusEl) statusEl.textContent = 'capturing input';
      // populate device list now that permission is granted
      if (deviceSel) {
        const devs = await listMicDevices();
        deviceSel.innerHTML = '';
        const def = el('option', null, '(default)'); def.value = '';
        deviceSel.appendChild(def);
        devs.forEach(d => {
          const op = el('option', null, d.label || 'Input ' + d.deviceId.slice(0,6));
          op.value = d.deviceId;
          if (d.deviceId === track.deviceId) op.selected = true;
          deviceSel.appendChild(op);
        });
      }
    } catch (e) {
      track.enabled = false;
      if (btn) { btn.textContent = 'Enable Mic'; btn.classList.remove('on'); }
      if (statusEl) statusEl.textContent = 'denied: ' + (e.message || e.name);
    }
  }
  function enableMic(track, btn, statusEl, deviceSel) {
    return switchMicDevice(track, track.deviceId || '', btn, statusEl, deviceSel);
  }
  async function enableMicFromTab(track, btn, statusEl) {
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (!navigator.mediaDevices.getDisplayMedia) {
      if (statusEl) statusEl.textContent = 'tab capture unsupported';
      return;
    }
    if (track.stream) { try { track.stream.getTracks().forEach(s => s.stop()); } catch(e){} }
    if (track.micSource) { try { track.micSource.disconnect(); } catch(e){} }
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      stream.getVideoTracks().forEach(v => { try { v.stop(); } catch(e){} stream.removeTrack(v); });
      if (stream.getAudioTracks().length === 0) {
        if (statusEl) statusEl.textContent = 'no audio in shared tab';
        return;
      }
      track.stream    = stream;
      track.micSource = audioCtx.createMediaStreamSource(stream);
      track.micSource.connect(track.inputGainN);
      track.enabled = true;
      if (btn) { btn.textContent = 'Live (tab)'; btn.classList.add('on'); }
      if (statusEl) statusEl.textContent = 'capturing tab audio';
    } catch (e) {
      track.enabled = false;
      if (statusEl) statusEl.textContent = 'tab capture denied';
    }
  }
  function randomizeTrack(track) {
    if (track.kind === 'mic') return;
    const density = (track.kind === 'kick' || track.name === 'Kick') ? 0.4 : 0.3;
    for (let i = 0; i < track.steps; i++) {
      if (Math.random() < density) {
        const entry = defaultEntry(track);
        if (track.kind === 'bass' || track.kind === 'lead') {
          const scaleSemis = [0, 2, 3, 5, 7, 8, 10, 12];
          entry.pitch = scaleSemis[Math.floor(Math.random() * scaleSemis.length)];
          if (Math.random() < 0.25) entry.slide = true;
        }
        if (track.kind === 'chord') {
          entry.degree = Math.floor(Math.random() * 7);
        }
        if (track.kind === 'granular' || track.kind === 'mellotron') {
          const scaleSemis = [0, 2, 3, 5, 7, 8, 10, 12];
          entry.pitch = scaleSemis[Math.floor(Math.random() * scaleSemis.length)];
        }
        entry.vel = 0.6 + Math.random() * 0.4;
        track.pattern[i] = entry;
      } else {
        track.pattern[i] = false;
      }
    }
    rebuildSteps(track);
  }
  function refreshMicGates() {
    if (!audioCtx) return;
    const anySolo = tracks.some(x => x.solo);
    for (const t of tracks) {
      if (t.kind !== 'mic' || !t.micGate) continue;
      const audible = t.armed && !t.mute && (!anySolo || t.solo);
      t.micGate.gain.setTargetAtTime(audible ? 1 : 0, audioCtx.currentTime, 0.01);
    }
  }

  // ---------- track ops (mute groups, pending, duplicate) ----------
  let currentMode = 'recording';

  function setMuteAcross(track, val, deferred) {
    const groupTargets = (track.group > 0)
      ? tracks.filter(t => t.group === track.group)
      : [track];
    for (const t of groupTargets) {
      if (deferred) {
        t._pendingMute = (val === t.mute) ? undefined : val;
      } else {
        t.mute = val;
        t._pendingMute = undefined;
      }
    }
    refreshAllToggleBtns();
    if (!deferred) refreshMicGates();
  }
  function setArmedAcross(track, val, deferred) {
    const groupTargets = (track.group > 0)
      ? tracks.filter(t => t.group === track.group)
      : [track];
    for (const t of groupTargets) {
      if (deferred) {
        t._pendingArmed = (val === t.armed) ? undefined : val;
      } else {
        t.armed = val;
        t._pendingArmed = undefined;
      }
    }
    refreshAllToggleBtns();
    if (!deferred) refreshMicGates();
  }
  function setSoloAcross(track, val) {
    const targets = (track.group > 0)
      ? tracks.filter(t => t.group === track.group)
      : [track];
    for (const t of targets) t.solo = val;
    refreshAllToggleBtns();
    refreshMicGates();
  }
  function refreshAllToggleBtns() {
    for (const t of tracks) {
      if (t._mBtn) {
        const visM = (t._pendingMute !== undefined) ? t._pendingMute : t.mute;
        t._mBtn.classList.toggle('on', visM);
        t._mBtn.classList.toggle('pending', t._pendingMute !== undefined);
      }
      if (t._aBtn) {

        t._aBtn.classList.toggle('on', visA);
