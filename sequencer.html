  // ---------- waveform / scope ----------
  function getInkColor() {
    return getComputedStyle(document.body).getPropertyValue('--canvas-ink').trim() || '#111';
  }
  function syncCanvasSize(canvas) {
    const cw = Math.max(40, Math.floor(canvas.clientWidth));
    if (canvas.width !== cw) canvas.width = cw;
  }
  function drawWaveform(canvas, buffer, startNorm, lenSec) {
    syncCanvasSize(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const ink = getInkColor();
    ctx.clearRect(0, 0, w, h);
    if (!buffer) {
      ctx.fillStyle = '#888';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('no sample', w / 2, h / 2);
      return;
    }
    const data = buffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / w));
    const amp = h / 2;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < w; i++) {
      let min = 1.0, max = -1.0;
      const start = i * step;
      const end = Math.min(start + step, data.length);
      for (let j = start; j < end; j++) {
        const v = data[j];
        if (v < min) min = v;
        if (v > max) max = v;
      }
      ctx.moveTo(i, (1 - max) * amp);
      ctx.lineTo(i, (1 - min) * amp);
    }
    ctx.stroke();
    if (typeof startNorm === 'number') {
      const sx = Math.max(0, Math.min(w, startNorm * w));
      ctx.fillStyle = 'rgba(128, 128, 128, 0.28)';
      ctx.fillRect(0, 0, sx, h);
      ctx.strokeStyle = ink;
      ctx.beginPath();
      ctx.moveTo(sx + 0.5, 0); ctx.lineTo(sx + 0.5, h);
      ctx.stroke();
      if (typeof lenSec === 'number') {
        const lenNorm = lenSec / buffer.duration;
        const ex = Math.max(0, Math.min(w, (startNorm + lenNorm) * w));
        ctx.fillStyle = 'rgba(128, 128, 128, 0.28)';
        ctx.fillRect(ex, 0, w - ex, h);
        ctx.beginPath();
        ctx.moveTo(ex + 0.5, 0); ctx.lineTo(ex + 0.5, h);
        ctx.stroke();
      }
    }
  }

  function drawGranularWaveform(canvas, track) {
    syncCanvasSize(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const ink = getInkColor();
    ctx.clearRect(0, 0, w, h);
    const buffer = track.buffer;
    if (!buffer) {
      ctx.fillStyle = '#888';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('no sample — Listen + Rec, or Load a file', w / 2, h / 2);
      return;
    }
    // waveform
    const data = buffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / w));
    const amp = h / 2;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < w; i++) {
      let min = 1.0, max = -1.0;
      const s0 = i * step;
      const e0 = Math.min(s0 + step, data.length);
      for (let j = s0; j < e0; j++) { const v = data[j]; if (v < min) min = v; if (v > max) max = v; }
      ctx.moveTo(i, (1 - max) * amp);
      ctx.lineTo(i, (1 - min) * amp);
    }
    ctx.stroke();
    // truncation greyout
    const truncS = (track.truncStart || 0) * w;
    const truncE = Math.min(w, (track.truncEnd ?? 1) * w);
    ctx.fillStyle = 'rgba(128, 128, 128, 0.55)';
    ctx.fillRect(0, 0, truncS, h);
    ctx.fillRect(truncE, 0, w - truncE, h);
    // trunc boundary
    ctx.strokeStyle = ink;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(truncS + 0.5, 0); ctx.lineTo(truncS + 0.5, h);
    ctx.moveTo(truncE + 0.5, 0); ctx.lineTo(truncE + 0.5, h);
    ctx.stroke();
    ctx.setLineDash([]);
    // play length highlight (within trunc region)
    const truncW = truncE - truncS;
    const playStartX = truncS + (track.playStart || 0) * truncW;
    const playLenPx = ((track.length || 0) / 1000) / buffer.duration * w;
    ctx.fillStyle = 'rgba(80, 80, 80, 0.2)';
    ctx.fillRect(playStartX, 0, Math.min(playLenPx, w - playStartX), h);
    // play start marker
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(playStartX + 0.5, 0); ctx.lineTo(playStartX + 0.5, h);
    ctx.stroke();
    ctx.lineWidth = 1;
    // LFO range bar at bottom
    if ((track.lfoDepth || 0) > 0) {
      const half = (track.lfoDepth || 0) * 0.5;
      const a = Math.max(0, (track.playStart || 0) - half);
      const b = Math.min(1, (track.playStart || 0) + half);
      const ax = truncS + a * truncW;
      const bx = truncS + b * truncW;
      ctx.fillStyle = ink;
      ctx.globalAlpha = 0.45;
      ctx.fillRect(ax, h - 4, bx - ax, 3);
      ctx.globalAlpha = 1;
    }
  }

  // Sampler waveform — draws the buffer with a coloured region per pad and
  // highlights the currently-selected pad in accent. Used by both the sampler
  // UI canvas and as a click target for re-slicing.
  function drawSamplerWaveform(canvas, track) {
    syncCanvasSize(canvas);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const ink = getInkColor();
    ctx.clearRect(0, 0, w, h);
    const buffer = track.buffer;
    if (!buffer) {
      ctx.fillStyle = '#888';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('no sample — Listen + Rec, or Load a file', w / 2, h / 2);
      return;
    }
    const data = buffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / w));
    const amp = h / 2;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < w; i++) {
      let min = 1.0, max = -1.0;
      const s0 = i * step;
      const e0 = Math.min(s0 + step, data.length);
      for (let j = s0; j < e0; j++) { const v = data[j]; if (v < min) min = v; if (v > max) max = v; }
      ctx.moveTo(i, (1 - max) * amp);
      ctx.lineTo(i, (1 - min) * amp);
    }
    ctx.stroke();
    const pads = track.pads || [];
    const sel = track.selectedPad || 0;
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#8B5CF6';
    pads.forEach((pad, idx) => {
      const x0 = clamp(pad.start || 0, 0, 1) * w;
      const x1 = clamp(pad.end ?? 1, 0, 1) * w;
      const isSel = idx === sel;
      ctx.fillStyle = isSel ? accent : ink;
      ctx.globalAlpha = isSel ? 0.20 : 0.05;
      ctx.fillRect(x0, 0, Math.max(1, x1 - x0), h);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = isSel ? accent : ink;
      ctx.lineWidth = isSel ? 1.5 : 0.5;
      ctx.beginPath();
      ctx.moveTo(x0 + 0.5, 0); ctx.lineTo(x0 + 0.5, h);
      ctx.moveTo(x1 + 0.5, 0); ctx.lineTo(x1 + 0.5, h);
      ctx.stroke();
      ctx.fillStyle = isSel ? accent : 'rgba(128,128,128,0.75)';
      ctx.font = '8px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(String(idx + 1), x0 + 2, 2);
    });
    ctx.lineWidth = 1;
  }

  function startMicScope(track, canvas) {
    track._scopeStop = false;
    const cctx = canvas.getContext('2d');
    const FPS = 24;
    const minInterval = 1000 / FPS;
    let lastTime = 0;
    let idleDrawn = false;
    let buf = null;
    const draw = (now) => {
      if (track._scopeStop) return;
      if (!document.body.contains(canvas)) { track._scopeStop = true; return; }
      const enabled = !!(track.analyser && track.enabled);
      if (!enabled) {
        if (!idleDrawn) {
          syncCanvasSize(canvas);
          const w = canvas.width, h = canvas.height;
          cctx.clearRect(0, 0, w, h);
          cctx.fillStyle = '#888';
          cctx.font = '10px monospace';
          cctx.textAlign = 'center';
          cctx.textBaseline = 'middle';
          cctx.fillText('mic off', w / 2, h / 2);
          idleDrawn = true;
        }
        // when idle, poll less often (every ~250 ms) to detect enable
        setTimeout(() => { idleDrawn = false; requestAnimationFrame(draw); }, 250);
        return;
      }
      idleDrawn = false;
      if (!buf || buf.length !== track.analyser.fftSize) buf = new Float32Array(track.analyser.fftSize);
      const elapsed = now - lastTime;
      if (elapsed < minInterval) {
        requestAnimationFrame(draw);
        return;
      }
      lastTime = now;
      syncCanvasSize(canvas);
      const w = canvas.width, h = canvas.height;
      const ink = getInkColor();
      cctx.clearRect(0, 0, w, h);
      track.analyser.getFloatTimeDomainData(buf);
      cctx.strokeStyle = ink;
      cctx.lineWidth = 1;
      cctx.beginPath();
      const step = buf.length / w;
      for (let i = 0; i < w; i++) {
        const v = buf[Math.floor(i * step)] || 0;
        const y = (1 - v) * h / 2;
        if (i === 0) cctx.moveTo(i, y);
        else cctx.lineTo(i, y);
      }
      cctx.stroke();
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  }

  // ---------- mic ----------
  async function listMicDevices() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      return devs.filter(d => d.kind === 'audioinput');
    } catch (e) { return []; }
  }
  async function switchMicDevice(track, deviceId, btn, statusEl, deviceSel) {
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    // tear down previous
    if (track.stream) {
      try { track.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    }
    if (track.micSource) {
      try { track.micSource.disconnect(); } catch (e) {}
    }
    try {
      const constraints = {
        audio: {
          deviceId: deviceId ? { exact: deviceId } : undefined,
          echoCancellation: false, noiseSuppression: false, autoGainControl: false,
        }
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      track.stream    = stream;
      track.deviceId  = deviceId || '';
      track.micSource = audioCtx.createMediaStreamSource(stream);
      track.micSource.connect(track.inputGainN);
      track.enabled = true;
      if (btn) { btn.textContent = 'Live'; btn.classList.add('on'); }
      if (statusEl) statusEl.textContent = 'capturing input';
      // populate device list now that permission is granted
      if (deviceSel) {
        const devs = await listMicDevices();
        deviceSel.innerHTML = '';
        const def = el('option', null, '(default)'); def.value = '';
        deviceSel.appendChild(def);
        devs.forEach(d => {
          const op = el('option', null, d.label || 'Input ' + d.deviceId.slice(0,6));
          op.value = d.deviceId;
          if (d.deviceId === track.deviceId) op.selected = true;
          deviceSel.appendChild(op);
        });
      }
    } catch (e) {
      track.enabled = false;
      if (btn) { btn.textContent = 'Enable Mic'; btn.classList.remove('on'); }
      if (statusEl) statusEl.textContent = 'denied: ' + (e.message || e.name);
    }
  }
  function enableMic(track, btn, statusEl, deviceSel) {
    return switchMicDevice(track, track.deviceId || '', btn, statusEl, deviceSel);
  }
  async function enableMicFromTab(track, btn, statusEl) {
    initAudio();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    if (!navigator.mediaDevices.getDisplayMedia) {
      if (statusEl) statusEl.textContent = 'tab capture unsupported';
      return;
    }
    if (track.stream) { try { track.stream.getTracks().forEach(s => s.stop()); } catch(e){} }
    if (track.micSource) { try { track.micSource.disconnect(); } catch(e){} }
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      stream.getVideoTracks().forEach(v => { try { v.stop(); } catch(e){} stream.removeTrack(v); });

        if (statusEl) statusEl.textContent = 'no audio in shared tab';

      }
      track.stream    = stream;
      track.micSource = audioCtx.createMediaStreamSource(stream);
      track.micSource.connect(track.inputGainN);
      track.enabled = true;
      if (btn) { btn.textContent = 'Live (tab)'; btn.classList.add('on'); }

  function randomizeTrack(track) {
    if (track.kind === 'mic') return;
    const density = (track.kind === 'kick' || track.name === 'Kick') ? 0.4 : 0.3;
    for (let i = 0; i < track.steps; i++) {
      if (Math.random() < density) {
        const entry = defaultEntry(track);
        if (track.kind === 'bass' || track.kind === 'lead' || track.kind === 'sh101' || track.kind === 'juno' || track.kind === 'cs80') {
          const scaleSemis = [0, 2, 3, 5, 7, 8, 10, 12];
          entry.pitch = scaleSemis[Math.floor(Math.random() * scaleSemis.length)];
          if (Math.random() < 0.25) entry.slide = true;
        }
        if (track.kind === 'chord') {
          entry.degree = Math.floor(Math.random() * 7);
        }
        if (track.kind === 'granular' || track.kind === 'mellotron') {
          const scaleSemis = [0, 2, 3, 5, 7, 8, 10, 12];
          entry.pitch = scaleSemis[Math.floor(Math.random() * scaleSemis.length)];
        }
        if (track.kind === 'sampler') {
          entry.pad = Math.floor(Math.random() * 16);
        }
        entry.vel = 0.6 + Math.random() * 0.4;
        track.pattern[i] = entry;
      } else {
        track.pattern[i] = false;
      }
    }
    rebuildSteps(track);
  }
  function refreshMicGates() {
    if (!audioCtx) return;
    const anySolo = tracks.some(x => x.solo);
    for (const t of tracks) {
      if (t.kind !== 'mic' || !t.micGate) continue;
      const audible = t.armed && !t.mute && (!anySolo || t.solo);
      t.micGate.gain.setTargetAtTime(audible ? 1 : 0, audioCtx.currentTime, 0.01);
    }
  }

  // ---------- track ops (mute groups, pending, duplicate) ----------
  let currentMode = 'recording';

  function setMuteAcross(track, val, deferred) {
    const groupTargets = (track.group > 0)
      ? tracks.filter(t => t.group === track.group)
      : [track];
    for (const t of groupTargets) {
      if (deferred) {
        t._pendingMute = (val === t.mute) ? undefined : val;
      } else {
        t.mute = val;
        t._pendingMute = undefined;
      }
    }
    refreshAllToggleBtns();
    if (!deferred) refreshMicGates();
  }
  function setArmedAcross(track, val, deferred) {
    const groupTargets = (track.group > 0)
      ? tracks.filter(t => t.group === track.group)
      : [track];
    for (const t of groupTargets) {
      if (deferred) {
        t._pendingArmed = (val === t.armed) ? undefined : val;
      } else {
        t.armed = val;
        t._pendingArmed = undefined;
      }
    }
    refreshAllToggleBtns();
    if (!deferred) refreshMicGates();
  }
  // ---------- 4-slot Groups ----------
  // Per-track membership in up to 4 groups (multi-membership lets the
  // user nest — e.g. a hi-hat in both "drums" and "hats"). groupArmed
  // is the live arm/disarm state for each group; clicking a group
  // button on any track that's a member toggles the whole group at
  // once, deferred to the next downbeat in Live / Mix modes.
  const groupArmed = [true, true, true, true];
  function applyGroupArm(groupIdx) {
    const armed = groupArmed[groupIdx];
    const deferred = currentMode === 'live' || currentMode === 'mixing';
    for (const t of tracks) {
      if (!t.groups || !t.groups[groupIdx]) continue;
      if (deferred) {
        t._pendingArmed = (armed === t.armed) ? undefined : armed;
      } else {
        t.armed = armed;
        t._pendingArmed = undefined;
      }
    }
    refreshAllToggleBtns();
    if (!deferred) refreshMicGates();
  }
  function updateGroupBtn(btn, track, idx) {
    if (!track.groups) track.groups = [false, false, false, false];
    const member = !!track.groups[idx];
    const armed = groupArmed[idx];
    btn.classList.toggle('member', member);
    btn.classList.toggle('disarmed', member && !armed);
  }
  function refreshAllGroupBtns() {
    document.querySelectorAll('.group-selector').forEach(sel => {
      const tid = parseInt(sel.dataset.trackId, 10);
      const track = tracks.find(t => t.id === tid);
      if (!track) return;
      sel.querySelectorAll('.group-btn').forEach(btn => {
        const idx = parseInt(btn.dataset.group, 10);
        updateGroupBtn(btn, track, idx);

  function buildGroupSelector(track) {
    if (!track.groups) track.groups = [false, false, false, false];
    const wrap = el('div', 'group-selector');
    wrap.dataset.trackId = String(track.id);
    for (let i = 0; i < 4; i++) {
      const btn = el('button', 'group-btn', String(i + 1));
      btn.dataset.group = String(i);
      btn.title = 'Group ' + (i + 1) + ' — click: ' +
        'join group / toggle whole-group arm; alt-click or right-click: toggle membership';
      updateGroupBtn(btn, track, i);
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.altKey || e.shiftKey) {
          track.groups[i] = !track.groups[i];
        } else if (!track.groups[i]) {
          track.groups[i] = true;
        } else {

      btn.addEventListener('contextmenu', (e) => {

  function setSoloAcross(track, val) {
    const targets = (track.group > 0)

  function refreshAllToggleBtns() {
    for (const t of tracks) {

        const visM = (t._pendingMute !== undefined) ? t._pendingMute : t.mute;
        t._mBtn.classList.toggle('on', visM);
        t._mBtn.classList.toggle('pending', t._pendingMute !== undefined);
      }
      if (t._aBtn) {
        const visA = (t._pendingArmed !== undefined) ? t._pendingArmed : t.armed;
        t._aBtn.classList.toggle('on', visA);
        t._aBtn.classList.toggle('pending', t._pendingArmed !== undefined);

      if (t._sBtn) t._sBtn.classList.toggle('on', t.solo);

  function duplicateTrack(t) {

  // ---------- presets (drum / bass / lead / chord) ----------
  const PRESET_KINDS = new Set(['drum','bass','lead','sh101','juno','cs80','chord','mellotron']);
  // Auto-categorise non-drum presets by name so the dropdown groups them
  // (Sub / Acid / Wobble / Pluck / Pad / Lead / Bell / Brass / Strings / Choir / Stab / Bass / Other).
  // Drums are already nested by machine and skip this entirely.
  function categoriseFromName(kind, name) {
    if (!name) return 'Other';
    if (name.includes(' — ')) return name.split(' — ')[0];      // explicit "Pad — Warm Strings"
    const n = name.toLowerCase();
    const tests = [

  function loadPresetStore() {
    try { return JSON.parse(localStorage.getItem('substrata-presets') || '{}'); }
    catch (e) { return {}; }
  }
  function savePresetStore(store) {
    try { localStorage.setItem('substrata-presets', JSON.stringify(store)); } catch (e) {}
  }
  function getPresetsForKind(kind) {
    return loadPresetStore()[kind] || {};
  }
  function setPreset(kind, name, params) {
    const store = loadPresetStore();
    if (!store[kind]) store[kind] = {};
    store[kind][name] = params;
    savePresetStore(store);
  }
  function deletePreset(kind, name) {
    const store = loadPresetStore();
    if (store[kind]) delete store[kind][name];
    savePresetStore(store);
  }
  function getTrackPresetParams(track) {
    const keys = (SAVE_KEYS[track.kind] || []).slice();
    const out = {};
    keys.forEach(k => out[k] = track[k]);
    return out;
  }
  function applyPresetToTrack(track, preset) {
    Object.assign(track, preset);
    if (track.kind === 'drum') track.voice = DRUM_VOICES[track.voiceType] || DRUM_VOICES.kick;
  }

  // ---------- shared UI helpers ----------
  function checkBox(label, val, onChange) {
    const w = el('label', 'knob');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!val;
    cb.addEventListener('change', () => onChange(cb.checked));
    w.appendChild(cb);
    w.appendChild(el('span', null, label));
    return w;
  }

  // ---------- track UI ----------
  function buildTrack(track) {
    const wrap = el('div', 'track');
    if (track.expanded) wrap.classList.add('expanded');
    if (track.deck) wrap.dataset.deck = track.deck;

    const meta = el('div', 'track-meta');

    const name = el('div', 'track-name');
    const chev = el('span', 'chev', track.expanded ? '▾' : '▸');
    chev.style.cursor = 'pointer';
    chev.addEventListener('click', () => {
      track.expanded = !track.expanded;
      wrap.classList.toggle('expanded', track.expanded);
      chev.textContent = track.expanded ? '▾' : '▸';
    });
    name.appendChild(chev);
    const nameInput = el('input', 'name-input');
    nameInput.type = 'text';
    nameInput.value = track.name;
    nameInput.title = 'click to rename';
    nameInput.addEventListener('change', () => { track.name = nameInput.value || track.name; });
    nameInput.addEventListener('blur',   () => { track.name = nameInput.value || track.name; });
    name.appendChild(nameInput);
    meta.appendChild(name);

    const togs = el('div', 'toggles');
    const aBtn  = el('button', 'toggle arm',  'A');
    const mBtn  = el('button', 'toggle mute', 'M');
    const sBtn  = el('button', 'toggle solo', 'S');
    const rBtn  = el('button', 'toggle rnd',  'R');
    const syBtn = el('button', 'toggle sync', '↻');
    const nlBtn = el('button', 'toggle nudge nudge-back', '◄');
    const nrBtn = el('button', 'toggle nudge nudge-fwd',  '►');
    const dBtn  = el('button', 'toggle dup',  'D');
    const gBtn  = el('button', 'toggle grp',  'G' + (track.group || 0));
    const xBtn  = el('button', 'toggle rmv',  '×');
    aBtn.title = 'armed (will play)';
    mBtn.title = 'mute'; sBtn.title = 'solo';
    rBtn.title = 'randomize';
    syBtn.title = "sync to first track — wait until the first track's next step 1, then start at step 1";
    nlBtn.title = 'nudge pattern earlier by one step';
    nrBtn.title = 'nudge pattern later by one step';
    dBtn.title = 'duplicate track';
    gBtn.title = 'mute/solo group (0 = none, 1-8 link tracks)';
    xBtn.title = 'remove track';
    track._mBtn = mBtn;
    track._aBtn = aBtn;
    track._sBtn = sBtn;
    track._gBtn = gBtn;
    if (track.armed && track._pendingArmed === undefined) aBtn.classList.add('on');
    if (track._pendingArmed !== undefined) {
      aBtn.classList.toggle('on', track._pendingArmed);
      aBtn.classList.add('pending');
    }
    if (track.mute && track._pendingMute === undefined) mBtn.classList.add('on');
    if (track._pendingMute !== undefined) {
      mBtn.classList.toggle('on', track._pendingMute);
      mBtn.classList.add('pending');
    }
    if (track.solo)  sBtn.classList.add('on');
    aBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const visible = (track._pendingArmed !== undefined) ? track._pendingArmed : track.armed;
      const deferred = currentMode === 'mixing' || currentMode === 'live';
      setArmedAcross(track, !visible, deferred);
    });
    mBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const visible = (track._pendingMute !== undefined) ? track._pendingMute : track.mute;
      const deferred = currentMode === 'mixing' || currentMode === 'live';
      setMuteAcross(track, !visible, deferred);
    });
    sBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setSoloAcross(track, !track.solo);
    });
    rBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (track.kind === 'mic') return;
      randomizeTrack(track);
    });
    function nudgePattern(direction) {
      // Mic tracks have no step pattern to nudge.
      if (track.kind === 'mic' || !Array.isArray(track.pattern) || track.pattern.length === 0) return;
      if (direction > 0) {
        // forward in time: last step moves to first slot, everything else shifts right.
        track.pattern.unshift(track.pattern.pop());
      } else {
        // backward in time: first step moves to last slot, everything else shifts left.
        track.pattern.push(track.pattern.shift());
      }
      rebuildSteps(track);
    }
    nlBtn.addEventListener('click', (e) => { e.stopPropagation(); nudgePattern(-1); });
    nrBtn.addEventListener('click', (e) => { e.stopPropagation(); nudgePattern( 1); });
    syBtn.addEventListener('click', (e) => { e.stopPropagation(); syncTrackToFirst(track); });
    dBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      duplicateTrack(track);
    });
    gBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      track.group = ((track.group || 0) + 1) % 9;
      gBtn.textContent = 'G' + track.group;
    });
    xBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.confirm('Remove track "' + track.name + '"?')) removeTrack(track);
    });
    togs.appendChild(aBtn);
    togs.appendChild(mBtn);
    togs.appendChild(sBtn);
    togs.appendChild(rBtn);
    togs.appendChild(syBtn);
    togs.appendChild(nlBtn);
    togs.appendChild(nrBtn);
    togs.appendChild(dBtn);
    togs.appendChild(gBtn);
    togs.appendChild(xBtn);
    meta.appendChild(togs);

    wrap.appendChild(meta);

    // Live-mode per-channel volume slider (hidden by CSS outside live mode)
    const liveVolRow = el('div', 'live-vol-row');
    const liveVol = el('input');
    liveVol.type = 'range'; liveVol.min = 0; liveVol.max = 1.2; liveVol.step = 0.01;
    liveVol.value = track.volume;
    const liveVolVal = el('span', 'live-vol-val', Number(track.volume).toFixed(2));
    liveVol.addEventListener('input', () => {
      const v = parseFloat(liveVol.value);
      track.volume = v;
      liveVolVal.textContent = v.toFixed(2);
      if (track.volNode && audioCtx) {
        track.volNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
      }
      // Keep the Mix-tab fader in sync if it was built
      if (track._mixFader) {
        track._mixFader.value = v;
        if (track._mixVolLabel) track._mixVolLabel.textContent = v.toFixed(2);
      }
    });
    // Wrap the slider so we can overlay a faint tick marking the original
    // volume the track was loaded with (set by loadProjectIntoDeck).
    const liveVolWrap = el('div', 'live-vol-wrap');
    liveVolWrap.appendChild(liveVol);
    const liveVolMark = el('div', 'live-vol-original-mark');
    liveVolMark.title = 'Original volume at load time';
    liveVolWrap.appendChild(liveVolMark);
    if (typeof track._originalVolume === 'number') {
      const pct = Math.max(0, Math.min(100, (track._originalVolume / 1.2) * 100));
      liveVolMark.style.left = pct + '%';
    } else {
      liveVolMark.style.display = 'none';
    }
    liveVolRow.appendChild(liveVolWrap);
    liveVolRow.appendChild(liveVolVal);
    track._liveVol = liveVol;
    track._liveVolVal = liveVolVal;
    track._liveVolMark = liveVolMark;
    wrap.appendChild(liveVolRow);

    // Per-track A/B/C morph row — visible only in Live mode (CSS-hidden
    // elsewhere). The slider drives applyMorph; small slot dots show
    // which slots have a saved state.
    const liveMorphRow = el('div', 'live-morph-row');
    const liveMorphTicks = el('div', 'morph-ticks');
    ['A','B','C'].forEach(slot => {
      const has = !!(track.morphStates && track.morphStates[slot]);
      liveMorphTicks.appendChild(el('span', 'morph-slot' + (has ? ' has' : ''), slot));
    });
    liveMorphRow.appendChild(liveMorphTicks);
    const liveMorphSlider = el('input', 'morph-slider');
    liveMorphSlider.type = 'range'; liveMorphSlider.min = 0; liveMorphSlider.max = 2; liveMorphSlider.step = 0.01;
    liveMorphSlider.value = track.morphPos || 0;
    liveMorphSlider.addEventListener('input', () => {
      applyMorph(track, parseFloat(liveMorphSlider.value));
      // keep the Track-tab slider (if visible) in sync
      if (track._morphSlider) track._morphSlider.value = liveMorphSlider.value;
    });
    liveMorphRow.appendChild(liveMorphSlider);
    wrap.appendChild(liveMorphRow);

    if (track.kind === 'mic') {
      const mic = el('div', 'mic-control');
      const btn = el('button', null, track.enabled ? 'Live' : 'Enable Mic');
      if (track.enabled) btn.classList.add('on');
      const status = el('span', 'status', track.enabled ? 'capturing input' : 'off');
      const deviceSel = el('select', 'mic-device');
      const def = el('option', null, '(default)'); def.value = '';
      deviceSel.appendChild(def);
      deviceSel.addEventListener('change', () => switchMicDevice(track, deviceSel.value, btn, status, deviceSel));
      btn.addEventListener('click', () => enableMic(track, btn, status, deviceSel));
      const tabBtn = el('button', 'mic-btn', '🖥 Tab Audio');
      tabBtn.title = 'capture audio from another browser tab/window';
      tabBtn.addEventListener('click', () => enableMicFromTab(track, btn, status));
      const scope = el('canvas', 'mic-scope');
      scope.width = 240; scope.height = 38;
      mic.appendChild(btn);
      mic.appendChild(deviceSel);
      mic.appendChild(tabBtn);
      mic.appendChild(status);
      mic.appendChild(scope);
      wrap.appendChild(mic);
      startMicScope(track, scope);
    } else {
      const stepsRow = el('div', 'steps-row');
      track.stepsEl = stepsRow;
      wrap.appendChild(stepsRow);
    }

    const knobs = el('div', 'track-knobs');
    track.knobsEl = knobs;
    buildKnobs(track);
    wrap.appendChild(knobs);

    // 3-band channel EQ (Mix mode only — hidden by CSS otherwise)
    const eqWrap = el('div', 'mix-eq-wrap');
    const fmtEq = v => (v > 0 ? '+' : '') + v.toFixed(1);
    const makeEqRow = (label, val, onChange) => {
      const row = el('div', 'mix-eq-row mix-eq-rotary');
      const lab = el('span', 'eq-label', label);
      const valEl = el('span', 'eq-val', fmtEq(val));
      let saved = val;
      let killed = false;
      const kill = el('button', 'eq-kill', '✕');
      kill.title = 'kill this band (-40 dB)';
      const dial = makeRotary(-40, 15, val, (v) => {
        if (killed) { killed = false; kill.classList.remove('on'); }
        saved = v;
        valEl.textContent = fmtEq(v);
        onChange(v);
      }, fmtEq);
      kill.addEventListener('click', (e) => {
        e.preventDefault();
        killed = !killed;
        kill.classList.toggle('on', killed);
        const v = killed ? -40 : saved;
        if (!killed) saved = v;
        else saved = saved;          // keep last user value
        dial._setValue(v);
        valEl.textContent = fmtEq(v);
        onChange(v);
      });
      row.appendChild(lab);
      row.appendChild(dial);
      row.appendChild(valEl);
      row.appendChild(kill);
      return row;
    };
    eqWrap.appendChild(makeEqRow('HI', track.eqHigh || 0, v => {
      track.eqHigh = v;
      if (track.trkEqHigh) track.trkEqHigh.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
    }));
    eqWrap.appendChild(makeEqRow('MD', track.eqMid || 0, v => {
      track.eqMid = v;
      if (track.trkEqMid) track.trkEqMid.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
    }));
    eqWrap.appendChild(makeEqRow('LO', track.eqLow || 0, v => {
      track.eqLow = v;
      if (track.trkEqLow) track.trkEqLow.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
    }));
    wrap.appendChild(eqWrap);

    // Channel strip: meter + vertical fader (Mix mode only)
    const strip = el('div', 'mix-strip');
    const meterRes = buildSegmentedMeter(14);
    track._meterSegs = meterRes.segs;
    strip.appendChild(meterRes.meter);

    const mixFaderWrap = el('div', 'mix-fader-wrap');
    const mixFader = el('input', 'mix-fader');
    mixFader.type = 'range';
    mixFader.min = 0; mixFader.max = 1.2; mixFader.step = 0.01;
    mixFader.value = track.volume;
    const mixVolLabel = el('span', 'mix-vol-val', Number(track.volume).toFixed(2));
    mixFader.addEventListener('input', () => {
      const v = parseFloat(mixFader.value);
      track.volume = v;
      mixVolLabel.textContent = v.toFixed(2);
      if (track.volNode) track.volNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    });
    mixFaderWrap.appendChild(mixFader);
    mixFaderWrap.appendChild(mixVolLabel);
    track._mixFader = mixFader;
    track._mixVolLabel = mixVolLabel;
    strip.appendChild(mixFaderWrap);
    wrap.appendChild(strip);

    // Per-channel send levels (Mix mode only — hidden by CSS otherwise)
    const sendsWrap = el('div', 'mix-sends-wrap');
    sendsWrap.appendChild(el('div', 'mix-sends-title', 'SENDS'));
    const SENDS = [
      ['DLY', 'delaySend',     'delaySendN'],
      ['SPC', 'spaceEchoSend', 'spaceEchoSendN'],
      ['RVB', 'reverbSend',    'reverbSendN'],
      ['CHO', 'chorusSend',   'chorusSendN'],
      ['FLA', 'flangerSend',  'flangerSendN'],
      ['BIT', 'bitcrushSend', 'bitcrushSendN']
    ];
    SENDS.forEach(([label, prop, nodeProp]) => {
      const row = el('div', 'mix-send-row');
      row.appendChild(el('span', 'send-label', label));
      const r = el('input'); r.type = 'range'; r.min = 0; r.max = 1; r.step = 0.01;
      r.value = track[prop] || 0;
      const valEl = el('span', 'send-val', Number(track[prop] || 0).toFixed(2));
      r.addEventListener('input', () => {
        const v = parseFloat(r.value);
        track[prop] = v;
        valEl.textContent = v.toFixed(2);
        if (track[nodeProp] && audioCtx) {
          track[nodeProp].gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
        }
      });
      row.appendChild(r);
      row.appendChild(valEl);
      sendsWrap.appendChild(row);
    });
    wrap.appendChild(sendsWrap);

    tracksEl.appendChild(wrap);
    if (track.kind !== 'mic') rebuildSteps(track);
  }

  function buildKnobs(track) {
    const k = track.knobsEl;
    k.innerHTML = '';

    if (track.kind === 'mic') {
      k.appendChild(group(null,
        knob('Vol', 0, 1.2, 0.01, track.volume, v => {
          track.volume = v;
          if (track.volNode) track.volNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        }, v => v.toFixed(2)),
        knob('Gain', 0.1, 20, 0.1, track.inputGain, v => {
          track.inputGain = v;
          if (track.inputGainN) track.inputGainN.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        }, v => v.toFixed(1) + 'x'),
        knob('HPF', 20, 1000, 5, track.hpfFreq, v => {
          track.hpfFreq = v;
          if (track.hpf) track.hpf.frequency.setTargetAtTime(v, audioCtx.currentTime, 0.02);
        }, v => Math.round(v)),
      ));
      // 8-band EQ — each band is its own column with on toggle, freq, gain
      track.eqBands.forEach((b, idx) => {
        const cell = el('div', 'group eq-band');
        const head = el('div', 'eq-head');
        const onBtn = el('button', 'toggle eq-on', String(idx + 1));
        if (b.on) onBtn.classList.add('on');
        onBtn.addEventListener('click', () => {
          b.on = !b.on;
          onBtn.classList.toggle('on', b.on);
          if (track.eqNodes && track.eqNodes[idx]) {
            track.eqNodes[idx].gain.setTargetAtTime(b.on ? b.gain : 0, audioCtx.currentTime, 0.02);
          }
        });
        head.appendChild(onBtn);
        cell.appendChild(head);
        cell.appendChild(knob('Hz', 30, 16000, 10, b.freq, v => {
          b.freq = v;
          if (track.eqNodes && track.eqNodes[idx]) {
            track.eqNodes[idx].frequency.setTargetAtTime(v, audioCtx.currentTime, 0.02);
          }
        }, v => Math.round(v)));
        cell.appendChild(knob('dB', -15, 15, 0.5, b.gain, v => {
          b.gain = v;
          if (track.eqNodes && track.eqNodes[idx] && b.on) {
            track.eqNodes[idx].gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
          }
        }, v => (v >= 0 ? '+' : '') + v.toFixed(1)));
        k.appendChild(cell);
      });
    } else {
      const stdControls = [
        numField('Stp', 1, 128, track.steps, n => { track.steps = n; rebuildSteps(track); }),
        knob('Vol', 0, 1.2, 0.01, track.volume, v => {
          track.volume = v;
          if (track.volNode) track.volNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        }, v => v.toFixed(2)),
        knob('Swg', 0, 0.6, 0.01, track.swing || 0, v => track.swing = v, v => v.toFixed(2)),
        checkBox('Mono', track.mono, v => { track.mono = v; if (!v) track._lastTrigGain = null; }),
      ];
      if (NOTE_LEN_KINDS.has(track.kind)) {
        const curLen = track.noteLen != null ? track.noteLen : 1.0;
        stdControls.push(knob('NLen', 0.1, 3, 0.05, curLen, v => {
          track.noteLen = v;
          // overwrite every existing step's length too
          for (const entry of track.pattern) { if (entry) entry.length = v; }
          rebuildSteps(track);
        }, v => v.toFixed(2)));
      }
      k.appendChild(group(null, ...stdControls));
      if (PRESET_KINDS.has(track.kind)) {
        const presetWrap = el('div', 'group');
        presetWrap.appendChild(el('span', 'label', 'Preset'));
        const row = el('div', 'group-row');
        const sel = el('select');
        sel.className = 'preset-select';
        // The drum kind organises factory presets per machine (nested object),
        // every other kind keeps a flat map under a single Factory optgroup.
        const isDrumGrouped = track.kind === 'drum';
        const refreshSel = () => {
          sel.innerHTML = '';
          const def = el('option', null, '(load…)'); def.value = '';
          sel.appendChild(def);
          const factory = (FACTORY_PRESETS[track.kind] || {});
          const user    = getPresetsForKind(track.kind);
          if (isDrumGrouped) {
            Object.keys(factory).forEach(machine => {
              const presets = factory[machine] || {};
              const names = Object.keys(presets).sort();
              if (!names.length) return;
              const og = document.createElement('optgroup');
              og.label = machine;
              names.forEach(n => {
                const op = el('option', null, n);
                op.value = 'f:' + machine + '/' + n;
                og.appendChild(op);
              });
              sel.appendChild(og);
            });
          } else {
            const fNames = Object.keys(factory).sort();
            if (fNames.length) {
              // Bucket each preset name into a category for a more
              // navigable dropdown — one optgroup per category.
              const byCat = {};
              fNames.forEach(n => {
                const c = categoriseFromName(track.kind, n);
                (byCat[c] = byCat[c] || []).push(n);
              });
              Object.keys(byCat).sort().forEach(cat => {
                const og = document.createElement('optgroup');
                og.label = cat;
                byCat[cat].forEach(n => {
                  const op = el('option', null, n); op.value = 'f:' + n;
                  og.appendChild(op);
                });
                sel.appendChild(og);
              });
            }
          }
          const uNames = Object.keys(user).sort();
          if (uNames.length) {
            const og = document.createElement('optgroup');
            og.label = 'User';
            uNames.forEach(n => {
              const op = el('option', null, n); op.value = 'u:' + n;
              og.appendChild(op);
            });
            sel.appendChild(og);
          }
        };
        refreshSel();
        sel.addEventListener('change', () => {
          if (!sel.value) return;
          const idx = sel.value.indexOf(':');
          const src = sel.value.slice(0, idx);
          const rest = sel.value.slice(idx + 1);
          let p;
          if (src === 'f') {
            if (isDrumGrouped) {
              const sep = rest.indexOf('/');
              if (sep > 0) {
                const machine = rest.slice(0, sep);
                const name    = rest.slice(sep + 1);
                p = (FACTORY_PRESETS[track.kind] || {})[machine]?.[name];
              }
            } else {
              p = (FACTORY_PRESETS[track.kind] || {})[rest];
            }
          } else {
            p = getPresetsForKind(track.kind)[rest];
          }
          if (!p) return;
          applyPresetToTrack(track, p);
          buildKnobs(track);
          // In Track mode the knobs panel is partitioned into Instrument /
          // Channel sections and the std controls are lifted to the sequencer
          // header. buildKnobs above just rebuilt the flat shape, so refresh
          // the whole track UI to put everything back in place.
          if (currentMode === 'recording') rebuildTracksUI();
        });
        const saveBtn = el('button', 'mic-btn', 'Save');
        saveBtn.title = 'save current sound as a user preset (shift-click to save as new)';
        saveBtn.addEventListener('click', (e) => {
          // If a user preset is selected and shift is not held, overwrite silently
          if (!e.shiftKey && sel.value && sel.value.startsWith('u:')) {
            const name = sel.value.slice(2);
            setPreset(track.kind, name, getTrackPresetParams(track));
            return;
          }
          let suggested = '';
          if (sel.value && sel.value.startsWith('u:')) suggested = sel.value.slice(2);
          const name = window.prompt('Save ' + track.kind + ' preset as:', suggested);
          if (!name) return;
          setPreset(track.kind, name, getTrackPresetParams(track));
          refreshSel();
          sel.value = 'u:' + name;
        });
        const delBtn = el('button', 'mic-btn', 'Del');
        delBtn.title = 'delete the selected user preset (factory presets cannot be deleted)';
        delBtn.addEventListener('click', () => {
          if (!sel.value) return;
          if (!sel.value.startsWith('u:')) {
            window.alert('Factory presets cannot be deleted.');
            return;
          }
          const name = sel.value.slice(2);
          if (window.confirm('Delete preset "' + name + '"?')) {
            deletePreset(track.kind, name);
            refreshSel();
          }
        });
        row.appendChild(sel);
        row.appendChild(saveBtn);
        row.appendChild(delBtn);
        presetWrap.appendChild(row);
        k.appendChild(presetWrap);
      }
    }

    if (track.kind === 'granular') {
      const area = el('div', 'sample-area');
      const head = el('div', 'group');
      const listenBtn = el('button', 'mic-btn', track.stream ? '■ Stop Listen' : '🎤 Listen');
      if (track.stream) listenBtn.classList.add('on');
      const recBtn = el('button', 'mic-btn', '● Rec');
      recBtn.disabled = !track.stream;
      const loadBtn = el('button', 'mic-btn', 'Load File');
      const status = el('span', 'sample-status', track.buffer ? track.buffer.duration.toFixed(2) + 's loaded' : 'no sample');
      const wave = el('canvas', 'grain-wave');
      wave.width = 380; wave.height = 60;

      const refreshWave = () => drawGranularWaveform(wave, track);
      refreshWave();
      track._refreshWave = refreshWave;

      listenBtn.addEventListener('click', () => {
        if (track.stream) disableGranularListen(track, listenBtn, recBtn, status);
        else enableGranularListen(track, listenBtn, recBtn, status);
      });
      const tabBtn = el('button', 'mic-btn', '🖥 Tab');
      tabBtn.title = 'capture audio from another browser tab/window';
      tabBtn.addEventListener('click', () => {
        if (track.stream) disableGranularListen(track, listenBtn, recBtn, status);
        else enableGranularListenTab(track, listenBtn, recBtn, status);
      });
      recBtn.addEventListener('click', () => {
        if (track.recorder && track.recorder.state === 'recording') stopGranularRecord(track);
        else startGranularRecord(track, recBtn, status);
      });
      loadBtn.addEventListener('click', () => loadGranularFile(track, status));

      // click on waveform sets playStart inside truncated region
      wave.style.cursor = 'crosshair';
      wave.addEventListener('click', (e) => {
        if (!track.buffer) return;
        const rect = wave.getBoundingClientRect();
        const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        const tS = track.truncStart || 0, tE = track.truncEnd ?? 1;
        if (x < tS || x > tE) return;
        track.playStart = (x - tS) / Math.max(0.001, tE - tS);
        refreshWave();
        rebuildTracksUI();
      });

      head.appendChild(listenBtn);
      head.appendChild(tabBtn);
      head.appendChild(recBtn);
      head.appendChild(loadBtn);
      head.appendChild(status);
      area.appendChild(head);
      area.appendChild(wave);
      k.appendChild(area);

      k.appendChild(group('Trunc',
        knob('Start', 0, 0.99, 0.001, track.truncStart, v => {
          track.truncStart = Math.min(v, (track.truncEnd ?? 1) - 0.01);
          refreshWave();
        }, v => v.toFixed(3)),
        knob('End',   0.01, 1, 0.001, track.truncEnd, v => {
          track.truncEnd = Math.max(v, (track.truncStart || 0) + 0.01);
          refreshWave();
        }, v => v.toFixed(3)),
      ));
      k.appendChild(group('Play',
        knob('Pitch', -24, 24, 1, track.pitch, v => track.pitch = v, v => (v >= 0 ? '+' : '') + v),
        knob('Start', 0, 1, 0.001, track.playStart, v => { track.playStart = v; refreshWave(); }, v => v.toFixed(3)),
        knob('Len',   10, 4000, 1, track.length, v => { track.length = v; refreshWave(); }, v => v + 'ms'),
        knob('Att',   0.001, 0.5, 0.001, track.attack,  v => track.attack  = v, v => v.toFixed(3)),
        knob('Rel',   0.001, 0.5, 0.001, track.release, v => track.release = v, v => v.toFixed(3)),
      ));
      const loopWrap = el('label', 'knob');
      const lcb = el('input'); lcb.type = 'checkbox'; lcb.checked = !!track.loop;
      lcb.addEventListener('change', () => track.loop = lcb.checked);
      loopWrap.appendChild(lcb); loopWrap.appendChild(el('span', null, 'Loop'));
      k.appendChild(group('Loop', loopWrap));
      k.appendChild(group('LFO→Play',
        knob('Rate', 0.01, 20, 0.01, track.lfoRate, v => track.lfoRate = v, v => v.toFixed(2)),
        knob('Dep',  0, 1, 0.01, track.lfoDepth, v => { track.lfoDepth = v; refreshWave(); }, v => v.toFixed(2)),
        selectField('Shp', ['sine','triangle','sawtooth','square','random'], track.lfoShape, v => track.lfoShape = v),
      ));
    }

    if (track.kind === 'sampler') {
      const area = el('div', 'sample-area');
      const head = el('div', 'group');
      const listenBtn = el('button', 'mic-btn', track.stream ? '■ Stop Listen' : '🎤 Listen');
      if (track.stream) listenBtn.classList.add('on');
      const recBtn = el('button', 'mic-btn', '● Rec');
      recBtn.disabled = !track.stream;
      const loadBtn = el('button', 'mic-btn', 'Load File');
      const sliceBtn = el('button', 'mic-btn', 'Auto-slice 16');
      sliceBtn.title = 'split the loaded sample into 16 equal pads';
      const status = el('span', 'sample-status', track.buffer ? track.buffer.duration.toFixed(2) + 's loaded' : 'no sample');
      const wave = el('canvas', 'grain-wave sampler-wave');
      wave.width = 380; wave.height = 60;

      const padGrid = el('div', 'sampler-pads');
      const padBtns = [];
      const refreshPadGrid = () => {
        const sel = track.selectedPad || 0;
        padBtns.forEach((b, i) => b.classList.toggle('on', i === sel));
      };

      let padCtrlHost = null;
      const renderPadCtrls = () => {
        if (!padCtrlHost) return;
        padCtrlHost.innerHTML = '';
        const idx = track.selectedPad || 0;
        const pad = track.pads[idx];
        if (!pad) return;
        padCtrlHost.appendChild(el('div', 'sampler-pad-label', 'Pad ' + (idx + 1)));
        padCtrlHost.appendChild(knob('Start', 0, 0.999, 0.001, pad.start || 0, v => {
          pad.start = Math.min(v, (pad.end ?? 1) - 0.001);
          refreshWave();
        }, v => v.toFixed(3)));
        padCtrlHost.appendChild(knob('End',   0.001, 1, 0.001, pad.end ?? 1, v => {
          pad.end = Math.max(v, (pad.start || 0) + 0.001);
          refreshWave();
        }, v => v.toFixed(3)));
        padCtrlHost.appendChild(knob('Pitch', -24, 24, 1, pad.pitch || 0, v => pad.pitch = v, v => (v >= 0 ? '+' : '') + v));
        padCtrlHost.appendChild(knob('Gain',  0, 2, 0.01, pad.gain == null ? 1 : pad.gain, v => pad.gain = v, v => v.toFixed(2)));
      };

      const refreshWave = () => drawSamplerWaveform(wave, track);
      refreshWave();
      track._refreshWave = refreshWave;

      for (let i = 0; i < 16; i++) {
        const b = el('button', 'sampler-pad', String(i + 1));
        b.addEventListener('click', (e) => {
          track.selectedPad = i;
          refreshPadGrid();
          renderPadCtrls();
          refreshWave();
          if (e.shiftKey) previewPad(track, i);
        });

  function rebuildSteps(track) {
    const prev = track.pattern;
    track.pattern = new Array(track.steps).fill(false).map((_, i) => prev[i] || false);
    track.stepsEl.innerHTML = '';
    for (let i = 0; i < track.steps; i++) {
      const col = el('div', 'step-col');
      const cell = el('div', 'step' + (i % 4 === 0 ? ' beat' : ''));
      // Faded "1, 5, 9, 13, …" beat counter overlaid in the top-left of
      // every fourth step so the user can find their place in the bar.
      if (i % 4 === 0) cell.appendChild(el('span', 'step-num', String(i + 1)));
      // Centred span for the per-step value (pitch / numeral). Pulled out
      // so renderStep doesn't blow away the beat counter.
      const pitchEl = el('span', 'step-pitch');
      cell.appendChild(pitchEl);
      cell._pitchEl = pitchEl;
      renderStep(cell, track, i);

      // forward refs so the click handler can refresh the lanes when a step is toggled off
      let velRef = null, panRef = null, lenRef = null;

      cell.addEventListener('click', (e) => {
        if ((track.kind === 'bass' || track.kind === 'lead' || track.kind === 'sh101' || track.kind === 'juno' || track.kind === 'cs80') && e.shiftKey) {
          if (track.pattern[i]) {
            track.pattern[i].slide = !track.pattern[i].slide;
            renderStep(cell, track, i);
          }
          return;
        }
        toggleStep(track, i);
        renderStep(cell, track, i);
        if (velRef) renderLane(velRef, track, i, 'vel');
        if (panRef) renderLane(panRef, track, i, 'pan');
        if (lenRef) renderLane(lenRef, track, i, 'length');
      });

      if (track.kind === 'bass' || track.kind === 'lead' || track.kind === 'sh101' || track.kind === 'juno' || track.kind === 'cs80' || track.kind === 'granular' || track.kind === 'mellotron') {
        cell.addEventListener('wheel', (e) => {
          if (!track.pattern[i]) return;
          e.preventDefault();
          const dir = e.deltaY < 0 ? 1 : -1;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) + dir, -24, 24);
          renderStep(cell, track, i);
        }, { passive: false });
      }
      if (track.kind === 'chord') {
        cell.addEventListener('wheel', (e) => {
          if (!track.pattern[i]) return;
          e.preventDefault();
          const dir = e.deltaY < 0 ? 1 : -1;
          track.pattern[i].degree = clamp(((track.pattern[i].degree || 0) + dir), 0, 6);
          renderStep(cell, track, i);
        }, { passive: false });
      }
      if (track.kind === 'sampler') {
        cell.addEventListener('wheel', (e) => {
          if (!track.pattern[i]) return;
          e.preventDefault();
          const dir = e.deltaY < 0 ? 1 : -1;
          track.pattern[i].pad = clamp((track.pattern[i].pad || 0) + dir, 0, 15);
          renderStep(cell, track, i);
        }, { passive: false });
      }

      col.appendChild(cell);

      if (track.kind === 'bass' || track.kind === 'lead' || track.kind === 'sh101' || track.kind === 'juno' || track.kind === 'cs80') {
        const ctrl = el('div', 'step-mini');
        const dn = el('button', null, '−');
        const up = el('button', null, '+');
        const sl = el('button', null, 'S');
        const refreshSlide = () => {
          sl.classList.toggle('on', !!(track.pattern[i] && track.pattern[i].slide));
        };
        dn.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) - 1, -12, 24);
          renderStep(cell, track, i);
        });
        up.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) + 1, -12, 24);
          renderStep(cell, track, i);
        });
        sl.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].slide = !track.pattern[i].slide;
          refreshSlide();
          renderStep(cell, track, i);
        });
        refreshSlide();
        ctrl.appendChild(dn); ctrl.appendChild(up); ctrl.appendChild(sl);
        col.appendChild(ctrl);
      }
      if (track.kind === 'granular' || track.kind === 'mellotron') {
        const ctrl = el('div', 'step-mini');
        const dn = el('button', null, '−');
        const up = el('button', null, '+');
        dn.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) - 1, -24, 24);
          renderStep(cell, track, i);
        });
        up.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pitch = clamp((track.pattern[i].pitch || 0) + 1, -24, 24);
          renderStep(cell, track, i);
        });
        ctrl.appendChild(dn); ctrl.appendChild(up);
        col.appendChild(ctrl);
      }
      if (track.kind === 'sampler') {
        const ctrl = el('div', 'step-mini');
        const dn = el('button', null, '−');
        const up = el('button', null, '+');
        dn.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pad = clamp((track.pattern[i].pad || 0) - 1, 0, 15);
          renderStep(cell, track, i);
        });
        up.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].pad = clamp((track.pattern[i].pad || 0) + 1, 0, 15);
          renderStep(cell, track, i);
        });
        ctrl.appendChild(dn); ctrl.appendChild(up);
        col.appendChild(ctrl);
      }
      if (track.kind === 'chord') {
        const ctrl = el('div', 'step-mini');
        const dn = el('button', null, '−');
        const up = el('button', null, '+');
        dn.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].degree = clamp((track.pattern[i].degree || 0) - 1, 0, 6);
          renderStep(cell, track, i);
        });
        up.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          track.pattern[i].degree = clamp((track.pattern[i].degree || 0) + 1, 0, 6);
          renderStep(cell, track, i);
        });
        ctrl.appendChild(dn); ctrl.appendChild(up);
        col.appendChild(ctrl);

        const qRow = el('div', 'step-mini');
        const qBtn = el('button', null, QUALITY_LABELS[track.pattern[i]?.quality || 'auto']);
        qBtn.title = 'chord quality';
        qBtn.addEventListener('click', () => {
          if (!track.pattern[i]) return;
          const cur = track.pattern[i].quality || 'auto';
          const idx = CHORD_QUALITIES.indexOf(cur);
          const next = CHORD_QUALITIES[(idx + 1) % CHORD_QUALITIES.length];
          track.pattern[i].quality = next;
          qBtn.textContent = QUALITY_LABELS[next];
        });
        qRow.appendChild(qBtn);
        col.appendChild(qRow);
      }

      const vel = el('div', 'lane-cell vel');
      const velBar = el('div', 'bar'); vel.appendChild(velBar);
      renderLane(vel, track, i, 'vel');
      attachLaneDrag(vel, track, i, 'vel');
      col.appendChild(vel);
      velRef = vel;

      const pan = el('div', 'lane-cell pan');
      const panBar = el('div', 'bar'); pan.appendChild(panBar);
      renderLane(pan, track, i, 'pan');
      attachLaneDrag(pan, track, i, 'pan');
      col.appendChild(pan);
      panRef = pan;

      if (NOTE_LEN_KINDS.has(track.kind)) {
        const len = el('div', 'lane-cell length');
        const lenBar = el('div', 'bar'); len.appendChild(lenBar);
        renderLane(len, track, i, 'length');
        attachLaneDrag(len, track, i, 'length');
        col.appendChild(len);
        lenRef = len;
      }

      track.stepsEl.appendChild(col);
    }
  }

  function defaultEntry(track) {
    const base = { vel: 1, pan: 0 };
    const len = track.noteLen != null ? track.noteLen : 1.0;
    if (track.kind === 'bass' || track.kind === 'lead' || track.kind === 'sh101' || track.kind === 'juno' || track.kind === 'cs80') return { ...base, pitch: 0, slide: false, length: len };
    if (track.kind === 'granular') return { ...base, pitch: 0, length: len };
    if (track.kind === 'mellotron') return { ...base, pitch: 0, length: len };
    if (track.kind === 'chord') return { ...base, degree: 0, quality: 'auto', length: len };
    if (track.kind === 'sampler') return { ...base, pad: track.selectedPad || 0, length: len };
    return base;
  }
  // Which kinds support per-step note length
  const NOTE_LEN_KINDS = new Set(['bass','lead','sh101','juno','cs80','chord','mellotron','granular','sampler']);
  function toggleStep(track, i) {
    track.pattern[i] = track.pattern[i] ? false : defaultEntry(track);
  }

  function renderStep(cell, track, i) {
    const on = !!track.pattern[i];
    cell.classList.toggle('on', on);
    cell.classList.toggle('slide', on && track.pattern[i].slide);
    // Use the dedicated pitch span so the beat-counter overlay survives.
    const pitchEl = cell._pitchEl;
    let txt = '';
    if (on && (track.kind === 'bass' || track.kind === 'lead' || track.kind === 'sh101' || track.kind === 'juno' || track.kind === 'cs80' || track.kind === 'granular' || track.kind === 'mellotron')) {
      txt = String(track.pattern[i].pitch);
    } else if (on && track.kind === 'chord') {
      const numerals = ['I','II','III','IV','V','VI','VII'];
      txt = numerals[track.pattern[i].degree | 0];
    } else if (on && track.kind === 'sampler') {
      txt = String((track.pattern[i].pad || 0) + 1);
    }
    if (pitchEl) pitchEl.textContent = txt;
    else cell.textContent = txt;
  }
  function renderLane(cellEl, track, i, kind) {
    const bar = cellEl.querySelector('.bar');
    const entry = track.pattern[i];
    if (!entry) { bar.style.display = 'none'; return; }
    bar.style.display = 'block';
    if (kind === 'vel') {
      const v = entry.vel ?? 1;
      bar.style.top = ''; bar.style.bottom = '0';
      bar.style.height = (v * 100) + '%';
    } else if (kind === 'pan') {
      const v = entry.pan ?? 0;
      if (v >= 0) {
        bar.style.bottom = '50%';
        bar.style.top = '';
        bar.style.height = (v * 50) + '%';
      } else {
        bar.style.top = '50%';
        bar.style.bottom = '';
        bar.style.height = (-v * 50) + '%';
      }
    } else if (kind === 'length') {
      // 0..3 mapped to 0..100% from bottom. 1.0 sits at 33%.
      const v = entry.length ?? 1.0;
      bar.style.top = ''; bar.style.bottom = '0';
      bar.style.height = Math.min(100, (v / 3) * 100) + '%';
    }
  }
  function attachLaneDrag(cellEl, track, i, kind) {
    const beginDrag = (initialY) => {
      if (!track.pattern[i]) return null;
      const rect = cellEl.getBoundingClientRect();
      const update = (y) => {
        const t = clamp((rect.bottom - y) / rect.height, 0, 1);
        let val;
        if (kind === 'vel')         val = t;          // 0..1
        else if (kind === 'pan')    val = t * 2 - 1;  // -1..1
        else if (kind === 'length') val = t * 3;      // 0..3
        else                        val = t;
        track.pattern[i][kind] = val;
        renderLane(cellEl, track, i, kind);
      };
      update(initialY);
      return update;
    };
    cellEl.addEventListener('mousedown', (e) => {
      const update = beginDrag(e.clientY);
      if (!update) return;
      const onMove = (ev) => update(ev.clientY);
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
    cellEl.addEventListener('touchstart', (e) => {
      const t0 = e.touches[0]; if (!t0) return;
      const update = beginDrag(t0.clientY);
      if (!update) return;
      const onMove = (ev) => { const t = ev.touches[0]; if (t) { update(t.clientY); ev.preventDefault(); } };
      const onEnd = () => {
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onEnd);
        window.removeEventListener('touchcancel', onEnd);
      };
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
      window.addEventListener('touchcancel', onEnd);
      e.preventDefault();
    }, { passive: false });
  }

  function highlightStep(track, idx) {
    if (track._cursorIdx === idx) return;
    track._cursorIdx = idx;
    // Live-mode mini playhead — runs even when the step grid isn't
    // rendered so the bar still tracks the loop.
    updateLiveSeqCursor(track);
    if (!track.stepsEl) return;
    const cols = track.stepsEl.children;
    if (typeof track._prevCursorIdx === 'number' && track._prevCursorIdx !== idx) {
      const oldCol = cols[track._prevCursorIdx];
      if (oldCol && oldCol.firstChild) oldCol.firstChild.classList.remove('cursor');
    }
    if (idx >= 0 && idx < cols.length) {
      const newCol = cols[idx];
      if (newCol && newCol.firstChild) newCol.firstChild.classList.add('cursor');
    }
    track._prevCursorIdx = idx;
  }
  // Move the Live-mode mini playhead next to the track name to the
  // current step position. Called from highlightStep on every scheduler
  // tick so the bar tracks the loop in real time.
  function updateLiveSeqCursor(track) {
    const cursor = track._liveSeqCursor;
    if (!cursor || !cursor.isConnected) return;
    const len = (track.pattern && track.pattern.length) || track.steps || 16;
    const idx = (typeof track._cursorIdx === 'number' && track._cursorIdx >= 0) ? track._cursorIdx : 0;
    const pos = ((idx % len) / len) * 100;
    cursor.style.left = pos.toFixed(2) + '%';
  }

  // ---------- FX rack presets ----------
  // A "rack" snapshots every master / FX config — EQ, comp, ducker timing,
  // delay, reverb, chorus, flanger, bitcrush, tape, lo-fi, LP/HP — so users
  // can sculpt a master FX chain once and recall it. Master vol and the
  // ducker source are deliberately excluded (they're project-specific).
  const FX_RACK_FACTORY = {

  function getUserFxRacks() {
    try { return JSON.parse(localStorage.getItem('substrata.fxRacks') || '{}'); }
    catch (e) { return {}; }
  }
  function setUserFxRacks(racks) {
    try { localStorage.setItem('substrata.fxRacks', JSON.stringify(racks)); }
    catch (e) { console.warn('Could not save FX rack to localStorage:', e); }
  }

  function captureCurrentFxRack() {
    return {
      master:      { low: master.low, mid: master.mid, high: master.high, warmth: master.warmth },
      compCfg:     { ...compCfg },
      duckCfg:     { attack: duckCfg.attack, release: duckCfg.release },
      delayCfg:    { ...delayCfg },
      spaceEchoCfg: { ...spaceEchoCfg },
      reverbCfg:   { ...reverbCfg },
      chorusCfg:   { ...chorusCfg },
      flangerCfg:  { ...flangerCfg },
      bitcrushCfg: { ...bitcrushCfg },
      tapeCfg:     { ...tapeCfg },
      lofiCfg:     { ...lofiCfg },
      lpfCfg:      { ...lpfCfg },
      hpfCfg:      { ...hpfCfg }
    };
  }

  function applyFxRack(rack) {
    if (!rack) return;
    if (rack.master) {
      ['low','mid','high','warmth'].forEach(k => {
        if (rack.master[k] !== undefined) master[k] = rack.master[k];
      });
    }
    if (rack.compCfg)     Object.assign(compCfg, rack.compCfg);
    if (rack.duckCfg) {
      if (rack.duckCfg.attack  !== undefined) duckCfg.attack  = rack.duckCfg.attack;
      if (rack.duckCfg.release !== undefined) duckCfg.release = rack.duckCfg.release;
    }
    if (rack.delayCfg)    Object.assign(delayCfg, rack.delayCfg);
    if (rack.spaceEchoCfg) Object.assign(spaceEchoCfg, rack.spaceEchoCfg);
    if (rack.reverbCfg)   Object.assign(reverbCfg, rack.reverbCfg);
    if (rack.chorusCfg)   Object.assign(chorusCfg, rack.chorusCfg);
    if (rack.flangerCfg)  Object.assign(flangerCfg, rack.flangerCfg);
    if (rack.bitcrushCfg) Object.assign(bitcrushCfg, rack.bitcrushCfg);
    if (rack.tapeCfg)     Object.assign(tapeCfg, rack.tapeCfg);
    if (rack.lofiCfg)     Object.assign(lofiCfg, rack.lofiCfg);
    if (rack.lpfCfg)      Object.assign(lpfCfg, rack.lpfCfg);
    if (rack.hpfCfg)      Object.assign(hpfCfg, rack.hpfCfg);
    applyAllParams();
    rebuildFxModules();
  }

  function rebuildFxModules() {
    ['master','comp','ducker','delay','space-echo','reverb','chorus','flanger','bitcrush','tape','lofi','lpfilter','hpfilter'].forEach(id => {
      const node = document.getElementById(id);
      if (node) node.innerHTML = '';
    });
    buildMaster(); buildComp(); buildDucker();
    buildDelay(); buildSpaceEcho(); buildReverb();
    buildChorus(); buildFlanger(); buildBitcrush(); buildTape(); buildLoFi();
    buildLPFilter(); buildHPFilter();
    applyCollapsibles();
  }

  function buildFxRacks() {
    const m = document.getElementById('fx-racks');
    if (!m) return;
    m.appendChild(el('h2', null, 'FX Rack'));

    // Scrollable vertical list of every rack (factory + user). Click an
    // entry to apply it; the selected row gets the accent highlight.
    let selectedValue = '';
    const listWrap = el('div', 'fx-rack-list');

    const populate = (selectedName) => {
      if (selectedName !== undefined) selectedValue = selectedName;
      listWrap.innerHTML = '';

      const section = (label, names, kind) => {
        if (!names.length) return;
        const head = el('div', 'fx-rack-section', label);
        listWrap.appendChild(head);
        names.forEach(name => {
          const value = kind + ':' + name;
          const item = el('button', 'fx-rack-item', name);
          if (value === selectedValue) item.classList.add('on');
          item.addEventListener('click', () => {
            const rack = kind === 'factory' ? FX_RACK_FACTORY[name] : getUserFxRacks()[name];
            if (rack) {
              applyFxRack(rack);
              selectedValue = value;
              listWrap.querySelectorAll('.fx-rack-item').forEach(b => b.classList.remove('on'));
              item.classList.add('on');
            }
          });
          listWrap.appendChild(item);
        });
      };

      section('Factory', Object.keys(FX_RACK_FACTORY), 'factory');
      const user = getUserFxRacks();
      section('User', Object.keys(user), 'user');
      if (Object.keys(FX_RACK_FACTORY).length === 0 && Object.keys(user).length === 0) {
        listWrap.appendChild(el('div', 'fx-rack-empty', 'No presets yet'));
      }
    };
    populate();
    m.appendChild(listWrap);

    // Save / Delete buttons under the list.
    const btnRow = el('div', 'fx-rack-actions');

    const saveBtn = el('button', 'small', 'Save as…');
    saveBtn.addEventListener('click', () => {
      const name = window.prompt('Save current FX rack as:', 'My rack');
      if (!name) return;
      const trimmed = name.trim();
      if (!trimmed) return;
      if (FX_RACK_FACTORY[trimmed]) {
        alert('That name is reserved for a factory preset. Pick another.');
        return;
      }
      const user = getUserFxRacks();
      if (user[trimmed] && !confirm('Overwrite existing rack "' + trimmed + '"?')) return;
      user[trimmed] = captureCurrentFxRack();
      setUserFxRacks(user);
      populate('user:' + trimmed);
    });

    const deleteBtn = el('button', 'small', 'Delete');
    deleteBtn.addEventListener('click', () => {
      if (!selectedValue.startsWith('user:')) {
        alert('Only user racks can be deleted.');
        return;
      }
      const name = selectedValue.slice(5);
      if (!confirm('Delete user rack "' + name + '"?')) return;
      const user = getUserFxRacks();
      delete user[name];
      setUserFxRacks(user);
      selectedValue = '';
      populate();
    });

    btnRow.appendChild(saveBtn);
    btnRow.appendChild(deleteBtn);
    m.appendChild(btnRow);
  }

  // ---------- side ----------
  function buildMaster() {
    const m = document.getElementById('master');
    m.appendChild(el('h2', null, 'Master'));
    const top = el('div', 'fx-top');
    sideRowEq(top, 'Low',  master.low,  v => {
      master.low = v; if (eqLow) eqLow.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    });
    sideRowEq(top, 'Mid',  master.mid,  v => {
      master.mid = v; if (eqMid) eqMid.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    });
    sideRowEq(top, 'High', master.high, v => {
      master.high = v; if (eqHigh) eqHigh.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    });
    sideRow(top, 'Warm', 0, 1, 0.01, master.warmth, v => {
      master.warmth = v;
      if (warmShaper) warmShaper.curve = makeWarmthCurve(v);
      if (warmLow)  warmLow.gain.setTargetAtTime( 1.5 * v, audioCtx.currentTime, 0.02);
      if (warmHigh) warmHigh.gain.setTargetAtTime(-2.5 * v, audioCtx.currentTime, 0.02);
    }, v => v.toFixed(2));
    m.appendChild(top);
    sideRowVerticalVol(m, 'Vol', master.vol, v => {
      master.vol = v; if (masterOut) masterOut.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
    }, v => v.toFixed(2));
  }
  function buildDelay() {
    const m = document.getElementById('delay');
    m.appendChild(el('h2', null, 'Delay'));
    const top = el('div', 'fx-top');

    // Sync row: toggle + division selector
    const syncRow = el('div', 'row wide');
    syncRow.appendChild(el('label', null, 'Sync'));
    const ctrls = el('div', 'sync-ctrls');
    const syncBtn = el('button', 'mini-toggle');
    syncBtn.textContent = delayCfg.sync ? 'On' : 'Off';
    if (delayCfg.sync) syncBtn.classList.add('on');
    const divSel = el('select');
    Object.keys(DELAY_DIVS).forEach(k => {
      const op = el('option', null, k); op.value = k;
      if (k === delayCfg.div) op.selected = true;
      divSel.appendChild(op);
    });
    divSel.disabled = !delayCfg.sync;
    ctrls.appendChild(syncBtn);
    ctrls.appendChild(divSel);
    syncRow.appendChild(ctrls);
    top.appendChild(syncRow);

    // Time row (manually built so we can refresh display when sync mode changes)
    const timeRow = el('div', 'row rotary-row');
    timeRow.appendChild(el('label', null, 'Time'));
    const currentT = delayCfg.sync ? computeDelaySync() : delayCfg.time;
    const timeVal = el('span', 'v', currentT.toFixed(2));
    const timeDial = makeRotary(0.02, 1.5, currentT, (raw) => {
      if (delayCfg.sync) {
        // Snap back to the synced value; the user can't override while synced.
        timeDial._setValue(computeDelaySync());
        return;
      }
      const v = Math.round(raw * 100) / 100;
      delayCfg.time = v;
      timeVal.textContent = v.toFixed(2);
      applyDelayTime();
    }, v => v.toFixed(2));
    timeRow.appendChild(timeDial);
    timeRow.appendChild(timeVal);
    top.appendChild(timeRow);

    function refreshTimeDisplay() {
      const t = delayCfg.sync ? computeDelaySync() : delayCfg.time;
      timeDial._setValue(t);
      timeVal.textContent = t.toFixed(2);
    }
    delayCfg._refreshUI = refreshTimeDisplay;

    syncBtn.addEventListener('click', () => {
      delayCfg.sync = !delayCfg.sync;
      syncBtn.textContent = delayCfg.sync ? 'On' : 'Off';
      syncBtn.classList.toggle('on', delayCfg.sync);
      divSel.disabled = !delayCfg.sync;
      applyDelayTime();
      refreshTimeDisplay();
    });
    divSel.addEventListener('change', () => {
      delayCfg.div = divSel.value;
      if (delayCfg.sync) {
        applyDelayTime();
        refreshTimeDisplay();
      }
    });

    sideRow(top, 'Fbk',  0, 0.95, 0.01, delayCfg.fb, v => {
      delayCfg.fb = v;
      if (delayFb) delayFb.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
    }, v => v.toFixed(2));
    m.appendChild(top);
    sideRowVerticalFader(m, 'Wet', 0, 1, 0.01, delayCfg.wet, v => {
      delayCfg.wet = v;
      if (delayWet) delayWet.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
    }, v => v.toFixed(2));
  }
  function buildSpaceEcho() {
    const m = document.getElementById('space-echo');

    ctrls.appendChild(syncBtn);
    ctrls.appendChild(divSel);

    // Base time (H1)
    const timeRow = el('div', 'row rotary-row');

    const startT = spaceEchoCfg.sync ? computeSpaceBase() : spaceEchoCfg.baseTime;
    const timeVal = el('span', 'v', startT.toFixed(3));
    const timeDial = makeRotary(0.04, 0.6, startT, (raw) => {
      if (spaceEchoCfg.sync) { timeDial._setValue(computeSpaceBase()); return; }
      const v = Math.round(raw * 200) / 200;   // 0.005 step
      spaceEchoCfg.baseTime = v;
      timeVal.textContent = v.toFixed(3);
      applySpaceEchoTimes();

    timeRow.appendChild(timeDial);

      refreshSpaceTimeUI();

      spaceEchoCfg.div = divSel.value;
