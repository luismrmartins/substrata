<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>substrata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light theme — Warm White */
    --bg: #FDFCF4;
    --text: #2A2C2F;
    --muted: #B3ABA3;
    --line: #ECE8E3;
    --cell-off: transparent;
    --cell-on: #8B5CF6;
    --cell-border: #B3ABA3;
    --cell-playing: #8B5CF6;
    --canvas-ink: #2A2C2F;
    --accent: #8B5CF6;
    --dot: rgba(42, 44, 47, 0.07);
  }
  body.dark {
    /* Dark theme — Meteorite Black */
    --bg: #2A2C2F;
    --text: #FDFCF4;
    --muted: #B3ABA3;
    --line: #3F4145;
    --cell-off: transparent;
    --cell-on: #8B5CF6;
    --cell-border: #5A5C60;
    --cell-playing: #8B5CF6;
    --canvas-ink: #FDFCF4;
    --accent: #8B5CF6;
    --dot: rgba(253, 252, 244, 0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', ui-monospace, Menlo, monospace;
    font-weight: 400;
    font-size: 11px;
    line-height: 1.4;
  }
  body {
    padding: 18px 20px;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><circle cx='1' cy='1' r='1' fill='%232A2C2F' fill-opacity='0.07'/></svg>");
    background-repeat: repeat;
  }
  body.dark {
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><circle cx='1' cy='1' r='1' fill='%23FDFCF4' fill-opacity='0.05'/></svg>");
  }
  h2 { font-weight: 500; margin: 0; letter-spacing: 0.5px; font-size: 10px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

  h1.title {
    margin: 0;
    line-height: 1;
    display: block;
  }
  h1.title svg {
    display: block;
    height: 22px;
    width: auto;
  }
  h1.title .logo-ink    { fill: var(--text); }
  h1.title .logo-accent { fill: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }
  /* Side effects panel only shows on the Effects tab */
  .side { display: none; }
  /* Effects layout: every block (fx-racks · effect modules · master) is a
     full-height card sitting side-by-side in a single horizontal flex row.
     If the row is wider than the viewport, scroll horizontally — no
     module ever wraps to a second row.

     In effects mode the body becomes a flex column locked to the
     viewport, so .side genuinely fills the leftover space (the bottom
     padding reserved for the fixed decks mixer is still respected via
     padding-bottom on body). No more guess-the-overhead calc, no more
     whitespace gap below the cards. */
  body.mode-effects { --side-bottom: 240px; }
  body.mode-effects.mixer-collapsed { --side-bottom: 40px; }
  body.mode-effects {
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
    overflow: hidden;
  }
  body.mode-effects .layout {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  body.mode-effects main {
    flex: 0 0 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  body.mode-effects .side {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: row;
    gap: 12px;
    align-items: stretch;
    overflow-x: auto;
    overflow-y: hidden;
  }
  /* .fx-section is the original HTML grouping (Mastering / Filters /
     Sends). In this layout the section box itself isn't rendered as a
     box — display: contents flattens it so its .module children become
     direct flex children of .side, side-by-side with fx-racks + master. */
  body.mode-effects .fx-section { display: contents; }

  /* Order pin: fx-racks always leftmost, master always rightmost. The
     order keyword overrides the HTML source order. */
  body.mode-effects #fx-racks { order: -10; position: static; top: auto; align-self: stretch; }
  body.mode-effects #master   { order:  10; position: static; top: auto; align-self: stretch; height: auto; }

  /* Every block — fx-racks, every effect module, master — shares the
     same card shell. Fixed width (70 % of the previous 220 px → 154 px),
     stretched to the full side height. Flex column: dials sit at the
     top in natural order, vfader-row gets pushed to the bottom via
     margin-top: auto. */
  body.mode-effects .module {
    flex: 0 0 154px;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 10px 14px;
    background: var(--bg);
    min-height: 0;
    height: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }
  body.mode-effects .module h2 { margin: 0 0 4px; padding: 0; border: none; font-size: 11px; }
  /* Top knobs area — single column for breathing room now that each
     card is a tall narrow strip. Selector / sync rows still get full
     width via .row.wide. */
  body.mode-effects .module .fx-top {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  /* Vertical fader pinned to the bottom of every card via margin-top:
     auto, with a thin separator above dividing the dials from the
     fader area. */
  body.mode-effects .module > .row.vfader-row {
    margin-top: auto;
    border-top: 1px solid var(--line);
  }
  /* Each row inside the .fx-top knobs area — narrow card means we go
     back to the standard label / dial / value layout. */
  body.mode-effects .module .fx-top > .row.rotary-row {
    grid-template-columns: 38px auto minmax(0, 1fr);
    column-gap: 6px;
  }
  body.mode-effects .module .fx-top > .row.eq-row.rotary-row {
    grid-template-columns: 38px auto minmax(0, 1fr) 18px;
  }
  body.mode-effects .module .fx-top > .row label { font-size: 9px; }
  /* Vertical fader — centered column (label · slider · value). The
     slider's pixel height is set by resizeEffectsFaders() at render
     time so it always fills the room below the knobs (≥60% of card). */
  /* vfader-row is a flex column pinned to the card bottom. Inside:
     label, vfader-wrap, then the slider value sits at the bottom of
     the wrap. The slider height itself is set by JS to 55 % of the
     card height — guarantees consistent fader sizing across cards. */
  body.mode-effects .module .row.vfader-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding-top: 8px;
  }
  body.mode-effects .module .row.vfader-row > label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }
  body.mode-effects .module .vfader-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 24px;
  }
  body.mode-effects .module .vfader {
    width: 24px;
    /* Default fallback — JS overrides via inline style to fill wrap. */
    height: 200px;
    min-height: 60px;
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    writing-mode: bt-lr;
    accent-color: var(--accent);
    margin: 0;
  }
  body.mode-effects .module .vfader-row .v {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-size: 10px;
  }
  /* FX rack list — replaces the dropdown. Scrollable vertical list with
     subtle section headers (Factory / User) and an accent highlight on
     the selected entry. Lives inside the fx-racks card. */
  body.mode-effects #fx-racks {
    overflow-y: hidden;
  }
  body.mode-effects .fx-rack-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0 -4px;
    padding: 0 4px;
  }
  body.mode-effects .fx-rack-section {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    padding: 8px 2px 2px;
  }
  body.mode-effects .fx-rack-section:first-child { padding-top: 0; }
  body.mode-effects .fx-rack-item {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-align: left;
    padding: 5px 8px;
    cursor: pointer;
  }
  body.mode-effects .fx-rack-item:hover { background: rgba(139, 92, 246, 0.08); }
  body.mode-effects .fx-rack-item.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  body.mode-effects .fx-rack-empty {
    font-size: 10px;
    color: var(--muted);
    padding: 12px 4px;
    text-align: center;
  }
  body.mode-effects .fx-rack-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  body.mode-effects .fx-rack-actions button { flex: 1; }
  @media (max-width: 900px) {
    /* On narrow viewports drop the side-by-side card row and let the
       blocks stack vertically with a normal page scroll. */
    body.mode-effects .side {
      flex-direction: column;
      height: auto;
      overflow-x: hidden;
      overflow-y: visible;
      align-items: stretch;
    }
    body.mode-effects .module {
      flex: 0 0 auto;
      width: 100%;
      min-height: 320px;
    }
  }
  body.mode-effects .fx-section-title {
    grid-column: 1 / -1;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-weight: 600;
    margin: 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  /* Hidden when not in Effects mode (mirrors .side itself). */
  .fx-section, .fx-section-title { display: none; }

  /* Three-cell layout: left (logo + transport ctrls), center (mode tabs),
     right (everything else). Grid keeps the center cell at the exact
     midpoint even when the two sides have different widths. */
  .transport {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .transport-left {
    display: flex;
    align-items: center;
    gap: 14px;
    justify-self: start;
  }
  .transport-center { justify-self: center; }
  .transport-right {
    display: flex;
    align-items: center;
    gap: 14px;
    justify-self: end;
  }
  .transport .field { display: flex; align-items: center; gap: 8px; }
  .transport label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .transport input[type="number"] {
    width: 56px;
    background: transparent; color: var(--text);
    border: none; border-bottom: 1px solid var(--line);
    padding: 2px 0; font: inherit; text-align: right;
  }
  .transport input:focus { outline: none; border-bottom-color: var(--text); }
  button.play {
    background: var(--accent); color: #fff;
    border: none;
    width: 34px; height: 28px;
    padding: 0;
    font: inherit; font-size: 13px; font-weight: 500;
    line-height: 1;
    text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button.play.playing { background: transparent; color: var(--text); outline: 1px solid var(--accent); }
  /* Transport record — icon-only dot, same compact box as Play. Uses the
     monochrome accent so it blends with the rest of the transport. */
  button.rec {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--cell-border);
    width: 34px; height: 28px;
    padding: 0;
    font: inherit; font-size: 16px; line-height: 1;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button.rec:hover { border-color: var(--text); }
  button.rec.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .transport button.small,
  .live-controls button.small,
  .module button.small,
  .morph-buttons button.small {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .transport button.small:hover,
  .live-controls button.small:hover,
  .module button.small:hover,
  .morph-buttons button.small:hover { border-color: var(--text); }
  .transport button.small.on,
  .live-controls button.small.on,
  .module button.small.on,
  .morph-buttons button.small.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .mode-toggle {
    display: inline-flex;
    border: 1px solid var(--cell-border);
  }
  .mode-toggle button {
    background: transparent;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 14px;
    cursor: pointer;
    border-right: 1px solid var(--cell-border);
  }
  .mode-toggle button:last-child { border-right: none; }
  .mode-toggle button.on { background: var(--text); color: var(--bg); }

  .tabs {
    display: inline-flex;
    border-bottom: 1px solid var(--line);
  }
  .tabs button {
    background: transparent;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 6px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabs button.on {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .folder-name {
    font-size: 10px;
    color: var(--muted);
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .add-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
  }
  .add-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .add-row button.small {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .add-row button.small:hover { border-color: var(--text); }

  /* Effects mode hides the tracks UI; .side reveals itself via the rule above. */
  body.mode-effects .add-row,
  body.mode-effects #tracks { display: none !important; }

  /* mixing mode: hide everything except name + toggles */
  body.mode-mixing .steps-row,
  body.mode-mixing .track-knobs,
  body.mode-mixing .mic-control,
  body.mode-mixing .mixer,
  body.mode-mixing .add-row { display: none !important; }
  /* Track mode hides the top add-row entirely — adding a new instrument
     is done from the button at the bottom of the instruments column. */
  body.mode-recording .add-row { display: none !important; }

  /* ---- Track mode (recording): three columns — instruments | sequencer
     (with quick controls above) | details (Instrument + Channel). */
  /* Padding-bottom reserves room for the fixed mixer at the bottom of the
     viewport so scrollable content above doesn't hide under it. Combined
     with box-sizing: border-box, the body's min-height (100vh from the
     base rule) absorbs the padding instead of adding to it — without
     this the body would always be 130vh tall and scroll. */
  body.mode-recording {
    box-sizing: border-box;
    padding-bottom: 30vh;
  }
  body.mode-recording #tracks {
    display: grid;
    grid-template-columns: 220px auto minmax(280px, 1fr);
    gap: 24px;
    /* Lock the grid to the viewport's available height (viewport - top
       transport area - fixed bottom mixer) so any column that overflows
       scrolls within itself instead of pushing the whole page taller. */
    align-items: stretch;
    height: calc(70vh - 130px);
    overflow: hidden;
  }
  /* Each column scrolls independently. min-height: 0 lets a grid item
     shrink below its intrinsic content size and become scrollable. */
  body.mode-recording .panel-instruments,
  body.mode-recording .panel-sequencer,
  body.mode-recording .panel-details {
    max-height: 100%;
    min-height: 0;
    overflow-y: auto;
  }
  .panel-instruments {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    /* Divider line between instruments list and sequencer */
    padding-right: 24px;
    border-right: 1px solid var(--line);
  }
  .panel-sequencer   { min-width: 0; }
  .panel-details     {
    min-width: 0;
    padding-left: 24px;
    border-left: 1px solid var(--line);
    /* Clip horizontal overflow so a wide select / waveform / knob row
       can't push a horizontal scroll on the column. */
    overflow-x: hidden;
  }
  /* Make sure every form control inside the details panel can shrink
     below its intrinsic content width — otherwise long preset names or
     8-knob ADSR rows force the column to grow. */
  .panel-details .knob { min-width: 0; flex-shrink: 1; }
  .panel-details .knob select,
  .panel-details .knob input[type="number"] { max-width: 100%; min-width: 0; }
  .panel-details .group,
  .panel-details .group-row,
  .panel-details .knobs-section,
  .panel-details .knobs-row { min-width: 0; max-width: 100%; }
  .panel-details select { max-width: 100%; }
  /* Track-name headers share the exact same style across the instruments
     list, the sequencer column header, and each details section header. */
  .panel-track-name,
  .knobs-section-name,
  .instrument-item .track-name input.name-input {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.3px;
  }
  .panel-track-name-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  /* Pattern bank selector (A/B/C/D) — small toggle row that switches
     between four step-sequence snapshots for the same instrument. */
  .pattern-banks {
    display: flex;
    gap: 4px;
  }
  .pattern-bank-btn {
    width: 22px;
    height: 22px;
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    padding: 0;
  }
  .pattern-bank-btn:hover { border-color: var(--text); }
  .pattern-bank-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  /* Sequence-edit actions sit between the bank selector and the preview
     button. Visually similar to the bank-selector buttons. */
  .seq-actions {
    display: flex;
    gap: 4px;
  }
  .seq-action-btn {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    width: 26px;
    height: 22px;
    padding: 0;
    cursor: pointer;
    text-align: center;
  }
  .seq-action-btn:hover { border-color: var(--accent); color: var(--accent); }
  /* Preview button (Track tab, right of the bank selector) */
  .panel-track-name-row .pattern-preview {
    margin-left: auto;
  }
  .pattern-preview {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .pattern-preview:hover { border-color: var(--text); }
  .panel-seq-header {
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .panel-seq-header .group { border-left: none; padding-left: 0; }
  /* Sequencer step grid: at most 16 cells per row — wraps to additional
     rows for longer patterns. Wrapped in a max-height container so that
     128-step patterns scroll instead of pushing the layout past the
     fixed bottom mixer. */
  .panel-sequencer {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-sequencer .steps-row {
    display: grid;
    grid-template-columns: repeat(16, auto);
    gap: 3px;
    width: max-content;
  }
  /* Live mode: stack name + pattern banks vertically inside the strip */
  body.mode-live .live-name-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 0 0 96px;
    min-width: 0;
  }
  body.mode-live .live-name-wrap .pattern-bank-btn {
    width: 18px;
    height: 18px;
    font-size: 9px;
  }
  .panel-details .track-knobs {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    margin: 0;
    padding: 0;
    border-top: none;
  }
  .panel-empty {
    font-size: 11px;
    color: var(--muted);
    padding: 14px 12px;
    border: 1px dashed var(--line);
    border-radius: 3px;
    text-align: center;
  }
  .instrument-item {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color 80ms ease, background 80ms ease;
  }
  .instrument-item:hover { border-color: var(--muted); }
  .instrument-item.selected {
    border-color: var(--accent);
    background: rgba(139, 92, 246, 0.05);
  }
  .instrument-item .track-meta {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .instrument-item .track-name {
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .instrument-item .track-name .chev { display: none; }
  .instrument-item .toggles {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 3px;
  }
  .instrument-item .toggle { width: 22px; height: 22px; font-size: 9px; }
  /* R + nudge buttons live on the sequencer header in Track mode, not in
     the per-instrument toggle row. */
  body.mode-recording .instrument-item .toggle.rnd,
  body.mode-recording .instrument-item .toggle.sync,
  body.mode-recording .instrument-item .toggle.nudge { display: none !important; }
  /* Add-instrument button + popout menu at the bottom of the instruments
     column (replaces the old top-row + Drum / + Bass / … strip). */
  .add-instrument-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
  }
  .add-instrument-btn {
    background: transparent;
    border: 1px dashed var(--cell-border);
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.4px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: border-color 80ms ease, color 80ms ease;
  }
  .add-instrument-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-instrument-btn.on    { border-color: var(--accent); color: var(--accent); border-style: solid; }
  .add-instrument-menu {
    display: none;
    flex-direction: column;
    gap: 3px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  .add-instrument-menu.open { display: flex; }
  .add-instrument-option {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    font: inherit;
    font-size: 11px;
    padding: 6px 10px;
    cursor: pointer;
    text-align: left;
  }
  .add-instrument-option:hover {
    background: rgba(139, 92, 246, 0.08);
    border-color: var(--accent);
    color: var(--accent);
  }
  .panel-sequencer .mic-control { margin: 0; }
  /* Sections in the right-side details panel — no boxes, stacked
     vertically and separated by horizontal divider lines. */
  .knobs-section {
    padding: 0;
    border: none;
  }
  .knobs-section + .knobs-section {
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-top: 14px;
  }
  .knobs-section-head {
    margin-bottom: 10px;
  }
  .knobs-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 2px;
  }
  /* Each instrument group (Osc A / Osc B / Filter / Envs / LFO / …) gets
     its own row so they read top-to-bottom instead of being packed into a
     wrap. Group internals still flow horizontally. */
  .knobs-section .knobs-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .knobs-section .knobs-row > .group {
    border-left: none;
    padding-left: 0;
    padding-right: 0;
  }
  .knobs-section .knobs-row > .group + .group {
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .knobs-section .knobs-row .group-row {
    flex-wrap: wrap;
    gap: 14px;
  }
  /* Bottom mixer strip — pinned to the bottom 30vh of the viewport so
     the divider line above it always sits at 70 % from the top, no
     matter how short the rest of the Track view is. */
  .panel-mixer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 8px;
    padding: 16px 20px 16px 20px;
    background: var(--bg);
    border-top: 1px solid var(--line);
    height: 30vh;
    min-height: 240px;
    box-sizing: border-box;
    z-index: 4;
  }
  .mini-channel {
    flex: 0 0 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 6px;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 80ms ease;
  }
  .mini-channel:hover { border-color: var(--muted); }
  .mini-channel.selected { border-color: var(--accent); }
  .mini-channel-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  /* Each strip uses CSS grid so that the mix-strip row has a real pixel
     height (1fr of the remaining space after name + EQ). With an explicit
     parent height, .mix-meter and the appearance:slider-vertical .mix-fader
     finally honour height:100% — no more dead space below the fader. */
  .panel-mixer .mini-channel,
  .panel-mixer .master-strip {
    height: 100%;
    box-sizing: border-box;
    display: grid;
    row-gap: 4px;
  }
  .panel-mixer .mini-channel { grid-template-rows: auto auto auto 1fr; }
  .panel-mixer .master-strip { grid-template-rows: auto auto 1fr; }
  /* Pan row sits between the channel name and the EQ. Horizontal slider
     because pan is left-to-right; double-click recenters. */
  .mini-pan-row {
    display: grid;
    grid-template-columns: 22px 1fr 26px;
    align-items: center;
    column-gap: 4px;
    padding: 0 4px;
  }
  .mini-pan-row .pan-label {
    font-size: 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .mini-pan-row .mini-pan {
    width: 100%;
    height: 12px;
    accent-color: var(--accent);
    margin: 0;
    cursor: ew-resize;
  }
  .mini-pan-row .pan-val {
    font-size: 8px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .panel-mixer .mix-eq-wrap { margin-top: 0; padding: 4px 6px; gap: 3px; }
  .panel-mixer .mix-strip {
    min-height: 0;
    height: 100%;
    align-items: stretch;
    justify-self: center;
    justify-content: center;
    width: 100%;
    margin-top: 0;
  }
  .panel-mixer .mix-meter { height: 100%; min-height: 0; }
  .panel-mixer .mix-fader-wrap {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 2px;
  }
  .panel-mixer .mix-fader {
    flex: 1 1 0;
    min-height: 0;
    height: 100%;
  }
  /* Master strip in the bottom mixer — same shape as a mini-channel,
     accent-bordered, pushed to the right with margin-left:auto. */
  .panel-mixer .master-strip {
    flex: 0 0 120px;
    flex-direction: column;
    align-items: center;
    padding: 8px 6px;
    border-radius: 4px;
    margin-left: auto;
  }
  .panel-mixer .master-strip .track-name {
    margin-bottom: 4px;
  }
  @media (max-width: 1100px) {
    body.mode-recording #tracks {
      grid-template-columns: 200px 1fr;
    }
    .panel-details {
      grid-column: 1 / -1;
      border-left: none;
      border-top: 1px solid var(--line);
      padding-left: 0;
      padding-top: 14px;
      margin-top: 4px;
    }
  }
  @media (max-width: 900px) {
    body.mode-recording #tracks { grid-template-columns: 1fr; }
    .panel-instruments {
      padding-right: 0;
      border-right: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }
  }

  /* Mix mode — vertical channel strips. Master is pinned to the right of
     the viewport via a grid + sticky column; every other channel stacks in
     a wrapping flex grid on the left. */
  body.mode-mixing #tracks {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: start;
  }
  .mix-channels-left {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-start;
  }
  .mix-channels-right {
    position: sticky;
    right: 0;
    align-self: start;
    padding-left: 12px;
    border-left: 1px solid var(--line);
  }
  body.mode-mixing .track {
    display: flex !important;
    flex-direction: column;
    align-items: center;
    width: 110px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 6px;
    grid-template-columns: unset;
    overflow: hidden;
  }
  body.mode-mixing .track-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    overflow: visible;
    width: 100%;
  }
  body.mode-mixing .track-name {
    font-size: 10px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    cursor: default;
    font-weight: 500;
  }
  body.mode-mixing .track-name .chev { display: none; }
  body.mode-mixing .track-name input.name-input {
    width: 82px;
    text-align: center;
    font-size: 10px;
    border-bottom: 1px solid var(--line);
  }
  body.mode-mixing .toggles {
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px;
    max-width: 86px;
  }
  body.mode-mixing .toggle { width: 18px; height: 18px; font-size: 9px; }
  body.mode-mixing .mix-fader-wrap,
  .panel-mixer .mix-fader-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }

  /* The fader strip itself — vertical orientation across modern browsers */
  .mix-fader-wrap { display: none; }
  .mix-fader {
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    writing-mode: vertical-lr;
    direction: rtl;
    width: 22px;
    height: 180px;
    accent-color: var(--accent);
    cursor: ns-resize;
  }
  .mix-vol-val {
    font-size: 8px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Mix-mode 3-band EQ + meter + master strip */
  .mix-eq-wrap, .mix-strip { display: none; }
  body.mode-mixing .mix-eq-wrap,
  .panel-mixer .mix-eq-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
    width: 100%;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  body.mode-mixing .mix-strip,
  .panel-mixer .mix-strip {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }
  body.mode-mixing .mix-fader-wrap,
  .panel-mixer .mix-fader-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  /* Each EQ band stacks label-and-value above the slider so the slider gets
     the full strip width — at 96px channel width that means ~80px of slider
     instead of the ~58px we'd get from a single inline row. */
  .mix-eq-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 4px;
    row-gap: 1px;
    font-size: 8px;
    color: var(--muted);
    width: 100%;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  /* Rotary-style row — single line with label · dial · value · kill.
     Switched to flex so the existing range-only grid rules don't fight
     with the new four-cell layout. */
  .mix-eq-row.mix-eq-rotary {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 4px;
  }
  .mix-eq-row.mix-eq-rotary .eq-label { width: 16px; flex-shrink: 0; }
  .mix-eq-row.mix-eq-rotary .rotary   { width: 24px; height: 24px; flex-shrink: 0; }
  /* Fixed-width value column wide enough to hold "-40.0" so the channel
     strip's width never changes as the user dials the EQ. min-width: 0
     keeps the column from forcing its parent wider on weird overflows. */
  .mix-eq-row.mix-eq-rotary .eq-val   {
    flex: 0 0 30px;
    min-width: 0;
    text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .mix-eq-row.mix-eq-rotary .eq-kill  { flex-shrink: 0; }
  .mix-eq-row span.eq-label { text-align: left; }
  .mix-eq-row span.eq-val {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .mix-eq-row input[type="range"] {
    grid-column: 1;
    width: 100%;
    height: 14px;
    accent-color: var(--text);
    margin: 0;
  }
  .mix-eq-row .eq-kill {
    grid-column: 2;
    align-self: center;
  }
  /* Meter wrapper — left column carries the dB scale labels (0 / -6 / -12
     / -24), right column is the meter itself. Wrap auto-sizes to the
     meter height so the existing resize logic keeps working. */
  .mix-meter-wrap {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 3px;
  }
  .mix-meter-scale {
    position: relative;
    flex: 0 0 14px;
    height: auto;
  }
  .mix-meter-tick {
    position: absolute;
    right: 0;
    transform: translateY(-50%);
    font-size: 7px;
    line-height: 1;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }
  /* Segmented meter — fixed number of small cells stacked bottom-up.
     Each segment has a faint colour matching its position on the
     green→yellow→red scale, so the user sees the scale even when no
     signal is playing. Lit segments use the full colour. */
  .mix-meter {
    width: 10px;
    height: 180px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column-reverse;
    gap: 1px;
    overflow: hidden;
  }
  .mix-meter-seg {
    flex: 1;
    min-height: 2px;
    background: var(--seg-off);
    border-radius: 1px;
    transition: background 50ms linear;
  }
  .mix-meter-seg.lit { background: var(--seg-on); }
  .mix-meter-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0%;
    background: linear-gradient(to top, #2ecc40 0%, #2ecc40 55%, #ffdc00 75%, #ff4136 92%);
  }
  .master-strip { display: none; }
  body.mode-mixing .master-strip,
  .panel-mixer .master-strip {
    display: flex !important;
    border-left: 3px solid var(--accent);
  }
  body.mode-mixing .master-strip .track-name,
  .panel-mixer .master-strip .track-name {
    color: var(--accent);
    font-weight: 600;
    font-size: 11px;
  }
  /* Per-channel sends — visible only on regular channel strips in Mix mode */
  .mix-sends-wrap { display: none; }
  body.mode-mixing .track:not(.master-strip) .mix-sends-wrap {
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 100%;
    margin-top: 6px;
    padding: 6px 4px 4px;
    border-top: 1px solid var(--line);
  }
  .mix-sends-title {
    font-size: 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    text-align: center;
    margin-bottom: 2px;
  }
  .mix-send-row {
    display: grid;
    grid-template-columns: 22px 1fr 24px;
    align-items: center;
    column-gap: 4px;
    font-size: 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .mix-send-row .send-label { text-align: left; }
  .mix-send-row .send-val {
    text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .mix-send-row input[type="range"] {
    width: 100%;
    height: 10px;
    accent-color: var(--text);
    margin: 0;
  }

  /* ----- Live mode: two-deck side-by-side live mixer ----- */
  .live-controls { display: none; }
  .live-vol-row { display: none; }
  .live-morph-row { display: none; }

  /* ---- A / B / C morph (per-track) ---- */
  .morph-ticks {
    display: flex;
    justify-content: space-between;
    margin: 4px 2px 2px;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .morph-slot {
    text-align: center;
    width: 14px;
  }
  .morph-slot.has {
    color: var(--accent);
    font-weight: 600;
  }
  .morph-slider {
    width: 100%;
    accent-color: var(--accent);
    height: 14px;
    cursor: ew-resize;
  }
  .morph-buttons {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .morph-buttons .small { flex: 1; }
  /* Morph cell: label on the left spans both grid rows, A/B/C ticks
     sit immediately above the slider on the right, slider underneath.
     Label-then-ticks-on-top-of-slider matches the user's reference
     screenshot. */
  body.mode-live .live-morph-row {
    display: grid;
    grid-template-columns: auto minmax(100px, 1fr);
    grid-template-rows: auto auto;
    column-gap: 8px;
    row-gap: 2px;
    align-items: center;
    margin-top: 0;
    width: 100%;
    min-width: 180px;
  }
  body.mode-live .live-morph-row .live-feature-label {
    grid-row: 1 / 3;
    grid-column: 1;
    margin: 0;
    align-self: center;
  }
  body.mode-live .live-morph-row .morph-ticks {
    grid-row: 1;
    grid-column: 2;
    display: flex;
    justify-content: space-between;
    margin: 0;
    padding: 0 4px;
  }
  body.mode-live .live-morph-row .morph-slider {
    grid-row: 2;
    grid-column: 2;
    width: 100%;
    height: 12px;
  }
  body.mode-live .live-morph-row .morph-buttons { display: none; }
  body.mode-live .live-morph-row .morph-ticks { margin: 0 2px; }
  body.mode-live .add-row,
  body.mode-live .mixer,
  body.mode-live .steps-row,
  body.mode-live .track-knobs,
  body.mode-live .mic-control { display: none !important; }
  body.mode-live .live-controls {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    column-gap: 24px;
    align-items: start;
    margin: 6px 0 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .live-main-controls {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  .live-decks-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  /* Tracks (deck channels) live in the right column too — same 260px offset
     keeps the deck A and B columns aligned with the controls above. */
  body.mode-live #tracks {
    margin-left: 284px;
  }
  /* Cue — stage multiple projects, then send each to Deck A or Deck B.
     Lives as a fixed-width column on the left of Live mode, sticky so it
     stays visible while scrolling through deck channels. */
  .live-cue {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    position: sticky;
    top: 12px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
  }
  .live-cue.drag-over {
    background: rgba(139, 92, 246, 0.06);
    border-color: var(--accent);
  }
  .live-cue-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .live-cue-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-weight: 600;
  }
  .live-cue-count {
    font-size: 10px;
    color: var(--muted);
  }
  .live-cue-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .live-cue-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .live-cue-empty {
    font-size: 10px;
    color: var(--muted);
    padding: 10px 0;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 3px;
  }
  .live-cue-item {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    grid-template-areas:
      "name name name name"
      "meta a    b    rm";
    align-items: center;
    column-gap: 4px;
    row-gap: 4px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 11px;
  }
  .live-cue-name {
    grid-area: name;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .live-cue-meta {
    grid-area: meta;
    font-size: 9px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .live-cue-deck-btn {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 9px;
    cursor: pointer;
    min-width: 28px;
  }
  .live-cue-item .live-cue-deck-btn:nth-of-type(1) { grid-area: a; }
  .live-cue-item .live-cue-deck-btn:nth-of-type(2) { grid-area: b; }
  .live-cue-deck-btn:hover { border-color: var(--accent); color: var(--accent); }
  .live-cue-rm {
    grid-area: rm;
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    padding: 4px 7px;
    cursor: pointer;
  }
  .live-cue-rm:hover { border-color: var(--text); color: var(--text); }
  .live-deck-transport {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  /* Live master bar — bottom of the live controls. Master EQ + volume so
     the user can shape the whole mix during a live set without leaving the
     Live tab. */
  .live-master-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .live-master-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-weight: 600;
    flex: 0 0 auto;
  }
  .live-master-eq {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 0 0 auto;
  }
  /* Compact rotary layout — label · dial · value · kill, single line. */
  .live-master-eq-row {
    display: flex;
    align-items: center;
    gap: 6px;

  body.mode-live #tracks {
    display: grid;
    grid-template-columns: 1fr 1fr;

    align-items: start;

  .live-deck-tracks {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 80px;
  }
  /* Two-row channel strip:
       Row 1: name + playhead | sections (banks + groups) | tools
              (arm/mute/solo/randomize/sync/nudge)
       Row 2: volume                                       | morphs
     Tools cell hugs the right edge so the toggles sit just after the
     groups; volume + morphs share the lower row. */
  body.mode-live .track {
    display: grid !important;
    grid-template-columns: minmax(150px, max-content) auto auto minmax(180px, 1fr);
    grid-template-areas:
      "name   sections tools  morphs"
      "volume volume   volume volume";
    column-gap: 14px;
    row-gap: 6px;
    /* align-items: start keeps sections + tools + morphs on the same
       baseline as the track-name text. Without this they'd centre
       vertically inside the row, sitting between the name and the
       playhead bar that lives under it. */
    align-items: start;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 10px;
    overflow: hidden;
    width: 100%;
  }
  body.mode-live .track + .track { margin-top: 3px; }

     content (toggle icons, fader) is self-evident. The Sequences label
     stays visible. */
  body.mode-live .live-cell-tools .live-feature-label,
  body.mode-live .live-cell-volume .live-feature-label { display: none; }

  body.mode-live .live-cell-sections { grid-area: sections; }
  body.mode-live .live-cell-tools    { grid-area: tools; }

    content: '▸ ';
    font-size: 8px;
    opacity: 0.65;
  }
  .group:not(.collapsed) .label::before { content: '▾ '; }
  .group.collapsed .group-row { display: none; }
  .group-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toggle.pending {
    outline: 1px dashed var(--accent);
    outline-offset: 1px;
  }
  .group.eq-band { gap: 4px; padding: 3px 6px; }
  .group.eq-band .group-row { flex-direction: column; align-items: stretch; }
  .group.eq-band .knob { flex-direction: column; align-items: stretch; gap: 2px; }
  .group.eq-band .knob input[type="range"] { width: 50px; }
  .group.eq-band .knob .rotary { width: 22px; height: 22px; }
  .eq-head { display: flex; justify-content: center; }
  .toggle.eq-on { width: 18px; height: 14px; font-size: 9px; }

  /* ---- side ---- */
  /* NOTE: .side default display is `none` (declared earlier). It is only revealed
     in `body.mode-effects` via the rule above. Do NOT set a `display` value here
     or it will leak the effects panel onto the Track and Mix tabs. */
  .side .module h2 { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .side .row {
    display: grid;
    grid-template-columns: 56px 1fr 34px;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 10px;
  }
  .side .row label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .side .row input[type="range"] { width: 100%; accent-color: var(--text); height: 12px; }
  .side .row .v { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  /* Effects rotary row — label · dial · value, optional kill cell. The
     dial column is auto-width so the dial sits next to the label. */
  .side .row.rotary-row {
    grid-template-columns: 56px auto 1fr;
    column-gap: 10px;
  }
  .side .row.rotary-row .rotary {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }
  .side .row.rotary-row .v { text-align: left; padding-left: 0; }
  .side .row.eq-row.rotary-row { grid-template-columns: 56px auto 1fr 20px; }
  /* Vertical fader for the master volume — narrow column, short slider. */
  .side .row.vfader-row { grid-template-columns: 56px 1fr; }
  .side .row.vfader-row .vfader-wrap {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
  }
  .side .row.vfader-row .vfader {
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    writing-mode: bt-lr;
    width: 24px;
    height: 110px;
    accent-color: var(--accent);
    margin: 0;
  }
  .side .row.vfader-row .v { color: var(--text); font-variant-numeric: tabular-nums; }
  .side .row select {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 2px 0;
    width: 100%;
    cursor: pointer;
  }
  .side .row select:focus { outline: none; border-bottom-color: var(--text); }
  .side .row.wide { grid-template-columns: 56px 1fr; }
  .side .row.eq-row { grid-template-columns: 56px 1fr 34px 20px; column-gap: 6px; }
  .sync-ctrls { display: flex; gap: 6px; align-items: center; }
  .sync-ctrls select {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 1px 0;
    cursor: pointer;
  }
  .sync-ctrls select:disabled { color: var(--muted); cursor: not-allowed; }
  .mini-toggle {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .mini-toggle:hover { border-color: var(--text); }
  .mini-toggle.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .hint {
    font-size: 9px;
    color: var(--muted);
    margin-left: 6px;
  }

  /* ---- mute/solo ---- */
  .track-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding-top: 2px;
    min-width: 0;
    overflow: hidden;
  }
  .toggles { display: flex; gap: 2px; flex-wrap: wrap; }
  .toggle {
    width: 16px; height: 16px;
    border: 1px solid var(--cell-border);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 9px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    user-select: none;
  }
  .toggle:hover { border-color: var(--text); }
  .toggle.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .mic-control {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 0;
  }
  .mic-control button {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .mic-control button:hover { border-color: var(--text); }
  .mic-control button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .mic-control .status { font-size: 10px; color: var(--muted); }
  button.mic-btn {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button.mic-btn:hover { border-color: var(--text); }
  button.mic-btn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  button.mic-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.mic-btn:disabled:hover { border-color: var(--cell-border); }
  select.preset-select {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 4px 6px;
    max-width: 140px;
    cursor: pointer;
  }
  select.preset-select:focus { outline: none; border-color: var(--text); }
  .sample-status { font-size: 10px; color: var(--muted); padding-left: 4px; }
  .grain-wave, .mic-scope {
    border: 1px solid var(--cell-border);
    background: transparent;
    display: block;
    max-width: 100%;
    width: 100%;
  }
  .grain-wave { height: 50px; }
  .mic-scope  { height: 38px; }
  .sample-area { display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
  /* 4×4 pad grid for the sampler. Each pad is a small square button that
     shows the pad number; selected pad takes the accent colour. */
  .sampler-pads {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    max-width: 220px;
  }
  .sampler-pad {
    aspect-ratio: 1 / 1;
    min-height: 32px;
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    padding: 0;
    transition: background 80ms, color 80ms, border-color 80ms;
  }
  .sampler-pad:hover { border-color: var(--text); color: var(--text); }
  .sampler-pad.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .sampler-pad-ctrls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .sampler-pad-label {
    font-size: 9px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    width: 100%;
  }
  .sampler-wave { height: 70px; }
  .mic-control select.mic-device {
    background: transparent;
    border: 1px solid var(--cell-border);
    color: var(--text);
    font: inherit;
    font-size: 10px;
    padding: 4px 6px;
    max-width: 200px;
    cursor: pointer;
  }
  .mic-control .level {
    width: 110px; height: 6px;
    border: 1px solid var(--cell-border);
    position: relative;
  }
  .mic-control .level-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--text);
    width: 0%;
    transition: width 60ms linear;
  }

  /* ---- mixer / decks (locked to bottom, Effects tab only) ---- */
  .mixer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 10px 20px;
    z-index: 10;
    margin: 0;
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }
  body.mode-effects .mixer { display: block; }
  .mixer h2 { margin-bottom: 10px; }
  .mixer.collapsed { padding: 6px 20px; max-height: none; overflow: visible; }
  .mixer.collapsed > *:not(h2) { display: none; }
  body { padding-bottom: 24px; }
  body.mode-effects { padding-bottom: 240px; }
  body.mode-effects.mixer-collapsed { padding-bottom: 40px; }
  body.mode-mixing { padding-bottom: 0 !important; }

  /* collapsible modules */
  .module.collapsed > *:not(h2) { display: none; }
  .collapse-chev {
    display: inline-block;
    width: 12px;
    color: var(--muted);
    font-size: 10px;
    margin-right: 4px;
  }
  .module h2, .mixer h2 { user-select: none; cursor: pointer; }
  .decks-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px;
    align-items: start;
  }
  .mixer-deck { display: flex; flex-direction: column; gap: 10px; }
  .deck-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 500;
  }
  .deck-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .deck-knobs { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .mixer-xfade {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; min-width: 160px;
  }
  .mixer-xfade input[type="range"] {
    width: 160px; accent-color: var(--text);
  }
  .xfade-label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  /* ---- responsive ---- */
  @media (max-width: 1024px) {
    body { padding: 14px 14px 220px; }
    .layout { gap: 18px; }
  }
  @media (max-width: 720px) {
    body { padding: 12px 10px 12px; }
    body.mode-effects { padding-bottom: 60vh; }
    body.mode-effects.mixer-collapsed { padding-bottom: 40px; }
    .decks-grid { grid-template-columns: 1fr; }
    .mixer-xfade { width: 100%; min-width: 0; }
    .mixer-xfade input[type="range"] { width: 100%; }
    .knob input[type="range"] { width: 80px; }
    h1.title svg { height: 20px; }
    .transport { gap: 8px; flex-wrap: wrap; row-gap: 6px; }
    .add-row { gap: 6px; flex-wrap: wrap; row-gap: 6px; }
    .mixer { max-height: 50vh; }
    body.mode-mixing #tracks { gap: 8px; }
  }
  @media (max-width: 560px) {
    body { padding: 10px 8px 10px; }
    body.mode-effects { padding-bottom: 60vh; }
    body.mode-effects.mixer-collapsed { padding-bottom: 40px; }
    .track { grid-template-columns: 88px 1fr; column-gap: 6px; }
    h1.title svg { height: 18px; }
    .hint { display: none; }
    .folder-name { display: none; }
    .transport { gap: 6px; flex-wrap: wrap; row-gap: 6px; }
    .transport button.small, .mode-toggle button, .tabs button {
      padding: 5px 8px;
      font-size: 9px;
      letter-spacing: 0.3px;
    }
    .transport .field input[type="number"] { width: 46px; }
    button.play { padding: 6px 14px; font-size: 11px; }
    .knobs, .track-knobs { gap: 6px; }
    .group { padding: 2px 5px; gap: 4px; }
    .step { width: 22px; height: 22px; }
    .step-mini { height: 16px; }
    .step-mini button { font-size: 10px; }
    .lane-cell { width: 22px; height: 14px; }
    .toggle { width: 22px; height: 22px; font-size: 11px; }
    .mic-control { flex-wrap: wrap; gap: 8px; }
    .mic-control select.mic-device { max-width: 100%; flex: 1 1 100%; }
    .knob input[type="range"] { width: 72px; }
    .knob input[type="number"] { width: 44px; }
    .track-name input.name-input { width: 66px; font-size: 9px; }
    .add-row button.small { padding: 5px 8px; font-size: 8px; }
    body.mode-mixing .track { width: 88px; }
    body.mode-mixing .toggles { max-width: 80px; }
    .mix-fader { height: 150px; }
  }
  @media (max-width: 400px) {
    body { padding: 8px 6px 8px; }
    .track { grid-template-columns: 76px 1fr; column-gap: 4px; }
    .track-name input.name-input { width: 56px; font-size: 9px; }
    .step { width: 20px; height: 20px; font-size: 8px; }
    .lane-cell { width: 20px; height: 12px; }
    .toggle { width: 20px; height: 20px; font-size: 10px; }
    body.mode-mixing .track { width: 76px; }
    body.mode-mixing .track-name input.name-input { width: 68px; }
    body.mode-mixing .toggles { max-width: 68px; gap: 2px; }
    body.mode-mixing .toggle { width: 16px; height: 16px; font-size: 8px; }
    .mix-fader { width: 20px; height: 130px; }
    .transport button.small, .mode-toggle button, .tabs button {
      padding: 4px 6px;
      font-size: 8px;
    }
  }
</style>
