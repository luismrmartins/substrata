<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>substrata · visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDFCF4;
    --ink: #2A2C2F;
    --muted: #B3ABA3;
    --line: #ECE8E3;
    --accent: #FF5623;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Mono', ui-monospace, Menlo, monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
  }
  .title {
    position: fixed;
    top: 24px;
    left: 28px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    user-select: none;
  }
  .title .accent { color: var(--ink); }
  .vertical {
    position: fixed;
    top: 24px;
    right: 28px;
    z-index: 10;
    writing-mode: vertical-rl;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    user-select: none;
  }
  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    padding: 10px 18px;
    background: rgba(253, 252, 244, 0.85);
    border: 1px solid var(--line);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  button {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--ink);
    font: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 80ms ease;
  }
  button:hover { border-color: var(--ink); }
  button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .status {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-align: center;
    pointer-events: none;
    max-width: 90vw;
  }
  .back-link {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 10px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .back-link:hover { color: var(--ink); }

  /* Fullscreen: hide all UI chrome — visualizer only.
     Both :fullscreen (native) and the .immersive class (manual toggle) hide chrome.
     The .immersive class is also set when entering fullscreen so styles still
     apply if a vendor prefix on :fullscreen is missing. */
  :fullscreen .title,
  :fullscreen .vertical,
  :fullscreen .back-link,
  :fullscreen .controls,
  :fullscreen .status,
  body.immersive .title,
  body.immersive .vertical,
  body.immersive .back-link,
  body.immersive .controls,
  body.immersive .status { display: none !important; }
  :fullscreen, body.immersive { cursor: none; }

  /* Dark modes (chromatic arc, fabric stripes) — invert chrome colours so
     it stays legible against the black canvas. */
  body.mode-2, body.mode-3 { background: #000; color: #ECE8E3; }
  body.mode-2 .title, body.mode-2 .vertical, body.mode-2 .status, body.mode-2 .back-link,
  body.mode-3 .title, body.mode-3 .vertical, body.mode-3 .status, body.mode-3 .back-link { color: #888; }
  body.mode-2 .title .accent, body.mode-3 .title .accent { color: #ECE8E3; }
  body.mode-2 .back-link:hover, body.mode-3 .back-link:hover { color: #ECE8E3; }
  body.mode-2 .controls, body.mode-3 .controls { background: rgba(0, 0, 0, 0.75); border-color: #333; }
  body.mode-2 button, body.mode-3 button { border-color: #555; color: #ECE8E3; }
  body.mode-2 button:hover, body.mode-3 button:hover { border-color: #ECE8E3; }
  body.mode-2 button.on, body.mode-3 button.on { background: #ECE8E3; color: #000; border-color: #ECE8E3; }
  .mode-hint {
    position: fixed;
    bottom: 24px;
    right: 28px;
    z-index: 10;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    user-select: none;
  }
  body.mode-2 .mode-hint, body.mode-3 .mode-hint { color: #888; }
  :fullscreen .mode-hint, body.immersive .mode-hint { display: none !important; }

  @media (max-width: 560px) {
    .title { font-size: 9px; top: 14px; left: 16px; letter-spacing: 1.5px; }
    .vertical { font-size: 9px; top: 14px; right: 16px; }
    .back-link { font-size: 9px; top: 14px; }
    .controls { gap: 6px; padding: 8px 12px; bottom: 16px; }
    button { font-size: 9px; padding: 5px 8px; }
    .status { bottom: 70px; font-size: 9px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="title"><span class="accent">substrata</span> · visualizer</div>
<div class="vertical">武蔵 · 音 · スペクトル</div>
<a class="back-link" href="/">← Back to substrata</a>
<div class="status" id="status">Pick an audio source to start the visualizer.</div>
<div class="controls">
  <button id="start-tab" title="Listen to another browser tab (recommended)">🖥 Tab Audio</button>
  <button id="start-mic" title="Listen to microphone">🎤 Mic</button>
  <button id="mode-1" title="Pink line spectrum (key 1)">1 · LINES</button>
  <button id="mode-2" title="Chromatic arc (key 2)">2 · ARC</button>
  <button id="mode-3" title="Fabric stripes (key 3)">3 · CLOTH</button>
  <button id="fullscreen" title="Toggle full screen (ESC to exit)">⛶</button>
</div>
<div class="mode-hint">1 · LINES &nbsp; 2 · ARC &nbsp; 3 · CLOTH &nbsp; F · FULL</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const status = document.getElementById('status');
  const startTabBtn = document.getElementById('start-tab');
  const startMicBtn = document.getElementById('start-mic');
  const fullscreenBtn = document.getElementById('fullscreen');
  const mode1Btn = document.getElementById('mode-1');
  const mode2Btn = document.getElementById('mode-2');
  const mode3Btn = document.getElementById('mode-3');

  let mode = 1;  // 1 = pink line spectrum, 2 = chromatic arc, 3 = fabric stripes
  function setMode(m) {
    mode = m;
    document.body.classList.toggle('mode-1', m === 1);
    document.body.classList.toggle('mode-2', m === 2);
    document.body.classList.toggle('mode-3', m === 3);
    mode1Btn.classList.toggle('on', m === 1);
    mode2Btn.classList.toggle('on', m === 2);
    mode3Btn.classList.toggle('on', m === 3);
  }

  let audioCtx = null;
  let analyser = null;
  let source = null;
  let stream = null;
  let timeData = null;
  let freqData = null;
  let running = false;

  // ----- audio analysis state -----
  let phase = 0;
  // Smoothed averages
  let subAvg = 0, bassAvg = 0, lowMidAvg = 0, midAvg = 0, highAvg = 0, airAvg = 0;
  // Fast-attack / slow-release envelopes for transient detection
  let subPeak = 0, bassPeak = 0, midPeak = 0, highPeak = 0;
  // Onset event "hits" — flash decays each frame
  let kickHit = 0;          // sub-bass transient (kicks, low toms)
  let bassHit = 0;          // bass / low-mid transient
  let snareHit = 0;         // 200-2k transient (snare, clap, perc)
  let hatHit = 0;           // high band transient (hats, ride, sparkle)
  // Long-term energy used for dynamic range normalisation
  let dynRef = 0.001;

  // Particle pool for hat sparks
  const sparks = [];
  // Ripple shockwaves on kick hits
  const ripples = [];
  // Snare flash bars
  const flashes = [];

  // ----- palette (Musashino-poster pink) -----
  const HUE_BASE = 320;
  const HUE_RANGE = 30;

  function resize() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.fillStyle = '#FDFCF4';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  function setStatus(msg) { status.textContent = msg; }

  function stopExistingStream() {
    if (stream) {
      try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
      stream = null;
    }
    if (source) { try { source.disconnect(); } catch (e) {} source = null; }
  }

  async function startWithStream(newStream, label) {
    stopExistingStream();
    stream = newStream;
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.6;
    timeData = new Uint8Array(analyser.fftSize);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
    setStatus('Listening to ' + label + ' — full-screen for the full effect (⛶)');
    startTabBtn.classList.toggle('on', label === 'tab audio');
    startMicBtn.classList.toggle('on', label === 'mic');
    if (!running) { running = true; draw(); }
  }

  async function startTab() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      setStatus('Tab audio capture is only available in Chrome / Edge.');
      return;
    }
    try {
      const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      s.getVideoTracks().forEach(t => { try { t.stop(); } catch (e) {} s.removeTrack(t); });
      if (s.getAudioTracks().length === 0) {
        setStatus('No audio in the shared tab. Make sure to tick "Share tab audio" in the picker.');
        return;
      }
      await startWithStream(s, 'tab audio');
    } catch (e) {
      setStatus('Tab capture cancelled or denied.');
    }
  }
  async function startMic() {
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      await startWithStream(s, 'mic');
    } catch (e) {
      setStatus('Mic access denied.');
    }
  }
  startTabBtn.addEventListener('click', startTab);
  startMicBtn.addEventListener('click', startMic);

  // ---- fullscreen ----
  function enterFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(() => {});
  }
  function exitFullscreen() {
    const ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (ex) try { ex.call(document); } catch (e) {}
  }
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  }
  fullscreenBtn.addEventListener('click', () => {
    if (isFullscreen()) exitFullscreen();
    else enterFullscreen();
  });
  function onFullscreenChange() {
    document.body.classList.toggle('immersive', isFullscreen());
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);
  // ESC also exits via the browser default; this catches edge cases (e.g. when
  // fullscreen was triggered programmatically and the browser swallowed the key).
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isFullscreen()) exitFullscreen();
    if (e.key === 'f' || e.key === 'F') {
      if (isFullscreen()) exitFullscreen(); else enterFullscreen();
    }
    if (e.key === '1') setMode(1);
    if (e.key === '2') setMode(2);
    if (e.key === '3') setMode(3);
  });
  mode1Btn.addEventListener('click', () => setMode(1));
  mode2Btn.addEventListener('click', () => setMode(2));
  mode3Btn.addEventListener('click', () => setMode(3));
  setMode(1);

  // ----- helpers for onset detection -----
  function bandAvg(arr, startBin, endBin) {
    let s = 0;
    for (let i = startBin; i < endBin; i++) s += arr[i];
    return s / Math.max(1, (endBin - startBin) * 255);
  }

  // ----- main render loop -----
  function draw() {
    if (!running) return;
    requestAnimationFrame(draw);

    const W = canvas.width, H = canvas.height;
    const dpr = Math.max(1, window.devicePixelRatio || 1);

    // Crisp clear — colour depends on the current mode.
    ctx.fillStyle = (mode === 2 || mode === 3) ? '#000000' : '#FDFCF4';
    ctx.fillRect(0, 0, W, H);

    if (!analyser) {
      drawIdleHint(W, H, dpr);
      return;
    }

    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    const bins = freqData.length;

    // Approx frequency bands (assuming ~44.1 kHz, fftSize 2048 -> 1024 bins, ~21.5 Hz per bin):
    //   sub:    0  – 5    (~0-100 Hz)        kicks, sub-bass
    //   bass:   5  – 14   (~100-300 Hz)      bass body, low toms
    //   lowMid: 14 – 46   (~300-1k Hz)       snare body, vox lows
    //   mid:    46 – 140  (~1k-3k Hz)        snare snap, lead body
    //   high:   140 – 280 (~3k-6k Hz)        hat body, presence
    //   air:    280 – 460 (~6k-10k Hz)       hat shimmer, ride
    const subEnd    = Math.min(bins, 5);
    const bassEnd   = Math.min(bins, 14);
    const lowMidEnd = Math.min(bins, 46);
    const midEnd    = Math.min(bins, 140);
    const highEnd   = Math.min(bins, 280);
    const airEnd    = Math.min(bins, 460);

    const subNow    = bandAvg(freqData, 0, subEnd);
    const bassNow   = bandAvg(freqData, subEnd, bassEnd);
    const lowMidNow = bandAvg(freqData, bassEnd, lowMidEnd);
    const midNow    = bandAvg(freqData, lowMidEnd, midEnd);
    const highNow   = bandAvg(freqData, midEnd, highEnd);
    const airNow    = bandAvg(freqData, highEnd, airEnd);

    // Slow smoothed averages (tonal energy)
    subAvg    = subAvg    * 0.85 + subNow    * 0.15;
    bassAvg   = bassAvg   * 0.85 + bassNow   * 0.15;
    lowMidAvg = lowMidAvg * 0.85 + lowMidNow * 0.15;
    midAvg    = midAvg    * 0.85 + midNow    * 0.15;
    highAvg   = highAvg   * 0.85 + highNow   * 0.15;
    airAvg    = airAvg    * 0.85 + airNow    * 0.15;

    // Fast-attack / slow-release per-band envelopes — used for onset detection
    function envUpdate(prev, now) {
      return now > prev ? now : (prev * 0.92 + now * 0.08);
    }
    const newSubPeak  = envUpdate(subPeak,  subNow);
    const newBassPeak = envUpdate(bassPeak, bassNow);
    const newMidPeak  = envUpdate(midPeak,  midNow);
    const newHighPeak = envUpdate(highPeak, (highNow + airNow) * 0.5);

    // Onset detection: instantaneous value sharply above the smoothed floor.
    const subDelta  = subNow  - subAvg;
    const bassDelta = bassNow - bassAvg;
    const midDelta  = lowMidNow - lowMidAvg;
    const hatDelta  = (highNow + airNow) * 0.5 - (highAvg + airAvg) * 0.5;

    // Trigger thresholds — tuned for typical dub-techno mix levels
    if (subDelta > 0.05 && subNow > 0.18 && kickHit < 0.4) kickHit = Math.min(1.4, subDelta * 6);
    if (bassDelta > 0.05 && bassNow > 0.20 && bassHit < 0.4) bassHit = Math.min(1.2, bassDelta * 5);
    if (midDelta > 0.04 && lowMidNow > 0.18 && snareHit < 0.4) snareHit = Math.min(1.0, midDelta * 6);
    if (hatDelta > 0.025 && (highNow + airNow) * 0.5 > 0.10 && hatHit < 0.5) hatHit = Math.min(1.0, hatDelta * 8);

    subPeak = newSubPeak; bassPeak = newBassPeak; midPeak = newMidPeak; highPeak = newHighPeak;

    // Trigger visual events on the rising edges
    if (kickHit > 0.5) spawnRipple(W, H, dpr, kickHit);
    if (snareHit > 0.5) spawnFlash(W, H, dpr, snareHit);
    if (hatHit > 0.3) spawnSparks(W, H, dpr, hatHit);

    // Decay the hit envelopes
    kickHit  *= 0.86;
    bassHit  *= 0.88;
    snareHit *= 0.85;
    hatHit   *= 0.82;

    // Total energy — drives global phase advance and dynamic colouration
    const totalNow = (subNow + bassNow + lowMidNow + midNow + highNow + airNow) / 6;
    dynRef = dynRef * 0.995 + totalNow * 0.005;
    const norm = totalNow / Math.max(0.05, dynRef);

    phase += 0.005 + totalNow * 0.04 + kickHit * 0.05;

    if (mode === 2) { renderArc(W, H, dpr); return; }
    if (mode === 3) { renderCloth(W, H, dpr); return; }

    // ----- background depth: bottom warmth tied to sustained sub/bass -----
    const lowGrad = ctx.createLinearGradient(0, H * 0.55, 0, H);
    const lowAlpha = 0.05 + (subAvg + bassAvg) * 0.45;
    lowGrad.addColorStop(0, 'rgba(220, 60, 150, 0)');
    lowGrad.addColorStop(1, 'rgba(180, 30, 120, ' + lowAlpha.toFixed(3) + ')');
    ctx.fillStyle = lowGrad;
    ctx.fillRect(0, 0, W, H);

    // ----- kick pulse: dark vignette around screen on kick hits -----
    if (kickHit > 0.05) {
      const k = Math.min(1, kickHit);
      const radial = ctx.createRadialGradient(W * 0.5, H * 0.5, W * 0.2, W * 0.5, H * 0.5, W * 0.7);
      radial.addColorStop(0, 'rgba(200, 40, 130, 0)');
      radial.addColorStop(1, 'rgba(140, 20, 100, ' + (0.18 * k).toFixed(3) + ')');
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, W, H);
    }

    // ----- vertical line field (the core spectral display) -----
    const lineSpacing = Math.max(1.2 * dpr, Math.min(2.4 * dpr, W / 600));
    const numLines = Math.floor(W / lineSpacing);

    // Warp amplitude blends sustained mid-range with kick punch
    const warpAmp = (midAvg * 0.5 + lowMidAvg * 0.3 + highAvg * 0.2) * 20 * dpr + kickHit * 14 * dpr;
    // Vertical pulse from kick — lines briefly squash toward centre
    const vSquash = kickHit * 0.07;
    // Horizontal sway from bass — whole field tilts
    const sway = Math.sin(phase * 0.7) * bassAvg * 8 * dpr;

    ctx.lineCap = 'butt';

    for (let i = 0; i < numLines; i++) {
      const x = i * lineSpacing + lineSpacing * 0.5 + sway;
      const t = i / numLines;

      // Each line samples one frequency bin (log-ish — musical octaves spread)
      const binIdx = Math.floor(Math.pow(t, 1.4) * bins * 0.55);
      const freqVal = freqData[binIdx] / 255;

      // Two travelling sine fields create the rippling "ridges"
      const ripple1 = Math.sin(t * Math.PI * 9 + phase) * 0.5 + 0.5;
      const ripple2 = Math.sin(t * Math.PI * 21 - phase * 1.3) * 0.5 + 0.5;
      const ripple = ripple1 * 0.6 + ripple2 * 0.4;

      // Intensity layers: ambient + per-bin response + kick boost
      const ambient = 0.14 + ripple * 0.18;
      const audioIntensity = freqVal * 0.55 + bassAvg * 0.25;
      const intensity = Math.min(1, ambient + audioIntensity + kickHit * 0.12);

      // Hue drifts with ripple AND with which band has more energy
      // (so a snare-heavy moment leans more magenta than a bass-heavy one)
      const bandTilt = (midAvg - bassAvg) * 8;
      const hue = HUE_BASE + ripple * HUE_RANGE - 5 + bandTilt;
      const sat = 72 + intensity * 22;
      const lit = 72 - intensity * 38 - kickHit * 6;
      const alpha = 0.22 + intensity * 0.7;

      // Time-domain warp — each line picks up the instantaneous waveform
      const waveIdx = Math.floor(t * timeData.length);
      const waveVal = (timeData[waveIdx] - 128) / 128;

      ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',' + sat.toFixed(0) + '%,' + lit.toFixed(0) + '%,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = Math.max(0.6, lineSpacing * 0.55) + bassHit * 0.6;

      ctx.beginPath();
      const segments = 16;
      const cy = H * 0.5;
      for (let sg = 0; sg <= segments; sg++) {
        const yNorm = sg / segments;
        // Vertical squash bends Y toward centre on kick hits
        const yWarp = yNorm + (yNorm - 0.5) * vSquash * Math.sin(yNorm * Math.PI);
        const y = yWarp * H;
        const wave = Math.sin(yNorm * Math.PI * 2.2 + phase * 1.1 + i * 0.045) * waveVal * warpAmp;
        const xOffset = x + wave;
        if (sg === 0) ctx.moveTo(xOffset, y);
        else ctx.lineTo(xOffset, y);
      }
      ctx.stroke();
    }

    // ----- ripples (kick shockwaves) -----
    ctx.globalCompositeOperation = 'lighter';
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= r.decay;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      r.radius += r.speed;
      const a = r.life * 0.4;
      ctx.strokeStyle = 'hsla(330, 80%, 60%, ' + a.toFixed(3) + ')';
      ctx.lineWidth = (4 + (1 - r.life) * 3) * dpr;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ----- snare flashes (horizontal moving bars) -----
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.life -= 0.04;
      if (f.life <= 0) { flashes.splice(i, 1); continue; }
      const a = f.life * 0.45;
      const grad = ctx.createLinearGradient(0, f.y, 0, f.y + f.h);
      grad.addColorStop(0, 'rgba(255, 220, 240, 0)');
      grad.addColorStop(0.5, 'rgba(255, 120, 200, ' + a.toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(255, 220, 240, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, f.y, W, f.h);
    }

    // ----- hat sparks (tiny falling particles) -----
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.05 * dpr;
      const a = Math.max(0, s.life);
      ctx.fillStyle = 'hsla(' + s.hue.toFixed(0) + ', 90%, 75%, ' + a.toFixed(3) + ')';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalCompositeOperation = 'source-over';

    // ----- soft moving highlight band (reference-poster centre lift) -----
    const glowY = H * (0.55 + Math.sin(phase * 0.4) * 0.06);
    const glow = ctx.createRadialGradient(W * 0.45, glowY, 0, W * 0.45, glowY, W * 0.35);
    glow.addColorStop(0, 'rgba(255, 240, 248, ' + (0.16 + airAvg * 0.22).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(255, 240, 248, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---- mode 2: chromatic spectrum arc ----
  // White light refracting through a prism — each ray is itself a full rainbow
  // (warm inner edge → cool outer edge), softly feathered, additively blended.
  // The arc breathes on bass, individual rays modulate length per FFT bin,
  // and a wide halo + outer bloom give the photographic light-leak feel.
  let arcSweep = 0;
  let arcSprite = null;
  let arcSpriteW = 0, arcSpriteH = 0, arcSpriteDpr = 0;

  function buildArcSprite(dpr) {
    const w = Math.max(8, Math.floor(14 * dpr));
    const h = Math.max(160, Math.floor(280 * dpr));
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const c = off.getContext('2d');

    // Vertical rainbow — top is the warm INNER end of the ray, bottom is the
    // cool OUTER end. Ends are feathered so the ray fades into black.
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0.00, 'rgba(255,  60,  40, 0)');
    g.addColorStop(0.04, 'rgba(255,  60,  40, 0.9)');
    g.addColorStop(0.14, 'rgba(255, 130,  20, 1.0)');
    g.addColorStop(0.28, 'rgba(255, 215,  40, 1.0)');
    g.addColorStop(0.44, 'rgba( 90, 230,  90, 1.0)');
    g.addColorStop(0.60, 'rgba( 40, 150, 255, 1.0)');
    g.addColorStop(0.76, 'rgba(120,  70, 240, 1.0)');
    g.addColorStop(0.90, 'rgba(190,  50, 210, 0.7)');
    g.addColorStop(1.00, 'rgba(190,  50, 210, 0)');
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);

    // Horizontal feather — soft sides so adjacent rays blend, not stripe.
    const fg = c.createLinearGradient(0, 0, w, 0);
    fg.addColorStop(0.00, 'rgba(0,0,0,1)');
    fg.addColorStop(0.50, 'rgba(0,0,0,0)');
    fg.addColorStop(1.00, 'rgba(0,0,0,1)');
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = fg;
    c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'source-over';

    arcSprite = off;
    arcSpriteW = w;
    arcSpriteH = h;
    arcSpriteDpr = dpr;
  }

  function renderArc(W, H, dpr) {
    if (!arcSprite || arcSpriteDpr !== dpr) buildArcSprite(dpr);

    const minDim = Math.min(W, H);
    const cx = W * 0.5;
    const cy = H * 0.46;
    // Arc breathes with bass + kicks
    const baseR = minDim * (0.22 + bassAvg * 0.05 + kickHit * 0.03);

    // Wide background halo — pulses with sustained energy
    const haloA = 0.05 + (bassAvg + midAvg) * 0.10 + kickHit * 0.05;
    const halo = ctx.createRadialGradient(cx, cy, baseR * 0.3, cx, cy, baseR * 2.6);
    halo.addColorStop(0.00, 'rgba(120,  40, 180, ' + haloA.toFixed(3) + ')');
    halo.addColorStop(0.55, 'rgba( 60,  20, 120, ' + (haloA * 0.4).toFixed(3) + ')');
    halo.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    // Arc geometry — gap at the bottom, opens like a horseshoe.
    arcSweep += 0.0010 + bassAvg * 0.0025;
    const ARC_START = Math.PI * 0.72 + Math.sin(arcSweep) * 0.03;
    const ARC_SPAN  = Math.PI * 1.56;

    const numRays = 260;
    const bins = freqData.length;

    // Each ray is the same rainbow sprite — we just rotate it outward along
    // the arc and modulate its length / opacity with the audio.
    for (let i = 0; i < numRays; i++) {
      const t = i / numRays;
      // Slow horizontal drift so the colour ridges shimmer between frames
      const angle = ARC_START + t * ARC_SPAN;

      // Map ray to an FFT bin — log-ish so musical octaves spread evenly.
      const binIdx = Math.floor(Math.pow(t, 1.25) * bins * 0.42);
      const v = freqData[binIdx] / 255;

      // Per-ray energy: own bin + sustained low end + kick punch
      const energy = v * 0.65 + bassAvg * 0.18 + kickHit * 0.12 + 0.18;
      // How tall the ray is, relative to min dim
      const rayLen = minDim * (0.16 + energy * 0.42);
      // How wide the ray is — slightly thicker on louder rays
      const rayWidth = arcSpriteW * (0.7 + energy * 0.6);

      const px = cx + Math.cos(angle) * baseR;
      const py = cy + Math.sin(angle) * baseR;

      ctx.save();
      ctx.translate(px, py);
      // Rotate so the sprite's local +y points OUTWARD from the arc centre.
      ctx.rotate(angle - Math.PI / 2);
      // Bias: ~20% of the sprite extends inward (showing warm inner colours
      // tinting the arc curve), ~80% extends outward (the visible plume).
      ctx.globalAlpha = 0.35 + energy * 0.55;
      ctx.drawImage(
        arcSprite,
        -rayWidth / 2,
        -rayLen * 0.2,
        rayWidth,
        rayLen
      );
      ctx.restore();
    }

    // Outer bloom pass — re-draw a wider, more transparent halo on top so
    // the brightest section blooms outward (light-leak feel).
    ctx.globalAlpha = 1;
    const bloom = ctx.createRadialGradient(cx, cy, baseR, cx, cy, baseR * 2.0);
    const bloomA = 0.06 + (bassAvg + highAvg) * 0.10;
    bloom.addColorStop(0.00, 'rgba(255, 200, 230, 0)');
    bloom.addColorStop(0.45, 'rgba(255, 200, 230, ' + bloomA.toFixed(3) + ')');
    bloom.addColorStop(1.00, 'rgba(255, 200, 230, 0)');
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // Subtle film grain — random white dots at very low opacity. Adds the
    // analogue / photographic texture seen in the reference image.
    const grainCount = Math.floor(W * H / (2200 * dpr * dpr));
    for (let i = 0; i < grainCount; i++) {
      const a = Math.random() * 0.05;
      ctx.fillStyle = 'rgba(255, 255, 255, ' + a.toFixed(3) + ')';
      ctx.fillRect(Math.random() * W, Math.random() * H, dpr, dpr);
    }
  }

  // ---- mode 3: fabric stripes ----
  // Overlapping rectangular "blocks" of vertical white stripes painted on a
  // black field. A shared 2D warp field bends every stripe as if the whole
  // surface were a folded sheet of cloth. Bass + kicks drive fold depth,
  // per-band energy drives each block's stripe density.
  const CLOTH_BLOCKS = [
    { x: 0.00, w: 0.42, y: 0.00, h: 0.36, baseDen: 26, band: 'sub'    },
    { x: 0.30, w: 0.70, y: 0.05, h: 0.30, baseDen: 42, band: 'bass'   },
    { x: 0.00, w: 0.58, y: 0.28, h: 0.30, baseDen: 30, band: 'lowMid' },
    { x: 0.46, w: 0.54, y: 0.34, h: 0.28, baseDen: 50, band: 'mid'    },
    { x: 0.06, w: 0.54, y: 0.56, h: 0.30, baseDen: 34, band: 'high'   },
    { x: 0.50, w: 0.50, y: 0.62, h: 0.38, baseDen: 58, band: 'air'    },
    { x: 0.20, w: 0.40, y: 0.74, h: 0.26, baseDen: 28, band: 'bass'   }
  ];

  function clothWarp(x, y, W, H, p, amp) {
    const xN = x / W;
    const yN = y / H;
    // Three layered sines at different frequencies = soft fabric folds
    const w1 = Math.sin(yN * Math.PI * 1.6 + p * 0.35) * amp;
    const w2 = Math.sin(yN * Math.PI * 3.4 + xN * Math.PI * 0.9 + p * 0.55) * amp * 0.45;
    const w3 = Math.cos(xN * Math.PI * 2.3 + yN * Math.PI * 0.7 - p * 0.25) * amp * 0.30;
    return w1 + w2 + w3;
  }

  function renderCloth(W, H, dpr) {
    const bandEnergy = {
      sub:    subAvg + kickHit * 0.6,
      bass:   bassAvg + bassHit * 0.4,
      lowMid: lowMidAvg + snareHit * 0.3,
      mid:    midAvg,
      high:   highAvg + hatHit * 0.3,
      air:    airAvg
    };

    // Fold depth grows with sustained bass + kick punch
    const warpAmp = (12 + bassAvg * 55 + kickHit * 35 + midAvg * 18) * dpr;

    ctx.fillStyle = '#FFFFFF';
    ctx.strokeStyle = '#FFFFFF';

    for (let bi = 0; bi < CLOTH_BLOCKS.length; bi++) {
      const b = CLOTH_BLOCKS[bi];
      const energy = bandEnergy[b.band] || 0;
      // Block dimensions in pixels — a touch of per-band sway on x position
      const sway = Math.sin(phase * 0.4 + bi * 0.9) * (4 + energy * 14) * dpr;
      const x0 = b.x * W + sway;
      const y0 = b.y * H;
      const bw = b.w * W;
      const bh = b.h * H;

      // Stripe density: baseline + audio
      const density = Math.max(10, Math.floor(b.baseDen * (0.9 + energy * 1.3)));
      const spacing = bw / density;
      // Stripe width: thinner when dense, thicker when sparse, modulated by audio
      const stripeW = Math.max(0.8, spacing * (0.20 + energy * 0.30));

      // Clip drawing to this block so stripes don't bleed across the field —
      // that boxy "different swatch" look from the reference image.
      ctx.save();
      ctx.beginPath();
      ctx.rect(x0, y0, bw, bh);
      ctx.clip();

      const segs = 28;
      for (let i = 0; i < density; i++) {
        const xCol = x0 + i * spacing + spacing * 0.5;

        ctx.beginPath();
        for (let s = 0; s <= segs; s++) {
          const t = s / segs;
          const y = y0 + t * bh;
          const dx = clothWarp(xCol, y, W, H, phase + bi * 0.4, warpAmp);
          if (s === 0) ctx.moveTo(xCol + dx, y);
          else ctx.lineTo(xCol + dx, y);
        }
        ctx.lineWidth = stripeW;
        ctx.lineCap = 'butt';
        ctx.stroke();
      }

      ctx.restore();
    }

    // Subtle vignette so the edges fall off gently
    const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.4, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
    vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- event spawners ----
  function spawnRipple(W, H, dpr, strength) {
    // One ripple per kick — centre-ish, expanding outward
    ripples.push({
      x: W * (0.35 + Math.random() * 0.3),
      y: H * (0.45 + Math.random() * 0.2),
      radius: 6 * dpr,
      speed: (4 + strength * 6) * dpr,
      life: 1,
      decay: 0.025
    });
  }
  function spawnFlash(W, H, dpr, strength) {
    flashes.push({
      y: H * (0.25 + Math.random() * 0.5),
      h: (12 + strength * 30) * dpr,
      life: 1
    });
  }
  function spawnSparks(W, H, dpr, strength) {
    const n = Math.floor(6 + strength * 14);
    for (let i = 0; i < n; i++) {
      sparks.push({
        x: Math.random() * W,
        y: H * (0.05 + Math.random() * 0.4),
        vx: (Math.random() - 0.5) * 2 * dpr,
        vy: (-0.5 + Math.random() * 1.5) * dpr,
        size: (1.2 + Math.random() * 1.8) * dpr,
        hue: 315 + Math.random() * 30,
        life: 0.7 + Math.random() * 0.4,
        decay: 0.015 + Math.random() * 0.015
      });
    }
  }

  function drawIdleHint(W, H, dpr) {
    if (mode === 3) {
      // Idle cloth — fixed energy values, slow phase
      const t0 = Date.now() * 0.0006;
      const warpAmp = 18 * dpr;
      ctx.strokeStyle = '#FFFFFF';
      for (let bi = 0; bi < CLOTH_BLOCKS.length; bi++) {
        const b = CLOTH_BLOCKS[bi];
        const x0 = b.x * W;
        const y0 = b.y * H;
        const bw = b.w * W;
        const bh = b.h * H;
        const density = Math.max(12, Math.floor(b.baseDen * 0.85));
        const spacing = bw / density;
        const stripeW = Math.max(0.7, spacing * 0.22);
        ctx.save();
        ctx.beginPath();
        ctx.rect(x0, y0, bw, bh);
        ctx.clip();
        const segs = 22;
        for (let i = 0; i < density; i++) {
          const xCol = x0 + i * spacing + spacing * 0.5;
          ctx.beginPath();
          for (let s = 0; s <= segs; s++) {
            const t = s / segs;
            const y = y0 + t * bh;
            const dx = clothWarp(xCol, y, W, H, t0 + bi * 0.4, warpAmp);
            if (s === 0) ctx.moveTo(xCol + dx, y);
            else ctx.lineTo(xCol + dx, y);
          }
          ctx.lineWidth = stripeW;
          ctx.globalAlpha = 0.55;
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      return;
    }
    if (mode === 2) {
      if (!arcSprite || arcSpriteDpr !== dpr) buildArcSprite(dpr);
      const minDim = Math.min(W, H);
      const cx = W * 0.5, cy = H * 0.46;
      const baseR = minDim * 0.22;
      const t0 = Date.now() * 0.0004;
      const ARC_START = Math.PI * 0.72 + Math.sin(t0) * 0.03;
      const ARC_SPAN  = Math.PI * 1.56;
      const numRays = 200;
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < numRays; i++) {
        const t = i / numRays;
        const angle = ARC_START + t * ARC_SPAN;
        const energy = 0.32 + (Math.sin(t * Math.PI * 5 + t0 * 2) * 0.5 + 0.5) * 0.18;
        const rayLen = minDim * (0.16 + energy * 0.32);
        const rayWidth = arcSpriteW * 0.85;
        const px = cx + Math.cos(angle) * baseR;
        const py = cy + Math.sin(angle) * baseR;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(angle - Math.PI / 2);
        ctx.globalAlpha = 0.35;
        ctx.drawImage(arcSprite, -rayWidth / 2, -rayLen * 0.2, rayWidth, rayLen);
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      // Light grain
      const grainCount = Math.floor(W * H / (3000 * dpr * dpr));
      for (let i = 0; i < grainCount; i++) {
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (Math.random() * 0.04).toFixed(3) + ')';
        ctx.fillRect(Math.random() * W, Math.random() * H, dpr, dpr);
      }
      return;
    }
    const lineSpacing = 3 * dpr;
    const numLines = Math.floor(W / lineSpacing);
    for (let i = 0; i < numLines; i++) {
      const x = i * lineSpacing + lineSpacing * 0.5;
      const t = i / numLines;
      const wave = Math.sin(t * Math.PI * 7 + Date.now() * 0.0008) * 0.5 + 0.5;
      ctx.strokeStyle = 'hsla(' + (320 + wave * 30) + ',60%,72%,' + (0.06 + wave * 0.10).toFixed(3) + ')';
      ctx.lineWidth = 0.8 * dpr;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
  }

  function idleTick() {
    if (running) return;
    const W = canvas.width, H = canvas.height;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    ctx.fillStyle = (mode === 2 || mode === 3) ? '#000000' : '#FDFCF4';
    ctx.fillRect(0, 0, W, H);
    drawIdleHint(W, H, dpr);
    requestAnimationFrame(idleTick);
  }
  idleTick();
})();
</script>
</body>
</html>
